                <td>${r.daily === 0 ? '<span class="badge badge-red">Hareketsiz</span>' : r.cover > 180 ? '<span class="badge badge-violet">Fazla</span>' : r.cover < 14 ? '<span class="badge badge-amber">Az</span>' : '<span class="badge badge-green">Dengeli</span>'}</td></tr>`).join('')}
            </tbody></table></div></section>`;
    }

    // ---------------- Kur riski ----------------
    function fxRisk() {
        const rows = M.products().filter((p) => !p.synthetic).map((p) => {
            const ex = M.currencyExposure(p.kod);
            const mat = U.sum(Object.values(ex));
            const foreign = mat - (ex.TRY || 0);
            return { p, ex, mat, foreign, share: mat ? foreign / mat : 0, cost: M.unitCost(p.kod) };
        }).filter((r) => r.foreign > 0).sort((a, b) => b.share - a.share);
        const curs = Object.keys(D.CURRENCIES).filter((c) => c !== 'TRY');
        return `${H.banner('blue', 'info', 'Kur riski', 'Ürün maliyetinin dövize bağlı payı. %10 kur artışının birim maliyete etkisi = dövizli pay × %10.')}
            <section class="card"><div class="table-wrap"><table><thead><tr><th>Kod</th><th>Ürün</th>${curs.map((c) => `<th class="num">${c} payı ₺</th>`).join('')}<th class="num">Dövizli pay</th><th class="num">%10 kur etkisi</th></tr></thead><tbody>
            ${rows.map((r) => `<tr><td>${H.productLink(r.p.kod)}</td><td class="strong">${esc(r.p.ad)}</td>${curs.map((c) => `<td class="num">${r.ex[c] ? U.num(r.ex[c]) : '–'}</td>`).join('')}
                <td class="num"><span class="bar"><span style="width:${r.share * 100}%;background:var(--violet);"></span></span> %${U.num(r.share * 100, 0)}</td>
                <td class="num tp-neg">+${U.cur(r.foreign * 0.1 * (1 + M.overheadPct()))}</td></tr>`).join('') || `<tr><td colspan="${4 + curs.length}">${H.empty('Dövizli malzeme içeren ürün yok')}</td></tr>`}
            </tbody></table></div></section>`;
    }

    // ---------------- Senaryo ----------------
    function scenario() {
        const canRun = MRP.auth.can('runMRP') || MRP.auth.canView('mrp');
        const res = aState.scenarioResult;
        let html = H.card('Senaryo talepleri', 'Ana plan değişmeden, eklenen taleplerin malzeme ve kapasiteye etkisini simüle edin', `
            <div class="card-body">
                <datalist id="scProducts">${M.products().filter((p) => !p.synthetic || aState.scenario.some((s) => s.kod === p.kod)).map((p) => `<option value="${esc(p.kod)}">${esc(p.ad)}</option>`).join('')}</datalist>
                <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr auto;align-items:end;">
                    <div class="field"><label>Mamul</label><input id="scKod" list="scProducts" autocomplete="off" placeholder="Kod yazın…"></div>
                    <div class="field"><label>Miktar</label><input id="scQty" type="number" min="1" step="1" value="100"></div>
                    <div class="field"><label>Termin</label><input id="scDate" type="date" value="${U.iso(U.addDays(U.today(), 21))}"></div>
                    <button class="btn btn-secondary" data-act="scAdd">${MRP.icon('plus')} Ekle</button>
                </div>
                ${aState.scenario.length ? `<div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>Mamul</th><th>Ad</th><th class="num">Miktar</th><th>Termin</th><th></th></tr></thead><tbody>
                    ${aState.scenario.map((s, i) => `<tr><td class="mono">${esc(s.kod)}</td><td>${esc((M.product(s.kod) || {}).ad || '')}</td><td class="num">${s.qty}</td><td>${esc(U.date(U.parseDate(s.dueDate)))}</td>
                        <td><button class="btn btn-ghost btn-sm" data-act="scDel" data-id="${i}">${MRP.icon('x', 'sm')}</button></td></tr>`).join('')}</tbody></table></div>` : ''}
                <div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-primary" data-act="scRun" ${aState.scenario.length && canRun ? '' : 'disabled'}>${MRP.icon('play')} Senaryoyu çalıştır</button>
                    ${aState.scenario.length ? `<button class="btn btn-ghost" data-act="scClear">Temizle</button>` : ''}</div>
            </div>`);
        if (!res) return html;

        const b = res.base.summary, s = res.scen.summary;
        const delta = (x, y, money) => { const d = y - x; return `${money ? U.compactCur(y) : y} <span class="${d > 0 ? 'tp-neg' : d < 0 ? 'tp-pos' : 'muted'}" style="font-size:.8em;">(${d > 0 ? '+' : ''}${money ? U.compactCur(d) : d})</span>`; };
        html += `<div style="height:16px;"></div><div class="kpis">
            <div class="kpi violet"><div class="l">Satın alma önerisi</div><div class="v" style="font-size:1.15em;">${delta(b.purchaseCount, s.purchaseCount)}</div><div class="s">${delta(b.purchaseValue, s.purchaseValue, true)}</div></div>
            <div class="kpi blue"><div class="l">Üretim önerisi</div><div class="v" style="font-size:1.15em;">${delta(b.productionCount, s.productionCount)}</div><div class="s">Mamul + yarı mamul</div></div>
            <div class="kpi ${s.late > b.late ? 'red' : 'green'}"><div class="l">Geç salım</div><div class="v" style="font-size:1.15em;">${delta(b.late, s.late)}</div><div class="s">Tedarik süresi yetmeyen</div></div>
            <div class="kpi ${res.capScen.over > res.capBase.over ? 'red' : 'green'}"><div class="l">Kapasite aşımı</div><div class="v" style="font-size:1.15em;">${delta(res.capBase.over, res.capScen.over)}</div><div class="s">Tepe doluluk %${U.num(res.capScen.peak * 100, 0)}</div></div>
        </div>`;
        const verdict = s.late > b.late || res.capScen.over > res.capBase.over
            ? H.banner('red', 'alert', 'Senaryo mevcut tedarik süreleri/kapasite ile karşılanamıyor', 'Termin ötelenmeli, kritik malzemeler hızlandırılmalı veya kapasite artırılmalı. Aşağıda geç kalan kalemler listelenmiştir.')
            : H.banner('green', 'check', 'Senaryo uygulanabilir görünüyor', 'Ek talepler mevcut tedarik süreleri ve kapasite ile karşılanabilir.');
        html += verdict;
        html += H.card('Ek ihtiyaç doğan kalemler', 'Senaryo ile temel plan arasındaki planlı sipariş farkı', `<div class="table-wrap"><table><thead><tr><th>Kod</th><th>Kalem</th><th>Tip</th><th class="num">Ek miktar</th><th class="num">Ek tutar ₺</th><th>En erken salım</th><th>Durum</th></tr></thead><tbody>
            ${res.diff.map((d) => `<tr class="${d.late ? 'r-crit' : ''}"><td>${H.anyLink(d.kod)}</td><td class="strong">${esc(d.ad)}</td><td>${d.type === 'production' ? '<span class="badge badge-blue">Üretim</span>' : '<span class="badge badge-violet">Satın alma</span>'}</td>
                <td class="num">${esc(U.qty(d.qty, d.unit))}</td><td class="num">${U.num(d.value)}</td><td>${esc(U.date(U.parseDate(d.release)))}</td><td>${d.late ? '<span class="badge badge-red">Gecikir</span>' : '<span class="badge badge-green">Zamanında</span>'}</td></tr>`).join('')
                || `<tr><td colspan="7">${H.empty('Ek ihtiyaç yok', 'Mevcut stok ve planlı girişler yeterli.')}</td></tr>`}</tbody></table></div>`,
            `<button class="btn btn-secondary btn-sm" data-act="scApply" ${MRP.auth.can('runMRP') ? '' : 'disabled'}>Senaryoyu ana plana ekle</button>`);
        return html;
    }

    function runScenario() {
        const extra = aState.scenario.map((s, i) => ({ ...s, id: `SEN-${i + 1}` }));
        const base = MRP.engine.run();
        const scen = MRP.engine.run({ extraDemands: extra });
        const sumBy = (planned) => { const m = {}; planned.forEach((p) => { const e = m[p.kod] || (m[p.kod] = { qty: 0, value: 0, release: p.release, late: false, p }); e.qty += p.qty; e.value += p.value; if (p.release < e.release) e.release = p.release; e.late = e.late || p.late; }); return m; };
        const bm = sumBy(base.planned), sm = sumBy(scen.planned);
        const diff = Object.entries(sm).map(([kod, e]) => {
            const b0 = bm[kod] || { qty: 0, value: 0 };
            return { kod, ad: e.p.ad, unit: e.p.unit, type: e.p.type, qty: U.round(e.qty - b0.qty, 3), value: e.value - b0.value, release: e.release, late: e.late && !(bm[kod] && bm[kod].late) };
        }).filter((d) => d.qty > 1e-9).sort((a, b) => (b.late - a.late) || b.value - a.value);
        aState.scenarioResult = {
            base, scen, diff,
            capBase: MRP.capacity.summary(MRP.capacity.compute({ planned: base.planned })),
            capScen: MRP.capacity.summary(MRP.capacity.compute({ planned: scen.planned }))
        };
        app().render();
    }

    Object.assign(MRP.actions, {
        anTab: (t) => { aState.tab = t; app().render(); },
        anCat: (v) => { aState.cat = v; app().render(); },
        anThr: (v) => { aState.threshold = Math.max(0, U.toNum(v, 15)); app().render(); },
        anAbc: (v) => { aState.abcBasis = v; app().render(); },
        scAdd: () => {
            const kod = document.getElementById('scKod').value.trim();
            const qty = Math.round(U.toNum(document.getElementById('scQty').value));
            const dueDate = document.getElementById('scDate').value;
            if (!M.product(kod)) return UI.toast('Geçersiz mamul', 'Listeden bir mamul kodu seçin.', 'warn');
            if (qty <= 0 || !dueDate) return UI.toast('Miktar ve termin gerekli', '', 'warn');
            aState.scenario.push({ kod, qty, dueDate });
            aState.scenarioResult = null;
            app().render();
        },
        scDel: (i) => { aState.scenario.splice(+i, 1); aState.scenarioResult = null; app().render(); },
        scClear: () => { aState.scenario = []; aState.scenarioResult = null; app().render(); },
        scRun: () => runScenario(),
        scApply: async () => {
            if (!H.guard('runMRP')) return;
            if (!(await UI.confirm(`${aState.scenario.length} senaryo talebi ana üretim planına eklenecek.`, { title: 'Ana plana ekle', okLabel: 'Ekle' }))) return;
            aState.scenario.forEach((s) => S().mps.push({ id: MRP.store.nextNo('MPS'), ...s, note: 'Senaryodan eklendi' }));
            MRP.store.audit('Senaryo ana plana eklendi', aState.scenario.map((s) => `${s.kod}×${s.qty}`).join(', '));
            aState.scenario = []; aState.scenarioResult = null;
            location.hash = '#/mrp';
            app().commit();
            UI.toast('Ana plan güncellendi', 'MRP\'yi yeniden çalıştırın.', 'info');
        }
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/import.js */
/* ==========================================================================
   MRP Pro — Veri Aktarımı: Excel (XLSX/XLS) ve CSV içe aktarma
   Şablon indir → doldur → yükle → önizleme/doğrulama → içe aktar
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model, D = MRP.data;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;

    // ---------------- Ayrıştırma yardımcıları ----------------
    const TR = { 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'i̇': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u' };
    const norm = (s) => String(s ?? '').toLocaleLowerCase('tr').replace(/[çğıöşü]/g, (c) => TR[c]).replace(/[^a-z0-9]/g, '');
    const str = (v) => String(v ?? '').trim();
    /** "1.234,56" / "1234.56" / 1234.56 → sayı; boş → null */
    function num(v) {
        if (v === null || v === undefined || v === '') return null;
        if (typeof v === 'number') return isFinite(v) ? v : NaN;
        let s = String(v).trim().replace(/\s|₺|TL/gi, '');
        if (!s) return null;
        if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
        else if (s.includes(',')) s = s.replace(',', '.');
        const n = parseFloat(s);
        return isFinite(n) ? n : NaN;
    }
    /** Excel seri tarihi, gg.aa.yyyy, gg/aa/yyyy veya yyyy-aa-gg → "yyyy-aa-gg" */
    function date(v) {
        if (v === null || v === undefined || v === '') return null;
        if (typeof v === 'number') {
            const d = new Date(Math.round((v - 25569) * 86400000));
            return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
        }
        if (v instanceof Date) return U.iso(v);
        const s = String(v).trim();
        let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return undefined;
    }
    const PROC = { satinalma: 'buy', satin: 'buy', buy: 'buy', alim: 'buy', uretim: 'make', make: 'make', yarimamul: 'make', fason: 'service', hizmet: 'service', service: 'service' };
    const LOTP = { l4l: 'L4L', lotforlot: 'L4L', ihtiyackadar: 'L4L', foq: 'FOQ', sabit: 'FOQ', sabitparti: 'FOQ', min: 'MIN', minimum: 'MIN', minimumsiparis: 'MIN' };
    const LOCS = { merkez: 'MERKEZ', merkezdepo: 'MERKEZ', depo: 'MERKEZ', fabrika: 'FABRIKA', uretim: 'FABRIKA', uretimhatti: 'FABRIKA', fason: 'FASON', fasoncu: 'FASON', fasoncuda: 'FASON' };

    function parseCSV(text) {
        const first = text.split(/\r?\n/)[0] || '';
        const delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
        const rows = [];
        let row = [], cell = '', q = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (q) {
                if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c;
            } else if (c === '"') q = true;
            else if (c === delim) { row.push(cell); cell = ''; }
            else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
            else cell += c;
        }
        if (cell || row.length) { row.push(cell); rows.push(row); }
        const head = (rows.shift() || []).map((h) => h.replace(/^﻿/, ''));
        return rows.filter((r) => r.some((c) => c.trim())).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
    }

    async function readFile(file) {
        const ext = file.name.toLowerCase().split('.').pop();
        if (ext === 'csv' || ext === 'txt') return parseCSV(await file.text());
        if (typeof XLSX === 'undefined') throw new Error('Excel okuyucu yüklenemedi (internet gerekli). Dosyayı CSV olarak kaydedip yükleyebilirsiniz.');
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        return XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });
    }

    /** Dosya başlıklarını tanımlı alanlara eşler (Türkçe karakter/büyük-küçük harf duyarsız, eş anlamlılar) */
    function mapHeaders(rows, cols) {
        const heads = rows.length ? Object.keys(rows[0]) : [];
        const map = {};
        cols.forEach((c) => {
            const names = [c.label, c.key, ...(c.aliases || [])].map(norm);
            const h = heads.find((x) => names.includes(norm(x)));
            if (h) map[c.key] = h;
        });
        return map;
    }

    // ---------------- Aktarım tipleri ----------------
    const TYPES = {
        items: {
            label: 'Malzeme Kartları', perm: 'editItem',
            desc: 'Yeni malzeme ekler veya mevcut kartın fiyat, para birimi, tedarik süresi, emniyet stoğu ve parti bilgisini günceller. Boş bırakılan alanlar değişmez.',
            cols: [
                { key: 'kod', label: 'Kod', req: true, aliases: ['malzeme kodu', 'stok kodu', 'malzemekod'] },
                { key: 'ad', label: 'Ad', aliases: ['malzeme adi', 'adi', 'aciklama', 'stok adi'] },
                { key: 'tur', label: 'Tür', aliases: ['tur', 'grup', 'malzeme turu'] },
                { key: 'unit', label: 'Birim', aliases: ['olcu birimi', 'br'] },
                { key: 'price', label: 'Birim Fiyat', aliases: ['fiyat', 'birim maliyet'] },
                { key: 'currency', label: 'Para Birimi', aliases: ['doviz', 'kur', 'pb'] },
                { key: 'procurement', label: 'Tedarik Tipi', aliases: ['tedarik'] },
                { key: 'leadTime', label: 'Tedarik Süresi (gün)', aliases: ['tedarik suresi', 'lt', 'temin suresi'] },
                { key: 'safetyStock', label: 'Emniyet Stoğu', aliases: ['emniyet', 'min stok', 'minimum stok'] },
                { key: 'lotPolicy', label: 'Parti Politikası', aliases: ['parti', 'lot politikasi'] },
                { key: 'lotSize', label: 'Parti Miktarı', aliases: ['parti miktari', 'moq', 'min siparis'] }
            ],
            sample: () => M.items().map((i) => ({ 'Kod': i.kod, 'Ad': i.ad, 'Tür': i.tur, 'Birim': i.unit, 'Birim Fiyat': i.price, 'Para Birimi': i.currency, 'Tedarik Tipi': M.PROCUREMENT[i.procurement], 'Tedarik Süresi (gün)': i.leadTime, 'Emniyet Stoğu': i.safetyStock, 'Parti Politikası': i.lotPolicy, 'Parti Miktarı': i.lotSize }))
        },
        products: {
            label: 'Ürünler (Mamul)', perm: 'editProduct',
            desc: 'Yeni mamul ekler veya mevcut mamulün adını, kategorisini ve kayıtlı (ERP) maliyetini günceller. Reçeteler ayrıca "Reçeteler" ile yüklenir.',
            cols: [
                { key: 'kod', label: 'Mamul Kodu', req: true, aliases: ['kod', 'urun kodu', 'mamul'] },
                { key: 'ad', label: 'Mamul Adı', aliases: ['ad', 'urun adi', 'adi'] },
                { key: 'kategori', label: 'Kategori', aliases: ['grup', 'urun grubu'] },
                { key: 'toplam', label: 'Kayıtlı Maliyet', aliases: ['maliyet', 'toplam maliyet', 'birim maliyet'] }
            ],
            sample: () => [{ 'Mamul Kodu': 'BG.ORNEK.001', 'Mamul Adı': 'ÖRNEK MASA 80*80*H75 ANTRASİT', 'Kategori': 'Masalar', 'Kayıtlı Maliyet': 2500 }]
        },
        bom: {
            label: 'Reçeteler (BOM)', perm: 'editProduct',
            desc: 'Her satır bir reçete satırıdır. Dosyada geçen her mamulün reçetesi dosyadaki satırlarla TAMAMEN değiştirilir. Bileşenler önceden tanımlı olmalıdır.',
            cols: [
                { key: 'parent', label: 'Mamul Kodu', req: true, aliases: ['ust kod', 'urun kodu', 'mamul'] },
                { key: 'kod', label: 'Bileşen Kodu', req: true, aliases: ['bilesen', 'alt kod', 'malzeme kodu', 'stok kodu'] },
                { key: 'k', label: 'Katsayı', req: true, aliases: ['miktar', 'kullanim miktari', 'katsayi'] }
            ],
            sample: () => M.bom('BG.212.A').map((l) => ({ 'Mamul Kodu': 'BG.212.A', 'Bileşen Kodu': l.kod, 'Katsayı': l.k }))
        },
        stock: {
            label: 'Stok Sayımı', perm: 'adjustStock',
            desc: 'Sayılan miktarı girin; sistem stoğu ile fark "Sayım Düzeltme" hareketi olarak işlenir. Lokasyon boşsa Merkez Depo kabul edilir.',
            cols: [
                { key: 'kod', label: 'Kod', req: true, aliases: ['malzeme kodu', 'stok kodu'] },
                { key: 'qty', label: 'Sayılan Miktar', req: true, aliases: ['miktar', 'sayim', 'stok'] },
                { key: 'loc', label: 'Lokasyon', aliases: ['depo', 'yer'] },
                { key: 'lot', label: 'Lot No', aliases: ['lot', 'parti no', 'parti'] }
            ],
            sample: () => M.items().filter((i) => i.procurement !== 'service').slice(0, 10).map((i) => ({ 'Kod': i.kod, 'Sayılan Miktar': M.onHand(i.kod, 'MERKEZ'), 'Lokasyon': 'Merkez Depo', 'Lot No': '' }))
        },
        mps: {
            label: 'Ana Üretim Planı', perm: 'runMRP',
            desc: 'Müşteri siparişleri veya tahminler. "Mevcut planı değiştir" seçilirse ana plan dosyadaki taleplerle yenilenir.',
            cols: [
                { key: 'kod', label: 'Mamul Kodu', req: true, aliases: ['kod', 'urun kodu', 'mamul'] },
                { key: 'qty', label: 'Miktar', req: true, aliases: ['adet', 'siparis miktari'] },
                { key: 'dueDate', label: 'Termin', req: true, aliases: ['termin tarihi', 'teslim tarihi', 'tarih'] },
                { key: 'note', label: 'Açıklama', aliases: ['not', 'musteri', 'siparis no'] }
            ],
            sample: () => S().mps.map((d) => ({ 'Mamul Kodu': d.kod, 'Miktar': d.qty, 'Termin': U.date(U.parseDate(d.dueDate)), 'Açıklama': d.note }))
        },
        pricelist: {
            label: 'Tedarikçi Fiyat Listesi', perm: 'manageSuppliers',
            desc: 'Tedarikçi tekliflerini ekler/günceller. Tedarikçi kodu (TED-001) veya firma adı kullanılabilir.',
            cols: [
                { key: 'supplier', label: 'Tedarikçi', req: true, aliases: ['tedarikci kodu', 'firma', 'firma adi'] },
                { key: 'kod', label: 'Malzeme Kodu', req: true, aliases: ['kod', 'stok kodu'] },
                { key: 'price', label: 'Fiyat', req: true, aliases: ['birim fiyat'] },
                { key: 'currency', label: 'Para Birimi', aliases: ['doviz', 'pb'] },
                { key: 'leadTime', label: 'Teslim Süresi (gün)', aliases: ['teslim suresi', 'lt'] },
                { key: 'moq', label: 'Min. Sipariş', aliases: ['moq', 'minimum siparis'] }
            ],
            sample: () => S().priceList.slice(0, 30).map((o) => ({ 'Tedarikçi': o.supplierId, 'Malzeme Kodu': o.kod, 'Fiyat': o.price, 'Para Birimi': o.currency, 'Teslim Süresi (gün)': o.leadTime, 'Min. Sipariş': o.moq }))
        }
    };

    // ---------------- Doğrulama: satırları işlemlere çevirir ----------------
    function validate(type, raw, opts) {
        const def = TYPES[type];
        const map = mapHeaders(raw, def.cols);
        const missing = def.cols.filter((c) => c.req && !map[c.key]).map((c) => c.label);
        if (missing.length) return { fatal: `Zorunlu sütun(lar) bulunamadı: ${missing.join(', ')}`, map };
        const rows = raw.map((r) => Object.fromEntries(Object.entries(map).map(([k, h]) => [k, r[h]])));
        const ops = [], errors = [], warnings = [];
        const err = (i, m) => errors.push({ row: i + 2, msg: m });
        const warn = (i, m) => warnings.push({ row: i + 2, msg: m });

        if (type === 'items') rows.forEach((r, i) => {
            const kod = str(r.kod).toUpperCase();
            if (!kod) return err(i, 'Kod boş');
            const ex = M.rawItem(kod);
            if (M.isProduct(kod)) return err(i, `${kod} bir mamul kodu — Ürünler aktarımını kullanın`);
            const ch = {};
            if (str(r.ad)) ch.ad = str(r.ad);
            if (str(r.tur)) { ch.tur = str(r.tur); if (!D.ITEM_TYPES.includes(ch.tur)) warn(i, `Bilinmeyen tür "${ch.tur}" — yeni tür olarak kaydedilecek`); }
            if (str(r.unit)) ch.unit = str(r.unit);
            const p = num(r.price); if (p !== null) { if (isNaN(p) || p < 0) return err(i, 'Geçersiz fiyat'); ch.price = p; }
            if (str(r.currency)) { ch.currency = str(r.currency).toUpperCase().replace('TL', 'TRY'); if (!D.CURRENCIES[ch.currency]) return err(i, `Geçersiz para birimi: ${r.currency}`); }
            if (str(r.procurement)) { ch.procurement = PROC[norm(r.procurement)]; if (!ch.procurement) return err(i, `Geçersiz tedarik tipi: ${r.procurement}`); }
            for (const k of ['leadTime', 'safetyStock', 'lotSize']) { const n = num(r[k]); if (n !== null) { if (isNaN(n) || n < 0) return err(i, `Geçersiz sayı: ${k}`); ch[k] = k === 'leadTime' ? Math.round(n) : n; } }
            if (str(r.lotPolicy)) { ch.lotPolicy = LOTP[norm(r.lotPolicy)] || str(r.lotPolicy).toUpperCase(); if (!M.LOT_POLICIES[ch.lotPolicy]) return err(i, `Geçersiz parti politikası: ${r.lotPolicy}`); }
            if (!ex && !ch.ad) return err(i, `${kod} yeni bir kalem — Ad zorunlu`);
            if (!Object.keys(ch).length) return warn(i, `${kod}: değişiklik yok`);
            ops.push({ kod, ch, isNew: !ex, label: `${kod} ${ex ? 'güncellenecek' : 'eklenecek'}` });
        });

        if (type === 'products') rows.forEach((r, i) => {
            const kod = str(r.kod).toUpperCase();
            if (!kod) return err(i, 'Mamul kodu boş');
            if (M.rawItem(kod)) return err(i, `${kod} bir malzeme kodu`);
            const ex = M.product(kod);
            const ch = {};
            if (str(r.ad)) ch.ad = str(r.ad);
            if (str(r.kategori)) { const c = D.CATEGORIES.find((x) => norm(x) === norm(r.kategori)); if (!c) return err(i, `Bilinmeyen kategori: ${r.kategori}`); ch.kategori = c; }
            const t = num(r.toplam); if (t !== null) { if (isNaN(t) || t < 0) return err(i, 'Geçersiz maliyet'); ch.toplam = t; }
            if (!ex && (!ch.ad || !ch.kategori)) return err(i, `${kod} yeni mamul — Ad ve Kategori zorunlu`);
            ops.push({ kod, ch, isNew: !ex, custom: ex && ex.custom, label: `${kod} ${ex ? 'güncellenecek' : 'eklenecek'}` });
        });

        if (type === 'bom') {
            const groups = {};
            rows.forEach((r, i) => {
                const parent = str(r.parent).toUpperCase(), kod = str(r.kod).toUpperCase(), k = num(r.k);
                if (!parent || !kod) return err(i, 'Mamul veya bileşen kodu boş');
                const pIt = M.item(parent);
                if (!pIt || (pIt.procurement !== 'make' && !pIt.isProduct)) return err(i, `${parent} mamul veya yarı mamul değil`);
                if (!M.item(kod)) return err(i, `Bileşen tanımsız: ${kod} (önce Malzeme Kartları ile ekleyin)`);
                if (kod === parent) return err(i, 'Kalem kendi bileşeni olamaz');
                if (k === null || isNaN(k) || k <= 0) return err(i, 'Katsayı sıfırdan büyük olmalı');
                const g = groups[parent] = groups[parent] || [];
                const dup = g.find((l) => l.kod === kod);
                if (dup) { dup.k += k; warn(i, `${parent} / ${kod} tekrar ediyor — katsayılar toplandı`); } else g.push({ kod, k });
            });
            // Döngü kontrolü (yeni reçetelerle birlikte)
            const bomOf = (k) => groups[k] || M.bom(k);
            const cyc = (k, seen) => { if (seen.has(k)) return true; seen.add(k); const r = bomOf(k).some((l) => cyc(l.kod, seen)); seen.delete(k); return r; };
            Object.entries(groups).forEach(([parent, lines]) => {
                if (cyc(parent, new Set())) errors.push({ row: '-', msg: `${parent}: döngüsel reçete oluşuyor` });
                else ops.push({ parent, lines, label: `${parent}: ${lines.length} satırlık reçete (${M.bom(parent).length} → ${lines.length})` });
            });
        }

        if (type === 'stock') rows.forEach((r, i) => {
            const kod = str(r.kod).toUpperCase();
            const it = M.item(kod);
            if (!it) return err(i, `Tanımsız kod: ${kod}`);
            if (it.procurement === 'service') return err(i, `${kod} stoksuz (fason/hizmet) kalem`);
            const qty = num(r.qty);
            if (qty === null || isNaN(qty) || qty < 0) return err(i, 'Geçersiz sayılan miktar');
            const loc = str(r.loc) ? (LOCS[norm(r.loc)] || (M.LOCATIONS[str(r.loc).toUpperCase()] ? str(r.loc).toUpperCase() : null)) : 'MERKEZ';
            if (!loc) return err(i, `Bilinmeyen lokasyon: ${r.loc}`);
            const cur = M.onHand(kod, loc);
            const diff = U.round(qty - cur, 4);
            if (Math.abs(diff) < 1e-9) return;
            ops.push({ kod, loc, diff, lot: str(r.lot), label: `${kod} @ ${M.LOCATIONS[loc].ad}: ${U.qty(cur)} → ${U.qty(qty)} (${diff > 0 ? '+' : ''}${U.qty(diff)})` });
        });

        if (type === 'mps') rows.forEach((r, i) => {
            const kod = str(r.kod).toUpperCase();
            if (!M.product(kod)) return err(i, `Tanımsız mamul: ${kod}`);
            const qty = num(r.qty);
            if (qty === null || isNaN(qty) || qty <= 0) return err(i, 'Geçersiz miktar');
            const dueDate = date(r.dueDate);
            if (!dueDate) return err(i, `Geçersiz termin: ${r.dueDate}`);
            if (dueDate < U.iso(U.today())) warn(i, `${kod}: termin geçmiş (${dueDate})`);
            ops.push({ kod, qty: Math.round(qty), dueDate, note: str(r.note), label: `${kod} × ${Math.round(qty)} — ${U.date(U.parseDate(dueDate))}` });
        });

        if (type === 'pricelist') rows.forEach((r, i) => {
            const s = str(r.supplier);
            const sup = S().suppliers.find((x) => x.id.toUpperCase() === s.toUpperCase() || norm(x.ad) === norm(s));
            if (!sup) return err(i, `Tanımsız tedarikçi: ${s}`);
            const kod = str(r.kod).toUpperCase();
            const it = M.rawItem(kod);
            if (!it) return err(i, `Tanımsız malzeme: ${kod}`);
            const price = num(r.price);
            if (price === null || isNaN(price) || price <= 0) return err(i, 'Geçersiz fiyat');
            const currency = str(r.currency) ? str(r.currency).toUpperCase().replace('TL', 'TRY') : it.currency;
            if (!D.CURRENCIES[currency]) return err(i, `Geçersiz para birimi: ${r.currency}`);
            const lt = num(r.leadTime), moq = num(r.moq);
            ops.push({ supplierId: sup.id, kod, price, currency, leadTime: lt && lt > 0 ? Math.round(lt) : it.leadTime, moq: moq && moq > 0 ? moq : 0,
                label: `${sup.ad} · ${kod}: ${M.fmtMoney(price, currency)}${M.offer(sup.id, kod) ? ' (güncelleme)' : ''}` });
        });

        return { ops, errors, warnings, map, total: raw.length, opts };
    }

    // ---------------- Uygulama ----------------
    function apply(type, res) {
        const st = S();
        const ops = res.ops;
        if (type === 'items') ops.forEach((o) => {
            if (o.isNew) {
                const tur = o.ch.tur || 'Diğer Hammadde';
                st.customItems[o.kod] = { kod: o.kod, ad: o.ch.ad, tur, unit: D.UNIT_BY_TYPE[tur] || 'ad', price: 0, currency: 'TRY', procurement: tur === 'Fason İşçilik' ? 'service' : 'buy', leadTime: 7, safetyStock: 0, lotPolicy: 'L4L', lotSize: 0, ...o.ch };
            } else if (st.customItems[o.kod]) Object.assign(st.customItems[o.kod], o.ch);
            else st.itemOverrides[o.kod] = { ...(st.itemOverrides[o.kod] || {}), ...o.ch };
        });
        if (type === 'products') ops.forEach((o) => {
            if (o.isNew) st.customProducts.push({ kod: o.kod, ad: o.ch.ad, kategori: o.ch.kategori, bilesen: 0, fason: 0, hammadde: o.ch.toplam || 0, iroko: 0, toplam: o.ch.toplam || 0, createdAt: new Date().toISOString() });
            else if (o.custom) Object.assign(st.customProducts.find((p) => p.kod === o.kod), o.ch);
            else st.productOverrides[o.kod] = { ...(st.productOverrides[o.kod] || {}), ...o.ch };
        });
        if (type === 'bom') ops.forEach((o) => {
            st.customBoms[o.parent] = o.lines;
            const cp = st.customProducts.find((p) => p.kod === o.parent);
            if (cp) cp.bilesen = o.lines.length;
        });
        if (type === 'stock') ops.forEach((o) => M.move({ kod: o.kod, qty: o.diff, type: 'ADJ', loc: o.loc, lot: o.diff > 0 ? (o.lot || 'SAYIM-' + U.iso(new Date())) : '', ref: 'EXCEL-SAYIM', note: 'Excel ile sayım aktarımı' }));
        if (type === 'mps') {
            if (res.opts.replace) st.mps = [];
            ops.forEach((o) => st.mps.push({ id: MRP.store.nextNo('MPS'), kod: o.kod, qty: o.qty, dueDate: o.dueDate, note: o.note || 'Excel aktarımı' }));
        }
        if (type === 'pricelist') ops.forEach((o) => {
            const ex = M.offer(o.supplierId, o.kod);
            const rec = { supplierId: o.supplierId, kod: o.kod, price: o.price, currency: o.currency, leadTime: o.leadTime, moq: o.moq, updatedAt: new Date().toISOString() };
            if (ex) Object.assign(ex, rec); else st.priceList.push(rec);
        });
        MRP.store.audit(`Excel aktarımı: ${TYPES[type].label}`, `${iState.fileName} — ${ops.length} işlem, ${res.errors.length} hatalı satır atlandı`);
    }

    // ---------------- Şablon ----------------
    function template(type) {
        const def = TYPES[type];
        let rows = def.sample();
        if (!rows.length) rows = [Object.fromEntries(def.cols.map((c) => [c.label, '']))];
        const name = `MRP_Sablon_${def.label.replace(/[^A-Za-z0-9ÇĞİÖŞÜçğıöşü]+/g, '_')}`;
        if (typeof XLSX !== 'undefined') {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(rows, { header: def.cols.map((c) => c.label) });
            ws['!cols'] = def.cols.map((c) => ({ wch: Math.max(14, c.label.length + 4) }));
            XLSX.utils.book_append_sheet(wb, ws, 'Veri');
            const info = [['Sütun', 'Zorunlu', 'Açıklama'], ...def.cols.map((c) => [c.label, c.req ? 'Evet' : '', c.key === 'currency' ? 'TRY / USD / EUR / GBP' : c.key === 'procurement' ? 'Satın Alma / Üretim / Fason' : c.key === 'lotPolicy' ? 'L4L / FOQ / MIN' : c.key === 'loc' ? 'Merkez Depo / Fabrika / Fasoncu' : c.key === 'kategori' ? D.CATEGORIES.join(', ') : c.key === 'tur' ? D.ITEM_TYPES.join(', ') : ''])];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'Açıklama');
            XLSX.writeFile(wb, name + '.xlsx');
        } else {
            const headers = def.cols.map((c) => c.label);
            U.download(new Blob([U.toCSV(headers, rows.map((r) => headers.map((h) => r[h] ?? '')))], { type: 'text/csv;charset=utf-8' }), name + '.csv');
        }
    }

    // ---------------- Görünüm ----------------
    const iState = { type: 'items', fileName: '', result: null, replace: false };

    MRP.views.import = {
        title: 'Veri Aktarımı',
        subtitle: 'Excel veya CSV ile malzeme, ürün, reçete, stok, ana plan ve fiyat listesi yükleyin',
        render() {
            const def = TYPES[iState.type];
            const allowed = MRP.auth.can(def.perm);
            const tabs = Object.entries(TYPES).filter(([, t]) => MRP.auth.can(t.perm)).map(([k, t]) => [k, t.label, null]);
            if (!tabs.length) return H.empty('Yetkiniz olan aktarım tipi yok');
            if (!allowed) { iState.type = tabs[0][0]; return this.render(); }
            let html = H.tabs(tabs, iState.type, 'impType');
            html += `<div class="grid grid-2">
                ${H.card(`1. Şablonu indirin — ${def.label}`, '', `<div class="card-body"><p style="font-size:.88em;margin-bottom:12px;">${esc(def.desc)}</p>
                    <div class="table-wrap"><table><thead><tr><th>Sütun</th><th>Zorunlu</th><th>Alternatif başlıklar</th></tr></thead><tbody>
                    ${def.cols.map((c) => `<tr><td class="strong">${esc(c.label)}</td><td>${c.req ? '<span class="badge badge-red plain">Zorunlu</span>' : ''}</td><td class="muted" style="font-size:.85em;">${esc((c.aliases || []).join(', '))}</td></tr>`).join('')}</tbody></table></div>
                    <button class="btn btn-secondary" data-act="impTemplate" style="margin-top:12px;">${MRP.icon('download')} Şablonu indir${iState.type === 'items' || iState.type === 'pricelist' || iState.type === 'mps' ? ' (mevcut verilerle)' : ''}</button></div>`)}
                ${H.card('2. Dosyayı yükleyin', '.xlsx, .xls veya .csv (; veya , ayraçlı)', `<div class="card-body">
                    <label class="btn btn-primary" style="cursor:pointer;">${MRP.icon('download')} Dosya seç<input type="file" id="impFile" accept=".xlsx,.xls,.csv,.txt" hidden data-change="impFile"></label>
                    ${iState.type === 'mps' ? `<label class="check-chip" style="margin-left:8px;"><input type="checkbox" data-change="impReplace" ${iState.replace ? 'checked' : ''}> Mevcut planı değiştir</label>` : ''}
                    <p class="muted" style="font-size:.8em;margin-top:12px;">İlk sayfa okunur. Sütun başlıkları Türkçe karakter ve büyük/küçük harf duyarsız eşleştirilir; ERP çıktınızdaki başlıklar alternatiflerden biriyse doğrudan yükleyebilirsiniz. Sayılar 1.234,56 veya 1234.56 biçiminde olabilir.</p>
                    ${iState.fileName ? `<p style="margin-top:10px;font-size:.88em;">Yüklenen: <b>${esc(iState.fileName)}</b></p>` : ''}
                </div>`)}
            </div>`;

            const r = iState.result;
            if (r) {
                html += '<div style="height:16px;"></div>';
                if (r.fatal) html += H.banner('red', 'alert', 'Dosya okunamadı', r.fatal);
                else {
                    html += `<div class="kpis">${H.kpi('Okunan satır', r.total, iState.fileName, 'blue')}${H.kpi('Uygulanacak işlem', r.ops.length, '', 'green')}
                        ${H.kpi('Hatalı satır', r.errors.length, r.errors.length ? 'Atlanacak' : 'Yok', r.errors.length ? 'red' : 'green')}${H.kpi('Uyarı', r.warnings.length, '', r.warnings.length ? 'violet' : '')}</div>`;
                    html += H.card('3. Önizleme ve onay', `Eşleşen sütunlar: ${Object.entries(r.map).map(([k, h]) => `${h}`).join(', ')}`, `
                        ${r.errors.length ? `<div class="card-body" style="padding-bottom:0;"><h3 style="font-size:.88em;color:var(--red);margin-bottom:6px;">Hatalar</h3></div><div class="table-wrap" style="max-height:200px;"><table><thead><tr><th>Satır</th><th>Hata</th></tr></thead><tbody>
                            ${r.errors.slice(0, 100).map((e) => `<tr class="r-crit"><td class="num">${e.row}</td><td>${esc(e.msg)}</td></tr>`).join('')}</tbody></table></div>` : ''}
                        ${r.warnings.length ? `<div class="card-body" style="padding-bottom:0;"><h3 style="font-size:.88em;color:var(--amber);margin-bottom:6px;">Uyarılar</h3></div><div class="table-wrap" style="max-height:160px;"><table><tbody>
                            ${r.warnings.slice(0, 100).map((e) => `<tr class="r-warn"><td class="num" style="width:70px;">${e.row}</td><td>${esc(e.msg)}</td></tr>`).join('')}</tbody></table></div>` : ''}
                        <div class="card-body" style="padding-bottom:0;"><h3 style="font-size:.88em;margin-bottom:6px;">Yapılacak işlemler (ilk 200)</h3></div>
                        <div class="table-wrap" style="max-height:300px;"><table><tbody>${r.ops.slice(0, 200).map((o, i) => `<tr><td class="num" style="width:50px;">${i + 1}</td><td>${esc(o.label)}</td></tr>`).join('') || `<tr><td>${H.empty('Uygulanacak işlem yok')}</td></tr>`}</tbody></table></div>`,
                        `<div style="display:flex;gap:8px;"><button class="btn btn-ghost" data-act="impCancel">Vazgeç</button><button class="btn btn-success" data-act="impApply" ${r.ops.length ? '' : 'disabled'}>${MRP.icon('check')} ${r.ops.length} işlemi içe aktar</button></div>`);
                }
            }

            if (MRP.auth.can('resetData')) {
                html += '<div style="height:16px;"></div>' + H.card('Yedekten geri yükle', 'Raporlar ekranından alınan JSON yedeği', `<div class="card-body"><label class="btn btn-secondary" style="cursor:pointer;">${MRP.icon('refresh')} Yedek dosyası seç (.json)<input type="file" accept=".json" hidden data-change="impRestore"></label>
                    <span class="muted" style="font-size:.8em;margin-left:8px;">Mevcut tüm veriler yedektekilerle değiştirilir.</span></div>`);
            }
            return html;
        }
    };

    Object.assign(MRP.actions, {
        impType: (t) => { iState.type = t; iState.result = null; iState.fileName = ''; app().render(); },
        impTemplate: () => template(iState.type),
        impReplace: (_, el) => { iState.replace = el.checked; if (iState.result && !iState.result.fatal) iState.result.opts = { replace: el.checked }; },
        impFile: async (_, el) => {
            const f = el.files && el.files[0];
            if (!f) return;
            iState.fileName = f.name;
            try {
                const rows = await readFile(f);
                if (!rows.length) throw new Error('Dosyada veri satırı yok.');
                iState.result = validate(iState.type, rows, { replace: iState.replace });
            } catch (e) {
                iState.result = { fatal: e.message };
            }
            app().render();
        },
        impCancel: () => { iState.result = null; iState.fileName = ''; app().render(); },
        impApply: async () => {
            const def = TYPES[iState.type];
            if (!H.guard(def.perm)) return;
            const r = iState.result;
            const extra = iState.type === 'mps' && r.opts.replace ? ' Mevcut ana plan silinecek.' : '';
            if (!(await UI.confirm(`${r.ops.length} işlem uygulanacak${r.errors.length ? `, ${r.errors.length} hatalı satır atlanacak` : ''}.${extra}`, { title: `${def.label} — içe aktar`, okLabel: 'İçe aktar' }))) return;
            apply(iState.type, r);
            const n = r.ops.length;
            iState.result = null; iState.fileName = '';
            app().commit();
            UI.toast('Aktarım tamamlandı', `${def.label}: ${n} işlem`, 'success');
        },
        impRestore: async (_, el) => {
            const f = el.files && el.files[0];
            if (!f || !H.guard('resetData')) return;
            if (!(await UI.confirm(`Tüm veriler "${f.name}" yedeğindekilerle değiştirilecek.`, { title: 'Yedekten geri yükle', okLabel: 'Geri yükle', danger: true }))) return;
            try {
                MRP.store.restore(JSON.parse(await f.text()));
                MRP.model.init();
                MRP.store.audit('Yedekten geri yüklendi', f.name);
                MRP.store.save();
                app().render();
                UI.toast('Yedek geri yüklendi', f.name, 'success');
            } catch (e) { UI.toast('Yedek okunamadı', e.message, 'error'); }
        }
    });
    MRP.importer = { validate, parseCSV, num, date };
})(window.MRP);
</script>
<script>
/* assets/js/views/system.js */
/* ==========================================================================
   MRP Pro — Sistem: Raporlar / dışa aktarım ve denetim kaydı
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const stamp = () => U.iso(new Date());

    const REPORTS = [
        { id: 'csvProducts', icon: 'doc', title: 'Ürün listesi (CSV)', desc: 'Tüm mamuller; kayıtlı ve BOM maliyetleri. Excel ile açılabilir (noktalı virgül ayraçlı, UTF-8).' },
        { id: 'xlsxFull', icon: 'chart', title: 'Tam rapor (Excel)', desc: 'Ürünler, malzeme kartları, stok, MRP önerileri, talepler, siparişler, iş emirleri, hareketler ve tedarikçiler.' },
        { id: 'xlsxMrp', icon: 'calc', title: 'MRP önerileri (Excel)', desc: 'Son MRP çalıştırmasının planlı siparişleri ve istisna mesajları.' },
        { id: 'pdfSummary', icon: 'print', title: 'Yönetim özeti (PDF)', desc: 'KPI\'lar, kritik stoklar, açık siparişler ve MRP özeti.' }
    ];

    MRP.views.reports = {
        title: 'Raporlar & Dışa Aktarım',
        subtitle: 'Verileri Excel, CSV veya PDF olarak indirin',
        render() {
            let html = `<div class="grid grid-3">${REPORTS.map((r) => `<section class="card card-body" style="display:flex;flex-direction:column;gap:10px;">
                <div style="display:flex;gap:10px;align-items:center;">${MRP.icon(r.icon)}<h2 style="font-size:.98em;">${esc(r.title)}</h2></div>
                <p class="muted" style="font-size:.85em;flex:1;">${esc(r.desc)}</p>
                <button class="btn btn-secondary" data-act="${r.id}">${MRP.icon('download')} İndir</button></section>`).join('')}</div>`;
            if (MRP.auth.can('resetData')) {
                html += `<div style="height:20px;"></div>${H.card('Veri yönetimi', 'Yalnızca yönetici', `<div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                    <p class="muted" style="flex:1;min-width:240px;font-size:.85em;">Tüm hareketler, talepler, siparişler, iş emirleri ve özel ürünler silinir; demo veriler yeniden yüklenir. Bu işlem geri alınamaz.</p>
                    <button class="btn btn-secondary" data-act="backupJson">${MRP.icon('download')} Yedek al (JSON)</button>
                    <button class="btn btn-danger" data-act="resetData">${MRP.icon('refresh')} Demo verilerine sıfırla</button></div>`)}`;
            }
            return html;
        }
    };

    const needXLSX = () => {
        if (typeof XLSX !== 'undefined') return true;
        UI.toast('Excel kütüphanesi yüklenemedi', 'İnternet bağlantınızı kontrol edin.', 'error');
        return false;
    };

    function sheet(wb, name, rows) {
        if (!rows.length) rows = [{ Bilgi: 'Kayıt yok' }];
        const ws = XLSX.utils.json_to_sheet(rows);
        ws['!cols'] = Object.keys(rows[0]).map((k) => ({ wch: Math.min(48, Math.max(10, k.length + 2, ...rows.slice(0, 200).map((r) => String(r[k] ?? '').length))) }));
        XLSX.utils.book_append_sheet(wb, ws, name);
    }

    function plannedRows(run) {
        return run ? run.planned.map((p) => ({
            'Öneri': p.id, 'Kod': p.kod, 'Kalem': p.ad, 'Tip': p.type === 'production' ? 'Üretim' : p.service ? 'Fason' : 'Satın alma',
            'Net ihtiyaç': p.shortage, 'Sipariş miktarı': p.qty, 'Birim': p.unit, 'Salım': p.release, 'İhtiyaç': p.due,
            'LT (gün)': p.leadTime, 'Tutar': +(p.qty * (p.type === 'production' ? M.unitCost(p.kod) : p.price)).toFixed(2), 'Gecikmiş': p.late ? 'EVET' : '', 'Neden': p.reason
        })) : [];
    }

    Object.assign(MRP.actions, {
        csvProducts: () => {
            const rows = M.products().map((p) => [p.kod, p.ad, p.kategori, M.bom(p.kod).length, p.fason, p.hammadde, p.iroko, p.toplam, U.round(M.materialCost(p.kod), 2), U.round(M.unitCost(p.kod), 2), M.onHand(p.kod), p.custom ? 'EVET' : 'HAYIR']);
            const csv = U.toCSV(['Mamul Kodu', 'Mamul Adı', 'Kategori', 'Bileşen', 'Fason', 'Hammadde', 'İroko', 'Kayıtlı Maliyet', 'BOM Malzeme', 'Standart Maliyet', 'Stok', 'Özel'], rows);
            U.download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `MRP_Urunler_${stamp()}.csv`);
            UI.toast('CSV indirildi', `${rows.length} ürün`, 'success');
        },
        xlsxFull: () => {
            if (!needXLSX()) return;
            const st = S();
            const wb = XLSX.utils.book_new();
            sheet(wb, 'Ürünler', M.products().map((p) => { const c = M.costParts(p.kod); return { 'Kod': p.kod, 'Ad': p.ad, 'Kategori': p.kategori, 'Kayıtlı Maliyet': p.toplam, 'BOM Malzeme': U.round(c.material, 2), 'İşçilik': U.round(c.labor, 2), 'Standart Maliyet': U.round(M.unitCost(p.kod), 2), 'Stok': M.onHand(p.kod) }; }));
            sheet(wb, 'Malzeme Kartları', M.items().map((i) => ({ 'Kod': i.kod, 'Ad': i.ad, 'Tür': i.tur, 'Birim': i.unit, 'Tedarik': M.PROCUREMENT[i.procurement], 'Fiyat': i.price, 'Para Birimi': i.currency, 'Birim Maliyet ₺': U.round(i.procurement === 'make' ? M.unitCost(i.kod) : M.priceTRY(i.kod), 4), 'LT (gün)': i.leadTime, 'Emniyet Stoğu': i.safetyStock, 'Parti Politikası': i.lotPolicy, 'Parti Miktarı': i.lotSize })));
            sheet(wb, 'Stok', M.items().filter((i) => i.procurement !== 'service').map((i) => ({ 'Kod': i.kod, 'Ad': i.ad, 'Eldeki': M.onHand(i.kod), 'Emniyet': i.safetyStock, 'Siparişte': M.onOrder(i.kod), 'Merkez': M.onHand(i.kod, 'MERKEZ'), 'Fabrika': M.onHand(i.kod, 'FABRIKA'), 'Fason': M.onHand(i.kod, 'FASON'), 'Durum': M.stockStatus(i.kod), 'Değer': U.round(M.onHand(i.kod) * (i.procurement === 'make' ? M.unitCost(i.kod) : M.priceTRY(i.kod)), 2) })));
            sheet(wb, 'MRP Önerileri', plannedRows(st.lastRun));
            sheet(wb, 'Talepler', st.requests.map((r) => ({ 'No': r.no, 'Durum': H.REQ_STATUS[r.status][1], 'Öncelik': H.PRIORITY[r.priority][1], 'Kalem': r.lines.length, 'Tutar': U.round(r.total, 2), 'Talep Eden': r.createdByName, 'Tarih': U.dateTime(r.createdAt), 'Sipariş': r.poNo || '' })));
            sheet(wb, 'Siparişler', st.pos.map((p) => ({ 'No': p.no, 'Tedarikçi': p.supplierName, 'Talep': p.requestNo, 'Teslim': p.deliveryDate, 'Durum': H.PO_STATUS[p.status][1], 'Genel Toplam': U.round(MRP.purchasing.poTotals(p).grand, 2), 'Oluşturan': p.createdBy })));
            sheet(wb, 'İş Emirleri', st.workOrders.map((w) => ({ 'No': w.no, 'Kod': w.kod, 'Ad': w.ad, 'Miktar': w.qty, 'Başlangıç': w.start, 'Bitiş': w.end, 'Durum': H.WO_STATUS[w.status][1] })));
            sheet(wb, 'Hareketler', st.movements.map((m) => ({ 'No': m.id, 'Tarih': U.dateTime(m.at), 'Kod': m.kod, 'Tür': M.MOVE_TYPES[m.type].label, 'Miktar': m.qty, 'Bakiye': m.balance, 'Değer': U.round(m.value, 2), 'Belge': m.ref, 'Kullanıcı': m.user, 'Not': m.note })));
            sheet(wb, 'Lotlar', st.lots.map((l) => ({ 'Lot': l.lot, 'Kod': l.kod, 'Lokasyon': (M.LOCATIONS[l.loc] || {}).ad || l.loc, 'Miktar': l.qty, 'Giriş': U.dateTime(l.at), 'Tedarikçi': l.supplier, 'Belge': l.ref })));
            sheet(wb, 'Fiyat Listesi', st.priceList.map((o) => ({ 'Tedarikçi': o.supplierId, 'Kod': o.kod, 'Fiyat': o.price, 'Para Birimi': o.currency, 'TL': U.round(M.toTRY(o.price, o.currency), 4), 'Teslim (gün)': o.leadTime, 'Min. Sipariş': o.moq })));
            sheet(wb, 'Kurlar', [{ 'Tarih': st.fx.updatedAt ? U.dateTime(st.fx.updatedAt) : 'Varsayılan', 'Kaynak': st.fx.source, ...st.fx.rates }]);
            sheet(wb, 'Tedarikçiler', st.suppliers.map((s) => ({ 'Kod': s.id, 'Firma': s.ad, 'Yetkili': s.yetkili, 'Telefon': s.tel, 'E-posta': s.email, 'Vade': s.vade, 'Puan': s.puan, 'Kategoriler': s.kategoriler.join(', '), 'Aktif': s.aktif ? 'EVET' : 'HAYIR' })));
            XLSX.writeFile(wb, `MRP_Rapor_${stamp()}.xlsx`);
            UI.toast('Excel raporu indirildi', '', 'success');
        },
        xlsxMrp: () => {
            const run = S().lastRun;
            if (!run) return UI.toast('MRP sonucu yok', 'Önce MRP çalıştırılmalı.', 'warn');
            if (!needXLSX()) return;
            const wb = XLSX.utils.book_new();
            sheet(wb, 'Planlı Siparişler', plannedRows(run));
            sheet(wb, 'İstisnalar', run.exceptions.map((e) => ({ 'Önem': { critical: 'Kritik', warn: 'Uyarı', info: 'Bilgi' }[e.sev], 'Kod': e.kod, 'Mesaj': e.msg })));
            sheet(wb, 'Ana Plan', S().mps.map((d) => ({ 'No': d.id, 'Mamul': d.kod, 'Miktar': d.qty, 'Termin': d.dueDate, 'Açıklama': d.note })));
            XLSX.writeFile(wb, `MRP_Oneriler_${stamp()}.xlsx`);
            UI.toast('MRP önerileri indirildi', '', 'success');
        },
        pdfSummary: () => {
            if (!window.jspdf) return UI.toast('PDF kütüphanesi yüklenemedi', 'İnternet bağlantınızı kontrol edin.', 'error');
            const T = U.pdfText;
            const st = S();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
            doc.setFillColor(17, 23, 41); doc.rect(0, 0, pw, 30, 'F');
            doc.setTextColor(245, 158, 11); doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text('MRP Pro', 14, 14);
            doc.setTextColor(230, 233, 242); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
            doc.text(T(`Yönetim Özeti · ${U.dateTime(new Date())} · ${MRP.auth.current().name}`), 14, 22);
            const items = M.items().filter((i) => i.procurement !== 'service');
            const crit = items.filter((i) => M.stockStatus(i.kod) === 'critical');
            const run = st.lastRun;
            const openPOs = st.pos.filter((p) => p.status === 'open' || p.status === 'partial');
            doc.autoTable({
                startY: 38, theme: 'plain', styles: { fontSize: 9 }, columnStyles: { 0: { fontStyle: 'bold', cellWidth: 70 } },
                body: [
                    ['Mamul sayısı', M.products().length.toLocaleString('tr-TR')],
                    ['Malzeme kartı', String(M.items().length)],
                    ['Stok değeri', U.cur(M.stockValue())],
                    ['Döviz kurları', `${Object.entries(st.fx.rates).map(([c, r]) => `${c} ${U.num(r, 4)}`).join(' · ')} (${st.fx.source})`],
                    ['Kritik stok', String(crit.length)],
                    ['Onay bekleyen talep', String(st.requests.filter((r) => r.status === 'pending').length)],
                    ['Açık sipariş', `${openPOs.length} · ${U.cur(U.sum(openPOs, (p) => MRP.purchasing.poTotals(p).grand))}`],
                    ['Aktif iş emri', String(st.workOrders.filter((w) => w.status === 'planned' || w.status === 'released').length)],
                    ['Son MRP', run ? `${U.dateTime(run.runAt)} · ${run.planned.length} öneri · ${run.summary.late} geç salım` : 'Çalıştırılmadı']
                ].map((r) => r.map(T))
            });
            const section = (title, head, body, color) => {
                let y = doc.lastAutoTable.finalY + 10;
                if (y > ph - 40) { doc.addPage(); y = 20; }
                doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(23, 32, 51); doc.text(T(title), 14, y);
                doc.autoTable({ startY: y + 3, head: [head.map(T)], body: body.length ? body.map((r) => r.map((c) => T(c))) : [[T('Kayıt yok')]], theme: 'grid',
                    headStyles: { fillColor: color, fontSize: 8 }, bodyStyles: { fontSize: 7.5 }, margin: { left: 14, right: 14 } });
            };
            section('Kritik stoklar', ['Kod', 'Malzeme', 'Eldeki', 'Emniyet', 'Siparişte'],
                crit.map((i) => [i.kod, i.ad.slice(0, 40), U.qty(M.onHand(i.kod), i.unit), U.qty(i.safetyStock, i.unit), U.qty(M.onOrder(i.kod), i.unit)]), [239, 68, 68]);
            section('Açık satın alma siparişleri', ['No', 'Tedarikçi', 'Teslim', 'Tutar', 'Durum'],
                openPOs.map((p) => [p.no, p.supplierName, U.date(U.parseDate(p.deliveryDate)), U.cur(MRP.purchasing.poTotals(p).grand), H.PO_STATUS[p.status][1]]), [16, 185, 129]);
            if (run) section('MRP istisnaları (ilk 25)', ['Önem', 'Kod', 'Mesaj'],
                run.exceptions.slice(0, 25).map((e) => [{ critical: 'Kritik', warn: 'Uyarı', info: 'Bilgi' }[e.sev], e.kod, e.msg]), [245, 158, 11]);
            const n = doc.internal.getNumberOfPages();
            for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(140); doc.text(`Sayfa ${i} / ${n}`, pw - 30, ph - 8); }
            doc.save(`MRP_Yonetim_Ozeti_${stamp()}.pdf`);
            UI.toast('PDF indirildi', '', 'success');
        },
        backupJson: () => {
            U.download(new Blob([JSON.stringify(S(), null, 2)], { type: 'application/json' }), `MRP_Yedek_${stamp()}.json`);
        },
        resetData: async () => {
            if (!H.guard('resetData')) return;
            if (!(await UI.confirm('Tüm işlem verileri silinecek ve demo verileri yeniden yüklenecek. Devam edilsin mi?', { title: 'Verileri sıfırla', okLabel: 'Sıfırla', danger: true }))) return;
            MRP.store.reset();
            MRP.model.init();
            MRP.store.audit('Veriler sıfırlandı', '');
            MRP.store.save();
            MRP.app.render();
            UI.toast('Veriler sıfırlandı', 'Demo verileri yüklendi.', 'info');
        }
    });

    // =====================================================================
    // DENETİM KAYDI
    // =====================================================================
    const auState = { q: '' };
    MRP.views.audit = {
        title: 'Denetim Kaydı',
        subtitle: 'Kim, ne zaman, ne yaptı — tüm kritik işlemlerin izi',
        render() {
            const q = auState.q.toLocaleLowerCase('tr');
            const list = S().audit.slice().reverse().filter((a) => !q || `${a.user} ${a.action} ${a.detail}`.toLocaleLowerCase('tr').includes(q)).slice(0, 500);
            return `<div class="toolbar"><input class="input" id="auSearch" placeholder="Kullanıcı, işlem veya detay ara…" value="${esc(auState.q)}" data-input="auSearch"></div>
                <section class="card"><div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Kullanıcı</th><th>Rol</th><th>İşlem</th><th>Detay</th></tr></thead><tbody>
                ${list.map((a) => `<tr><td class="nowrap">${esc(U.dateTime(a.at))}</td><td class="strong">${esc(a.user)}</td><td>${esc(a.role)}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.detail)}</td></tr>`).join('')
                    || `<tr><td colspan="5">${H.empty('Kayıt yok')}</td></tr>`}</tbody></table></div></section>`;
        },
        after() {
            const el = document.getElementById('auSearch');
            if (el && auState.q) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };
    const rerender = U.debounce(() => MRP.app.render(), 250);
    MRP.actions.auSearch = (v) => { auState.q = v; rerender(); };
})(window.MRP);
</script>
</body>
</html>
