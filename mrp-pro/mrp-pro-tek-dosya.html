                    <div class="field"><label>Ödeme vadesi</label><select id="poTerm">${[0, 30, 45, 60, 90].map((d) => `<option value="${d}">${d ? d + ' gün' : 'Peşin'}</option>`).join('')}</select></div>
                    <div class="field"><label>Teslim adresi</label><input id="poAddr" value="Merkez Depo — Fabrika"></div>
                </div>
                <div class="table-wrap" style="margin-top:16px;max-height:340px;"><table><thead><tr><th>Kod</th><th>Kalem</th><th class="num">Miktar</th><th class="num">Birim Fiyat</th><th class="num">İsk. %</th><th class="num">KDV %</th><th class="num">Satır Toplamı</th></tr></thead>
                <tbody id="poLines">${r.lines.map((l, i) => `<tr data-i="${i}"><td class="mono">${esc(l.kod)}</td><td>${esc(l.ad)}</td>
                    <td class="num">${inp('pl-qty', l.qty, 'any', 90)} <span class="muted">${esc(l.unit)}</span></td><td class="num">${inp('pl-price', U.round(l.price, 4), 'any', 110)}</td>
                    <td class="num">${inp('pl-disc', 0, '0.1', 70)}</td><td class="num">${inp('pl-vat', 20, '1', 64)}</td><td class="num strong pl-total">0</td></tr>`).join('')}</tbody></table></div>
                <div class="totals"><dl class="dl"><dt>Ara toplam</dt><dd id="poSub"></dd><dt>İskonto</dt><dd id="poDisc"></dd><dt>KDV</dt><dd id="poVat"></dd>
                    <dt class="grand">Genel toplam</dt><dd class="grand" id="poGrand"></dd></dl></div>`,
            buttons: [{ label: 'Vazgeç' }, { label: 'Siparişi Oluştur', cls: 'btn-primary', icon: 'check', onClick: (c) => submitPO(c, r) }]
        });
        const readLines = () => ctx.$$('#poLines tr').map((tr) => {
            const l = r.lines[+tr.dataset.i];
            return { kod: l.kod, ad: l.ad, tur: l.tur, unit: l.unit, qty: U.toNum(tr.querySelector('.pl-qty').value), price: U.toNum(tr.querySelector('.pl-price').value),
                disc: Math.min(100, Math.max(0, U.toNum(tr.querySelector('.pl-disc').value))), vat: Math.max(0, U.toNum(tr.querySelector('.pl-vat').value)), received: 0 };
        });
        const recalc = () => {
            const lines = readLines();
            ctx.$$('#poLines tr').forEach((tr, i) => { const l = lines[i]; tr.querySelector('.pl-total').textContent = U.num(l.qty * l.price * (1 - l.disc / 100) * (1 + l.vat / 100)); });
            const t = poTotals({ lines });
            ctx.$('#poSub').textContent = U.cur(t.sub); ctx.$('#poDisc').textContent = '−' + U.cur(t.disc);
            ctx.$('#poVat').textContent = U.cur(t.vat); ctx.$('#poGrand').textContent = U.cur(t.grand);
        };
        const syncTerm = () => { const s = S().suppliers.find((x) => x.id === ctx.$('#poSup').value); if (s) ctx.$('#poTerm').value = String([0, 30, 45, 60, 90].includes(s.vade) ? s.vade : 30); };
        ctx.$('#poLines').addEventListener('input', recalc);
        ctx.$('#poSup').addEventListener('change', syncTerm);
        ctx.readLines = readLines;

            no: MRP.store.nextNo('PO'), requestNo: r.no, supplierId: sup.id, supplierName: sup.ad, supplierContact: sup.yetkili,

            createdBy: me().name, createdAt: new Date().toISOString(), history: [], receipts: []

        r.status = 'ordered';

    function submitReceive(ctx, p) {
        const waybill = ctx.$('#rcWaybill').value.trim();
        const quality = ctx.$('#rcQuality').value;
        const note = ctx.$('#rcNote').value.trim();
        if (!waybill) { UI.toast('İrsaliye no gerekli', '', 'warn'); return false; }
        const lines = ctx.$$('.rc-qty').map((inp) => ({ i: +inp.dataset.i, qty: U.toNum(inp.value) })).filter((x) => x.qty > 0);
        if (!lines.length) { UI.toast('Miktar girilmedi', 'En az bir kalem için teslim miktarı girin.', 'warn'); return false; }
        if (lines.some((x) => x.qty < 0)) { UI.toast('Geçersiz miktar', '', 'warn'); return false; }
        const over = lines.filter((x) => (p.lines[x.i].received || 0) + x.qty > p.lines[x.i].qty * 1.1 + 1e-9);
        if (over.length) { UI.toast('Fazla teslimat', 'Sipariş miktarının %10\'undan fazlası kabul edilemez.', 'warn'); return false; }

        const rc = { waybill, quality, note, at: new Date().toISOString(), by: me().name, lines: lines.map((x) => ({ kod: p.lines[x.i].kod, qty: x.qty })) };
        p.receipts = p.receipts || [];
        p.receipts.push(rc);
        if (quality === 'rejected') {
            log(p, 'Teslimat reddedildi', `İrsaliye ${waybill}${note ? ' — ' + note : ''}`);
            MRP.store.audit('Teslimat reddedildi', `${p.no} / ${waybill}`);
            MRP.store.notify('po', 'Teslimat reddedildi', `${p.no} · ${p.supplierName} · İrsaliye ${waybill}`, ['satinalma', 'satinalma_muduru', 'admin', 'planlama'], 'po');
        } else {
            lines.forEach((x) => {
                const l = p.lines[x.i];
                l.received = U.round((l.received || 0) + x.qty, 3);
                const it = M.item(l.kod);
                if (it && it.procurement !== 'service') M.move({ kod: l.kod, qty: x.qty, type: 'GR', ref: p.no, note: `İrsaliye ${waybill}` });
            });
            const done = p.lines.every((l) => (l.received || 0) >= l.qty - 1e-9);
            p.status = done ? 'received' : 'partial';
            log(p, done ? 'Tamamı teslim alındı' : 'Kısmi teslim alındı', `İrsaliye ${waybill}`);
            if (done) {
                const r = findReq(p.requestNo);
                if (r) { r.status = 'closed'; log(r, 'Kapandı', `${p.no} teslim alındı`); }
            }
            MRP.store.audit('Mal kabul', `${p.no} / ${waybill}: ${lines.length} kalem${done ? '' : ' (kısmi)'}`);
            MRP.store.notify('po', 'Mal kabul yapıldı', `${p.no} · ${lines.length} kalem${done ? '' : ' (kısmi)'}`, ['planlama', 'satinalma_muduru', 'admin'], 'po');
        }
        app().commit();
        UI.toast(quality === 'rejected' ? 'Teslimat reddedildi' : 'Mal kabul kaydedildi', quality === 'rejected' ? 'Stok değişmedi.' : 'Stoklar güncellendi.', quality === 'rejected' ? 'warn' : 'success');
    }

    function printPO(no) {
        const p = findPO(no);
        if (!p) return;
        if (!window.jspdf) return UI.toast('PDF kütüphanesi yüklenemedi', 'İnternet bağlantınızı kontrol edin.', 'error');
        const T = U.pdfText;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const pw = doc.internal.pageSize.getWidth();
        doc.setFillColor(17, 23, 41); doc.rect(0, 0, pw, 28, 'F');
        doc.setTextColor(245, 158, 11); doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
        doc.text(T('SATIN ALMA SİPARİŞİ'), 14, 13);
        doc.setTextColor(230, 233, 242); doc.setFontSize(10); doc.setFont('helvetica', 'normal');
        doc.text(`${p.no}  |  ${T(U.date(p.createdAt))}`, 14, 21);
        doc.setTextColor(23, 32, 51); doc.setFontSize(9.5);
        const info = [['Tedarikçi', p.supplierName], ['Yetkili', p.supplierContact || '-'], ['Teslim tarihi', U.date(U.parseDate(p.deliveryDate))],
            ['Ödeme vadesi', p.paymentTerm ? p.paymentTerm + ' gün' : 'Peşin'], ['Teslim adresi', p.address || '-'], ['Talep referansı', p.requestNo]];
        info.forEach(([k, v], i) => { doc.setFont('helvetica', 'bold'); doc.text(T(k) + ':', 14, 38 + i * 6); doc.setFont('helvetica', 'normal'); doc.text(T(v), 50, 38 + i * 6); });
        doc.autoTable({
            startY: 76,
            head: [['Kod', 'Kalem', 'Miktar', 'Birim', 'Birim Fiyat', 'Isk.%', 'KDV%', 'Toplam'].map(T)],
            body: p.lines.map((l) => [l.kod, T(l.ad).slice(0, 38), U.qty(l.qty), T(l.unit), U.num(l.price, 2), U.num(l.disc, 1), U.num(l.vat, 0), U.num(l.qty * l.price * (1 - l.disc / 100) * (1 + l.vat / 100))]),
            theme: 'grid', headStyles: { fillColor: [17, 23, 41], textColor: [245, 158, 11], fontSize: 8 }, bodyStyles: { fontSize: 7.5 },
            columnStyles: { 2: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right' }, 7: { halign: 'right' } },
            margin: { left: 14, right: 14 }
        });
        const t = poTotals(p);
        let y = doc.lastAutoTable.finalY + 8;
        [['Ara toplam', t.sub], ['Iskonto', -t.disc], ['KDV', t.vat], ['GENEL TOPLAM', t.grand]].forEach(([k, v], i) => {
            doc.setFont('helvetica', i === 3 ? 'bold' : 'normal');
            doc.text(k, pw - 70, y); doc.text(T(U.cur(v)), pw - 14, y, { align: 'right' }); y += 6;
        });
        doc.setFontSize(7.5); doc.setTextColor(120);
        doc.text(T(`Oluşturan: ${p.createdBy} — MRP Pro`), 14, doc.internal.pageSize.getHeight() - 10);
        doc.save(`${p.no}.pdf`);
    }

                <div class="chips" style="margin-bottom:14px;">${s.kategoriler.map((k) => `<span class="badge badge-gray plain">${esc(k)}</span>`).join('')}</div>
                ${pos.length ? `<div class="table-wrap"><table><thead><tr><th>Sipariş</th><th>Tarih</th><th>Teslim</th><th class="num">Tutar ₺</th><th>Durum</th></tr></thead><tbody>
                    ${pos.map((p) => `<tr><td class="mono">${esc(p.no)}</td><td>${esc(U.date(p.createdAt))}</td><td>${esc(U.date(U.parseDate(p.deliveryDate)))}</td><td class="num">${U.num(poTotals(p).grand)}</td><td>${H.badge(H.PO_STATUS, p.status)}</td></tr>`).join('')}
                    </tbody></table></div>` : '<p class="muted">Henüz sipariş yok.</p>'}`
        });
    }

    function editSupplier(id) {
        if (!H.guard('manageSuppliers')) return;
        const s = id ? S().suppliers.find((x) => x.id === id) : { ad: '', yetkili: '', tel: '', email: '', adres: '', vergiNo: '', kategoriler: [], vade: 30, puan: 4, aktif: true };
        const types = MRP.data.ITEM_TYPES;
        UI.modal({
            title: id ? `Tedarikçi Düzenle — ${s.id}` : 'Yeni Tedarikçi', size: 'lg',
            body: `<div class="form-section"><h3>Firma bilgileri</h3><div class="form-grid">
                    <div class="field full"><label>Firma adı <span class="req">*</span></label><input id="sAd" value="${esc(s.ad)}"></div>
                    <div class="field"><label>Yetkili</label><input id="sYet" value="${esc(s.yetkili)}"></div>
                    <div class="field"><label>Telefon</label><input id="sTel" value="${esc(s.tel)}"></div>
                    <div class="field"><label>E-posta</label><input id="sMail" type="email" value="${esc(s.email)}"></div>
                    <div class="field"><label>Vergi no</label><input id="sVno" value="${esc(s.vergiNo)}" maxlength="11"></div>
                    <div class="field full"><label>Adres</label><textarea id="sAdr">${esc(s.adres)}</textarea></div></div></div>
                <div class="form-section"><h3>Tedarik kategorileri <span class="req">*</span></h3><div class="chips">${types.map((t) => `<label class="check-chip"><input type="checkbox" class="sCat" value="${esc(t)}" ${s.kategoriler.includes(t) ? 'checked' : ''}> ${esc(t)}</label>`).join('')}</div></div>
                <div class="form-section"><h3>Ticari</h3><div class="form-grid">
                    <div class="field"><label>Ödeme vadesi (gün)</label><input id="sVade" type="number" min="0" step="1" value="${s.vade}"></div>
                    <div class="field"><label>Performans puanı (1–5)</label><input id="sPuan" type="number" min="1" max="5" step="0.1" value="${s.puan}"></div></div></div>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Kaydet', cls: 'btn-success', icon: 'check', onClick: (ctx) => {
                    const ad = ctx.$('#sAd').value.trim();
                    const cats = ctx.$$('.sCat:checked').map((c) => c.value);
                    const email = ctx.$('#sMail').value.trim();
                    if (!ad) { UI.toast('Firma adı zorunlu', '', 'warn'); return false; }
                    if (!cats.length) { UI.toast('Kategori seçin', 'En az bir tedarik kategorisi gerekli.', 'warn'); return false; }
                    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { UI.toast('Geçersiz e-posta', '', 'warn'); return false; }
                    const data = { ad, yetkili: ctx.$('#sYet').value.trim(), tel: ctx.$('#sTel').value.trim(), email, adres: ctx.$('#sAdr').value.trim(),
                        vergiNo: ctx.$('#sVno').value.trim(), kategoriler: cats, vade: Math.max(0, Math.round(U.toNum(ctx.$('#sVade').value, 30))),
                        puan: Math.min(5, Math.max(1, U.toNum(ctx.$('#sPuan').value, 4))) };
                    if (id) {
                        Object.assign(s, data);
                        MRP.store.audit('Tedarikçi güncellendi', `${s.id} — ${ad}`);
                    } else {
                        const nid = MRP.store.nextNo('TED');
                        S().suppliers.push({ id: nid, ...data, aktif: true });
                        MRP.store.audit('Tedarikçi eklendi', `${nid} — ${ad}`);
                        MRP.store.notify('supplier', 'Yeni tedarikçi', `${ad} (${nid})`, ['satinalma', 'satinalma_muduru', 'admin'], 'suppliers');
                    }
                    app().commit();
                    UI.toast('Tedarikçi kaydedildi', ad, 'success');
                }
            }]
        });
    }

    Object.assign(MRP.actions, {
        supplierDetail: (id) => openSupplier(id),
        supplierEdit: (id) => editSupplier(id)
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/inventory.js */
/* ==========================================================================
   MRP Pro — Depo: Stok durumu, sayım düzeltme, stok hareketleri
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;

    const stockState = { tab: 'all', q: '' };

    MRP.views.stock = {
        title: 'Stok Durumu',
        subtitle: 'Eldeki stok, emniyet stoğu, açık sipariş ve stok değeri',
        render() {
            const stocked = M.items().filter((i) => i.procurement !== 'service');
            const status = (i) => M.stockStatus(i.kod);
            const fg = M.products().filter((p) => M.onHand(p.kod) !== 0);
            const tabs = [['all', 'Tüm malzemeler', stocked.length], ['critical', 'Kritik', stocked.filter((i) => status(i) === 'critical').length],
                ['warn', 'Düşük', stocked.filter((i) => status(i) === 'warn').length], ['ok', 'Normal', stocked.filter((i) => status(i) === 'ok').length], ['fg', 'Mamul stoğu', fg.length]];
            const q = stockState.q.toLocaleLowerCase('tr');
            const match = (x) => !q || x.kod.toLocaleLowerCase('tr').includes(q) || x.ad.toLocaleLowerCase('tr').includes(q);
            const canAdj = MRP.auth.can('adjustStock');

            let html = `<div class="kpis">
                ${H.kpi('Stok Değeri', U.compactCur(M.stockValue()), 'Standart maliyetle', '')}
                ${H.kpi('Stoklu Kalem', stocked.length, `${fg.length} mamul stokta`, 'blue')}
                ${H.kpi('Kritik', tabs[1][2], 'Emniyet stoğunun %50 altı', tabs[1][2] ? 'red' : 'green')}
                ${H.kpi('Düşük', tabs[2][2], 'Emniyet stoğunun altı', tabs[2][2] ? 'violet' : 'green')}
            </div>${H.tabs(tabs, stockState.tab, 'stockTab')}
            <div class="toolbar"><input class="input" id="stockSearch" placeholder="Kod veya ad ile ara…" value="${esc(stockState.q)}" data-input="stockSearch"></div>`;

            if (stockState.tab === 'fg') {
                const list = fg.filter(match);
                return html + `<section class="card"><div class="table-wrap"><table><thead><tr><th>Mamul</th><th>Ad</th><th>Kategori</th><th class="num">Stok</th><th class="num">Birim Maliyet</th><th class="num">Değer ₺</th><th></th></tr></thead><tbody>
                    ${list.map((p) => `<tr><td>${H.productLink(p.kod)}</td><td class="strong">${esc(p.ad)}</td><td>${H.catTag(p.kategori)}</td><td class="num">${esc(U.qty(M.onHand(p.kod), 'ad'))}</td>
                        <td class="num">${U.num(M.unitCost(p.kod))}</td><td class="num">${U.num(M.onHand(p.kod) * M.unitCost(p.kod))}</td>
                        <td>${canAdj ? `<button class="btn btn-ghost btn-sm" data-act="stockAdjust" data-id="${esc(p.kod)}">Düzelt</button>` : ''}</td></tr>`).join('')
                    || `<tr><td colspan="7">${H.empty('Mamul stoğu yok', 'Tamamlanan iş emirleri mamul stoğu oluşturur.')}</td></tr>`}</tbody></table></div></section>`;
            }

            const ord = { critical: 0, warn: 1, ok: 2, na: 3 };
            const list = stocked.filter((i) => (stockState.tab === 'all' || status(i) === stockState.tab) && match(i))
                .sort((a, b) => ord[status(a)] - ord[status(b)] || a.kod.localeCompare(b.kod));
            html += `<section class="card"><div class="table-wrap"><table>
                <thead><tr><th>Kod</th><th>Malzeme</th><th>Tür</th><th class="num">Eldeki</th><th class="num">Emniyet</th><th class="num">Siparişte</th>
                    <th>Doluluk</th><th>Durum</th><th class="num">Değer ₺</th><th></th></tr></thead>
                <tbody>${list.map((i) => {
                    const s = status(i);
                    const oh = M.onHand(i.kod);
                    const fill = i.safetyStock > 0 ? Math.min(100, oh / (i.safetyStock * 2) * 100) : 100;
                    const color = s === 'critical' ? 'var(--red)' : s === 'warn' ? 'var(--amber)' : 'var(--green)';
                    return `<tr class="${s === 'critical' ? 'r-crit' : s === 'warn' ? 'r-warn' : ''}">
                        <td>${H.itemLink(i.kod)}</td><td class="strong">${esc(i.ad)}</td><td><span class="badge badge-gray plain">${esc(i.tur)}</span></td>
                        <td class="num strong">${esc(U.qty(oh, i.unit))}</td><td class="num">${esc(U.qty(i.safetyStock, i.unit))}</td>
                        <td class="num">${esc(U.qty(M.onOrder(i.kod), i.unit))}</td>
                        <td><span class="bar"><span style="width:${Math.max(0, fill)}%;background:${color};"></span></span></td>
                        <td>${H.stockBadge(s)}</td><td class="num">${U.num(Math.max(0, oh) * M.unitCost(i.kod))}</td>
                        <td>${canAdj ? `<button class="btn btn-ghost btn-sm" data-act="stockAdjust" data-id="${esc(i.kod)}">Düzelt</button>` : ''}</td></tr>`;
                }).join('') || `<tr><td colspan="10">${H.empty('Kayıt yok')}</td></tr>`}</tbody></table></div></section>
                <p class="muted" style="font-size:.78em;margin-top:10px;">Eksik malzemeler için sipariş, MRP çalıştırıldığında emniyet stoğu tamamlama önerisi olarak otomatik oluşturulur.</p>`;
            return html;
        },
        after() {
            const el = document.getElementById('stockSearch');
            if (el && stockState.q) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };

    function adjust(kod) {
        if (!H.guard('adjustStock')) return;
        const it = M.item(kod);
        const cur = M.onHand(kod);
        UI.modal({
            title: `Sayım Düzeltme — ${kod}`, size: 'sm',
            body: `<p style="margin-bottom:14px;">${esc(it.ad)}</p>
                <div class="form-grid">
                    <div class="field"><label>Sistem stoğu</label><input value="${esc(U.qty(cur, it.unit))}" readonly></div>
                    <div class="field"><label>Sayılan miktar (${esc(it.unit)}) <span class="req">*</span></label><input id="adjQty" type="number" min="0" step="any" value="${cur}"></div>
                    <div class="field full"><label>Gerekçe <span class="req">*</span></label><input id="adjNote" placeholder="Yıl sonu sayımı, fire, hasar…"></div>
                </div><p class="hint" id="adjDiff" style="margin-top:10px;font-size:.84em;"></p>`,
            onOpen: (ctx) => {
                const upd = () => { const d = U.toNum(ctx.$('#adjQty').value) - cur; ctx.$('#adjDiff').textContent = `Fark: ${d > 0 ? '+' : ''}${U.qty(d, it.unit)} · ${U.cur(d * M.unitCost(kod))}`; };
                ctx.$('#adjQty').addEventListener('input', upd); upd();
            },
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Kaydet', cls: 'btn-primary', onClick: (ctx) => {
                    const v = U.toNum(ctx.$('#adjQty').value, NaN);
                    const note = ctx.$('#adjNote').value.trim();
                    if (!isFinite(v) || v < 0) { UI.toast('Geçersiz miktar', '', 'warn'); return false; }
                    if (!note) { UI.toast('Gerekçe zorunlu', 'Denetim için düzeltme gerekçesi girin.', 'warn'); return false; }
                    const d = U.round(v - cur, 3);
                    if (!d) return;
                    M.move({ kod, qty: d, type: 'ADJ', ref: 'SAYIM', note });
                    MRP.store.audit('Stok düzeltme', `${kod}: ${U.qty(cur)} → ${U.qty(v)} (${note})`);
                    app().commit();
                    UI.toast('Stok güncellendi', `${kod}: ${U.qty(v, it.unit)}`, 'success');
                }
            }]
        });
    }

    const rerender = U.debounce(() => app().render(), 250);
    Object.assign(MRP.actions, {
        stockTab: (t) => { stockState.tab = t; app().render(); },
        stockSearch: (v) => { stockState.q = v; rerender(); },
        stockAdjust: (kod) => adjust(kod)
    });

    // =====================================================================
    // STOK HAREKETLERİ
    // =====================================================================
    const mvState = { type: 'all', q: '', page: 1, size: 100 };

    MRP.views.movements = {
        title: 'Stok Hareketleri',
        subtitle: 'Mal kabul, üretime sarf, üretimden giriş ve sayım düzeltmeleri',
        render() {
            const q = mvState.q.toLocaleLowerCase('tr');
            let list = S().movements.slice().reverse();
            if (mvState.type !== 'all') list = list.filter((m) => m.type === mvState.type);
            if (q) list = list.filter((m) => m.kod.toLocaleLowerCase('tr').includes(q) || (m.ref || '').toLocaleLowerCase('tr').includes(q) || ((M.item(m.kod) || {}).ad || '').toLocaleLowerCase('tr').includes(q));
            const pages = Math.max(1, Math.ceil(list.length / mvState.size));
            mvState.page = Math.min(mvState.page, pages);
            const page = list.slice((mvState.page - 1) * mvState.size, mvState.page * mvState.size);
            return `<div class="toolbar">
                    <select class="input" data-change="mvType"><option value="all">Tüm hareketler</option>${Object.entries(M.MOVE_TYPES).map(([k, v]) => `<option value="${k}" ${mvState.type === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select>
                    <input class="input" id="mvSearch" placeholder="Kod, ad veya belge no…" value="${esc(mvState.q)}" data-input="mvSearch">
                </div>
                <section class="card"><div class="table-wrap"><table>
                    <thead><tr><th>Hareket No</th><th>Tarih</th><th>Kod</th><th>Kalem</th><th>Tür</th><th class="num">Miktar</th><th class="num">Bakiye</th><th class="num">Değer ₺</th><th>Belge</th><th>Kullanıcı</th><th>Açıklama</th></tr></thead>
                    <tbody>${page.map((m) => {
                        const it = M.item(m.kod) || { ad: '?', unit: '' };
                        return `<tr><td class="mono">${esc(m.id)}</td><td class="nowrap">${esc(U.dateTime(m.at))}</td><td>${H.anyLink(m.kod)}</td><td>${esc(it.ad)}</td>
                            <td><span class="badge ${M.MOVE_TYPES[m.type].badge}">${esc(M.MOVE_TYPES[m.type].label)}</span></td>
                            <td class="num ${m.qty < 0 ? 'tp-neg' : 'tp-pos'}">${m.qty > 0 ? '+' : ''}${esc(U.qty(m.qty, it.unit))}</td>
                            <td class="num">${esc(U.qty(m.balance))}</td><td class="num">${U.num(m.value)}</td>
                            <td class="mono">${esc(m.ref)}</td><td>${esc(m.user)}</td><td class="muted">${esc(m.note)}</td></tr>`;
                    }).join('') || `<tr><td colspan="11">${H.empty('Hareket bulunamadı')}</td></tr>`}</tbody>
                </table></div>${H.pager(list.length, mvState.page, mvState.size, 'mvPage')}</section>`;
        },
        after() {
            const el = document.getElementById('mvSearch');
            if (el && mvState.q) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };
    const rerenderMv = U.debounce(() => app().render(), 250);
    Object.assign(MRP.actions, {
        mvType: (v) => { mvState.type = v; mvState.page = 1; app().render(); },
        mvSearch: (v) => { mvState.q = v; mvState.page = 1; rerenderMv(); },
        mvPage: (p) => { mvState.page = +p; app().render(); }
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/system.js */
/* ==========================================================================
   MRP Pro — Sistem: Raporlar / dışa aktarım ve denetim kaydı
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const stamp = () => U.iso(new Date());

    const REPORTS = [
        { id: 'csvProducts', icon: 'doc', title: 'Ürün listesi (CSV)', desc: 'Tüm mamuller; kayıtlı ve BOM maliyetleri. Excel ile açılabilir (noktalı virgül ayraçlı, UTF-8).' },
        { id: 'xlsxFull', icon: 'chart', title: 'Tam rapor (Excel)', desc: 'Ürünler, malzeme kartları, stok, MRP önerileri, talepler, siparişler, iş emirleri, hareketler ve tedarikçiler.' },
        { id: 'xlsxMrp', icon: 'calc', title: 'MRP önerileri (Excel)', desc: 'Son MRP çalıştırmasının planlı siparişleri ve istisna mesajları.' },
        { id: 'pdfSummary', icon: 'print', title: 'Yönetim özeti (PDF)', desc: 'KPI\'lar, kritik stoklar, açık siparişler ve MRP özeti.' }
    ];

    MRP.views.reports = {
        title: 'Raporlar & Dışa Aktarım',
        subtitle: 'Verileri Excel, CSV veya PDF olarak indirin',
        render() {
            let html = `<div class="grid grid-3">${REPORTS.map((r) => `<section class="card card-body" style="display:flex;flex-direction:column;gap:10px;">
                <div style="display:flex;gap:10px;align-items:center;">${MRP.icon(r.icon)}<h2 style="font-size:.98em;">${esc(r.title)}</h2></div>
                <p class="muted" style="font-size:.85em;flex:1;">${esc(r.desc)}</p>
                <button class="btn btn-secondary" data-act="${r.id}">${MRP.icon('download')} İndir</button></section>`).join('')}</div>`;
            if (MRP.auth.can('resetData')) {
                html += `<div style="height:20px;"></div>${H.card('Veri yönetimi', 'Yalnızca yönetici', `<div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                    <p class="muted" style="flex:1;min-width:240px;font-size:.85em;">Tüm hareketler, talepler, siparişler, iş emirleri ve özel ürünler silinir; demo veriler yeniden yüklenir. Bu işlem geri alınamaz.</p>
                    <button class="btn btn-secondary" data-act="backupJson">${MRP.icon('download')} Yedek al (JSON)</button>
                    <button class="btn btn-danger" data-act="resetData">${MRP.icon('refresh')} Demo verilerine sıfırla</button></div>`)}`;
            }
            return html;
        }
    };

    const needXLSX = () => {
        if (typeof XLSX !== 'undefined') return true;
        UI.toast('Excel kütüphanesi yüklenemedi', 'İnternet bağlantınızı kontrol edin.', 'error');
        return false;
    };

    function sheet(wb, name, rows) {
        if (!rows.length) rows = [{ Bilgi: 'Kayıt yok' }];
        const ws = XLSX.utils.json_to_sheet(rows);
        ws['!cols'] = Object.keys(rows[0]).map((k) => ({ wch: Math.min(48, Math.max(10, k.length + 2, ...rows.slice(0, 200).map((r) => String(r[k] ?? '').length))) }));
        XLSX.utils.book_append_sheet(wb, ws, name);
    }

    function plannedRows(run) {
        return run ? run.planned.map((p) => ({
            'Öneri': p.id, 'Kod': p.kod, 'Kalem': p.ad, 'Tip': p.type === 'production' ? 'Üretim' : p.service ? 'Fason' : 'Satın alma',
            'Net ihtiyaç': p.shortage, 'Sipariş miktarı': p.qty, 'Birim': p.unit, 'Salım': p.release, 'İhtiyaç': p.due,
            'LT (gün)': p.leadTime, 'Tutar': +(p.qty * (p.type === 'production' ? M.unitCost(p.kod) : p.price)).toFixed(2), 'Gecikmiş': p.late ? 'EVET' : '', 'Neden': p.reason
        })) : [];
    }

    Object.assign(MRP.actions, {
        csvProducts: () => {
            const rows = M.products().map((p) => [p.kod, p.ad, p.kategori, M.bom(p.kod).length, p.fason, p.hammadde, p.iroko, p.toplam, U.round(M.unitCost(p.kod), 2), M.onHand(p.kod), p.custom ? 'EVET' : 'HAYIR']);
            const csv = U.toCSV(['Mamul Kodu', 'Mamul Adı', 'Kategori', 'Bileşen', 'Fason', 'Hammadde', 'İroko', 'Kayıtlı Maliyet', 'BOM Maliyeti', 'Stok', 'Özel'], rows);
            U.download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `MRP_Urunler_${stamp()}.csv`);
            UI.toast('CSV indirildi', `${rows.length} ürün`, 'success');
        },
        xlsxFull: () => {
            if (!needXLSX()) return;
            const st = S();
            const wb = XLSX.utils.book_new();
            sheet(wb, 'Ürünler', M.products().map((p) => ({ 'Kod': p.kod, 'Ad': p.ad, 'Kategori': p.kategori, 'Kayıtlı Maliyet': p.toplam, 'BOM Maliyeti': U.round(M.unitCost(p.kod), 2), 'Stok': M.onHand(p.kod) })));
            sheet(wb, 'Malzeme Kartları', M.items().map((i) => ({ 'Kod': i.kod, 'Ad': i.ad, 'Tür': i.tur, 'Birim': i.unit, 'Tedarik': M.PROCUREMENT[i.procurement], 'Birim Maliyet': U.round(M.unitCost(i.kod), 4), 'LT (gün)': i.leadTime, 'Emniyet Stoğu': i.safetyStock, 'Parti Politikası': i.lotPolicy, 'Parti Miktarı': i.lotSize })));
            sheet(wb, 'Stok', M.items().filter((i) => i.procurement !== 'service').map((i) => ({ 'Kod': i.kod, 'Ad': i.ad, 'Eldeki': M.onHand(i.kod), 'Emniyet': i.safetyStock, 'Siparişte': M.onOrder(i.kod), 'Durum': M.stockStatus(i.kod), 'Değer': U.round(M.onHand(i.kod) * M.unitCost(i.kod), 2) })));
            sheet(wb, 'MRP Önerileri', plannedRows(st.lastRun));
            sheet(wb, 'Talepler', st.requests.map((r) => ({ 'No': r.no, 'Durum': H.REQ_STATUS[r.status][1], 'Öncelik': H.PRIORITY[r.priority][1], 'Kalem': r.lines.length, 'Tutar': U.round(r.total, 2), 'Talep Eden': r.createdByName, 'Tarih': U.dateTime(r.createdAt), 'Sipariş': r.poNo || '' })));
            sheet(wb, 'Siparişler', st.pos.map((p) => ({ 'No': p.no, 'Tedarikçi': p.supplierName, 'Talep': p.requestNo, 'Teslim': p.deliveryDate, 'Durum': H.PO_STATUS[p.status][1], 'Genel Toplam': U.round(MRP.purchasing.poTotals(p).grand, 2), 'Oluşturan': p.createdBy })));
            sheet(wb, 'İş Emirleri', st.workOrders.map((w) => ({ 'No': w.no, 'Kod': w.kod, 'Ad': w.ad, 'Miktar': w.qty, 'Başlangıç': w.start, 'Bitiş': w.end, 'Durum': H.WO_STATUS[w.status][1] })));
            sheet(wb, 'Hareketler', st.movements.map((m) => ({ 'No': m.id, 'Tarih': U.dateTime(m.at), 'Kod': m.kod, 'Tür': M.MOVE_TYPES[m.type].label, 'Miktar': m.qty, 'Bakiye': m.balance, 'Değer': U.round(m.value, 2), 'Belge': m.ref, 'Kullanıcı': m.user, 'Not': m.note })));
            sheet(wb, 'Tedarikçiler', st.suppliers.map((s) => ({ 'Kod': s.id, 'Firma': s.ad, 'Yetkili': s.yetkili, 'Telefon': s.tel, 'E-posta': s.email, 'Vade': s.vade, 'Puan': s.puan, 'Kategoriler': s.kategoriler.join(', '), 'Aktif': s.aktif ? 'EVET' : 'HAYIR' })));
            XLSX.writeFile(wb, `MRP_Rapor_${stamp()}.xlsx`);
            UI.toast('Excel raporu indirildi', '', 'success');
        },
        xlsxMrp: () => {
            const run = S().lastRun;
            if (!run) return UI.toast('MRP sonucu yok', 'Önce MRP çalıştırılmalı.', 'warn');
            if (!needXLSX()) return;
            const wb = XLSX.utils.book_new();
            sheet(wb, 'Planlı Siparişler', plannedRows(run));
            sheet(wb, 'İstisnalar', run.exceptions.map((e) => ({ 'Önem': { critical: 'Kritik', warn: 'Uyarı', info: 'Bilgi' }[e.sev], 'Kod': e.kod, 'Mesaj': e.msg })));
            sheet(wb, 'Ana Plan', S().mps.map((d) => ({ 'No': d.id, 'Mamul': d.kod, 'Miktar': d.qty, 'Termin': d.dueDate, 'Açıklama': d.note })));
            XLSX.writeFile(wb, `MRP_Oneriler_${stamp()}.xlsx`);
            UI.toast('MRP önerileri indirildi', '', 'success');
        },
        pdfSummary: () => {
            if (!window.jspdf) return UI.toast('PDF kütüphanesi yüklenemedi', 'İnternet bağlantınızı kontrol edin.', 'error');
            const T = U.pdfText;
            const st = S();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
            doc.setFillColor(17, 23, 41); doc.rect(0, 0, pw, 30, 'F');
            doc.setTextColor(245, 158, 11); doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text('MRP Pro', 14, 14);
            doc.setTextColor(230, 233, 242); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
            doc.text(T(`Yönetim Özeti · ${U.dateTime(new Date())} · ${MRP.auth.current().name}`), 14, 22);
            const items = M.items().filter((i) => i.procurement !== 'service');
            const crit = items.filter((i) => M.stockStatus(i.kod) === 'critical');
            const run = st.lastRun;
            const openPOs = st.pos.filter((p) => p.status === 'open' || p.status === 'partial');
            doc.autoTable({
                startY: 38, theme: 'plain', styles: { fontSize: 9 }, columnStyles: { 0: { fontStyle: 'bold', cellWidth: 70 } },
                body: [
                    ['Mamul sayısı', M.products().length.toLocaleString('tr-TR')],
                    ['Malzeme kartı', String(M.items().length)],
                    ['Stok değeri', U.cur(M.stockValue())],
                    ['Kritik stok', String(crit.length)],
                    ['Onay bekleyen talep', String(st.requests.filter((r) => r.status === 'pending').length)],
                    ['Açık sipariş', `${openPOs.length} · ${U.cur(U.sum(openPOs, (p) => MRP.purchasing.poTotals(p).grand))}`],
                    ['Aktif iş emri', String(st.workOrders.filter((w) => w.status === 'planned' || w.status === 'released').length)],
                    ['Son MRP', run ? `${U.dateTime(run.runAt)} · ${run.planned.length} öneri · ${run.summary.late} geç salım` : 'Çalıştırılmadı']
                ].map((r) => r.map(T))
            });
            const section = (title, head, body, color) => {
                let y = doc.lastAutoTable.finalY + 10;
                if (y > ph - 40) { doc.addPage(); y = 20; }
                doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(23, 32, 51); doc.text(T(title), 14, y);
                doc.autoTable({ startY: y + 3, head: [head.map(T)], body: body.length ? body.map((r) => r.map((c) => T(c))) : [[T('Kayıt yok')]], theme: 'grid',
                    headStyles: { fillColor: color, fontSize: 8 }, bodyStyles: { fontSize: 7.5 }, margin: { left: 14, right: 14 } });
            };
            section('Kritik stoklar', ['Kod', 'Malzeme', 'Eldeki', 'Emniyet', 'Siparişte'],
                crit.map((i) => [i.kod, i.ad.slice(0, 40), U.qty(M.onHand(i.kod), i.unit), U.qty(i.safetyStock, i.unit), U.qty(M.onOrder(i.kod), i.unit)]), [239, 68, 68]);
            section('Açık satın alma siparişleri', ['No', 'Tedarikçi', 'Teslim', 'Tutar', 'Durum'],
                openPOs.map((p) => [p.no, p.supplierName, U.date(U.parseDate(p.deliveryDate)), U.cur(MRP.purchasing.poTotals(p).grand), H.PO_STATUS[p.status][1]]), [16, 185, 129]);
            if (run) section('MRP istisnaları (ilk 25)', ['Önem', 'Kod', 'Mesaj'],
                run.exceptions.slice(0, 25).map((e) => [{ critical: 'Kritik', warn: 'Uyarı', info: 'Bilgi' }[e.sev], e.kod, e.msg]), [245, 158, 11]);
            const n = doc.internal.getNumberOfPages();
            for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(140); doc.text(`Sayfa ${i} / ${n}`, pw - 30, ph - 8); }
            doc.save(`MRP_Yonetim_Ozeti_${stamp()}.pdf`);
            UI.toast('PDF indirildi', '', 'success');
        },
        backupJson: () => {
            U.download(new Blob([JSON.stringify(S(), null, 2)], { type: 'application/json' }), `MRP_Yedek_${stamp()}.json`);
        },
        resetData: async () => {
            if (!H.guard('resetData')) return;
            if (!(await UI.confirm('Tüm işlem verileri silinecek ve demo verileri yeniden yüklenecek. Devam edilsin mi?', { title: 'Verileri sıfırla', okLabel: 'Sıfırla', danger: true }))) return;
            MRP.store.reset();
            MRP.model.init();
            MRP.store.audit('Veriler sıfırlandı', '');
            MRP.store.save();
            MRP.app.render();
            UI.toast('Veriler sıfırlandı', 'Demo verileri yüklendi.', 'info');
        }
    });

    // =====================================================================
    // DENETİM KAYDI
    // =====================================================================
    const auState = { q: '' };
    MRP.views.audit = {
        title: 'Denetim Kaydı',
        subtitle: 'Kim, ne zaman, ne yaptı — tüm kritik işlemlerin izi',
        render() {
            const q = auState.q.toLocaleLowerCase('tr');
            const list = S().audit.slice().reverse().filter((a) => !q || `${a.user} ${a.action} ${a.detail}`.toLocaleLowerCase('tr').includes(q)).slice(0, 500);
            return `<div class="toolbar"><input class="input" id="auSearch" placeholder="Kullanıcı, işlem veya detay ara…" value="${esc(auState.q)}" data-input="auSearch"></div>
                <section class="card"><div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Kullanıcı</th><th>Rol</th><th>İşlem</th><th>Detay</th></tr></thead><tbody>
                ${list.map((a) => `<tr><td class="nowrap">${esc(U.dateTime(a.at))}</td><td class="strong">${esc(a.user)}</td><td>${esc(a.role)}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.detail)}</td></tr>`).join('')
                    || `<tr><td colspan="5">${H.empty('Kayıt yok')}</td></tr>`}</tbody></table></div></section>`;
        },
        after() {
            const el = document.getElementById('auSearch');
            if (el && auState.q) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };
    const rerender = U.debounce(() => MRP.app.render(), 250);
    MRP.actions.auSearch = (v) => { auState.q = v; rerender(); };
})(window.MRP);
</script>
</body>
</html>
