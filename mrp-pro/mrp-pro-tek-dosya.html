            if (q) list = list.filter((i) => i.kod.toLocaleLowerCase('tr').includes(q) || i.ad.toLocaleLowerCase('tr').includes(q) || i.tur.toLocaleLowerCase('tr').includes(q));
            const canEdit = MRP.auth.can('editItem') || MRP.auth.can('editCost');
            return `${H.tabs(tabs, itemState.tab, 'itemTab')}
                <div class="toolbar"><input class="input" id="itemSearch" placeholder="Kod, ad veya tür ile ara…" value="${esc(itemState.q)}" data-input="itemSearch"></div>
                <section class="card"><div class="table-wrap"><table>
                    <thead><tr><th>Kod</th><th>Malzeme</th><th>Tür</th><th>Tedarik</th><th class="num">Birim Maliyet</th><th class="num">LT (gün)</th>
                        <th class="num">Emniyet Stoğu</th><th>Parti Politikası</th><th class="num">Stok</th><th>Durum</th><th></th></tr></thead>
                    <tbody>${list.map((i) => `<tr class="${S().customItems[i.kod] ? 'r-new' : ''}">
                        <td>${H.itemLink(i.kod)}</td><td class="strong">${esc(i.ad)}</td><td><span class="badge badge-gray plain">${esc(i.tur)}</span></td>
                        <td>${esc(M.PROCUREMENT[i.procurement])}</td>
                        <td class="num">${i.procurement === 'make' ? U.cur(lineUnit(i.kod)) : esc(M.fmtMoney(i.price, i.currency))} <span class="muted">/${esc(i.unit)}</span></td>
                        <td class="num">${i.leadTime}</td>
                        <td class="num">${i.procurement === 'service' ? '–' : esc(U.qty(i.safetyStock, i.unit))}</td>
                        <td>${esc(i.lotPolicy)}${i.lotSize ? ` · ${esc(U.qty(i.lotSize, i.unit))}` : ''}</td>
                        <td class="num">${i.procurement === 'service' ? '–' : esc(U.qty(M.onHand(i.kod), i.unit))}</td>
                        <td>${H.stockBadge(M.stockStatus(i.kod))}</td>
                        <td>${canEdit ? `<button class="btn btn-ghost btn-sm" data-act="editItem" data-id="${esc(i.kod)}" title="Düzenle">${MRP.icon('edit', 'sm')}</button>` : ''}</td>
                    </tr>`).join('') || `<tr><td colspan="11">${H.empty('Kayıt yok')}</td></tr>`}</tbody>
                </table></div></section>`;
        },
        after() {
            const el = document.getElementById('itemSearch');
            if (el && itemState.q) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };
    const rerenderItems = U.debounce(() => app().render(), 250);
    Object.assign(MRP.actions, {
        itemTab: (t) => { itemState.tab = t; app().render(); },
        itemSearch: (v) => { itemState.q = v; rerenderItems(); }
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/planning.js */
/* ==========================================================================
   MRP Pro — Planlama: Ana Üretim Planı, MRP çalıştırma, İş Emirleri
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;

    // =====================================================================
    // MRP
    // =====================================================================
    const mrpState = { tab: 'planned', type: 'all', selected: new Set(), q: '' };

    function runMRP(silent = false) {
        const t0 = performance.now();
        const result = MRP.engine.run();
        S().lastRun = result;
        mrpState.selected.clear();
        MRP.store.audit('MRP çalıştırıldı', `${result.planned.length} öneri, ${result.summary.critical} kritik istisna`);
        app().commit();
        if (!silent) UI.toast('MRP tamamlandı', `${result.planned.length} planlı sipariş önerisi · ${Math.round(performance.now() - t0)} ms`, 'success');
    }

    MRP.views.mrp = {
        title: 'MRP Çalıştırma',
        subtitle: 'Ana üretim planı → çok seviyeli ihtiyaç patlatma → net ihtiyaç → planlı sipariş önerileri',
        render() {
            const st = S();
            const canRun = MRP.auth.can('runMRP');
            const run = st.lastRun;

            const mps = st.mps.slice().sort((a, b) => a.dueDate.localeCompare(b.dueDate));
            let html = H.card('Ana Üretim Planı (MPS)', 'Bağımsız talepler: müşteri siparişleri, tahminler, stok hedefleri', `
                <div class="table-wrap"><table>
                    <thead><tr><th>No</th><th>Mamul</th><th>Ad</th><th class="num">Miktar</th><th>Termin</th><th>Açıklama</th><th></th></tr></thead>
                    <tbody>${mps.map((d) => {
                        const p = M.product(d.kod);
                        const late = d.dueDate < U.iso(U.today());
                        return `<tr class="${late ? 'r-crit' : ''}"><td class="mono">${esc(d.id)}</td><td>${H.productLink(d.kod)}</td><td class="strong">${esc(p ? p.ad : '(silinmiş ürün)')}</td>
                            <td class="num">${esc(U.qty(d.qty, 'ad'))}</td><td class="nowrap">${esc(U.date(U.parseDate(d.dueDate)))} ${late ? '<span class="badge badge-red">Geçmiş</span>' : ''}</td>
                            <td>${esc(d.note || '')}</td>
                            <td>${canRun ? `<div class="row-actions"><button class="btn btn-ghost btn-sm" data-act="editDemand" data-id="${esc(d.id)}" title="Düzenle">${MRP.icon('edit', 'sm')}</button>
                                <button class="btn btn-ghost btn-sm" data-act="deleteDemand" data-id="${esc(d.id)}" title="Sil">${MRP.icon('trash', 'sm')}</button></div>` : ''}</td></tr>`;
                    }).join('') || `<tr><td colspan="7">${H.empty('Ana plan boş', 'Talep ekleyerek başlayın.')}</td></tr>`}</tbody>
                </table></div>`,
                canRun ? `<div style="display:flex;gap:8px;"><button class="btn btn-secondary" data-act="addDemand">${MRP.icon('plus')} Talep Ekle</button>
                    <button class="btn btn-primary" data-act="runMRP">${MRP.icon('play')} MRP'yi Çalıştır</button></div>` : '');

            html += '<div style="height:16px;"></div>';

            if (!run) {
                return html + H.banner('blue', 'info', 'Henüz MRP sonucu yok', canRun ? 'Ana planı gözden geçirip "MRP\'yi Çalıştır" butonuna basın.' : 'Planlama birimi MRP çalıştırdığında sonuçlar burada görünür.');
            }

            const s = run.summary;
            html += `<div class="kpis">
                ${H.kpi('Son Çalıştırma', U.dateTime(run.runAt), run.runBy, 'blue')}
                ${H.kpi('Planlanan Kalem', s.items, `${s.demands} bağımsız talep`, 'cyan')}
                ${H.kpi('Satın Alma Önerisi', s.purchaseCount, U.cur(s.purchaseValue), 'violet')}
                ${H.kpi('Üretim Önerisi', s.productionCount, 'Mamul + yarı mamul', 'green')}
                ${H.kpi('Geç Salım', s.late, 'Tedarik süresi yetersiz', s.late ? 'red' : 'green')}
                ${H.kpi('İstisna Mesajı', run.exceptions.length, `${s.critical} kritik`, s.critical ? 'red' : '')}
            </div>`;

            html += H.tabs([['planned', 'Planlı Siparişler', run.planned.length], ['exceptions', 'İstisna Mesajları', run.exceptions.length], ['records', 'Kalem Bazında Netleştirme', Object.keys(run.records).length]], mrpState.tab, 'mrpTab');

            if (mrpState.tab === 'planned') html += renderPlanned(run);
            else if (mrpState.tab === 'exceptions') html += renderExceptions(run);
            else html += renderRecords(run);
            return html;
        }
    };

    function renderPlanned(run) {
        let list = run.planned;
        if (mrpState.type !== 'all') list = list.filter((p) => p.type === mrpState.type);
        const q = mrpState.q.toLocaleLowerCase('tr');
        if (q) list = list.filter((p) => p.kod.toLocaleLowerCase('tr').includes(q) || p.ad.toLocaleLowerCase('tr').includes(q));
        list = list.slice().sort((a, b) => a.release.localeCompare(b.release));
        const canReq = MRP.auth.can('createRequest');
        const canWO = MRP.auth.can('manageWO');
        const selectable = (p) => (p.type === 'purchase' ? canReq : canWO);
        const sel = mrpState.selected;
        const nSelP = run.planned.filter((p) => sel.has(p.id) && p.type === 'purchase').length;
        const nSelW = run.planned.filter((p) => sel.has(p.id) && p.type === 'production').length;
        return `<div class="toolbar">
                <select class="input" data-change="mrpType">${[['all', 'Tüm öneriler'], ['purchase', 'Satın alma'], ['production', 'Üretim']].map(([v, l]) => `<option value="${v}" ${mrpState.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
                <input class="input" id="mrpSearch" placeholder="Kod veya ad…" value="${esc(mrpState.q)}" data-input="mrpSearch">
                <span class="spacer"></span>
                ${canReq ? `<button class="btn btn-violet" data-act="plannedToRequest" ${nSelP ? '' : 'disabled'}>${MRP.icon('cart')} Satın Alma Talebi Oluştur (${nSelP})</button>` : ''}
                ${canWO ? `<button class="btn btn-primary" data-act="plannedToWO" ${nSelW ? '' : 'disabled'}>${MRP.icon('factory')} İş Emri Oluştur (${nSelW})</button>` : ''}
            </div>
            <section class="card"><div class="table-wrap"><table>
                <thead><tr><th style="width:34px;">${canReq || canWO ? `<input type="checkbox" data-change="mrpSelAll" title="Tümünü seç" ${list.length && list.every((p) => !selectable(p) || sel.has(p.id)) ? 'checked' : ''}>` : ''}</th>
                    <th>Öneri</th><th>Kod</th><th>Kalem</th><th>Tip</th><th class="num">Net İhtiyaç</th><th class="num">Sipariş Miktarı</th>
                    <th>Salım</th><th>İhtiyaç</th><th class="num">LT</th><th class="num">Tutar ₺</th><th>Neden</th></tr></thead>
                <tbody>${list.map((p) => `<tr class="${p.late ? 'r-crit' : ''}">
                    <td>${selectable(p) ? `<input type="checkbox" data-change="mrpSel" data-id="${esc(p.id)}" ${sel.has(p.id) ? 'checked' : ''}>` : ''}</td>
                    <td class="mono">${esc(p.id)}</td><td>${H.anyLink(p.kod)}</td><td class="strong">${esc(p.ad)}</td>
                    <td>${p.type === 'production' ? '<span class="badge badge-blue">Üretim</span>' : p.service ? '<span class="badge badge-cyan">Fason</span>' : '<span class="badge badge-violet">Satın alma</span>'}</td>
                    <td class="num">${esc(U.qty(p.shortage, p.unit))}</td>
                    <td class="num strong">${esc(U.qty(p.qty, p.unit))}</td>
                    <td class="nowrap">${esc(U.date(U.parseDate(p.release)))} ${p.late ? '<span class="badge badge-red">Gecikmiş</span>' : ''}</td>
                    <td class="nowrap">${esc(U.date(U.parseDate(p.due)))}</td>
                    <td class="num">${p.leadTime}</td>
                    <td class="num">${U.num(p.qty * (p.type === 'production' ? M.unitCost(p.kod) : p.price))}</td>
                    <td class="muted">${esc(p.reason)}</td></tr>`).join('') || `<tr><td colspan="12">${H.empty('Öneri yok', 'Tüm ihtiyaçlar mevcut stok ve planlı girişlerle karşılanıyor.')}</td></tr>`}</tbody>
            </table></div></section>`;
    }

    function renderExceptions(run) {
        if (!run.exceptions.length) return H.banner('green', 'check', 'İstisna yok', 'Plan uygulanabilir görünüyor.');
        const label = { critical: 'Kritik', warn: 'Uyarı', info: 'Bilgi' };
        return `<section class="card">${run.exceptions.map((e) => `<div class="exc"><span class="sev ${e.sev}"></span>
            <div style="flex:1;"><b>${esc(label[e.sev])}</b> · ${H.anyLink(e.kod)} <span class="muted">${esc((M.item(e.kod) || {}).ad || '')}</span><div>${esc(e.msg)}</div></div></div>`).join('')}</section>`;
    }

    function renderRecords(run) {
        const recs = Object.values(run.records).sort((a, b) => a.level - b.level || a.kod.localeCompare(b.kod));
        return `<section class="card"><div class="table-wrap"><table>
            <thead><tr><th class="num">LLC</th><th>Kod</th><th>Kalem</th><th class="num">Eldeki</th><th class="num">Emniyet</th><th class="num">Brüt İhtiyaç</th>
                <th class="num">Planlı Giriş</th><th class="num">Planlı Sipariş</th><th class="num">Dönem Sonu</th><th></th></tr></thead>
            <tbody>${recs.map((r) => {
                const it = M.item(r.kod) || { ad: '?', unit: '' };
                return `<tr><td class="num">${r.level}</td><td>${H.anyLink(r.kod)}</td><td class="strong">${esc(it.ad)}</td>
                    <td class="num">${esc(U.qty(r.onHand, it.unit))}</td><td class="num">${esc(U.qty(r.ss, it.unit))}</td>
                    <td class="num">${esc(U.qty(U.sum(r.gross, (x) => x.qty), it.unit))}</td>
                    <td class="num">${esc(U.qty(U.sum(r.receipts, (x) => x.qty), it.unit))}</td>
                    <td class="num strong">${esc(U.qty(U.sum(r.planned, (x) => x.qty), it.unit))}</td>
                    <td class="num">${esc(U.qty(r.projectedEnd, it.unit))}</td>
                    <td><button class="btn btn-secondary btn-sm" data-act="timePhased" data-id="${esc(r.kod)}">Zaman fazlı</button></td></tr>`;
            }).join('')}</tbody></table></div></section>`;
    }

    function openTimePhased(kod) {
        const run = S().lastRun;
        const rec = run && run.records[kod];
        if (!rec) return;
        const it = M.item(kod);
        const tp = MRP.engine.timePhased(rec);
        const fmt = (v) => (Math.abs(v) < 1e-9 ? '<span class="muted">·</span>' : esc(U.qty(v)));
        const body = `<dl class="dl card card-body" style="margin-bottom:14px;grid-template-columns:repeat(4,auto 1fr);">
                <dt>Eldeki</dt><dd>${esc(U.qty(rec.onHand, it.unit))}</dd><dt>Emniyet stoğu</dt><dd>${esc(U.qty(rec.ss, it.unit))}</dd>
                <dt>Tedarik süresi</dt><dd>${it.leadTime} gün</dd><dt>Parti</dt><dd>${esc(it.lotPolicy)}${it.lotSize ? ' · ' + esc(U.qty(it.lotSize, it.unit)) : ''}</dd></dl>
            <div class="table-wrap"><table class="tp-table"><thead><tr><th>Kayıt</th>${tp.cols.map((c) => `<th>${esc(c.label)}${c.sub ? `<br><span style="font-weight:500;text-transform:none;">${esc(c.sub)}</span>` : ''}</th>`).join('')}</tr></thead>
            <tbody>${tp.rows.map((r) => `<tr><td class="strong">${esc(r.label)}</td>${r.values.map((v) => `<td class="${r.projected ? (v < rec.ss - 1e-9 ? 'tp-neg' : '') : r.release && v > 0 ? 'tp-pos' : ''}">${fmt(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
            <h3 style="font-size:.9em;margin:16px 0 8px;">İhtiyaç kaynakları (pegging)</h3>
            <div class="table-wrap" style="max-height:240px;"><table><thead><tr><th>Tarih</th><th>Kaynak</th><th class="num">Miktar</th></tr></thead><tbody>
            ${rec.gross.map((g) => `<tr><td>${esc(U.date(U.parseDate(g.date)))}</td><td class="mono">${esc(g.src)}</td><td class="num">${esc(U.qty(g.qty, it.unit))}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Brüt ihtiyaç yok (emniyet stoğu tamamlama).</td></tr>'}
            </tbody></table></div>
            <p class="muted" style="font-size:.78em;margin-top:10px;">Öngörülen stok, emniyet stoğunun altına düştüğünde kırmızı gösterilir. Planlı sipariş girişleri bunu dengeler.</p>`;
        UI.modal({ title: `Zaman Fazlı MRP — ${kod} ${it.ad}`, size: 'xl', body, buttons: [{ label: 'Kapat' }] });
    }

    function demandModal(d) {
        if (!H.guard('runMRP')) return;
        const isNew = !d.id;
        UI.modal({
            title: isNew ? 'Ana Plana Talep Ekle' : `Talebi Düzenle — ${d.id}`, size: 'md',
            body: `<datalist id="dmProducts">${M.products().map((p) => `<option value="${esc(p.kod)}">${esc(p.ad)}</option>`).join('')}</datalist>
                <div class="form-grid">
                <div class="field full"><label>Mamul kodu <span class="req">*</span></label><input id="dmKod" list="dmProducts" value="${esc(d.kod || '')}" autocomplete="off"><span class="hint" id="dmName"></span></div>
                <div class="field"><label>Miktar (adet) <span class="req">*</span></label><input id="dmQty" type="number" min="1" step="1" value="${d.qty || 10}"></div>
                <div class="field"><label>Termin tarihi <span class="req">*</span></label><input id="dmDate" type="date" value="${esc(d.dueDate || U.iso(U.addDays(U.today(), 21)))}"></div>
                <div class="field full"><label>Açıklama</label><input id="dmNote" value="${esc(d.note || '')}" placeholder="Müşteri siparişi, tahmin, stok hedefi…"></div>
            </div>`,
            onOpen: (ctx) => {
                const upd = () => { const p = M.product(ctx.$('#dmKod').value.trim()); ctx.$('#dmName').textContent = p ? p.ad : 'Listeden bir mamul seçin'; };
                ctx.$('#dmKod').addEventListener('input', upd); upd();
            },
            buttons: [{ label: 'Vazgeç' }, {
                label: isNew ? 'Ekle' : 'Kaydet', cls: 'btn-primary', onClick: (ctx) => {
                    const kod = ctx.$('#dmKod').value.trim();
                    const qty = Math.round(U.toNum(ctx.$('#dmQty').value));
                    const dueDate = ctx.$('#dmDate').value;
                    if (!M.product(kod)) { UI.toast('Geçersiz mamul', 'Listeden geçerli bir mamul kodu seçin.', 'warn'); return false; }
                    if (qty <= 0) { UI.toast('Geçersiz miktar', '', 'warn'); return false; }
                    if (!dueDate) { UI.toast('Termin tarihi gerekli', '', 'warn'); return false; }
                    const note = ctx.$('#dmNote').value.trim();
                    if (isNew) {
                        const id = MRP.store.nextNo('MPS');
                        S().mps.push({ id, kod, qty, dueDate, note });
                        MRP.store.audit('Ana plana talep eklendi', `${id}: ${kod} × ${qty}, termin ${dueDate}`);
                    } else {
                        Object.assign(S().mps.find((x) => x.id === d.id), { kod, qty, dueDate, note });
                        MRP.store.audit('Ana plan talebi güncellendi', `${d.id}: ${kod} × ${qty}, termin ${dueDate}`);
                    }
                    if (app().currentView() !== 'mrp') location.hash = '#/mrp';
                    app().commit();
                    UI.toast('Ana plan güncellendi', 'Sonuçları görmek için MRP\'yi yeniden çalıştırın.', 'info');
                }
            }]
        });
    }

    function plannedToRequest() {
        if (!H.guard('createRequest')) return;
        const run = S().lastRun;
        const sel = run.planned.filter((p) => mrpState.selected.has(p.id) && p.type === 'purchase');
        if (!sel.length) return;
        UI.modal({
            title: 'Satın Alma Talebi Oluştur', size: 'lg',
            body: `${H.banner('blue', 'cart', `${sel.length} kalem satın alma birimine iletilecek`, 'Öncelik ve notu belirleyip gönderin. Talep onaylandıktan sonra siparişe dönüştürülür.')}
                <div class="form-grid">
                    <div class="field"><label>Öncelik</label><select id="rqPri">${Object.entries(H.PRIORITY).map(([k, v]) => `<option value="${k}" ${k === (sel.some((p) => p.late) ? 'urgent' : 'normal') ? 'selected' : ''}>${v[1]}</option>`).join('')}</select></div>
                    <div class="field full"><label>Not</label><textarea id="rqNote" placeholder="Satın alma için ek bilgi…"></textarea></div>
                </div>
                <div class="table-wrap" style="margin-top:14px;max-height:300px;"><table><thead><tr><th>Kod</th><th>Kalem</th><th class="num">Miktar</th><th>İhtiyaç</th><th class="num">Tutar ₺</th></tr></thead><tbody>
                ${sel.map((p) => `<tr><td class="mono">${esc(p.kod)}</td><td>${esc(p.ad)}</td><td class="num">${esc(U.qty(p.qty, p.unit))}</td><td>${esc(U.date(U.parseDate(p.due)))}</td><td class="num">${U.num(p.value)}</td></tr>`).join('')}
                <tr class="total"><td colspan="4" class="text-right">Tahmini toplam</td><td class="num">${U.num(U.sum(sel, (p) => p.value))}</td></tr></tbody></table></div>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Talebi Gönder', cls: 'btn-violet', icon: 'check', onClick: (ctx) => {
                    const u = MRP.auth.current();
                    const lines = sel.map((p) => ({ kod: p.kod, ad: p.ad, tur: p.tur, unit: p.unit, qty: p.qty, price: p.price, total: p.value, needDate: p.due, planId: p.id }));
                    const req = {
                        no: MRP.store.nextNo('STT'), status: 'pending', priority: ctx.$('#rqPri').value, note: ctx.$('#rqNote').value.trim(),
                        lines, total: U.sum(lines, (l) => l.total), deadline: lines.map((l) => l.needDate).sort()[0],
                        createdBy: u.username, createdByName: u.name, createdAt: new Date().toISOString(), source: 'MRP',
                        history: [{ action: 'Oluşturuldu', by: u.name, at: new Date().toISOString() }], comments: []
                    };
                    S().requests.unshift(req);
                    MRP.store.audit('Satın alma talebi oluşturuldu', `${req.no}: ${lines.length} kalem, ${U.cur(req.total)}`);
                    MRP.store.notify('request', 'Yeni satın alma talebi', `${req.no} · ${lines.length} kalem · ${U.cur(req.total)} (${u.name})`, ['satinalma', 'satinalma_muduru', 'admin'], 'requests');
                    runMRP(true);
                    UI.toast('Talep gönderildi', `${req.no} satın alma birimine iletildi.`, 'success');
                }
            }]
        });
    }

    async function plannedToWO() {
        if (!H.guard('manageWO')) return;
        const run = S().lastRun;
        const sel = run.planned.filter((p) => mrpState.selected.has(p.id) && p.type === 'production');
        if (!sel.length) return;
        if (!(await UI.confirm(`${sel.length} üretim önerisi "Planlandı" durumunda iş emrine dönüştürülecek.`, { title: 'İş emri oluştur', okLabel: 'Oluştur' }))) return;
        const u = MRP.auth.current();
        const today = U.iso(U.today());
        sel.forEach((p) => {
            const wo = {
                no: MRP.store.nextNo('IE'), kod: p.kod, ad: p.ad, qty: p.qty,
                start: p.release < today ? today : p.release, end: p.due < today ? today : p.due,
                status: 'planned', source: p.id, createdBy: u.name, createdAt: new Date().toISOString(),
                history: [{ action: 'Oluşturuldu (MRP)', by: u.name, at: new Date().toISOString() }]
            };
            S().workOrders.push(wo);
        });
        MRP.store.audit('İş emirleri oluşturuldu', `${sel.length} adet (MRP önerisinden)`);
        runMRP(true);
        UI.toast('İş emirleri oluşturuldu', `${sel.length} iş emri planlandı.`, 'success');
    }

    const rerenderMrp = U.debounce(() => app().render(), 250);
    Object.assign(MRP.actions, {
        runMRP: () => { if (H.guard('runMRP')) runMRP(); },
        mrpTab: (t) => { mrpState.tab = t; app().render(); },
        mrpType: (v) => { mrpState.type = v; app().render(); },
        mrpSearch: (v) => { mrpState.q = v; rerenderMrp(); },
        mrpSel: (_, el) => { if (el.checked) mrpState.selected.add(el.dataset.id); else mrpState.selected.delete(el.dataset.id); app().render(); },
        mrpSelAll: (_, el) => {
            const run = S().lastRun;
            run.planned.filter((p) => (mrpState.type === 'all' || p.type === mrpState.type) && MRP.auth.can(p.type === 'purchase' ? 'createRequest' : 'manageWO'))
                .forEach((p) => (el.checked ? mrpState.selected.add(p.id) : mrpState.selected.delete(p.id)));
            app().render();
        },
        timePhased: (kod) => openTimePhased(kod),
        addDemand: (kod) => demandModal({ kod: typeof kod === 'string' ? kod : '' }),
        editDemand: (id) => demandModal(S().mps.find((d) => d.id === id)),
        deleteDemand: async (id) => {
            if (!H.guard('runMRP')) return;
            if (!(await UI.confirm(`${id} ana plandan silinecek.`, { title: 'Talebi sil', okLabel: 'Sil', danger: true }))) return;
            S().mps = S().mps.filter((d) => d.id !== id);
            MRP.store.audit('Ana plan talebi silindi', id);
            app().commit();
        },
        plannedToRequest, plannedToWO
    });
    MRP.planning = { runMRP };

    // =====================================================================
    // İŞ EMİRLERİ
    // =====================================================================
    const woState = { tab: 'open' };

    /** İş emrinin malzeme durumu (stoklu kalemler için) */
    function woAvailability(wo) {
        return M.bom(wo.kod).map((l) => {
            const it = M.item(l.kod) || { ad: '?', unit: '', procurement: 'buy' };
            const need = l.k * wo.qty;
            const stocked = it.procurement !== 'service';
            const have = stocked ? M.available(l.kod) : need;
            return { kod: l.kod, it, need, have, short: stocked ? Math.max(0, need - have) : 0, stocked };
        });
    }

    MRP.views.workorders = {
        title: 'İş Emirleri',
        subtitle: 'Üretim emirleri, malzeme uygunluğu, sarf ve mamul girişi',
        render() {
            const all = S().workOrders;
            const by = (s) => all.filter((w) => s.includes(w.status));
            const tabs = [['open', 'Açık', by(['planned', 'released']).length], ['completed', 'Tamamlanan', by(['completed']).length], ['cancelled', 'İptal', by(['cancelled']).length], ['all', 'Tümü', all.length]];
            const list = (woState.tab === 'open' ? by(['planned', 'released']) : woState.tab === 'all' ? all : by([woState.tab]))
                .slice().sort((a, b) => a.start.localeCompare(b.start));
            const can = MRP.auth.can('manageWO');
            let html = `${H.tabs(tabs, woState.tab, 'woTab')}
                <div class="toolbar"><span class="spacer"></span>${can ? `<button class="btn btn-primary" data-act="newWO">${MRP.icon('plus')} Yeni İş Emri</button>` : ''}</div>`;
            const open = by(['planned', 'released']);
            if (open.length) html += H.card('Üretim takvimi', 'Açık iş emirleri — kırmızı çizgi bugünü gösterir', `<div class="card-body" style="overflow-x:auto;">${gantt(open)}</div>`) + '<div style="height:16px;"></div>';
            html += `<section class="card"><div class="table-wrap"><table>
                <thead><tr><th>İş Emri</th><th>Mamul</th><th>Ad</th><th class="num">Miktar</th><th>Başlangıç</th><th>Bitiş</th><th>Durum</th><th>Malzeme</th><th></th></tr></thead>
                <tbody>${list.map((w) => {
                    const isOpen = w.status === 'planned' || w.status === 'released';
                    const av = isOpen ? woAvailability(w) : [];
                    const shorts = av.filter((a) => a.short > 0).length;
                    return `<tr class="${isOpen && w.end < U.iso(U.today()) ? 'r-crit' : ''}">
                        <td><button class="link mono" data-act="woDetail" data-id="${esc(w.no)}">${esc(w.no)}</button></td>
                        <td>${H.anyLink(w.kod)}</td><td class="strong">${esc(w.ad)}</td><td class="num">${esc(U.qty(w.qty, 'ad'))}</td>
                        <td class="nowrap">${esc(U.date(U.parseDate(w.start)))}</td><td class="nowrap">${esc(U.date(U.parseDate(w.end)))}</td>
                        <td>${H.badge(H.WO_STATUS, w.status)}</td>
                        <td>${isOpen ? (shorts ? `<span class="badge badge-red">${shorts} eksik</span>` : '<span class="badge badge-green">Hazır</span>') : '–'}</td>
                        <td><div class="row-actions">${can && w.status === 'planned' ? `<button class="btn btn-secondary btn-sm" data-act="woRelease" data-id="${esc(w.no)}">Serbest Bırak</button>` : ''}
                            ${can && w.status === 'released' ? `<button class="btn btn-success btn-sm" data-act="woComplete" data-id="${esc(w.no)}">Tamamla</button>` : ''}
                            ${can && isOpen ? `<button class="btn btn-ghost btn-sm" data-act="woCancel" data-id="${esc(w.no)}" title="İptal">${MRP.icon('x', 'sm')}</button>` : ''}</div></td></tr>`;
                }).join('') || `<tr><td colspan="9">${H.empty('İş emri yok', 'MRP önerilerinden veya "Yeni İş Emri" ile oluşturabilirsiniz.')}</td></tr>`}</tbody>
            </table></div></section>`;
            return html;
        }
    };

    function gantt(list) {
        const today = U.iso(U.today());
        const min = [today, ...list.map((w) => w.start)].sort()[0];
        const max = [U.iso(U.addDays(U.today(), 7)), ...list.map((w) => w.end)].sort().pop();
        const total = Math.max(1, U.diffDays(max, min) + 1);
        const pct = (d) => (U.diffDays(d, min) / total) * 100;
        const color = { planned: '#64748b', released: '#3b82f6' };
        return `<div class="gantt">
            <div class="gantt-head"><div>İş emri</div><div>${esc(U.date(U.parseDate(min)))} → ${esc(U.date(U.parseDate(max)))} (${total} gün)</div><div class="text-right">Tarih</div></div>
            ${list.map((w) => {
                const left = pct(w.start);
                const width = Math.max(1.5, ((U.diffDays(w.end, w.start) + 1) / total) * 100);
                return `<div class="gantt-row"><div class="gantt-label" title="${esc(w.ad)}">${esc(w.ad)}<small>${esc(w.no)} · ${esc(U.qty(w.qty, 'ad'))}</small></div>
                    <div class="gantt-track"><span class="gantt-today" style="left:${pct(today)}%;"></span>
                        <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${w.end < today ? '#ef4444' : color[w.status]};" title="${esc(w.no)}">${esc(H.WO_STATUS[w.status][1])}</div></div>
                    <div class="muted mono text-right" style="font-size:.78em;">${esc(U.date(U.parseDate(w.start)).slice(0, 5))} → ${esc(U.date(U.parseDate(w.end)).slice(0, 5))}</div></div>`;
            }).join('')}
            <div style="display:flex;gap:16px;margin-top:10px;font-size:.78em;color:var(--text-3);">
                <span><span class="badge badge-gray">Planlandı</span></span><span><span class="badge badge-blue">Serbest</span></span><span><span class="badge badge-red">Gecikmiş</span></span></div>
        </div>`;
    }

    const findWO = (no) => S().workOrders.find((w) => w.no === no);
    const woLog = (w, action) => { w.history = w.history || []; w.history.push({ action, by: MRP.auth.current().name, at: new Date().toISOString() }); };

    function openWODetail(no) {
        const w = findWO(no);
        if (!w) return;
        const av = woAvailability(w);
        const isOpen = w.status === 'planned' || w.status === 'released';
        UI.modal({
            title: `${w.no} — ${w.ad}`, size: 'lg',
            body: `<dl class="dl card card-body" style="margin-bottom:14px;grid-template-columns:repeat(4,auto 1fr);">
                    <dt>Durum</dt><dd>${H.badge(H.WO_STATUS, w.status)}</dd><dt>Miktar</dt><dd>${esc(U.qty(w.qty, 'ad'))}</dd>
                    <dt>Başlangıç</dt><dd>${esc(U.date(U.parseDate(w.start)))}</dd><dt>Bitiş</dt><dd>${esc(U.date(U.parseDate(w.end)))}</dd>
                    <dt>Kaynak</dt><dd>${esc(w.source || 'Manuel')}</dd><dt>Oluşturan</dt><dd>${esc(w.createdBy)}</dd></dl>
                <div class="table-wrap" style="max-height:340px;"><table><thead><tr><th>Kod</th><th>Bileşen</th><th class="num">İhtiyaç</th><th class="num">Kullanılabilir</th><th class="num">Eksik</th></tr></thead><tbody>
                ${av.map((a) => `<tr class="${isOpen && a.short > 0 ? 'r-crit' : ''}"><td>${H.itemLink(a.kod)}</td><td>${esc(a.it.ad)}</td><td class="num">${esc(U.qty(a.need, a.it.unit))}</td>
                    <td class="num">${a.stocked ? esc(U.qty(a.have, a.it.unit)) : '<span class="muted">fason</span>'}</td><td class="num ${a.short > 0 ? 'tp-neg' : ''}">${a.short > 0 ? esc(U.qty(a.short, a.it.unit)) : '–'}</td></tr>`).join('')}
                </tbody></table></div>
                <h3 style="font-size:.9em;margin:16px 0 8px;">Operasyonlar</h3>
                <div class="table-wrap"><table><thead><tr><th>#</th><th>İş merkezi</th><th class="num">Hazırlık</th><th class="num">Birim</th><th class="num">Toplam süre</th><th class="num">İşçilik ₺</th></tr></thead><tbody>
                ${M.routing(w.kod).map((op, i) => { const wc = M.workCenter(op.wc) || { ad: op.wc, rate: 0 }; const min = M.opMinutes(op, w.qty);
                    return `<tr><td class="num">${(i + 1) * 10}</td><td>${esc(wc.ad)}</td><td class="num">${U.num(op.setup, 0)} dk</td><td class="num">${U.num(op.run, 1)} dk</td><td class="num strong">${U.num(min / 60, 1)} sa</td><td class="num">${U.num(min / 60 * wc.rate)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">Rota tanımlı değil</td></tr>'}
                </tbody></table></div>
                <h3 style="font-size:.9em;margin:16px 0 8px;">Geçmiş</h3>
                <div class="timeline">${(w.history || []).map((h) => `<div class="ev"><b>${esc(h.action)}</b><span class="d">${esc(h.by)} · ${esc(U.dateTime(h.at))}</span></div>`).join('')}</div>`,
            buttons: [{ label: 'Kapat' }]
        });
    }

    function newWO() {
        if (!H.guard('manageWO')) return;
        UI.modal({
            title: 'Yeni İş Emri', size: 'md',
            body: `<datalist id="woProducts">${M.products().map((p) => `<option value="${esc(p.kod)}">${esc(p.ad)}</option>`).join('')}${M.items().filter((i) => i.procurement === 'make').map((i) => `<option value="${esc(i.kod)}">${esc(i.ad)}</option>`).join('')}</datalist>
                <div class="form-grid">
                    <div class="field full"><label>Mamul / yarı mamul <span class="req">*</span></label><input id="woKod" list="woProducts" autocomplete="off"></div>
                    <div class="field"><label>Miktar <span class="req">*</span></label><input id="woQty" type="number" min="1" step="1" value="10"></div>
                    <div class="field"><label>Başlangıç</label><input id="woStart" type="date" value="${U.iso(U.today())}"></div>
                    <div class="field"><label>Bitiş</label><input id="woEnd" type="date" value="${U.iso(U.addDays(U.today(), 5))}"></div>
                </div>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Oluştur', cls: 'btn-primary', onClick: (ctx) => {
                    const kod = ctx.$('#woKod').value.trim();
                    const it = M.item(kod);
                    const qty = Math.round(U.toNum(ctx.$('#woQty').value));
                    const start = ctx.$('#woStart').value, end = ctx.$('#woEnd').value;
                    if (!it || it.procurement !== 'make') { UI.toast('Geçersiz kalem', 'Üretilebilir bir mamul veya yarı mamul seçin.', 'warn'); return false; }
                    if (qty <= 0 || !start || !end || end < start) { UI.toast('Geçersiz değer', 'Miktar ve tarihleri kontrol edin.', 'warn'); return false; }
                    const u = MRP.auth.current();
                    const wo = { no: MRP.store.nextNo('IE'), kod, ad: it.ad, qty, start, end, status: 'planned', source: '', createdBy: u.name, createdAt: new Date().toISOString(), history: [] };
                    woLog(wo, 'Oluşturuldu');
                    S().workOrders.push(wo);
                    MRP.store.audit('İş emri oluşturuldu', `${wo.no}: ${kod} × ${qty}`);
                    app().commit();
                    UI.toast('İş emri oluşturuldu', wo.no, 'success');
                }
            }]
        });
    }

    async function completeWO(no) {
        if (!H.guard('manageWO')) return;
        const w = findWO(no);
        const av = woAvailability(w);
        const shorts = av.filter((a) => a.short > 0);
        if (shorts.length) {
            return UI.modal({
                title: 'Malzeme eksik — iş emri tamamlanamaz', size: 'md',
                body: `${H.banner('red', 'alert', `${shorts.length} bileşende stok yetersiz`, 'Mal kabul veya stok düzeltmesi sonrası tekrar deneyin.')}
                    <div class="table-wrap"><table><thead><tr><th>Kod</th><th class="num">İhtiyaç</th><th class="num">Eldeki</th><th class="num">Eksik</th></tr></thead><tbody>
                    ${shorts.map((a) => `<tr><td class="mono">${esc(a.kod)}</td><td class="num">${esc(U.qty(a.need, a.it.unit))}</td><td class="num">${esc(U.qty(a.have, a.it.unit))}</td><td class="num tp-neg">${esc(U.qty(a.short, a.it.unit))}</td></tr>`).join('')}
                    </tbody></table></div>`,
                buttons: [{ label: 'Kapat' }]
            });
        }
        if (!(await UI.confirm(`${w.no}: ${av.filter((a) => a.stocked).length} bileşen stoktan düşülecek ve ${U.qty(w.qty, 'ad')} ${w.kod} stoğa girecek.`, { title: 'İş emrini tamamla', okLabel: 'Tamamla' }))) return;
        av.filter((a) => a.stocked).forEach((a) => M.move({ kod: a.kod, qty: -a.need, type: 'GI', loc: ['FABRIKA', 'MERKEZ'], ref: w.no }));
        // Teslim alınmış fason hizmet bakiyesi varsa düşülür (hizmet alınmamışsa iş emri engellenmez)
        av.filter((a) => !a.stocked).forEach((a) => { const q = Math.min(a.need, M.available(a.kod)); if (q > 1e-9) M.move({ kod: a.kod, qty: -q, type: 'GI', loc: ['FABRIKA', 'MERKEZ'], ref: w.no, note: 'Fason hizmet kullanımı' }); });
        M.move({ kod: w.kod, qty: w.qty, type: 'FG', loc: 'MERKEZ', lot: w.no, ref: w.no });
        w.status = 'completed';
        w.completedAt = new Date().toISOString();
        woLog(w, 'Tamamlandı — sarf ve mamul girişi yapıldı');
        MRP.store.audit('İş emri tamamlandı', `${w.no}: ${w.kod} × ${w.qty}`);
        MRP.store.notify('wo', 'İş emri tamamlandı', `${w.no} · ${w.ad} × ${w.qty}`, ['admin', 'planlama'], 'workorders');
        app().commit();
        UI.toast('İş emri tamamlandı', 'Stoklar güncellendi.', 'success');
    }

    Object.assign(MRP.actions, {
        woTab: (t) => { woState.tab = t; app().render(); },
        woDetail: (no) => openWODetail(no),
        newWO,
        woRelease: (no) => {
            if (!H.guard('manageWO')) return;
            const w = findWO(no);
            const shorts = woAvailability(w).filter((a) => a.short > 0).length;
            w.status = 'released';
            woLog(w, 'Serbest bırakıldı');
            MRP.store.audit('İş emri serbest bırakıldı', w.no);
            app().commit();
            UI.toast('İş emri serbest bırakıldı', shorts ? `Uyarı: ${shorts} bileşende eksik var.` : w.no, shorts ? 'warn' : 'success');
        },
        woComplete: (no) => completeWO(no),
        woCancel: async (no) => {
            if (!H.guard('manageWO')) return;
            if (!(await UI.confirm(`${no} iptal edilecek.`, { title: 'İş emrini iptal et', okLabel: 'İptal Et', danger: true }))) return;
            const w = findWO(no);
            w.status = 'cancelled';
            woLog(w, 'İptal edildi');
            MRP.store.audit('İş emri iptal edildi', no);
            app().commit();
        }
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/purchasing.js */
/* ==========================================================================
   MRP Pro — Satın Alma: Talepler, Siparişler (PO), Mal Kabul, Tedarikçiler
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;
    const me = () => MRP.auth.current();
    const log = (doc, action, note) => { doc.history = doc.history || []; doc.history.push({ action, by: me().name, at: new Date().toISOString(), note: note || '' }); };

    const findReq = (no) => S().requests.find((r) => r.no === no);
    const findPO = (no) => S().pos.find((p) => p.no === no);

    function poTotals(po) {
        let sub = 0, disc = 0, vat = 0;
        po.lines.forEach((l) => {
            const gross = l.qty * l.price;
            const d = gross * (l.disc || 0) / 100;
            sub += gross; disc += d; vat += (gross - d) * (l.vat || 0) / 100;
        });
        return { sub, disc, vat, grand: sub - disc + vat };
    }
    const poProgress = (po) => {
        const ord = U.sum(po.lines, (l) => l.qty);
        return ord ? Math.min(100, U.sum(po.lines, (l) => Math.min(l.qty, l.received || 0)) / ord * 100) : 0;
    };

    // =====================================================================
    // SATIN ALMA TALEPLERİ
    // =====================================================================
    const reqState = { tab: 'pending' };

    MRP.views.requests = {
        title: 'Satın Alma Talepleri',
        subtitle: 'MRP önerilerinden oluşturulan talepler, onay akışı ve siparişe dönüşüm',
        render() {
            const all = S().requests;
            const cnt = (s) => all.filter((r) => r.status === s).length;
            const tabs = [['pending', 'Onay Bekleyen', cnt('pending')], ['approved', 'Onaylı', cnt('approved')], ['ordered', 'Siparişte', cnt('ordered')],
                ['closed', 'Kapanan', cnt('closed')], ['rejected', 'Reddedilen', cnt('rejected')], ['all', 'Tümü', all.length]];
            const list = reqState.tab === 'all' ? all : all.filter((r) => r.status === reqState.tab);
            const limit = me().can.approveLimit;
            let html = H.tabs(tabs, reqState.tab, 'reqTab');
            if (MRP.auth.can('approveRequest') && isFinite(limit)) {
                html += H.banner('blue', 'info', `Onay limitiniz: ${U.cur(limit)}`, 'Limit üzerindeki talepler Satın Alma Müdürü onayına yönlendirilir.');
            }
            if (!list.length) return html + H.empty('Talep bulunamadı', MRP.auth.can('createRequest') ? 'MRP ekranında satın alma önerilerini seçerek talep oluşturabilirsiniz.' : '');
            html += `<div class="cards">${list.map((r) => {
                const color = { pending: 'var(--violet)', approved: 'var(--green)', ordered: 'var(--amber)', closed: 'var(--cyan)', rejected: 'var(--red)' }[r.status];
                return `<article class="doc-card" style="--doc-c:${color};">
                    <div class="h"><div><b>${esc(r.no)}</b><div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;">${H.badge(H.REQ_STATUS, r.status)} ${H.badge(H.PRIORITY, r.priority)}
                        ${r.escalated && r.status === 'pending' ? '<span class="badge badge-amber">Müdür onayında</span>' : ''}</div></div>
                        <div class="amount">${U.cur(r.total)}</div></div>
                    <div class="meta">
                        <div><span>Kalem</span>${r.lines.length}</div>
                        <div><span>İlk ihtiyaç</span>${esc(U.date(U.parseDate(r.deadline)))}</div>
                        <div><span>Talep eden</span>${esc(r.createdByName)}</div>
                        <div><span>Tarih</span>${esc(U.dateTime(r.createdAt))}</div>
                        ${r.poNo ? `<div><span>Sipariş</span><span class="mono" style="color:var(--text);display:inline;">${esc(r.poNo)}</span></div>` : ''}
                        ${r.comments && r.comments.length ? `<div><span>Yorum</span>${r.comments.length}</div>` : ''}
                    </div>
                    ${r.rejectionReason ? `<div class="banner red" style="margin:0;padding:8px 12px;"><div class="tx"><p><b>Red sebebi:</b> ${esc(r.rejectionReason)}</p></div></div>` : ''}
                    <div class="acts">
                        <button class="btn btn-secondary btn-sm" data-act="reqDetail" data-id="${esc(r.no)}">Detay</button>
                        ${r.status === 'pending' && MRP.auth.can('approveRequest') ? `<button class="btn btn-success btn-sm" data-act="reqApprove" data-id="${esc(r.no)}">${MRP.icon('check', 'sm')} Onayla</button>
                            <button class="btn btn-danger btn-sm" data-act="reqReject" data-id="${esc(r.no)}">Reddet</button>` : ''}
                        ${r.status === 'approved' && MRP.auth.can('createPO') ? `<button class="btn btn-primary btn-sm" data-act="createPO" data-id="${esc(r.no)}">${MRP.icon('truck', 'sm')} Sipariş Oluştur</button>` : ''}
                    </div></article>`;
            }).join('')}</div>`;
            return html;
        }
    };

    function openReqDetail(no) {
        const r = findReq(no);
        if (!r) return;
        const comments = r.comments || [];
        const buttons = [{ label: 'Kapat' }];
        if (r.status === 'pending' && MRP.auth.can('approveRequest')) {
            buttons.push({ label: 'Reddet', cls: 'btn-danger', onClick: () => { setTimeout(() => rejectReq(no)); } });
            buttons.push({ label: 'Onayla', cls: 'btn-success', icon: 'check', onClick: () => { approveReq(no); } });
        }
        if (r.status === 'approved' && MRP.auth.can('createPO')) buttons.push({ label: 'Sipariş Oluştur', cls: 'btn-primary', icon: 'truck', onClick: () => { setTimeout(() => openCreatePO(no)); } });
        const ctx = UI.modal({
            title: `${r.no} — Satın Alma Talebi`, size: 'xl', buttons,
            body: `<dl class="dl card card-body" style="margin-bottom:14px;grid-template-columns:repeat(4,auto 1fr);">
                    <dt>Durum</dt><dd>${H.badge(H.REQ_STATUS, r.status)}</dd><dt>Öncelik</dt><dd>${H.badge(H.PRIORITY, r.priority)}</dd>
                    <dt>Talep eden</dt><dd>${esc(r.createdByName)}</dd><dt>Kaynak</dt><dd>${esc(r.source || 'Manuel')}</dd>
                    <dt>Toplam</dt><dd style="color:var(--accent);">${U.cur(r.total)}</dd><dt>Sipariş</dt><dd class="mono">${esc(r.poNo || '–')}</dd></dl>
                ${r.note ? H.banner('amber', 'info', 'Not', r.note) : ''}
                <div class="table-wrap" style="max-height:300px;"><table><thead><tr><th>Kod</th><th>Kalem</th><th>Tür</th><th class="num">Miktar</th><th class="num">Birim Fiyat</th><th class="num">Tutar ₺</th><th>İhtiyaç</th></tr></thead><tbody>
                ${r.lines.map((l) => `<tr><td>${H.itemLink(l.kod)}</td><td>${esc(l.ad)}</td><td><span class="badge badge-gray plain">${esc(l.tur)}</span></td><td class="num">${esc(U.qty(l.qty, l.unit))}</td>
                    <td class="num">${U.num(l.price, 4)}</td><td class="num strong">${U.num(l.total)}</td><td>${esc(U.date(U.parseDate(l.needDate)))}</td></tr>`).join('')}
                <tr class="total"><td colspan="5" class="text-right">Toplam</td><td class="num">${U.num(r.total)}</td><td></td></tr></tbody></table></div>
                <div class="grid grid-2" style="margin-top:16px;">
                    <div><h3 style="font-size:.9em;margin-bottom:8px;">Geçmiş</h3><div class="timeline">${(r.history || []).map((h) => `<div class="ev"><div><b>${esc(h.action)}</b>${h.note ? ` — ${esc(h.note)}` : ''}<div class="d">${esc(h.by)} · ${esc(U.dateTime(h.at))}</div></div></div>`).join('')}</div></div>
                    <div><h3 style="font-size:.9em;margin-bottom:8px;">Yorumlar (${comments.length})</h3>
                        <div id="cmList">${comments.map((c) => `<div class="comment"><span class="avatar ${esc(c.role)}">${esc(c.avatar)}</span><div style="flex:1;"><div class="who">${esc(c.by)} <small>${esc(c.roleName)} · ${esc(U.timeAgo(c.at))}</small></div><div class="tx">${esc(c.text)}</div></div></div>`).join('') || '<p class="muted" style="font-size:.85em;">Henüz yorum yok.</p>'}</div>
                        <div style="display:flex;gap:8px;margin-top:10px;"><input class="input" id="cmText" placeholder="Yorum yazın…" maxlength="500"><button class="btn btn-violet" id="cmSend">Gönder</button></div></div>
                </div>`
        });
        const send = () => {
            const text = ctx.$('#cmText').value.trim();
            if (!text) return;
            const u = me();
            r.comments = r.comments || [];
            r.comments.push({ by: u.name, role: u.role, roleName: u.roleName, avatar: u.avatar, text, at: new Date().toISOString() });
            const targets = r.createdBy === u.username ? ['satinalma', 'satinalma_muduru'] : [MRP.auth.USERS[r.createdBy] ? MRP.auth.USERS[r.createdBy].role : 'planlama'];
            MRP.store.notify('comment', `${r.no} için yorum`, `${u.name}: ${text.slice(0, 80)}`, targets, 'requests');
            MRP.store.save();
            ctx.close();
            openReqDetail(no);
        };
        ctx.$('#cmSend').addEventListener('click', send);
        ctx.$('#cmText').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    }

    function approveReq(no) {
        if (!H.guard('approveRequest')) return;
        const r = findReq(no);
        if (!r || r.status !== 'pending') return;
        const limit = me().can.approveLimit;
        if (r.total > limit) {
            if (!r.escalated) {
                r.escalated = true;
                log(r, 'Müdür onayına yönlendirildi', `Tutar ${U.cur(r.total)} > limit ${U.cur(limit)}`);
                MRP.store.notify('request', 'Onayınız gerekiyor', `${r.no} · ${U.cur(r.total)} — ${me().name} limitini aşıyor`, ['satinalma_muduru', 'admin'], 'requests');
                app().commit();
            }
            return UI.toast('Onay limiti aşıldı', `${U.cur(limit)} üzerindeki talep müdür onayına yönlendirildi.`, 'warn', 5500);
        }
        r.status = 'approved';
        r.approvedBy = me().name;
        r.approvedAt = new Date().toISOString();
        log(r, 'Onaylandı');
        MRP.store.audit('Talep onaylandı', `${r.no} (${U.cur(r.total)})`);
        MRP.store.notify('request', 'Talep onaylandı', `${r.no} ${me().name} tarafından onaylandı.`, ['planlama', 'satinalma', 'admin'], 'requests');
        app().commit();
        UI.toast('Talep onaylandı', r.no, 'success');
    }

    async function rejectReq(no) {
        if (!H.guard('approveRequest')) return;
        const r = findReq(no);
        if (!r || r.status !== 'pending') return;
        const reason = await UI.promptText({ title: `${no} — Reddet`, label: 'Red sebebi', required: true, okLabel: 'Reddet' });
        if (reason == null) return;
        r.status = 'rejected';
        r.rejectionReason = reason;
        log(r, 'Reddedildi', reason);
        MRP.store.audit('Talep reddedildi', `${r.no}: ${reason}`);
        MRP.store.notify('request', 'Talep reddedildi', `${r.no}: ${reason}`, ['planlama', 'admin'], 'requests');
        app().commit();
        UI.toast('Talep reddedildi', r.no, 'info');
    }

    // ---------------- PO oluşturma ----------------
    /** Talep satırları için tedarikçi bazında teklif karşılaştırması */
    function compareQuotes(r) {
        const types = [...new Set(r.lines.map((l) => l.tur))];
        return M.suggestSuppliers(types).map(({ s, match }) => {
            let total = 0, priced = 0, maxLt = 0;
            r.lines.forEach((l) => {
                const o = M.offer(s.id, l.kod);
                if (o) { priced++; total += l.qty * M.toTRY(o.price, o.currency); maxLt = Math.max(maxLt, o.leadTime); } else total += l.qty * l.price;
            });
            return { s, match, priced, total, maxLt, score: M.supplierScore(s), perf: M.supplierPerformance(s.id) };
        }).filter((q) => q.priced || q.match).sort((a, b) => b.priced - a.priced || a.total - b.total);
    }

    function openCreatePO(no) {
        if (!H.guard('createPO')) return;
        const r = findReq(no);
        if (!r || r.status !== 'approved') return;
        const quotes = compareQuotes(r);
        const all = M.suggestSuppliers([...new Set(r.lines.map((l) => l.tur))]);
        if (!all.length) return UI.toast('Aktif tedarikçi yok', 'Önce tedarikçi tanımlayın.', 'warn');
        const best = quotes.length ? quotes[0].s.id : all[0].s.id;
        const bestTotal = quotes.length ? Math.min(...quotes.filter((q) => q.priced === quotes[0].priced).map((q) => q.total)) : 0;
        const inp = (cls, v, step, w) => `<input class="input input-sm ${cls}" type="number" min="0" step="${step}" value="${v}" style="width:${w}px;text-align:right;">`;
        const ctx = UI.modal({
            title: `Satın Alma Siparişi — ${r.no}`, size: 'xl',
            body: `${quotes.length ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;"><h3 style="font-size:.9em;">Teklif karşılaştırma</h3>
                    <button class="btn btn-violet btn-sm" id="poSplit" type="button">En uygun tedarikçilere böl (${splitPlan(r).length} sipariş)</button></div>
                <div class="table-wrap" style="margin-bottom:16px;max-height:220px;"><table><thead><tr><th>Tedarikçi</th><th class="num">Fiyatlı kalem</th><th class="num">Tahmini tutar (KDV hariç)</th><th class="num">En uzun teslim</th><th class="num">Puan</th><th>Performans</th><th></th></tr></thead><tbody>
                ${quotes.map((q) => `<tr class="${q.s.id === best ? 'r-new' : ''}"><td class="strong">${esc(q.s.ad)} ${q.s.id === best ? '<span class="badge badge-green plain">Önerilen</span>' : ''}</td>
                    <td class="num">${q.priced}/${r.lines.length}</td><td class="num">${U.cur(q.total)}${q.priced === quotes[0].priced && q.total > bestTotal ? ` <span class="muted">(+%${U.num((q.total / bestTotal - 1) * 100, 1)})</span>` : ''}</td>
                    <td class="num">${q.maxLt ? q.maxLt + ' gün' : '–'}</td><td class="num">${U.num(q.score, 1)}★</td>
                    <td class="muted" style="font-size:.85em;">${q.perf ? `Zamanında %${U.num(q.perf.onTimePct * 100, 0)} · Kalite %${U.num(q.perf.qualityPct * 100, 0)}` : 'Teslimat verisi yok'}</td>
                    <td><button class="btn btn-secondary btn-sm qt-pick" type="button" data-sup="${esc(q.s.id)}">Seç</button></td></tr>`).join('')}</tbody></table></div>` : ''}
                <div class="form-grid">
                    <div class="field"><label>Tedarikçi <span class="req">*</span></label><select id="poSup">${all.map(({ s, match }) =>
                        `<option value="${esc(s.id)}" ${s.id === best ? 'selected' : ''}>${esc(s.ad)} · ${U.num(M.supplierScore(s), 1)}★${match ? ` · ${match} kategori uyumlu` : ''}</option>`).join('')}</select>
                        <span class="hint">Seçilen tedarikçinin fiyat listesindeki fiyatlar satırlara güncel kurla TL olarak yazılır.</span></div>
                    <div class="field"><label>Teslim tarihi <span class="req">*</span></label><input id="poDate" type="date" value="${esc(r.deadline > U.iso(U.today()) ? r.deadline : U.iso(U.addDays(U.today(), 7)))}"></div>
                    <div class="field"><label>Ödeme vadesi</label><select id="poTerm">${[0, 30, 45, 60, 90].map((d) => `<option value="${d}">${d ? d + ' gün' : 'Peşin'}</option>`).join('')}</select></div>
                    <div class="field"><label>Teslim adresi</label><input id="poAddr" value="Merkez Depo — Fabrika"></div>
                </div>
                <div class="table-wrap" style="margin-top:16px;max-height:340px;"><table><thead><tr><th>Kod</th><th>Kalem</th><th class="num">Miktar</th><th class="num">Birim Fiyat ₺</th><th>Kaynak</th><th class="num">İsk. %</th><th class="num">KDV %</th><th class="num">Satır Toplamı</th></tr></thead>
                <tbody id="poLines">${r.lines.map((l, i) => `<tr data-i="${i}"><td class="mono">${esc(l.kod)}</td><td>${esc(l.ad)}</td>
                    <td class="num">${inp('pl-qty', l.qty, 'any', 90)} <span class="muted">${esc(l.unit)}</span></td><td class="num">${inp('pl-price', U.round(l.price, 4), 'any', 110)}</td>
                    <td class="pl-src muted" style="font-size:.8em;"></td>
                    <td class="num">${inp('pl-disc', 0, '0.1', 70)}</td><td class="num">${inp('pl-vat', 20, '1', 64)}</td><td class="num strong pl-total">0</td></tr>`).join('')}</tbody></table></div>
                <div class="totals"><dl class="dl"><dt>Ara toplam</dt><dd id="poSub"></dd><dt>İskonto</dt><dd id="poDisc"></dd><dt>KDV</dt><dd id="poVat"></dd>
                    <dt class="grand">Genel toplam</dt><dd class="grand" id="poGrand"></dd></dl></div>`,
            buttons: [{ label: 'Vazgeç' }, { label: 'Siparişi Oluştur', cls: 'btn-primary', icon: 'check', onClick: (c) => submitPO(c, r) }]
        });
        const readLines = () => ctx.$$('#poLines tr').map((tr) => {
            const l = r.lines[+tr.dataset.i];
            return { kod: l.kod, ad: l.ad, tur: l.tur, unit: l.unit, qty: U.toNum(tr.querySelector('.pl-qty').value), price: U.toNum(tr.querySelector('.pl-price').value),
                currency: tr.dataset.cur || 'TRY', origPrice: tr.dataset.orig ? +tr.dataset.orig : U.toNum(tr.querySelector('.pl-price').value), fxRate: tr.dataset.fx ? +tr.dataset.fx : 1,
                disc: Math.min(100, Math.max(0, U.toNum(tr.querySelector('.pl-disc').value))), vat: Math.max(0, U.toNum(tr.querySelector('.pl-vat').value)), received: 0 };
        });
        const recalc = () => {
            const lines = readLines();
            ctx.$$('#poLines tr').forEach((tr, i) => { const l = lines[i]; tr.querySelector('.pl-total').textContent = U.num(l.qty * l.price * (1 - l.disc / 100) * (1 + l.vat / 100)); });
            const t = poTotals({ lines });
            ctx.$('#poSub').textContent = U.cur(t.sub); ctx.$('#poDisc').textContent = '−' + U.cur(t.disc);
            ctx.$('#poVat').textContent = U.cur(t.vat); ctx.$('#poGrand').textContent = U.cur(t.grand);
        };
        /** Tedarikçi değişince vade ve fiyat listesindeki fiyatları uygula */
        const applySupplier = () => {
            const sid = ctx.$('#poSup').value;
            const s = S().suppliers.find((x) => x.id === sid);
            if (s) ctx.$('#poTerm').value = String([0, 30, 45, 60, 90].includes(s.vade) ? s.vade : 30);
            ctx.$$('#poLines tr').forEach((tr) => {
                const l = r.lines[+tr.dataset.i];
                const o = M.offer(sid, l.kod);
                const src = tr.querySelector('.pl-src');
                if (o) {
                    const fx = M.fxRate(o.currency);
                    tr.querySelector('.pl-price').value = U.round(o.price * fx, 4);
                    tr.dataset.cur = o.currency; tr.dataset.orig = o.price; tr.dataset.fx = fx;
                    src.textContent = `Liste: ${M.fmtMoney(o.price, o.currency)}${o.currency !== 'TRY' ? ` × ${U.num(fx, 4)}` : ''} · ${o.leadTime} g`;
                } else {
                    tr.querySelector('.pl-price').value = U.round(l.price, 4);
                    delete tr.dataset.cur; delete tr.dataset.orig; delete tr.dataset.fx;
                    src.textContent = 'Kart fiyatı (listede yok)';
                }
            });
            recalc();
        };
        ctx.$('#poLines').addEventListener('input', (e) => {
            if (e.target.classList.contains('pl-price')) { const tr = e.target.closest('tr'); delete tr.dataset.cur; delete tr.dataset.orig; delete tr.dataset.fx; tr.querySelector('.pl-src').textContent = 'Elle girildi'; }
            recalc();
        });
        ctx.$('#poSup').addEventListener('change', applySupplier);
        ctx.$$('.qt-pick').forEach((b) => b.addEventListener('click', () => { ctx.$('#poSup').value = b.dataset.sup; applySupplier(); }));
        ctx.readLines = readLines;
        if (ctx.$('#poSplit')) ctx.$('#poSplit').addEventListener('click', () => splitPO(r, ctx));
        applySupplier();
    }

    /** Talep için sipariş oluşturur; bir talep birden çok tedarikçiye bölünebilir */
    function createPO(r, sup, lines, { deliveryDate, paymentTerm, address }) {
        const po = {
            no: MRP.store.nextNo('PO'), requestNo: r.no, supplierId: sup.id, supplierName: sup.ad, supplierContact: sup.yetkili,
            deliveryDate, paymentTerm, address, lines, status: 'open',
            createdBy: me().name, createdAt: new Date().toISOString(), history: [], receipts: []
        };
        log(po, 'Oluşturuldu', `Talep ${r.no}`);
        S().pos.unshift(po);
        r.poNos = [...(r.poNos || (r.poNo ? [r.poNo] : [])), po.no];
        r.poNo = r.poNos.join(', ');
        r.status = 'ordered';
        log(r, 'Siparişe dönüştürüldü', `${po.no} · ${sup.ad}`);
        const t = poTotals(po);
        MRP.store.audit('Satın alma siparişi oluşturuldu', `${po.no} · ${sup.ad} · ${U.cur(t.grand)}`);
        MRP.store.notify('po', 'Sipariş oluşturuldu', `${po.no} · ${sup.ad} · ${U.cur(t.grand)}`, ['planlama', 'satinalma', 'satinalma_muduru', 'admin'], 'po');
        return po;
    }

    /** Talebin durumunu bağlı siparişlerden türetir */
    function syncRequest(r) {
        if (!r) return;
        const pos = (r.poNos || (r.poNo ? [r.poNo] : [])).map(findPO).filter(Boolean);
        r.poNos = pos.filter((p) => p.status !== 'cancelled').map((p) => p.no);
        r.poNo = r.poNos.join(', ') || null;
        if (!r.poNos.length) { r.status = 'approved'; return; }
        const active = pos.filter((p) => p.status !== 'cancelled');
        if (active.every((p) => p.status === 'received') && r.status !== 'closed') { r.status = 'closed'; log(r, 'Kapandı', 'Tüm siparişler teslim alındı'); }
    }

    function submitPO(ctx, r) {
        const sup = S().suppliers.find((s) => s.id === ctx.$('#poSup').value);
        const deliveryDate = ctx.$('#poDate').value;
        const lines = ctx.readLines();
        if (!sup) { UI.toast('Tedarikçi seçin', '', 'warn'); return false; }
        if (!deliveryDate) { UI.toast('Teslim tarihi gerekli', '', 'warn'); return false; }
        if (lines.some((l) => l.qty <= 0)) { UI.toast('Geçersiz miktar', 'Tüm satırlarda miktar sıfırdan büyük olmalı.', 'warn'); return false; }
        const po = createPO(r, sup, lines, { deliveryDate, paymentTerm: +ctx.$('#poTerm').value, address: ctx.$('#poAddr').value.trim() });
        app().commit();
        UI.toast('Sipariş oluşturuldu', `${po.no} · ${sup.ad}`, 'success');
    }

    /** Her kalemi fiyat listesindeki en ucuz aktif tedarikçiye atar; teklifi olmayan kalem kategori uyumlu tedarikçiye gider */
    function splitPlan(r) {
        const groups = new Map();
        r.lines.forEach((l) => {
            const offer = M.offers(l.kod).find((o) => o.supplier.aktif);
            let sup, line;
            if (offer) {
                sup = offer.supplier;
                line = { kod: l.kod, ad: l.ad, tur: l.tur, unit: l.unit, qty: Math.max(l.qty, offer.moq || 0), price: U.round(offer.priceTRY, 4), currency: offer.currency, origPrice: offer.price, fxRate: M.fxRate(offer.currency), disc: 0, vat: 20, received: 0, lt: offer.leadTime };
            } else {
                const m = M.suggestSuppliers([l.tur])[0];
                if (!m) return;
                sup = m.s;
                line = { kod: l.kod, ad: l.ad, tur: l.tur, unit: l.unit, qty: l.qty, price: U.round(l.price, 4), currency: 'TRY', origPrice: l.price, fxRate: 1, disc: 0, vat: 20, received: 0, lt: (M.rawItem(l.kod) || {}).leadTime || 7 };
            }
            if (!groups.has(sup.id)) groups.set(sup.id, { sup, lines: [] });
            groups.get(sup.id).lines.push(line);
        });
        return [...groups.values()];
    }

    function splitPO(r, parentCtx) {
        const plan = splitPlan(r);
        if (!plan.length) return UI.toast('Uygun tedarikçi yok', '', 'warn');
        const today = U.iso(U.today());
        plan.forEach((g) => {
            const lt = Math.max(...g.lines.map((l) => l.lt || 0));
            const earliest = U.iso(U.addDays(U.today(), lt));
            g.deliveryDate = r.deadline && r.deadline > earliest ? r.deadline : earliest;
            g.total = poTotals({ lines: g.lines }).grand;
            g.late = r.deadline && g.deliveryDate > r.deadline && r.deadline >= today;
        });
        UI.modal({
            title: `${r.no} — tedarikçilere böl`, size: 'lg',
            body: `<p class="muted" style="font-size:.86em;margin-bottom:12px;">Her kalem fiyat listesindeki en uygun (TL) aktif tedarikçiye atanır; listede olmayan kalemler kategori uyumlu ve puanı yüksek tedarikçiye kart fiyatıyla gider. Teslim tarihi, tedarikçinin teslim süresine göre hesaplanır.</p>
                <div class="table-wrap"><table><thead><tr><th>Tedarikçi</th><th class="num">Kalem</th><th>Teslim</th><th class="num">Tutar (KDV dahil)</th></tr></thead><tbody>
                ${plan.map((g) => `<tr><td class="strong">${esc(g.sup.ad)}</td><td class="num">${g.lines.length}</td><td>${esc(U.date(U.parseDate(g.deliveryDate)))} ${g.late ? '<span class="badge badge-amber">İhtiyaçtan sonra</span>' : ''}</td><td class="num">${U.cur(g.total)}</td></tr>`).join('')}
                <tr class="total"><td>Toplam</td><td class="num">${U.sum(plan, (g) => g.lines.length)}</td><td></td><td class="num">${U.cur(U.sum(plan, (g) => g.total))}</td></tr></tbody></table></div>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: `${plan.length} sipariş oluştur`, cls: 'btn-primary', icon: 'check', onClick: () => {
                    const nos = plan.map((g) => createPO(r, g.sup, g.lines.map(({ lt, ...l }) => l), { deliveryDate: g.deliveryDate, paymentTerm: g.sup.vade, address: 'Merkez Depo — Fabrika' }).no);
                    if (parentCtx) parentCtx.close();
                    app().commit();
                    UI.toast(`${nos.length} sipariş oluşturuldu`, nos.join(', '), 'success', 6000);
                }
            }]
        });
    }

    Object.assign(MRP.actions, {
        reqTab: (t) => { reqState.tab = t; app().render(); },
        reqDetail: (no) => openReqDetail(no),
        reqApprove: (no) => approveReq(no),
        reqReject: (no) => rejectReq(no),
        createPO: (no) => openCreatePO(no)
    });

    // =====================================================================
    // SATIN ALMA SİPARİŞLERİ
    // =====================================================================
    const poState = { tab: 'active' };

    MRP.views.po = {
        title: 'Satın Alma Siparişleri',
        subtitle: 'Açık siparişler, teslimat takibi ve mal kabul',
        render() {
            const all = S().pos;
            const by = (s) => all.filter((p) => s.includes(p.status));
            const tabs = [['active', 'Açık / Kısmi', by(['open', 'partial']).length], ['received', 'Teslim Alınan', by(['received']).length], ['cancelled', 'İptal', by(['cancelled']).length], ['all', 'Tümü', all.length]];
            const list = poState.tab === 'active' ? by(['open', 'partial']) : poState.tab === 'all' ? all : by([poState.tab]);
            const today = U.iso(U.today());
            const late = by(['open', 'partial']).filter((p) => p.deliveryDate < today);
            let html = H.tabs(tabs, poState.tab, 'poTab');

        p.status = 'cancelled';

    function submitReceive(ctx, p) {
        const waybill = ctx.$('#rcWaybill').value.trim();
        const quality = ctx.$('#rcQuality').value;
        const note = ctx.$('#rcNote').value.trim();
        const loc = ctx.$('#rcLoc').value;
        const lotBase = ctx.$('#rcLot').value.trim();
        if (!waybill) { UI.toast('İrsaliye no gerekli', '', 'warn'); return false; }
        const lines = ctx.$$('.rc-qty').map((inp) => ({ i: +inp.dataset.i, qty: U.toNum(inp.value) })).filter((x) => x.qty > 0);
        if (!lines.length) { UI.toast('Miktar girilmedi', 'En az bir kalem için teslim miktarı girin.', 'warn'); return false; }
        if (lines.some((x) => x.qty < 0)) { UI.toast('Geçersiz miktar', '', 'warn'); return false; }
        const over = lines.filter((x) => (p.lines[x.i].received || 0) + x.qty > p.lines[x.i].qty * 1.1 + 1e-9);
        if (over.length) { UI.toast('Fazla teslimat', 'Sipariş miktarının %10\'undan fazlası kabul edilemez.', 'warn'); return false; }

        const rc = { waybill, quality, note, at: new Date().toISOString(), by: me().name, lines: lines.map((x) => ({ kod: p.lines[x.i].kod, qty: x.qty })) };
        p.receipts = p.receipts || [];
        p.receipts.push(rc);
        if (quality === 'rejected') {
            log(p, 'Teslimat reddedildi', `İrsaliye ${waybill}${note ? ' — ' + note : ''}`);
            MRP.store.audit('Teslimat reddedildi', `${p.no} / ${waybill}`);
            MRP.store.notify('po', 'Teslimat reddedildi', `${p.no} · ${p.supplierName} · İrsaliye ${waybill}`, ['satinalma', 'satinalma_muduru', 'admin', 'planlama'], 'po');
        } else {
            lines.forEach((x) => {
                const l = p.lines[x.i];
                l.received = U.round((l.received || 0) + x.qty, 3);
                const it = M.item(l.kod);
                if (it) M.move({ kod: l.kod, qty: x.qty, type: 'GR', loc, lot: lotBase || '', ref: p.no, supplier: p.supplierName, note: it.procurement === 'service' ? `Fason hizmet teslimi · İrsaliye ${waybill}` : `İrsaliye ${waybill}` });
            });
            const done = p.lines.every((l) => (l.received || 0) >= l.qty - 1e-9);
            p.status = done ? 'received' : 'partial';
            log(p, done ? 'Tamamı teslim alındı' : 'Kısmi teslim alındı', `İrsaliye ${waybill}`);
            if (done) syncRequest(findReq(p.requestNo));
            MRP.store.audit('Mal kabul', `${p.no} / ${waybill}: ${lines.length} kalem${done ? '' : ' (kısmi)'}`);
            MRP.store.notify('po', 'Mal kabul yapıldı', `${p.no} · ${lines.length} kalem${done ? '' : ' (kısmi)'}`, ['planlama', 'satinalma_muduru', 'admin'], 'po');
        }
        app().commit();
        UI.toast(quality === 'rejected' ? 'Teslimat reddedildi' : 'Mal kabul kaydedildi', quality === 'rejected' ? 'Stok değişmedi.' : 'Stoklar güncellendi.', quality === 'rejected' ? 'warn' : 'success');
    }

    function printPO(no) {
        const p = findPO(no);
        if (!p) return;
        if (!window.jspdf) return UI.toast('PDF kütüphanesi yüklenemedi', 'İnternet bağlantınızı kontrol edin.', 'error');
        const T = U.pdfText;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const pw = doc.internal.pageSize.getWidth();
        doc.setFillColor(17, 23, 41); doc.rect(0, 0, pw, 28, 'F');
        doc.setTextColor(245, 158, 11); doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
        doc.text(T('SATIN ALMA SİPARİŞİ'), 14, 13);
        doc.setTextColor(230, 233, 242); doc.setFontSize(10); doc.setFont('helvetica', 'normal');
        doc.text(`${p.no}  |  ${T(U.date(p.createdAt))}`, 14, 21);
        doc.setTextColor(23, 32, 51); doc.setFontSize(9.5);
        const info = [['Tedarikçi', p.supplierName], ['Yetkili', p.supplierContact || '-'], ['Teslim tarihi', U.date(U.parseDate(p.deliveryDate))],
            ['Ödeme vadesi', p.paymentTerm ? p.paymentTerm + ' gün' : 'Peşin'], ['Teslim adresi', p.address || '-'], ['Talep referansı', p.requestNo]];
        info.forEach(([k, v], i) => { doc.setFont('helvetica', 'bold'); doc.text(T(k) + ':', 14, 38 + i * 6); doc.setFont('helvetica', 'normal'); doc.text(T(v), 50, 38 + i * 6); });
        doc.autoTable({
            startY: 76,
            head: [['Kod', 'Kalem', 'Miktar', 'Birim', 'Birim Fiyat', 'Isk.%', 'KDV%', 'Toplam'].map(T)],
            body: p.lines.map((l) => [l.kod, T(l.ad).slice(0, 38), U.qty(l.qty), T(l.unit), U.num(l.price, 2), U.num(l.disc, 1), U.num(l.vat, 0), U.num(l.qty * l.price * (1 - l.disc / 100) * (1 + l.vat / 100))]),
            theme: 'grid', headStyles: { fillColor: [17, 23, 41], textColor: [245, 158, 11], fontSize: 8 }, bodyStyles: { fontSize: 7.5 },
            columnStyles: { 2: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right' }, 7: { halign: 'right' } },
            margin: { left: 14, right: 14 }
        });
        const t = poTotals(p);
        let y = doc.lastAutoTable.finalY + 8;
        [['Ara toplam', t.sub], ['Iskonto', -t.disc], ['KDV', t.vat], ['GENEL TOPLAM', t.grand]].forEach(([k, v], i) => {
            doc.setFont('helvetica', i === 3 ? 'bold' : 'normal');
            doc.text(k, pw - 70, y); doc.text(T(U.cur(v)), pw - 14, y, { align: 'right' }); y += 6;
        });
        doc.setFontSize(7.5); doc.setTextColor(120);
        doc.text(T(`Oluşturan: ${p.createdBy} — MRP Pro`), 14, doc.internal.pageSize.getHeight() - 10);
        doc.save(`${p.no}.pdf`);
    }

                <h3 style="font-size:.9em;margin-bottom:8px;">Siparişler</h3>
                ${pos.length ? `<div class="table-wrap"><table><thead><tr><th>Sipariş</th><th>Tarih</th><th>Teslim</th><th class="num">Tutar ₺</th><th>Durum</th></tr></thead><tbody>
                    ${pos.map((p) => `<tr><td class="mono">${esc(p.no)}</td><td>${esc(U.date(p.createdAt))}</td><td>${esc(U.date(U.parseDate(p.deliveryDate)))}</td><td class="num">${U.num(poTotals(p).grand)}</td><td>${H.badge(H.PO_STATUS, p.status)}</td></tr>`).join('')}
                    </tbody></table></div>` : '<p class="muted">Henüz sipariş yok.</p>'}`,
            onOpen: (ctx) => ctx.$$('.of-edit').forEach((b) => b.addEventListener('click', () => { ctx.close(); editOffer(id, b.dataset.kod); }))
        });
    }

    /** Tedarikçi fiyat listesi satırı ekle/düzenle/sil */
    function editOffer(supplierId, kod) {
        if (!H.guard('manageSuppliers')) return;
        const ex = kod ? M.offer(supplierId, kod) : null;
        const sup = S().suppliers.find((x) => x.id === supplierId);
        const items = M.items().filter((i) => i.procurement !== 'make');
        UI.modal({
            title: `${sup.ad} — ${ex ? 'Fiyatı düzenle' : 'Fiyat ekle'}`, size: 'md',
            body: `<datalist id="ofItems">${items.map((i) => `<option value="${esc(i.kod)}">${esc(i.ad)}</option>`).join('')}</datalist>
                <div class="form-grid">
                <div class="field full"><label>Malzeme kodu <span class="req">*</span></label><input id="ofKod" list="ofItems" value="${esc(kod || '')}" ${ex ? 'readonly' : ''} autocomplete="off"><span class="hint" id="ofName"></span></div>
                <div class="field"><label>Fiyat <span class="req">*</span></label><input id="ofPrice" type="number" min="0" step="any" value="${ex ? ex.price : ''}"></div>
                <div class="field"><label>Para birimi</label><select id="ofCur">${Object.keys(MRP.data.CURRENCIES).map((c) => `<option ${ex && ex.currency === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
                <div class="field"><label>Teslim süresi (gün)</label><input id="ofLt" type="number" min="1" step="1" value="${ex ? ex.leadTime : 7}"></div>
                <div class="field"><label>Min. sipariş</label><input id="ofMoq" type="number" min="0" step="any" value="${ex ? ex.moq : 0}"></div>
            </div>`,
            onOpen: (ctx) => {
                const upd = () => {
                    const it = M.rawItem(ctx.$('#ofKod').value.trim());
                    ctx.$('#ofName').textContent = it ? `${it.ad} · kart fiyatı ${M.fmtMoney(it.price, it.currency)}` : 'Listeden bir malzeme seçin';
                    if (it && !ex) ctx.$('#ofCur').value = it.currency;
                };
                ctx.$('#ofKod').addEventListener('input', upd); upd();
            },
            buttons: [{ label: 'Vazgeç' }, ...(ex ? [{ label: 'Sil', cls: 'btn-danger', onClick: () => {
                S().priceList = S().priceList.filter((o) => o !== ex);
                MRP.store.audit('Fiyat listesi satırı silindi', `${supplierId} / ${kod}`);
                app().commit();
            } }] : []), {
                label: 'Kaydet', cls: 'btn-primary', onClick: (ctx) => {
                    const k = ctx.$('#ofKod').value.trim().toUpperCase();
                    const price = U.toNum(ctx.$('#ofPrice').value, NaN);
                    if (!M.rawItem(k)) { UI.toast('Geçersiz malzeme', '', 'warn'); return false; }
                    if (!(price > 0)) { UI.toast('Geçersiz fiyat', '', 'warn'); return false; }
                    const rec = { supplierId, kod: k, price, currency: ctx.$('#ofCur').value, leadTime: Math.max(1, Math.round(U.toNum(ctx.$('#ofLt').value, 7))), moq: Math.max(0, U.toNum(ctx.$('#ofMoq').value)), updatedAt: new Date().toISOString() };
                    const cur = M.offer(supplierId, k);
                    if (cur) Object.assign(cur, rec); else S().priceList.push(rec);
                    MRP.store.audit('Fiyat listesi güncellendi', `${supplierId} / ${k}: ${price} ${rec.currency}`);
                    app().commit();
                    UI.toast('Fiyat kaydedildi', `${k} · ${M.fmtMoney(price, rec.currency)}`, 'success');
                }
            }]
        });
    }

    function editSupplier(id) {
        if (!H.guard('manageSuppliers')) return;
        const s = id ? S().suppliers.find((x) => x.id === id) : { ad: '', yetkili: '', tel: '', email: '', adres: '', vergiNo: '', kategoriler: [], vade: 30, puan: 4, aktif: true };
        const types = MRP.data.ITEM_TYPES;
        UI.modal({
            title: id ? `Tedarikçi Düzenle — ${s.id}` : 'Yeni Tedarikçi', size: 'lg',
            body: `<div class="form-section"><h3>Firma bilgileri</h3><div class="form-grid">
                    <div class="field full"><label>Firma adı <span class="req">*</span></label><input id="sAd" value="${esc(s.ad)}"></div>
                    <div class="field"><label>Yetkili</label><input id="sYet" value="${esc(s.yetkili)}"></div>
                    <div class="field"><label>Telefon</label><input id="sTel" value="${esc(s.tel)}"></div>
                    <div class="field"><label>E-posta</label><input id="sMail" type="email" value="${esc(s.email)}"></div>
                    <div class="field"><label>Vergi no</label><input id="sVno" value="${esc(s.vergiNo)}" maxlength="11"></div>
                    <div class="field full"><label>Adres</label><textarea id="sAdr">${esc(s.adres)}</textarea></div></div></div>
                <div class="form-section"><h3>Tedarik kategorileri <span class="req">*</span></h3><div class="chips">${types.map((t) => `<label class="check-chip"><input type="checkbox" class="sCat" value="${esc(t)}" ${s.kategoriler.includes(t) ? 'checked' : ''}> ${esc(t)}</label>`).join('')}</div></div>
                <div class="form-section"><h3>Ticari</h3><div class="form-grid">
                    <div class="field"><label>Ödeme vadesi (gün)</label><input id="sVade" type="number" min="0" step="1" value="${s.vade}"></div>
                    <div class="field"><label>Performans puanı (1–5)</label><input id="sPuan" type="number" min="1" max="5" step="0.1" value="${s.puan}"></div></div></div>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Kaydet', cls: 'btn-success', icon: 'check', onClick: (ctx) => {
                    const ad = ctx.$('#sAd').value.trim();
                    const cats = ctx.$$('.sCat:checked').map((c) => c.value);
                    const email = ctx.$('#sMail').value.trim();
                    if (!ad) { UI.toast('Firma adı zorunlu', '', 'warn'); return false; }
                    if (!cats.length) { UI.toast('Kategori seçin', 'En az bir tedarik kategorisi gerekli.', 'warn'); return false; }
                    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { UI.toast('Geçersiz e-posta', '', 'warn'); return false; }
                    const data = { ad, yetkili: ctx.$('#sYet').value.trim(), tel: ctx.$('#sTel').value.trim(), email, adres: ctx.$('#sAdr').value.trim(),
                        vergiNo: ctx.$('#sVno').value.trim(), kategoriler: cats, vade: Math.max(0, Math.round(U.toNum(ctx.$('#sVade').value, 30))),
                        puan: Math.min(5, Math.max(1, U.toNum(ctx.$('#sPuan').value, 4))) };
                    if (id) {
                        Object.assign(s, data);
                        MRP.store.audit('Tedarikçi güncellendi', `${s.id} — ${ad}`);
                    } else {
                        const nid = MRP.store.nextNo('TED');
                        S().suppliers.push({ id: nid, ...data, aktif: true });
                        MRP.store.audit('Tedarikçi eklendi', `${nid} — ${ad}`);
                        MRP.store.notify('supplier', 'Yeni tedarikçi', `${ad} (${nid})`, ['satinalma', 'satinalma_muduru', 'admin'], 'suppliers');
                    }
                    app().commit();
                    UI.toast('Tedarikçi kaydedildi', ad, 'success');
                }
            }]
        });
    }

    Object.assign(MRP.actions, {
        supplierDetail: (id) => openSupplier(id),
        supplierEdit: (id) => editSupplier(id)
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/inventory.js */
