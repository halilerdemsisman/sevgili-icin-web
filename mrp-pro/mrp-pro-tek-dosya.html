/* ==========================================================================
   MRP Pro — Depo: stok durumu (çoklu lokasyon), sayım, transfer, fason
   sevk/dönüş, lot izlenebilirliği, barkod okutma, stok hareketleri
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;
    const LOCS = () => Object.keys(M.LOCATIONS);
    const locName = (l) => (M.LOCATIONS[l] ? M.LOCATIONS[l].ad : l);
    const valueOf = (kod) => (M.isProduct(kod) || (M.rawItem(kod) || {}).procurement === 'make' ? M.unitCost(kod) : M.priceTRY(kod));

    const stockState = { tab: 'all', q: '', lotQ: '' };

    MRP.views.stock = {
        title: 'Stok Durumu',
        subtitle: 'Lokasyon bazında stok, emniyet stoğu, fason ve lot takibi',
        render() {
            const stocked = M.items().filter((i) => i.procurement !== 'service');
            const status = (i) => M.stockStatus(i.kod);
            const fg = M.products().filter((p) => M.onHand(p.kod) !== 0);
            const openFason = S().subcontracts.filter((x) => x.status === 'open');
            const tabs = [['all', 'Tüm malzemeler', stocked.length], ['critical', 'Kritik', stocked.filter((i) => status(i) === 'critical').length],
                ['warn', 'Düşük', stocked.filter((i) => status(i) === 'warn').length], ['ok', 'Normal', stocked.filter((i) => status(i) === 'ok').length],
                ['fg', 'Mamul stoğu', fg.length], ['fason', 'Fason sevkleri', openFason.length], ['lots', 'Lot izleme', null]];
            const q = stockState.q.toLocaleLowerCase('tr');
            const match = (x) => !q || x.kod.toLocaleLowerCase('tr').includes(q) || x.ad.toLocaleLowerCase('tr').includes(q);
            const canAdj = MRP.auth.can('adjustStock');

            let html = `<div class="kpis">
                ${H.kpi('Stok Değeri', U.compactCur(M.stockValue()), 'Güncel kur ve standart maliyetle', '')}
                ${H.kpi('Stoklu Kalem', stocked.length, `${fg.length} mamul stokta`, 'blue')}
                ${H.kpi('Kritik', tabs[1][2], 'Emniyet stoğunun %50 altı', tabs[1][2] ? 'red' : 'green')}
                ${H.kpi('Düşük', tabs[2][2], 'Emniyet stoğunun altı', tabs[2][2] ? 'violet' : 'green')}
                ${H.kpi('Fasonda', openFason.length, `${U.compactCur(U.sum(stocked, (i) => M.onHand(i.kod, 'FASON') * valueOf(i.kod)))} değerinde malzeme`, 'cyan')}
            </div>${H.tabs(tabs, stockState.tab, 'stockTab')}`;

            if (stockState.tab === 'fason') return html + renderFason();
            if (stockState.tab === 'lots') return html + renderLots();

            html += `<div class="toolbar"><input class="input" id="stockSearch" placeholder="Kod veya ad ile ara…" value="${esc(stockState.q)}" data-input="stockSearch">
                <span class="spacer"></span>
                ${canAdj ? `<button class="btn btn-secondary" data-act="stockTransfer">${MRP.icon('swap')} Transfer</button>
                    <button class="btn btn-primary" data-act="fasonNew">${MRP.icon('truck')} Fasona Sevk</button>` : ''}</div>`;

            if (stockState.tab === 'fg') {
                const list = fg.filter(match);
                return html + `<section class="card"><div class="table-wrap"><table><thead><tr><th>Mamul</th><th>Ad</th><th>Kategori</th><th class="num">Stok</th><th class="num">Birim Maliyet</th><th class="num">Değer ₺</th><th></th></tr></thead><tbody>
                    ${list.map((p) => `<tr><td>${H.productLink(p.kod)}</td><td class="strong">${esc(p.ad)}</td><td>${H.catTag(p.kategori)}</td><td class="num">${esc(U.qty(M.onHand(p.kod), 'ad'))}</td>
                        <td class="num">${U.num(M.unitCost(p.kod))}</td><td class="num">${U.num(M.onHand(p.kod) * M.unitCost(p.kod))}</td>
                        <td>${canAdj ? `<button class="btn btn-ghost btn-sm" data-act="stockAdjust" data-id="${esc(p.kod)}">Sayım</button>` : ''}</td></tr>`).join('')
                    || `<tr><td colspan="7">${H.empty('Mamul stoğu yok', 'Tamamlanan iş emirleri mamul stoğu oluşturur.')}</td></tr>`}</tbody></table></div></section>`;
            }

            const ord = { critical: 0, warn: 1, ok: 2, na: 3 };
            const list = stocked.filter((i) => (stockState.tab === 'all' || status(i) === stockState.tab) && match(i))
                .sort((a, b) => ord[status(a)] - ord[status(b)] || a.kod.localeCompare(b.kod));
            html += `<section class="card"><div class="table-wrap"><table>
                <thead><tr><th>Kod</th><th>Malzeme</th>${LOCS().map((l) => `<th class="num">${esc(locName(l))}</th>`).join('')}<th class="num">Toplam</th><th class="num">Emniyet</th><th class="num">Siparişte</th>
                    <th>Doluluk</th><th>Durum</th><th class="num">Değer ₺</th><th></th></tr></thead>
                <tbody>${list.map((i) => {
                    const s = status(i);
                    const oh = M.onHand(i.kod);
                    const fill = i.safetyStock > 0 ? Math.min(100, oh / (i.safetyStock * 2) * 100) : 100;
                    const color = s === 'critical' ? 'var(--red)' : s === 'warn' ? 'var(--amber)' : 'var(--green)';
                    return `<tr class="${s === 'critical' ? 'r-crit' : s === 'warn' ? 'r-warn' : ''}">
                        <td>${H.itemLink(i.kod)}</td><td class="strong">${esc(i.ad)}</td>
                        ${LOCS().map((l) => { const v = M.onHand(i.kod, l); return `<td class="num ${v ? '' : 'muted'}">${v ? esc(U.qty(v)) : '·'}</td>`; }).join('')}
                        <td class="num strong">${esc(U.qty(oh, i.unit))}</td><td class="num">${esc(U.qty(i.safetyStock))}</td>
                        <td class="num">${esc(U.qty(M.onOrder(i.kod)))}</td>
                        <td><span class="bar"><span style="width:${Math.max(0, fill)}%;background:${color};"></span></span></td>
                        <td>${H.stockBadge(s)}</td><td class="num">${U.num(Math.max(0, oh) * valueOf(i.kod))}</td>
                        <td>${canAdj ? `<div class="row-actions"><button class="btn btn-ghost btn-sm" data-act="stockAdjust" data-id="${esc(i.kod)}">Sayım</button><button class="btn btn-ghost btn-sm" data-act="stockTransfer" data-id="${esc(i.kod)}" title="Transfer">${MRP.icon('swap', 'sm')}</button></div>` : ''}</td></tr>`;
                }).join('') || `<tr><td colspan="${9 + LOCS().length}">${H.empty('Kayıt yok')}</td></tr>`}</tbody></table></div></section>
                <p class="muted" style="font-size:.78em;margin-top:10px;">Üretimde sarf, Fabrika ve Merkez Depo stoğundan FIFO ile yapılır; fasoncudaki stok MRP'de eldeki stok sayılır ancak sarf edilemez. Eksikler için öneriler MRP'de emniyet stoğu tamamlama olarak oluşur.</p>`;
            return html;
        },
        after() {
            const el = document.getElementById(stockState.tab === 'lots' ? 'lotSearch' : 'stockSearch');
            const v = stockState.tab === 'lots' ? stockState.lotQ : stockState.q;
            if (el && v) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };

    // ---------------- Sayım düzeltme (lokasyon bazında) ----------------
    function adjust(kod) {
        if (!H.guard('adjustStock')) return;
        const it = M.item(kod);
        UI.modal({
            title: `Sayım Düzeltme — ${kod}`, size: 'sm',
            body: `<p style="margin-bottom:14px;">${esc(it.ad)}</p>
                <div class="form-grid">
                    <div class="field full"><label>Lokasyon</label><select id="adjLoc">${LOCS().map((l) => `<option value="${l}">${esc(locName(l))} — ${esc(U.qty(M.onHand(kod, l), it.unit))}</option>`).join('')}</select></div>
                    <div class="field"><label>Sistem stoğu</label><input id="adjCur" readonly></div>
                    <div class="field"><label>Sayılan (${esc(it.unit)}) <span class="req">*</span></label><input id="adjQty" type="number" min="0" step="any"></div>
                    <div class="field full"><label>Lot no (fazla çıkan miktar için)</label><input id="adjLot" placeholder="Boş = SAYIM-tarih"></div>
                    <div class="field full"><label>Gerekçe <span class="req">*</span></label><input id="adjNote" placeholder="Yıl sonu sayımı, fire, hasar…"></div>
                </div><p class="hint" id="adjDiff" style="margin-top:10px;font-size:.84em;"></p>`,
            onOpen: (ctx) => {
                const cur = () => M.onHand(kod, ctx.$('#adjLoc').value);
                const upd = () => { const d = U.toNum(ctx.$('#adjQty').value) - cur(); ctx.$('#adjDiff').textContent = `Fark: ${d > 0 ? '+' : ''}${U.qty(d, it.unit)} · ${U.cur(d * valueOf(kod))}`; };
                const loc = () => { ctx.$('#adjCur').value = U.qty(cur(), it.unit); ctx.$('#adjQty').value = cur(); upd(); };
                ctx.$('#adjLoc').addEventListener('change', loc); ctx.$('#adjQty').addEventListener('input', upd); loc();
            },
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Kaydet', cls: 'btn-primary', onClick: (ctx) => {
                    const loc = ctx.$('#adjLoc').value;
                    const cur = M.onHand(kod, loc);
                    const v = U.toNum(ctx.$('#adjQty').value, NaN);
                    const note = ctx.$('#adjNote').value.trim();
                    if (!isFinite(v) || v < 0) { UI.toast('Geçersiz miktar', '', 'warn'); return false; }
                    if (!note) { UI.toast('Gerekçe zorunlu', 'Denetim için düzeltme gerekçesi girin.', 'warn'); return false; }
                    const d = U.round(v - cur, 4);
                    if (!d) return;
                    M.move({ kod, qty: d, type: 'ADJ', loc, lot: d > 0 ? (ctx.$('#adjLot').value.trim() || `SAYIM-${U.iso(new Date())}`) : '', ref: 'SAYIM', note });
                    MRP.store.audit('Stok düzeltme', `${kod} @ ${loc}: ${U.qty(cur)} → ${U.qty(v)} (${note})`);
                    app().commit();
                    UI.toast('Stok güncellendi', `${kod} @ ${locName(loc)}: ${U.qty(v, it.unit)}`, 'success');
                }
            }]
        });
    }

    // ---------------- Lokasyonlar arası transfer ----------------
    function transfer(kod) {
        if (!H.guard('adjustStock')) return;
        const items = M.items().filter((i) => i.procurement !== 'service' && M.onHand(i.kod) > 0);
        UI.modal({
            title: 'Lokasyonlar Arası Transfer', size: 'md',
            body: `<datalist id="trItems">${items.map((i) => `<option value="${esc(i.kod)}">${esc(i.ad)}</option>`).join('')}</datalist>
                <div class="form-grid">
                    <div class="field full"><label>Malzeme <span class="req">*</span></label><input id="trKod" list="trItems" value="${esc(kod || '')}" autocomplete="off"><span class="hint" id="trInfo"></span></div>
                    <div class="field"><label>Çıkış</label><select id="trFrom">${LOCS().map((l) => `<option value="${l}">${esc(locName(l))}</option>`).join('')}</select></div>
                    <div class="field"><label>Varış</label><select id="trTo">${LOCS().map((l, i) => `<option value="${l}" ${i === 1 ? 'selected' : ''}>${esc(locName(l))}</option>`).join('')}</select></div>
                    <div class="field"><label>Miktar <span class="req">*</span></label><input id="trQty" type="number" min="0" step="any"></div>
                    <div class="field"><label>Açıklama</label><input id="trNote" placeholder="Üretim hattına besleme…"></div>
                </div>`,
            onOpen: (ctx) => {
                const upd = () => {
                    const k = ctx.$('#trKod').value.trim(); const it = M.rawItem(k);
                    ctx.$('#trInfo').textContent = it ? `${it.ad} · ${LOCS().map((l) => `${locName(l)}: ${U.qty(M.onHand(k, l), it.unit)}`).join(' · ')}` : 'Listeden seçin';
                };
                ctx.$('#trKod').addEventListener('input', upd); upd();
            },
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Transfer Et', cls: 'btn-primary', onClick: (ctx) => {
                    const k = ctx.$('#trKod').value.trim(), from = ctx.$('#trFrom').value, to = ctx.$('#trTo').value;
                    const qty = U.toNum(ctx.$('#trQty').value, NaN);
                    if (!M.rawItem(k)) { UI.toast('Geçersiz malzeme', '', 'warn'); return false; }
                    if (from === to) { UI.toast('Çıkış ve varış aynı', '', 'warn'); return false; }
                    if (!(qty > 0)) { UI.toast('Geçersiz miktar', '', 'warn'); return false; }
                    if (qty > M.onHand(k, from) + 1e-9) { UI.toast('Yetersiz stok', `${locName(from)}: ${U.qty(M.onHand(k, from))}`, 'warn'); return false; }
                    M.move({ kod: k, qty, type: 'TRF', loc: from, toLoc: to, ref: 'TRANSFER', note: ctx.$('#trNote').value.trim() });
                    MRP.store.audit('Stok transferi', `${k}: ${U.qty(qty)} ${from} → ${to}`);
                    app().commit();
                    UI.toast('Transfer yapıldı', `${k} · ${U.qty(qty)} → ${locName(to)}`, 'success');
                }
            }]
        });
    }

    // ---------------- Fason sevk / dönüş ----------------
    function renderFason() {
        const list = S().subcontracts.slice().reverse();
        const today = U.iso(U.today());
        return `<div class="toolbar"><span class="spacer"></span>${MRP.auth.can('adjustStock') ? `<button class="btn btn-primary" data-act="fasonNew">${MRP.icon('truck')} Fasona Sevk</button>` : ''}</div>
            <section class="card"><div class="table-wrap"><table><thead><tr><th>Sevk No</th><th>Fasoncu</th><th>Sevk</th><th>Beklenen dönüş</th><th class="num">Kalem</th><th>Dönüş</th><th>Durum</th><th></th></tr></thead><tbody>
            ${list.map((x) => {
                const sent = U.sum(x.lines, (l) => l.qty), back = U.sum(x.lines, (l) => l.returned || 0);
                const late = x.status === 'open' && x.expectedAt < today;
                return `<tr class="${late ? 'r-warn' : ''}"><td class="mono">${esc(x.no)}</td><td class="strong">${esc(x.supplierName)}</td><td>${esc(U.date(x.sentAt))}</td>
                    <td>${esc(U.date(U.parseDate(x.expectedAt)))} ${late ? '<span class="badge badge-red">Gecikti</span>' : ''}</td><td class="num">${x.lines.length}</td>
                    <td><span class="bar"><span style="width:${sent ? back / sent * 100 : 0}%;background:var(--green);"></span></span> <span class="muted">%${U.num(sent ? back / sent * 100 : 0, 0)}</span></td>
                    <td>${x.status === 'open' ? '<span class="badge badge-amber">Fasonda</span>' : '<span class="badge badge-green">Döndü</span>'}</td>
                    <td><div class="row-actions">${x.status === 'open' && MRP.auth.can('adjustStock') ? `<button class="btn btn-success btn-sm" data-act="fasonReturn" data-id="${esc(x.no)}">Dönüş Al</button>` : ''}
                        <button class="btn btn-ghost btn-sm" data-act="fasonDetail" data-id="${esc(x.no)}">Detay</button></div></td></tr>`;
            }).join('') || `<tr><td colspan="8">${H.empty('Fason sevki yok', 'Boya, polisaj vb. için fasoncuya giden malzemeleri buradan takip edin.')}</td></tr>`}
            </tbody></table></div></section>`;
    }

    function fasonNew() {
        if (!H.guard('adjustStock')) return;
        const subs = S().suppliers.filter((s) => s.aktif && s.kategoriler.includes('Fason İşçilik'));
        if (!subs.length) return UI.toast('Fasoncu tanımlı değil', '"Fason İşçilik" kategorili aktif tedarikçi ekleyin.', 'warn');
        const items = M.items().filter((i) => i.procurement !== 'service' && M.available(i.kod) > 0);
        const ctx = UI.modal({
            title: 'Fasona Sevk', size: 'lg',
            body: `<datalist id="fsItems">${items.map((i) => `<option value="${esc(i.kod)}">${esc(i.ad)}</option>`).join('')}</datalist>
                <div class="form-grid">
                    <div class="field"><label>Fasoncu <span class="req">*</span></label><select id="fsSup">${subs.map((s) => `<option value="${esc(s.id)}">${esc(s.ad)}</option>`).join('')}</select></div>
                    <div class="field"><label>Beklenen dönüş</label><input id="fsDate" type="date" value="${U.iso(U.addDays(U.today(), 5))}"></div>
                    <div class="field full"><label>İşlem / not</label><input id="fsNote" placeholder="Elektrostatik boya, polisaj…"></div>
                </div>
                <div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>Malzeme</th><th class="num">Kullanılabilir</th><th class="num">Sevk miktarı</th><th></th></tr></thead><tbody id="fsRows"></tbody></table></div>
                <button class="btn btn-secondary btn-sm" id="fsAdd" type="button" style="margin-top:8px;">${MRP.icon('plus', 'sm')} Satır ekle</button>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Sevk Et', cls: 'btn-primary', onClick: (c) => {
                    const lines = [];
                    for (const tr of c.$$('#fsRows tr')) {
                        const kod = tr.querySelector('.fs-kod').value.trim(), qty = U.toNum(tr.querySelector('.fs-qty').value, 0);
                        if (!kod && !qty) continue;
                        const it = M.rawItem(kod);
                        if (!it) { UI.toast('Geçersiz malzeme', kod, 'warn'); return false; }
                        if (!(qty > 0) || qty > M.available(kod) + 1e-9) { UI.toast('Geçersiz/yetersiz miktar', `${kod}: kullanılabilir ${U.qty(M.available(kod))}`, 'warn'); return false; }
                        lines.push({ kod, ad: it.ad, unit: it.unit, qty, returned: 0 });
                    }
                    if (!lines.length) { UI.toast('Satır ekleyin', '', 'warn'); return false; }
                    const sup = S().suppliers.find((s) => s.id === c.$('#fsSup').value);
                    const x = { no: MRP.store.nextNo('FSV'), supplierId: sup.id, supplierName: sup.ad, sentAt: new Date().toISOString(), expectedAt: c.$('#fsDate').value || U.iso(U.addDays(U.today(), 5)),
                        note: c.$('#fsNote').value.trim(), status: 'open', lines, by: MRP.auth.current().name };
                    lines.forEach((l) => M.move({ kod: l.kod, qty: l.qty, type: 'TRF', loc: ['MERKEZ', 'FABRIKA'], toLoc: 'FASON', ref: x.no, note: `Fasona sevk: ${sup.ad}` }));
                    S().subcontracts.push(x);
                    MRP.store.audit('Fasona sevk', `${x.no} · ${sup.ad} · ${lines.length} kalem`);
                    app().commit();
                    UI.toast('Fasona sevk edildi', `${x.no} · ${sup.ad}`, 'success');
                }
            }]
        });
        const add = () => ctx.$('#fsRows').insertAdjacentHTML('beforeend', `<tr><td><input class="input input-sm fs-kod" list="fsItems" autocomplete="off" placeholder="YM.059"></td><td class="num fs-av muted">–</td>
            <td class="num"><input class="input input-sm fs-qty" type="number" min="0" step="any" style="width:110px;text-align:right;"></td><td><button class="btn btn-ghost btn-sm fs-del" type="button">${MRP.icon('x', 'sm')}</button></td></tr>`);
        ctx.$('#fsAdd').addEventListener('click', add);
        ctx.$('#fsRows').addEventListener('input', (e) => { if (e.target.classList.contains('fs-kod')) { const it = M.rawItem(e.target.value.trim()); e.target.closest('tr').querySelector('.fs-av').textContent = it ? U.qty(M.available(it.kod), it.unit) : '–'; } });
        ctx.$('#fsRows').addEventListener('click', (e) => { if (e.target.closest('.fs-del')) e.target.closest('tr').remove(); });
        add();
    }

    function fasonReturn(no) {
        if (!H.guard('adjustStock')) return;
        const x = S().subcontracts.find((s) => s.no === no);
        UI.modal({
            title: `Fasondan Dönüş — ${x.no}`, size: 'lg',
            body: `${H.banner('blue', 'truck', x.supplierName, `Sevk: ${U.date(x.sentAt)} · ${x.note || ''}`)}
                <div class="form-grid"><div class="field"><label>Giriş lokasyonu</label><select id="frLoc"><option value="FABRIKA">Fabrika / Üretim Hattı</option><option value="MERKEZ">Merkez Depo</option></select></div>
                    <div class="field"><label>İrsaliye no</label><input id="frWb"></div></div>
                <div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>Malzeme</th><th class="num">Sevk</th><th class="num">Dönen</th><th class="num">Bu dönüş</th></tr></thead><tbody>
                ${x.lines.map((l, i) => { const rem = Math.max(0, l.qty - (l.returned || 0)); return `<tr><td>${esc(l.kod)} ${esc(l.ad)}</td><td class="num">${esc(U.qty(l.qty, l.unit))}</td><td class="num">${esc(U.qty(l.returned || 0, l.unit))}</td>
                    <td class="num"><input class="input input-sm fr-qty" data-i="${i}" type="number" min="0" step="any" value="${U.round(Math.min(rem, M.onHand(l.kod, 'FASON')), 4)}" style="width:110px;text-align:right;"></td></tr>`; }).join('')}
                </tbody></table></div>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Dönüşü Kaydet', cls: 'btn-success', onClick: (ctx) => {
                    const loc = ctx.$('#frLoc').value;
                    const ret = ctx.$$('.fr-qty').map((inp) => ({ l: x.lines[+inp.dataset.i], q: U.toNum(inp.value, 0) })).filter((r) => r.q > 0);
                    if (!ret.length) { UI.toast('Miktar girin', '', 'warn'); return false; }
                    for (const r of ret) if (r.q > M.onHand(r.l.kod, 'FASON') + 1e-9) { UI.toast('Fasonda yeterli stok yok', r.l.kod, 'warn'); return false; }
                    ret.forEach((r) => { M.move({ kod: r.l.kod, qty: r.q, type: 'TRF', loc: 'FASON', toLoc: loc, ref: x.no, note: `Fasondan dönüş${ctx.$('#frWb').value ? ' · İrs. ' + ctx.$('#frWb').value : ''}` }); r.l.returned = U.round((r.l.returned || 0) + r.q, 4); });
                    if (x.lines.every((l) => (l.returned || 0) >= l.qty - 1e-9)) { x.status = 'closed'; x.closedAt = new Date().toISOString(); }
                    MRP.store.audit('Fasondan dönüş', `${x.no}: ${ret.length} kalem${x.status === 'closed' ? ' (kapandı)' : ''}`);
                    app().commit();
                    UI.toast('Dönüş kaydedildi', x.status === 'closed' ? 'Sevk kapandı.' : 'Kısmi dönüş.', 'success');
                }
            }]
        });
    }

    function fasonDetail(no) {
        const x = S().subcontracts.find((s) => s.no === no);
        const moves = S().movements.filter((m) => m.ref === no);
        UI.modal({
            title: `${x.no} — ${x.supplierName}`, size: 'lg',
            body: `<dl class="dl card card-body" style="margin-bottom:14px;"><dt>Sevk</dt><dd>${esc(U.dateTime(x.sentAt))} · ${esc(x.by || '')}</dd><dt>Beklenen dönüş</dt><dd>${esc(U.date(U.parseDate(x.expectedAt)))}</dd><dt>Not</dt><dd>${esc(x.note || '–')}</dd></dl>
                <div class="table-wrap" style="margin-bottom:14px;"><table><thead><tr><th>Malzeme</th><th class="num">Sevk</th><th class="num">Dönen</th><th class="num">Fasonda</th></tr></thead><tbody>
                ${x.lines.map((l) => `<tr><td>${H.itemLink(l.kod)} ${esc(l.ad)}</td><td class="num">${esc(U.qty(l.qty, l.unit))}</td><td class="num">${esc(U.qty(l.returned || 0, l.unit))}</td><td class="num">${esc(U.qty(Math.max(0, l.qty - (l.returned || 0)), l.unit))}</td></tr>`).join('')}</tbody></table></div>
                <h3 style="font-size:.9em;margin-bottom:8px;">Hareketler ve lotlar</h3>
                <div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Kod</th><th>Yön</th><th class="num">Miktar</th><th>Lotlar</th></tr></thead><tbody>
                ${moves.map((m) => `<tr><td>${esc(U.dateTime(m.at))}</td><td class="mono">${esc(m.kod)}</td><td>${esc(m.loc)} → ${esc(m.toLoc)}</td><td class="num">${esc(U.qty(m.qty))}</td><td class="mono" style="font-size:.85em;">${esc((m.lots || []).map((l) => `${l.lot} (${U.qty(Math.abs(l.qty))})`).join(', '))}</td></tr>`).join('')}</tbody></table></div>`,
            buttons: [{ label: 'Kapat' }]
        });
    }

    // ---------------- Lot izlenebilirliği ----------------
    function renderLots() {
        const q = stockState.lotQ.trim().toLocaleLowerCase('tr');
        let html = `<div class="toolbar"><input class="input" id="lotSearch" placeholder="Lot no, malzeme kodu veya tedarikçi…" value="${esc(stockState.lotQ)}" data-input="lotSearch"></div>`;
        const lots = S().lots.filter((l) => !q || l.lot.toLocaleLowerCase('tr').includes(q) || l.kod.toLocaleLowerCase('tr').includes(q) || (l.supplier || '').toLocaleLowerCase('tr').includes(q))
            .sort((a, b) => b.at.localeCompare(a.at)).slice(0, 400);
        html += `<section class="card"><div class="table-wrap"><table><thead><tr><th>Lot</th><th>Kod</th><th>Malzeme</th><th>Lokasyon</th><th>Giriş</th><th>Tedarikçi / kaynak</th><th class="num">Kalan</th></tr></thead><tbody>
            ${lots.map((l) => { const it = M.item(l.kod) || { ad: '?', unit: '' }; return `<tr><td><button class="link mono" data-act="lotTrace" data-id="${esc(l.lot)}">${esc(l.lot)}</button></td><td>${H.anyLink(l.kod)}</td><td>${esc(it.ad)}</td>
                <td>${esc(locName(l.loc))}</td><td>${esc(U.date(l.at))}</td><td>${esc([l.supplier, l.ref].filter(Boolean).join(' · '))}</td><td class="num">${esc(U.qty(l.qty, it.unit))}</td></tr>`; }).join('')
                || `<tr><td colspan="7">${H.empty('Lot bulunamadı')}</td></tr>`}</tbody></table></div></section>
            <p class="muted" style="font-size:.78em;margin-top:10px;">Lot numarasına tıklayarak geriye (hangi tedarikçi/sipariş) ve ileriye (hangi iş emri ve mamul) izleme yapabilirsiniz.</p>`;
        return html;
    }

    function lotTrace(lot) {
        const moves = S().movements.filter((m) => (m.lots || []).some((l) => l.lot === lot)).sort((a, b) => a.at.localeCompare(b.at));
        const remaining = S().lots.filter((l) => l.lot === lot);
        const wos = [...new Set(moves.filter((m) => m.type === 'GI').map((m) => m.ref))];
        const products = wos.map((no) => S().workOrders.find((w) => w.no === no)).filter(Boolean);
        UI.modal({
            title: `Lot İzleme — ${lot}`, size: 'lg',
            body: `<div class="grid grid-2" style="margin-bottom:14px;">
                <dl class="dl card card-body"><dt>Kalan</dt><dd>${remaining.map((l) => `${esc(l.kod)} ${esc(U.qty(l.qty))} @ ${esc(locName(l.loc))}`).join('<br>') || '–'}</dd>
                    <dt>Kaynak</dt><dd>${esc([...new Set(remaining.concat(moves.filter((m) => m.qty > 0 && m.type !== 'TRF')).map((x) => x.supplier || x.ref).filter(Boolean))].join(', ') || '–')}</dd></dl>
                <dl class="dl card card-body"><dt>Kullanıldığı iş emirleri</dt><dd>${products.map((w) => `${esc(w.no)} → ${esc(w.kod)} × ${esc(U.qty(w.qty, 'ad'))}`).join('<br>') || '–'}</dd></dl></div>
                <div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Kod</th><th>Lokasyon</th><th>Belge</th><th class="num">Lot miktarı</th></tr></thead><tbody>
                ${moves.map((m) => { const lq = U.sum(m.lots.filter((l) => l.lot === lot), (l) => l.qty); return `<tr><td class="nowrap">${esc(U.dateTime(m.at))}</td><td><span class="badge ${M.MOVE_TYPES[m.type].badge}">${esc(M.MOVE_TYPES[m.type].label)}</span></td>
                    <td class="mono">${esc(m.kod)}</td><td>${esc(m.loc)}${m.toLoc ? ' → ' + esc(m.toLoc) : ''}</td><td class="mono">${esc(m.ref)}</td><td class="num ${m.type === 'TRF' ? '' : lq < 0 ? 'tp-neg' : 'tp-pos'}">${esc(U.qty(lq))}</td></tr>`; }).join('')
                    || '<tr><td colspan="6" class="muted">Bu lot için hareket yok (başlangıç/devir stoğu).</td></tr>'}</tbody></table></div>`,
            buttons: [{ label: 'Kapat' }]
        });
    }

    // ---------------- Barkod / hızlı arama ----------------
    function scanOpen() {
        let stream = null, timer = null;
        const hasCam = 'BarcodeDetector' in window && navigator.mediaDevices;
        const ctx = UI.modal({
            title: 'Barkod Okut / Hızlı Arama', size: 'md',
            body: `<div class="field"><label>Kod (el terminali veya klavye ile okutun, Enter)</label><input id="scIn" autocomplete="off" placeholder="HM.044 · PO-2026-0001 · IE-… · LOT-…"></div>
                ${hasCam ? `<button class="btn btn-secondary btn-sm" id="scCam" type="button" style="margin-top:10px;">Kamera ile okut</button><video id="scVid" playsinline muted style="width:100%;margin-top:10px;border-radius:8px;display:none;"></video>` : '<p class="muted" style="font-size:.78em;margin-top:8px;">Bu tarayıcıda kamera ile barkod okuma desteklenmiyor; USB/Bluetooth barkod okuyucu klavye gibi çalışır.</p>'}
                <div id="scOut" style="margin-top:14px;"></div>`,
            onClose: () => { if (timer) clearInterval(timer); if (stream) stream.getTracks().forEach((t) => t.stop()); },
            buttons: [{ label: 'Kapat' }]
        });
        const show = (code) => {
            code = String(code).trim().toUpperCase();
            const out = ctx.$('#scOut');
            const it = M.item(code);
            const po = S().pos.find((p) => p.no === code), wo = S().workOrders.find((w) => w.no === code);
            const lot = S().lots.find((l) => l.lot.toUpperCase() === code) || S().movements.find((m) => (m.lots || []).some((l) => l.lot.toUpperCase() === code));
            const act = (a, id, label, cls = 'btn-secondary') => `<button class="btn ${cls} btn-sm" data-act="${a}" data-id="${esc(id)}">${esc(label)}</button>`;
            if (it) {
                out.innerHTML = `<div class="card card-body"><b class="mono">${esc(it.kod)}</b> — ${esc(it.ad)}<div class="muted" style="font-size:.85em;margin:6px 0 10px;">Stok: ${LOCS().map((l) => `${esc(locName(l))} ${esc(U.qty(M.onHand(it.kod, l), it.unit))}`).join(' · ')}</div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">${act(it.isProduct ? 'productDetail' : 'itemDetail', it.kod, 'Detay')}${MRP.auth.can('adjustStock') && it.procurement !== 'service' ? act('stockAdjust', it.kod, 'Sayım') + act('stockTransfer', it.kod, 'Transfer') : ''}</div></div>`;
            } else if (po) {
                out.innerHTML = `<div class="card card-body"><b class="mono">${esc(po.no)}</b> — ${esc(po.supplierName)} ${H.badge(H.PO_STATUS, po.status)}<div style="display:flex;gap:6px;margin-top:10px;">${act('poDetail', po.no, 'Detay')}${(po.status === 'open' || po.status === 'partial') && MRP.auth.can('receiveGoods') ? act('poReceive', po.no, 'Mal Kabul', 'btn-success') : ''}</div></div>`;
            } else if (wo) {
                out.innerHTML = `<div class="card card-body"><b class="mono">${esc(wo.no)}</b> — ${esc(wo.ad)} × ${esc(U.qty(wo.qty, 'ad'))} ${H.badge(H.WO_STATUS, wo.status)}<div style="margin-top:10px;">${act('woDetail', wo.no, 'Detay')}</div></div>`;
            } else if (lot) {
                const l = lot.lot ? lot.lot : lot.lots.find((x) => x.lot.toUpperCase() === code).lot;
                out.innerHTML = `<div class="card card-body">Lot <b class="mono">${esc(l)}</b><div style="margin-top:10px;">${act('lotTrace', l, 'Lot izleme')}</div></div>`;
            } else out.innerHTML = H.empty('Kayıt bulunamadı', code);
        };
        ctx.$('#scIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') { show(e.target.value); e.target.select(); } });
        if (hasCam) ctx.$('#scCam').addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const v = ctx.$('#scVid'); v.srcObject = stream; v.style.display = 'block'; await v.play();
                const det = new window.BarcodeDetector();
                timer = setInterval(async () => {
                    try {
                        const r = await det.detect(v);
                        if (r.length) { ctx.$('#scIn').value = r[0].rawValue; show(r[0].rawValue); clearInterval(timer); timer = null; stream.getTracks().forEach((t) => t.stop()); v.style.display = 'none'; }
                    } catch (e) { /* kare atla */ }
                }, 400);
            } catch (e) { UI.toast('Kamera açılamadı', 'İzin verilmedi veya kamera yok.', 'error'); }
        });
    }

    const rerender = U.debounce(() => app().render(), 250);
    Object.assign(MRP.actions, {
        stockTab: (t) => { stockState.tab = t; app().render(); },
        stockSearch: (v) => { stockState.q = v; rerender(); },
        lotSearch: (v) => { stockState.lotQ = v; rerender(); },
        stockAdjust: (kod) => adjust(kod),
        stockTransfer: (kod) => transfer(kod),
        fasonNew, fasonReturn: (no) => fasonReturn(no), fasonDetail: (no) => fasonDetail(no),
        lotTrace: (lot) => lotTrace(lot),
        scanOpen
    });

    // =====================================================================
    // STOK HAREKETLERİ
    // =====================================================================
    const mvState = { type: 'all', q: '', page: 1, size: 100 };

    MRP.views.movements = {
        title: 'Stok Hareketleri',
        subtitle: 'Mal kabul, üretime sarf, üretimden giriş, transfer ve sayım düzeltmeleri',
        render() {
            const q = mvState.q.toLocaleLowerCase('tr');
            let list = S().movements.slice().reverse();
            if (mvState.type !== 'all') list = list.filter((m) => m.type === mvState.type);
            if (q) list = list.filter((m) => m.kod.toLocaleLowerCase('tr').includes(q) || (m.ref || '').toLocaleLowerCase('tr').includes(q)
                || ((M.item(m.kod) || {}).ad || '').toLocaleLowerCase('tr').includes(q) || (m.lots || []).some((l) => l.lot.toLocaleLowerCase('tr').includes(q)));
            const pages = Math.max(1, Math.ceil(list.length / mvState.size));
            mvState.page = Math.min(mvState.page, pages);
            const page = list.slice((mvState.page - 1) * mvState.size, mvState.page * mvState.size);
            return `<div class="toolbar">
                    <select class="input" data-change="mvType"><option value="all">Tüm hareketler</option>${Object.entries(M.MOVE_TYPES).map(([k, v]) => `<option value="${k}" ${mvState.type === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select>
                    <input class="input" id="mvSearch" placeholder="Kod, ad, belge veya lot no…" value="${esc(mvState.q)}" data-input="mvSearch">
                </div>
                <section class="card"><div class="table-wrap"><table>
                    <thead><tr><th>Hareket No</th><th>Tarih</th><th>Kod</th><th>Kalem</th><th>Tür</th><th>Lokasyon</th><th class="num">Miktar</th><th class="num">Bakiye</th><th class="num">Değer ₺</th><th>Lot</th><th>Belge</th><th>Kullanıcı</th><th>Açıklama</th></tr></thead>
                    <tbody>${page.map((m) => {
                        const it = M.item(m.kod) || { ad: '?', unit: '' };
                        return `<tr><td class="mono">${esc(m.id)}</td><td class="nowrap">${esc(U.dateTime(m.at))}</td><td>${H.anyLink(m.kod)}</td><td>${esc(it.ad)}</td>
                            <td><span class="badge ${M.MOVE_TYPES[m.type].badge}">${esc(M.MOVE_TYPES[m.type].label)}</span></td>
                            <td class="nowrap">${esc(m.loc || '')}${m.toLoc ? ' → ' + esc(m.toLoc) : ''}</td>
                            <td class="num ${m.type === 'TRF' ? '' : m.qty < 0 ? 'tp-neg' : 'tp-pos'}">${m.qty > 0 && m.type !== 'TRF' ? '+' : ''}${esc(U.qty(m.qty, it.unit))}</td>
                            <td class="num">${esc(U.qty(m.balance))}</td><td class="num">${U.num(m.value)}</td>
                            <td style="font-size:.85em;">${(m.lots || []).slice(0, 3).map((l) => `<button class="link mono" data-act="lotTrace" data-id="${esc(l.lot)}">${esc(l.lot)}</button>`).join(', ')}${(m.lots || []).length > 3 ? '…' : ''}</td>
                            <td class="mono">${esc(m.ref)}</td><td>${esc(m.user)}</td><td class="muted">${esc(m.note)}</td></tr>`;
                    }).join('') || `<tr><td colspan="13">${H.empty('Hareket bulunamadı')}</td></tr>`}</tbody>
                </table></div>${H.pager(list.length, mvState.page, mvState.size, 'mvPage')}</section>`;
        },
        after() {
            const el = document.getElementById('mvSearch');
            if (el && mvState.q) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };
    const rerenderMv = U.debounce(() => app().render(), 250);
    Object.assign(MRP.actions, {
        mvType: (v) => { mvState.type = v; mvState.page = 1; app().render(); },
        mvSearch: (v) => { mvState.q = v; mvState.page = 1; rerenderMv(); },
        mvPage: (p) => { mvState.page = +p; app().render(); }
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/capacity.js */
/* ==========================================================================
   MRP Pro — Kapasite Planlama (CRP): iş merkezleri, rota bazlı haftalık yük
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;

    // =====================================================================
    // Hesaplama
    // =====================================================================
    /** start–end arası iş günleri (Pzt–Cum); hiç yoksa başlangıç günü */
    function workDays(startIso, endIso) {
        const out = [];
        let d = U.parseDate(startIso);
        const end = U.parseDate(endIso < startIso ? startIso : endIso);
        while (d <= end && out.length < 400) {
            const wd = d.getDay();
            if (wd >= 1 && wd <= 5) out.push(new Date(d));
            d = U.addDays(d, 1);
        }
        return out.length ? out : [U.parseDate(startIso)];
    }

    /** Yükü oluşturan emirler: açık iş emirleri + (isteğe bağlı) MRP planlı üretim önerileri */
    function loadOrders(includePlanned, planned) {
        const orders = S().workOrders.filter((w) => w.status === 'planned' || w.status === 'released')
            .map((w) => ({ ref: w.no, kod: w.kod, ad: w.ad, qty: w.qty, start: w.start, end: w.end, kind: 'İş emri' }));
        const src = planned || (includePlanned && S().lastRun ? S().lastRun.planned : []);
        src.filter((p) => p.type === 'production').forEach((p) => orders.push({ ref: p.id, kod: p.kod, ad: p.ad, qty: p.qty, start: p.release, end: p.due, kind: 'MRP önerisi' }));
        return orders;
    }

    /**
     * Haftalık yük matrisi.
     * @returns {{weeks:{label,from}[], rows:{wc, capWeek, load:number[], orders:object[][]}[]}}
     */
    function compute({ includePlanned = true, planned = null, weeks = 8 } = {}) {
        const start = U.weekStart(U.today());
        const today = U.iso(U.today());
        const wks = [...Array(weeks)].map((_, i) => { const f = U.addDays(start, i * 7); return { from: U.iso(f), label: `H${U.isoWeek(f)}`, sub: U.date(f).slice(0, 5) }; });
        const rows = M.workCenters().map((wc) => ({ wc, capWeek: wc.capacity * wc.days, load: Array(weeks).fill(0), orders: [...Array(weeks)].map(() => []) }));
        const byWc = new Map(rows.map((r) => [r.wc.id, r]));
        loadOrders(includePlanned, planned).forEach((o) => {
            const days = workDays(o.start < today ? today : o.start, o.end < today ? today : o.end);
            M.routing(o.kod).forEach((op) => {
                const row = byWc.get(op.wc);
                if (!row) return;
                const perDay = M.opMinutes(op, o.qty) / days.length;
                days.forEach((d) => {
                    const i = Math.max(0, Math.floor(U.diffDays(d, start) / 7));
                    if (i >= weeks) return;
                    row.load[i] += perDay;
                    const ex = row.orders[i].find((x) => x.ref === o.ref);
                    if (ex) ex.min += perDay; else row.orders[i].push({ ...o, min: perDay });
                });
            });
        });
        return { weeks: wks, rows };
    }

    function summary(cap) {
        let peak = 0, over = 0, total = 0;
        cap.rows.forEach((r) => r.load.forEach((l) => {
            const pct = r.capWeek ? l / r.capWeek : 0;
            peak = Math.max(peak, pct); total += l;
            if (pct > 1) over++;
        }));
        return { peak, over, totalHours: total / 60 };
    }
    MRP.capacity = { compute, summary };

    // =====================================================================
    // Görünüm
    // =====================================================================
    const capState = { includePlanned: true };
    const heat = (pct) => (pct > 1 ? 'var(--red)' : pct > 0.85 ? 'var(--amber)' : pct > 0 ? 'var(--green)' : 'transparent');

    MRP.views.capacity = {
        title: 'Kapasite Planlama',
        subtitle: 'İş merkezi bazında haftalık yük — açık iş emirleri ve MRP üretim önerileri',
        render() {
            const cap = compute({ includePlanned: capState.includePlanned });
            const sm = summary(cap);
            const can = MRP.auth.can('manageCapacity');
            let html = `<div class="kpis">
                ${H.kpi('En Yüksek Doluluk', `%${U.num(sm.peak * 100, 0)}`, 'İş merkezi × hafta', sm.peak > 1 ? 'red' : sm.peak > 0.85 ? 'violet' : 'green')}
                ${H.kpi('Aşırı Yüklü Hücre', sm.over, 'Kapasitenin üzerinde', sm.over ? 'red' : 'green')}
                ${H.kpi('Toplam Yük', `${U.num(sm.totalHours, 0)} sa`, '8 hafta', 'blue')}
                ${H.kpi('İş Merkezi', M.workCenters().length, `${U.num(U.sum(S().workCenters, (w) => w.capacity * w.days) / 60, 0)} sa/hafta kapasite`, 'cyan')}
            </div>
            <div class="toolbar"><label class="check-chip"><input type="checkbox" data-change="capPlanned" ${capState.includePlanned ? 'checked' : ''}> MRP üretim önerilerini dahil et</label>
                <span class="muted" style="font-size:.8em;">${S().lastRun ? `Son MRP: ${esc(U.dateTime(S().lastRun.runAt))}` : 'MRP henüz çalıştırılmadı — yalnızca iş emirleri'}</span></div>`;
            if (sm.over) html += H.banner('red', 'alert', `${sm.over} haftada kapasite aşımı var`, 'İş emirlerini öne/arkaya kaydırın, vardiya ekleyin veya fasona yönlendirin. Hücreye tıklayarak yükü oluşturan emirleri görebilirsiniz.');

            html += H.card('Haftalık yük ısı haritası', 'Doluluk % ve saat · yeşil < %85 · sarı %85–100 · kırmızı > %100', `<div class="table-wrap"><table>
                <thead><tr><th>İş merkezi</th><th class="num">Kapasite/hf</th>${cap.weeks.map((w) => `<th class="num">${esc(w.label)}<br><span style="font-weight:500;text-transform:none;">${esc(w.sub)}</span></th>`).join('')}</tr></thead>
                <tbody>${cap.rows.map((r) => `<tr><td class="strong">${esc(r.wc.ad)} <span class="muted mono">${esc(r.wc.id)}</span></td><td class="num">${U.num(r.capWeek / 60, 0)} sa</td>
                    ${r.load.map((l, i) => {
                        const pct = r.capWeek ? l / r.capWeek : 0;
                        return `<td class="num" style="background:color-mix(in srgb, ${heat(pct)} ${Math.min(45, 12 + pct * 30)}%, transparent);cursor:${l ? 'pointer' : 'default'};" ${l ? `data-act="capCell" data-id="${esc(r.wc.id)}|${i}"` : ''}>
                            ${l ? `<b>%${U.num(pct * 100, 0)}</b><br><span class="muted" style="font-size:.85em;">${U.num(l / 60, 1)} sa</span>` : '<span class="muted">·</span>'}</td>`;
                    }).join('')}</tr>`).join('')}</tbody></table></div>`);

            html += '<div style="height:16px;"></div>' + H.card('İş merkezleri', 'Kapasite, verimlilik ve saatlik maliyet (işçilik maliyetine yansır)', `<div class="table-wrap"><table>
                <thead><tr><th>Kod</th><th>Ad</th><th class="num">Günlük kapasite</th><th class="num">Gün/hafta</th><th class="num">Verimlilik</th><th class="num">Saat ücreti</th><th></th></tr></thead>
                <tbody>${M.workCenters().map((w) => `<tr><td class="mono">${esc(w.id)}</td><td class="strong">${esc(w.ad)}</td><td class="num">${U.num(w.capacity, 0)} dk (${U.num(w.capacity / 60, 1)} sa)</td>
                    <td class="num">${w.days}</td><td class="num">%${w.efficiency}</td><td class="num">${U.cur(w.rate)}</td>
                    <td>${can || MRP.auth.can('editCost') ? `<button class="btn btn-ghost btn-sm" data-act="wcEdit" data-id="${esc(w.id)}" title="Düzenle">${MRP.icon('edit', 'sm')}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`,
                can ? `<button class="btn btn-secondary btn-sm" data-act="wcEdit">${MRP.icon('plus', 'sm')} İş merkezi ekle</button>` : '');
            return html;
        }
    };

    function cellDetail(id) {
        const [wcId, i] = id.split('|');
        const cap = compute({ includePlanned: capState.includePlanned });
        const row = cap.rows.find((r) => r.wc.id === wcId);
        const list = row.orders[+i].slice().sort((a, b) => b.min - a.min);
        UI.modal({
            title: `${row.wc.ad} — ${cap.weeks[+i].label} yükü`, size: 'lg',
            body: `<p class="muted" style="margin-bottom:12px;">Kapasite ${U.num(row.capWeek / 60, 1)} sa · Yük ${U.num(row.load[+i] / 60, 1)} sa (%${U.num(row.load[+i] / row.capWeek * 100, 0)})</p>
                <div class="table-wrap"><table><thead><tr><th>Emir</th><th>Tür</th><th>Kalem</th><th class="num">Miktar</th><th>Başlangıç</th><th>Bitiş</th><th class="num">Bu haftaki yük</th></tr></thead><tbody>
                ${list.map((o) => `<tr><td class="mono">${esc(o.ref)}</td><td>${esc(o.kind)}</td><td>${H.anyLink(o.kod)} ${esc(o.ad)}</td><td class="num">${esc(U.qty(o.qty, 'ad'))}</td>
                    <td>${esc(U.date(U.parseDate(o.start)))}</td><td>${esc(U.date(U.parseDate(o.end)))}</td><td class="num strong">${U.num(o.min / 60, 1)} sa</td></tr>`).join('')}</tbody></table></div>`,
            buttons: [{ label: 'Kapat' }]
        });
    }

    function editWc(id) {
        if (!MRP.auth.can('manageCapacity') && !MRP.auth.can('editCost')) return H.guard('manageCapacity');
        const isNew = !id;
        const w = isNew ? { id: '', ad: '', capacity: 480, days: 5, efficiency: 90, rate: 500 } : M.workCenter(id);
        const capOnly = !MRP.auth.can('manageCapacity');
        UI.modal({
            title: isNew ? 'Yeni İş Merkezi' : `İş Merkezi — ${w.id}`, size: 'md',
            body: `<div class="form-grid">
                <div class="field"><label>Kod <span class="req">*</span></label><input id="wcId" value="${esc(w.id)}" ${isNew ? '' : 'readonly'} maxlength="6"></div>
                <div class="field"><label>Ad <span class="req">*</span></label><input id="wcAd" value="${esc(w.ad)}" ${capOnly ? 'readonly' : ''}></div>
                <div class="field"><label>Günlük kapasite (dk)</label><input id="wcCap" type="number" min="1" step="1" value="${w.capacity}" ${capOnly ? 'readonly' : ''}><span class="hint">Örn. 2 kişi × 8 saat = 960 dk</span></div>
                <div class="field"><label>Çalışma günü / hafta</label><input id="wcDays" type="number" min="1" max="7" step="1" value="${w.days}" ${capOnly ? 'readonly' : ''}></div>
                <div class="field"><label>Verimlilik (%)</label><input id="wcEff" type="number" min="10" max="150" step="1" value="${w.efficiency}" ${capOnly ? 'readonly' : ''}></div>
                <div class="field"><label>Saat ücreti (₺)</label><input id="wcRate" type="number" min="0" step="0.01" value="${w.rate}"><span class="hint">İşçilik + makine; ürün maliyetine yansır.</span></div>
            </div>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Kaydet', cls: 'btn-primary', onClick: (ctx) => {
                    const data = {
                        id: ctx.$('#wcId').value.trim().toUpperCase(), ad: ctx.$('#wcAd').value.trim(),
                        capacity: Math.max(1, Math.round(U.toNum(ctx.$('#wcCap').value, 480))), days: Math.min(7, Math.max(1, Math.round(U.toNum(ctx.$('#wcDays').value, 5)))),
                        efficiency: Math.min(150, Math.max(10, Math.round(U.toNum(ctx.$('#wcEff').value, 90)))), rate: Math.max(0, U.toNum(ctx.$('#wcRate').value))
                    };
                    if (!data.id || !data.ad) { UI.toast('Kod ve ad zorunlu', '', 'warn'); return false; }
                    if (isNew) {
                        if (M.workCenter(data.id)) { UI.toast('Kod kullanımda', data.id, 'warn'); return false; }
                        S().workCenters.push(data);
                    } else Object.assign(w, data);
                    MRP.store.audit(isNew ? 'İş merkezi eklendi' : 'İş merkezi güncellendi', `${data.id}: ${data.capacity} dk/gün × ${data.days}, %${data.efficiency}, ${data.rate} ₺/sa`);
                    app().commit();
                    UI.toast('İş merkezi kaydedildi', data.id, 'success');
                }
            }]
        });
    }

    Object.assign(MRP.actions, {
        capPlanned: (_, el) => { capState.includePlanned = el.checked; app().render(); },
        capCell: (id) => cellDetail(id),
        wcEdit: (id) => editWc(id)
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/costing.js */
/* ==========================================================================
   MRP Pro — Maliyet & Kur: döviz kurları (canlı/elle), kur etkisi,
   malzeme fiyatlarının düzenlenmesi, toplu fiyat güncelleme, maliyet ayarları
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model, D = MRP.data;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;
    const FOREIGN = Object.keys(D.CURRENCIES).filter((c) => c !== 'TRY');

    // =====================================================================
    // Canlı kur
    // =====================================================================
    /**
     * Güncel kurları çeker (1 birim döviz = x TL). CORS destekleyen iki kaynak sırayla denenir.
     * Not: TCMB'nin today.xml servisi tarayıcıdan doğrudan erişime (CORS) izin vermez.
     */
    async function fetchRates() {
        const sources = [
            {
                name: 'Frankfurter (ECB referans kurları)',
                url: `https://api.frankfurter.app/latest?from=TRY&to=${FOREIGN.join(',')}`,
                parse: (j) => ({ rates: j.rates, date: j.date })
            },
            {
                name: 'ExchangeRate-API (open.er-api.com)',
                url: 'https://open.er-api.com/v6/latest/TRY',
                parse: (j) => ({ rates: j.rates, date: (j.time_last_update_utc || '').slice(5, 16) })
            }
        ];
        const errors = [];
        for (const src of sources) {
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 8000);
                const res = await fetch(src.url, { signal: ctrl.signal });
                clearTimeout(t);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const { rates, date } = src.parse(await res.json());
                const out = {};
                FOREIGN.forEach((c) => { if (rates && rates[c] > 0) out[c] = U.round(1 / rates[c], 4); });
                if (!Object.keys(out).length) throw new Error('kur bulunamadı');
                return { rates: out, source: src.name, date };
            } catch (e) { errors.push(`${src.name}: ${e.message}`); }
        }
        throw new Error(errors.join(' · '));
    }

    /** Yeni kurların ana ürünlerin birim maliyetine etkisi (kalıcı değişiklik yapmadan) */
    function impact(newRates) {
        const products = M.products().filter((p) => !p.synthetic);
        const before = new Map(products.map((p) => [p.kod, M.unitCost(p.kod)]));
        const old = { ...S().fx.rates };
        S().fx.rates = { ...old, ...newRates };
        M.invalidate();
        const rows = products.map((p) => ({ p, before: before.get(p.kod), after: M.unitCost(p.kod) }));
        const stockAfter = M.stockValue();
        S().fx.rates = old;
        M.invalidate();
        const stockBefore = M.stockValue();
        rows.forEach((r) => { r.diff = r.after - r.before; r.pct = r.before ? r.diff / r.before * 100 : 0; });
        rows.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
        return { rows, stockBefore, stockAfter, avgPct: U.sum(rows, (r) => r.pct) / (rows.length || 1) };
    }

    function confirmRates(newRates, source, date) {
        const imp = impact(newRates);
        const cur = S().fx.rates;
        UI.modal({
            title: 'Kur güncellemesi — maliyet etkisi', size: 'lg',
            body: `<div class="table-wrap" style="margin-bottom:14px;"><table><thead><tr><th>Döviz</th><th class="num">Mevcut</th><th class="num">Yeni</th><th class="num">Değişim</th></tr></thead><tbody>
                ${FOREIGN.map((c) => { const a = cur[c], b = newRates[c] ?? a; const d = a ? (b - a) / a * 100 : 0; return `<tr><td class="strong">${c} ${esc(D.CURRENCIES[c].name)}</td><td class="num">${U.num(a, 4)}</td><td class="num strong">${U.num(b, 4)}</td>
                    <td class="num ${d > 0 ? 'tp-neg' : d < 0 ? 'tp-pos' : ''}">${d > 0 ? '+' : ''}${U.num(d, 2)}%</td></tr>`; }).join('')}</tbody></table></div>
                <dl class="dl card card-body" style="margin-bottom:14px;"><dt>Kaynak</dt><dd>${esc(source)}${date ? ` · ${esc(date)}` : ''}</dd>
                    <dt>Stok değeri</dt><dd>${U.cur(imp.stockBefore)} → ${U.cur(imp.stockAfter)}</dd>
                    <dt>Ana ürünlerde ort. maliyet değişimi</dt><dd>${imp.avgPct > 0 ? '+' : ''}${U.num(imp.avgPct, 2)}%</dd></dl>
                <h3 style="font-size:.9em;margin-bottom:8px;">En çok etkilenen ürünler</h3>
                <div class="table-wrap" style="max-height:280px;"><table><thead><tr><th>Kod</th><th>Ürün</th><th class="num">Önce</th><th class="num">Sonra</th><th class="num">Fark</th></tr></thead><tbody>
                ${imp.rows.slice(0, 15).map((r) => `<tr><td class="mono">${esc(r.p.kod)}</td><td>${esc(r.p.ad)}</td><td class="num">${U.num(r.before)}</td><td class="num">${U.num(r.after)}</td>
                    <td class="num ${r.diff > 0 ? 'tp-neg' : r.diff < 0 ? 'tp-pos' : ''}">${r.diff > 0 ? '+' : ''}${U.num(r.pct, 2)}%</td></tr>`).join('')}</tbody></table></div>`,
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Kurları Uygula', cls: 'btn-primary', icon: 'check', onClick: () => {
                    const fx = S().fx;
                    fx.rates = { ...fx.rates, ...newRates };
                    fx.updatedAt = new Date().toISOString();
                    fx.source = source;
                    fx.history.push({ at: fx.updatedAt, rates: { ...fx.rates }, source, by: MRP.auth.current().name });
                    MRP.store.audit('Döviz kurları güncellendi', `${FOREIGN.map((c) => `${c} ${fx.rates[c]}`).join(', ')} (${source})`);
                    app().commit();
                    UI.toast('Kurlar güncellendi', 'Tüm maliyetler yeni kurla hesaplanıyor.', 'success');
                }
            }]
        });
    }

    // =====================================================================
    // Görünüm
    // =====================================================================
    const cState = { type: 'all', cur: 'all', q: '', dirty: {} };

    MRP.views.costing = {
        title: 'Maliyet & Kur',
        subtitle: 'Döviz kurları, malzeme fiyatları ve maliyet parametreleri',
        render() {
            const fx = S().fx;
            const canEdit = MRP.auth.can('editCost');
            const items = M.items().filter((i) => i.procurement !== 'make');
            const stockByCur = {};
            items.forEach((i) => { const q = M.onHand(i.kod); if (q > 0) stockByCur[i.currency] = (stockByCur[i.currency] || 0) + q * M.priceTRY(i.kod); });
            const totalStock = U.sum(Object.values(stockByCur));
            const foreignShare = totalStock ? (totalStock - (stockByCur.TRY || 0)) / totalStock : 0;
            const age = fx.updatedAt ? Math.floor((Date.now() - new Date(fx.updatedAt)) / 86400000) : null;

            let html = '';
            if (age === null) html += H.banner('amber', 'alert', 'Kurlar varsayılan (demo) değerlerde', 'Maliyetlerin doğru hesaplanması için güncel kuru çekin veya elle girin.',
                canEdit ? `<button class="btn btn-primary btn-sm" data-act="fxFetch">${MRP.icon('refresh', 'sm')} Güncel kuru çek</button>` : '');
            else if (age >= 1) html += H.banner('blue', 'info', `Kurlar ${age} gün önce güncellendi`, `${fx.source} · ${U.dateTime(fx.updatedAt)}`,
                canEdit ? `<button class="btn btn-secondary btn-sm" data-act="fxFetch">${MRP.icon('refresh', 'sm')} Güncelle</button>` : '');

            html += `<div class="kpis">
                ${FOREIGN.map((c) => H.kpi(`${c}/TRY`, U.num(fx.rates[c], 4), fx.updatedAt ? U.date(fx.updatedAt) : 'Varsayılan', c === 'USD' ? 'green' : c === 'EUR' ? 'blue' : 'cyan')).join('')}
                ${H.kpi('Dövizli Stok Payı', `%${U.num(foreignShare * 100, 1)}`, U.compactCur(totalStock - (stockByCur.TRY || 0)), 'violet')}
            </div>`;

            // Kur kartı + maliyet ayarları
            html += `<div class="grid grid-2">
                ${H.card('Döviz kurları', `Kaynak: ${fx.source}`, `<div class="card-body">
                    <div class="form-grid">${FOREIGN.map((c) => `<div class="field"><label>1 ${c} (${esc(D.CURRENCIES[c].name)}) = ₺</label>
                        <input type="number" min="0" step="0.0001" id="fx_${c}" value="${fx.rates[c]}" ${canEdit ? '' : 'readonly'}></div>`).join('')}</div>
                    ${canEdit ? `<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
                        <button class="btn btn-primary" data-act="fxFetch">${MRP.icon('refresh')} Güncel kuru çek</button>
                        <button class="btn btn-secondary" data-act="fxManual">Elle girilen kurları uygula</button></div>
                        <p class="muted" style="font-size:.76em;margin-top:10px;">Canlı kur, ECB referans kurlarından (Frankfurter) alınır; erişilemezse ExchangeRate-API denenir. Resmî muhasebe için TCMB döviz satış kurunu elle girebilirsiniz.</p>` : ''}
                </div>`)}
                ${H.card('Maliyet parametreleri', 'Standart maliyet = (malzeme + işçilik) × (1 + genel gider)', `<div class="card-body">
                    <div class="form-grid">
                        <div class="field"><label>Genel gider oranı (%)</label><input type="number" min="0" max="200" step="0.5" id="cOverhead" value="${S().costing.overheadPct}" ${canEdit ? '' : 'readonly'}></div>
                        <div class="field"><label>Standart parti (adet)</label><input type="number" min="1" step="1" id="cStdLot" value="${S().costing.stdLot}" ${canEdit ? '' : 'readonly'}><span class="hint">Hazırlık süreleri bu partiye yayılır.</span></div>
                        <div class="field full"><label class="check-chip" style="text-transform:none;letter-spacing:0;font-size:.95em;justify-content:flex-start;color:var(--text);font-weight:500;"><input type="checkbox" id="cLabor" ${S().costing.includeLabor ? 'checked' : ''} ${canEdit ? '' : 'disabled'}> İşçilik maliyetini dahil et (rota × iş merkezi saat ücreti)</label></div>
                    </div>
                    ${canEdit ? `<button class="btn btn-primary" data-act="costingSave" style="margin-top:12px;">Parametreleri kaydet</button>` : ''}
                    <p class="muted" style="font-size:.76em;margin-top:10px;">İş merkezi saat ücretleri <a href="#/capacity">Kapasite Planlama</a> ekranından düzenlenir.</p>
                </div>`)}
            </div><div style="height:16px;"></div>`;

            // Fiyat tablosu (satır içi düzenleme)
            const types = [...new Set(items.map((i) => i.tur))].sort();
            const q = cState.q.toLocaleLowerCase('tr');
            const list = items.filter((i) => (cState.type === 'all' || i.tur === cState.type) && (cState.cur === 'all' || i.currency === cState.cur)
                && (!q || i.kod.toLocaleLowerCase('tr').includes(q) || i.ad.toLocaleLowerCase('tr').includes(q)));
            const nDirty = Object.keys(cState.dirty).length;
            html += H.card('Malzeme fiyatları', canEdit ? 'Fiyat ve para birimini doğrudan tabloda değiştirip kaydedin' : '', `
                <div class="card-body" style="padding-bottom:0;"><div class="toolbar">
                    <select class="input" data-change="cType"><option value="all">Tüm türler</option>${types.map((t) => `<option ${cState.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
                    <select class="input" data-change="cCur"><option value="all">Tüm para birimleri</option>${Object.keys(D.CURRENCIES).map((c) => `<option ${cState.cur === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
                    <input class="input" id="cSearch" placeholder="Kod veya ad…" value="${esc(cState.q)}" data-input="cSearch">
                    <span class="spacer"></span>
                    ${canEdit ? `<button class="btn btn-secondary" data-act="bulkPrice">Toplu fiyat güncelle</button>
                        <button class="btn btn-primary" data-act="priceSave" ${nDirty ? '' : 'disabled'}>${MRP.icon('check')} Değişiklikleri kaydet (${nDirty})</button>` : ''}
                </div></div>
                <div class="table-wrap"><table><thead><tr><th>Kod</th><th>Malzeme</th><th>Tür</th><th class="num">Birim fiyat</th><th>Para birimi</th><th class="num">TL karşılığı</th><th class="num">En iyi teklif</th><th class="num">Son alış</th></tr></thead>
                <tbody>${list.map((i) => {
                    const d = cState.dirty[i.kod] || {};
                    const price = d.price ?? i.price, cur = d.currency ?? i.currency;
                    const best = M.offers(i.kod)[0];
                    const hist = M.priceHistory(i.kod);
                    const last = hist[hist.length - 1];
                    return `<tr class="${cState.dirty[i.kod] ? 'r-warn' : ''}"><td>${H.itemLink(i.kod)}</td><td class="strong">${esc(i.ad)}</td><td><span class="badge badge-gray plain">${esc(i.tur)}</span></td>
                        <td class="num">${canEdit ? `<input class="input input-sm" type="number" min="0" step="any" value="${U.round(price, 4)}" style="width:120px;text-align:right;" data-change="priceEdit" data-id="${esc(i.kod)}"> <span class="muted">/${esc(i.unit)}</span>` : `${U.num(price, 4)} /${esc(i.unit)}`}</td>
                        <td>${canEdit ? `<select class="input input-sm" data-change="curEdit" data-id="${esc(i.kod)}" style="width:80px;">${Object.keys(D.CURRENCIES).map((c) => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}</select>` : esc(cur)}</td>
                        <td class="num strong">${U.num(price * M.fxRate(cur), 2)}</td>
                        <td class="num">${best ? `${U.num(best.priceTRY, 2)} <span class="muted" title="${esc(best.supplier.ad)}">${esc(best.supplier.id)}</span>` : '<span class="muted">–</span>'}</td>
                        <td class="num">${last ? `${U.num(last.price, 2)} <span class="muted">${esc(U.date(last.at))}</span>` : '<span class="muted">–</span>'}</td></tr>`;
                }).join('') || `<tr><td colspan="8">${H.empty('Kayıt yok')}</td></tr>`}</tbody></table></div>`);

            // Kur geçmişi
            if (fx.history.length) {
                html += '<div style="height:16px;"></div>' + H.card('Kur geçmişi', '', `<div class="table-wrap" style="max-height:260px;"><table><thead><tr><th>Tarih</th>${FOREIGN.map((c) => `<th class="num">${c}</th>`).join('')}<th>Kaynak</th><th>Kullanıcı</th></tr></thead><tbody>
                    ${fx.history.slice().reverse().map((h) => `<tr><td class="nowrap">${esc(U.dateTime(h.at))}</td>${FOREIGN.map((c) => `<td class="num">${U.num(h.rates[c], 4)}</td>`).join('')}<td>${esc(h.source)}</td><td>${esc(h.by)}</td></tr>`).join('')}
                    </tbody></table></div>`);
            }
            return html;
        },
        after() {
            const el = document.getElementById('cSearch');
            if (el && cState.q) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };

    function bulkPrice() {
        if (!H.guard('editCost')) return;
        const items = M.items().filter((i) => i.procurement !== 'make');
        const types = [...new Set(items.map((i) => i.tur))].sort();
        UI.modal({
            title: 'Toplu Fiyat Güncelleme', size: 'md',
            body: `<div class="form-grid">
                <div class="field"><label>Malzeme türü</label><select id="bpType"><option value="all">Tümü</option>${types.map((t) => `<option>${esc(t)}</option>`).join('')}</select></div>
                <div class="field"><label>Para birimi</label><select id="bpCur"><option value="all">Tümü</option>${Object.keys(D.CURRENCIES).map((c) => `<option>${c}</option>`).join('')}</select></div>
                <div class="field"><label>Değişim (%)</label><input id="bpPct" type="number" step="0.1" value="5"><span class="hint">Zam için pozitif, indirim için negatif.</span></div>
                <div class="field"><label>Fiyat listesine de uygula</label><select id="bpList"><option value="1">Evet — tedarikçi teklifleri de güncellensin</option><option value="0">Hayır</option></select></div>
            </div><p id="bpPrev" class="muted" style="margin-top:12px;font-size:.86em;"></p>`,
            onOpen: (ctx) => {
                const upd = () => {
                    const sel = items.filter((i) => (ctx.$('#bpType').value === 'all' || i.tur === ctx.$('#bpType').value) && (ctx.$('#bpCur').value === 'all' || i.currency === ctx.$('#bpCur').value));
                    ctx.$('#bpPrev').textContent = `${sel.length} malzeme etkilenecek.`;
                };
                ['#bpType', '#bpCur'].forEach((s) => ctx.$(s).addEventListener('change', upd)); upd();
            },
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Uygula', cls: 'btn-primary', onClick: (ctx) => {
                    const pct = U.toNum(ctx.$('#bpPct').value);
                    if (!pct || pct <= -100) { UI.toast('Geçersiz oran', '', 'warn'); return false; }
                    const t = ctx.$('#bpType').value, c = ctx.$('#bpCur').value;
                    const sel = items.filter((i) => (t === 'all' || i.tur === t) && (c === 'all' || i.currency === c));
                    const f = 1 + pct / 100;
                    sel.forEach((i) => setPrice(i.kod, { price: U.round(i.price * f, 4) }));
                    if (ctx.$('#bpList').value === '1') {
                        const set = new Set(sel.map((i) => i.kod));
                        S().priceList.forEach((o) => { if (set.has(o.kod)) { o.price = U.round(o.price * f, 4); o.updatedAt = new Date().toISOString(); } });
                    }
                    MRP.store.audit('Toplu fiyat güncelleme', `${sel.length} malzeme, %${pct} (${t === 'all' ? 'tüm türler' : t}, ${c === 'all' ? 'tüm dövizler' : c})`);
                    app().commit();
                    UI.toast('Fiyatlar güncellendi', `${sel.length} malzeme · %${pct}`, 'success');
                }
            }]
        });
    }

    /** Malzeme fiyat/para birimi değişikliği (özel kalemde doğrudan, standart kalemde override) */
    function setPrice(kod, ch) {
        if (S().customItems[kod]) Object.assign(S().customItems[kod], ch);
        else S().itemOverrides[kod] = { ...(S().itemOverrides[kod] || {}), ...ch };
    }
    MRP.costing = { setPrice, fetchRates };

    const rerender = U.debounce(() => app().render(), 250);
    Object.assign(MRP.actions, {
        fxFetch: async (_, el) => {
            if (!H.guard('editCost')) return;
            if (el) el.disabled = true;
            UI.toast('Kurlar alınıyor…', '', 'info', 2000);
            try {
                const r = await fetchRates();
                confirmRates(r.rates, r.source, r.date);
            } catch (e) {
                UI.toast('Güncel kur alınamadı', 'İnternet bağlantısını kontrol edin veya kurları elle girin.', 'error', 6000);
                console.warn(e);
            } finally { if (el) el.disabled = false; }
        },
        fxManual: () => {
            if (!H.guard('editCost')) return;
            const rates = {};
            for (const c of FOREIGN) {
                const v = U.toNum(document.getElementById('fx_' + c).value);
                if (!(v > 0)) return UI.toast('Geçersiz kur', c, 'warn');
                rates[c] = v;
            }
            confirmRates(rates, 'Elle giriş', U.date(new Date()));
        },
        costingSave: () => {
            if (!H.guard('editCost')) return;
            const c = S().costing;
            c.overheadPct = Math.min(200, Math.max(0, U.toNum(document.getElementById('cOverhead').value, 10)));
            c.stdLot = Math.max(1, Math.round(U.toNum(document.getElementById('cStdLot').value, 20)));
            c.includeLabor = document.getElementById('cLabor').checked;
            MRP.store.audit('Maliyet parametreleri güncellendi', `Genel gider %${c.overheadPct}, std. parti ${c.stdLot}, işçilik ${c.includeLabor ? 'dahil' : 'hariç'}`);
            app().commit();
            UI.toast('Parametreler kaydedildi', '', 'success');
        },
        cType: (v) => { cState.type = v; app().render(); },
        cCur: (v) => { cState.cur = v; app().render(); },
        cSearch: (v) => { cState.q = v; rerender(); },
        priceEdit: (v, el) => { const n = U.toNum(v, NaN); if (!(n >= 0)) return UI.toast('Geçersiz fiyat', '', 'warn'); (cState.dirty[el.dataset.id] = cState.dirty[el.dataset.id] || {}).price = n; app().render(); },
        curEdit: (v, el) => { (cState.dirty[el.dataset.id] = cState.dirty[el.dataset.id] || {}).currency = v; app().render(); },
        priceSave: () => {
            if (!H.guard('editCost')) return;
            const entries = Object.entries(cState.dirty);
            entries.forEach(([kod, ch]) => setPrice(kod, ch));
            MRP.store.audit('Malzeme fiyatları güncellendi', entries.map(([k, ch]) => `${k}: ${ch.price ?? ''} ${ch.currency ?? ''}`.trim()).join('; ').slice(0, 500));
            cState.dirty = {};
            app().commit();
            UI.toast('Fiyatlar kaydedildi', `${entries.length} malzeme`, 'success');
        },
        bulkPrice
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/analysis.js */
/* ==========================================================================
   MRP Pro — Analizler: maliyet sapması, ABC, stok devir hızı / ölü stok,
   kur riski ve senaryo (what-if) analizi
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model, D = MRP.data;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;

    const aState = { tab: 'variance', threshold: 15, cat: 'all', abcBasis: 'demand', scenario: [], scenarioResult: null };

    MRP.views.analysis = {
        title: 'Analizler',
        subtitle: 'Maliyet sapması, ABC sınıflandırma, stok devir hızı, kur riski ve senaryo analizi',
        render() {
            const tabs = [['variance', 'Maliyet Sapması'], ['abc', 'ABC Analizi'], ['turnover', 'Stok Devir / Ölü Stok'], ['fx', 'Kur Riski'], ['scenario', 'Senaryo (What-if)']];
            let html = H.tabs(tabs.map(([a, b]) => [a, b, null]), aState.tab, 'anTab');
            if (aState.tab === 'variance') html += variance();
            else if (aState.tab === 'abc') html += abc();
            else if (aState.tab === 'turnover') html += turnover();
            else if (aState.tab === 'fx') html += fxRisk();
            else html += scenario();
            return html;
        }
    };

    // ---------------- Maliyet sapması ----------------
    function variance() {
        const rows = M.products().filter((p) => !p.synthetic && p.toplam > 0 && (aState.cat === 'all' || p.kategori === aState.cat))
            .map((p) => { const mat = M.materialCost(p.kod); return { p, mat, pct: (mat - p.toplam) / p.toplam * 100, std: M.unitCost(p.kod) }; })
            .filter((r) => Math.abs(r.pct) >= aState.threshold)
            .sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
        return `<div class="toolbar">
                <select class="input" data-change="anCat"><option value="all">Tüm kategoriler</option>${D.CATEGORIES.map((c) => `<option ${aState.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
                <label class="muted" style="font-size:.85em;">Eşik %</label><input class="input" type="number" min="0" step="1" value="${aState.threshold}" style="width:90px;min-width:0;" data-change="anThr">
            </div>
            ${H.banner('blue', 'info', `${rows.length} ana üründe malzeme maliyeti kayıtlı maliyetten %${aState.threshold}+ sapıyor`, 'Kayıtlı maliyet ERP referansıdır (malzeme + fason). Büyük sapmalar eksik/hatalı reçete satırı, güncellenmemiş fiyat veya kur değişimini gösterir.')}
            <section class="card"><div class="table-wrap"><table><thead><tr><th>Kod</th><th>Ürün</th><th>Kategori</th><th class="num">Kayıtlı ₺</th><th class="num">BOM malzeme ₺</th><th class="num">Sapma</th><th class="num">Standart maliyet ₺</th></tr></thead><tbody>
            ${rows.map((r) => `<tr><td>${H.productLink(r.p.kod)}</td><td class="strong">${esc(r.p.ad)}</td><td>${H.catTag(r.p.kategori)}</td><td class="num">${U.num(r.p.toplam)}</td><td class="num">${U.num(r.mat)}</td>
                <td class="num ${r.pct > 0 ? 'tp-neg' : 'tp-pos'}">${r.pct > 0 ? '+' : ''}${U.num(r.pct, 1)}%</td><td class="num">${U.num(r.std)}</td></tr>`).join('') || `<tr><td colspan="7">${H.empty('Eşiği aşan sapma yok')}</td></tr>`}
            </tbody></table></div></section>`;
    }

    // ---------------- ABC ----------------
    function consumption(days) {
        const from = U.addDays(U.today(), -days).toISOString();
        const map = {};
        S().movements.filter((m) => m.type === 'GI' && m.at >= from).forEach((m) => { map[m.kod] = (map[m.kod] || 0) - m.qty; });
        return map;
    }
    function abcRows(basis) {
        const run = S().lastRun;
        const cons = consumption(90);
        const items = M.items().filter((i) => i.procurement !== 'service');
        const val = (i) => {
            const p = i.procurement === 'make' ? M.unitCost(i.kod) : M.priceTRY(i.kod);
            if (basis === 'stock') return Math.max(0, M.onHand(i.kod)) * p;
            if (basis === 'consumption') return (cons[i.kod] || 0) * p;
            const rec = run && run.records[i.kod];
            return rec ? U.sum(rec.gross, (g) => g.qty) * p : 0;
        };
        const rows = items.map((i) => ({ i, v: val(i) })).filter((r) => r.v > 0).sort((a, b) => b.v - a.v);
        const total = U.sum(rows, (r) => r.v);
        let cum = 0;
        rows.forEach((r) => { cum += r.v; r.cumPct = total ? cum / total : 0; r.cls = r.cumPct <= 0.8 || r === rows[0] ? 'A' : r.cumPct <= 0.95 ? 'B' : 'C'; });
        return { rows, total };
    }
    function abc() {
        const { rows, total } = abcRows(aState.abcBasis);
        const by = (c) => rows.filter((r) => r.cls === c);
        const basisLabel = { demand: 'MRP brüt ihtiyaç değeri', stock: 'Stok değeri', consumption: 'Son 90 gün sarf değeri' };
        const noData = aState.abcBasis === 'demand' && !S().lastRun;
        return `<div class="toolbar"><select class="input" data-change="anAbc">${Object.entries(basisLabel).map(([k, v]) => `<option value="${k}" ${aState.abcBasis === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
            ${noData ? H.banner('amber', 'alert', 'MRP sonucu yok', 'Bu ölçüt için önce MRP çalıştırın veya başka ölçüt seçin.') : ''}
            <div class="kpis">${['A', 'B', 'C'].map((c, i) => H.kpi(`${c} sınıfı`, `${by(c).length} kalem`, `${U.compactCur(U.sum(by(c), (r) => r.v))} · %${total ? U.num(U.sum(by(c), (r) => r.v) / total * 100, 1) : 0}`, ['red', 'violet', 'green'][i])).join('')}
                ${H.kpi('Toplam', U.compactCur(total), basisLabel[aState.abcBasis], 'blue')}</div>
            <p class="muted" style="font-size:.8em;margin-bottom:10px;">A: değerin ilk %80'i — sıkı takip, sık sayım, çoklu tedarikçi · B: sonraki %15 · C: son %5 — basit kontrol, toplu sipariş.</p>
            <section class="card"><div class="table-wrap"><table><thead><tr><th>Sınıf</th><th>Kod</th><th>Malzeme</th><th>Tür</th><th class="num">Değer ₺</th><th class="num">Kümülatif</th></tr></thead><tbody>
            ${rows.map((r) => `<tr><td><span class="badge ${r.cls === 'A' ? 'badge-red' : r.cls === 'B' ? 'badge-violet' : 'badge-green'} plain">${r.cls}</span></td><td>${H.itemLink(r.i.kod)}</td><td class="strong">${esc(r.i.ad)}</td>
                <td><span class="badge badge-gray plain">${esc(r.i.tur)}</span></td><td class="num">${U.num(r.v)}</td><td class="num">%${U.num(r.cumPct * 100, 1)}</td></tr>`).join('') || `<tr><td colspan="6">${H.empty('Veri yok')}</td></tr>`}
            </tbody></table></div></section>`;
    }

    // ---------------- Stok devir / ölü stok ----------------
    function turnover() {
        const run = S().lastRun;
        const cons = consumption(90);
        const horizon = 84;
        const rows = M.items().filter((i) => i.procurement !== 'service').map((i) => {
            const oh = M.onHand(i.kod);
            const used90 = cons[i.kod] || 0;
            const rec = run && run.records[i.kod];
            const planned = rec ? U.sum(rec.gross.filter((g) => U.diffDays(g.date, U.today()) <= horizon), (g) => g.qty) : 0;
            const daily = used90 > 0 ? used90 / 90 : planned / horizon;
            const p = i.procurement === 'make' ? M.unitCost(i.kod) : M.priceTRY(i.kod);
            return { i, oh, used90, planned, daily, cover: daily > 0 ? oh / daily : (oh > 0 ? Infinity : 0), turns: oh > 0 && daily > 0 ? daily * 365 / oh : 0, value: Math.max(0, oh) * p };
        }).filter((r) => r.oh > 0);
        const dead = rows.filter((r) => r.daily === 0);
        const excess = rows.filter((r) => r.cover !== Infinity && r.cover > 180);
        rows.sort((a, b) => (b.cover === Infinity ? 1e9 : b.cover) - (a.cover === Infinity ? 1e9 : a.cover));
        return `<div class="kpis">
                ${H.kpi('Hareketsiz Stok', `${dead.length} kalem`, U.compactCur(U.sum(dead, (r) => r.value)), dead.length ? 'red' : 'green')}
                ${H.kpi('Fazla Stok (>180 gün)', `${excess.length} kalem`, U.compactCur(U.sum(excess, (r) => r.value)), excess.length ? 'violet' : 'green')}
                ${H.kpi('Stoklu Kalem', rows.length, U.compactCur(U.sum(rows, (r) => r.value)), 'blue')}
            </div>
            <p class="muted" style="font-size:.8em;margin-bottom:10px;">Günlük kullanım: son 90 gün sarf; sarf yoksa MRP'deki önümüzdeki 12 haftanın brüt ihtiyacı. Kullanımı olmayan stok "hareketsiz" sayılır.</p>
            <section class="card"><div class="table-wrap"><table><thead><tr><th>Kod</th><th>Malzeme</th><th class="num">Eldeki</th><th class="num">90 gün sarf</th><th class="num">Günlük kullanım</th><th class="num">Yeterlilik (gün)</th><th class="num">Yıllık devir</th><th class="num">Değer ₺</th><th>Durum</th></tr></thead><tbody>
            ${rows.map((r) => `<tr><td>${H.itemLink(r.i.kod)}</td><td class="strong">${esc(r.i.ad)}</td><td class="num">${esc(U.qty(r.oh, r.i.unit))}</td><td class="num">${esc(U.qty(r.used90))}</td>
                <td class="num">${U.num(r.daily, 2)}</td><td class="num">${r.cover === Infinity ? '∞' : U.num(r.cover, 0)}</td><td class="num">${r.turns ? U.num(r.turns, 1) : '–'}</td><td class="num">${U.num(r.value)}</td>
