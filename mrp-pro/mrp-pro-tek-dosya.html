<script>
/* assets/js/model.js */
/* ==========================================================================
   MRP Pro — İş modeli: ürünler, malzeme kartları, ürün ağacı, rotalar,
   döviz/maliyet, lot tabanlı çoklu lokasyon stoğu, fiyat listesi
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U;
    const D = MRP.data;
    const S = () => MRP.store.state;
    const EPS = 1e-9;

    let staticProducts = [];
    let baseItems = {};
    let cache = {};

    const MOVE_TYPES = {
        GR: { label: 'Mal Kabul', badge: 'badge-green' },
        GI: { label: 'Üretime Sarf', badge: 'badge-amber' },
        FG: { label: 'Üretimden Giriş', badge: 'badge-blue' },
        ADJ: { label: 'Sayım Düzeltme', badge: 'badge-violet' },
        TRF: { label: 'Transfer', badge: 'badge-cyan' }
    };
    const PROCUREMENT = { buy: 'Satın Alma', make: 'Üretim', service: 'Fason / Hizmet' };
    const LOT_POLICIES = { L4L: 'Lot-for-Lot (ihtiyaç kadar)', FOQ: 'Sabit Parti (katları)', MIN: 'Minimum Sipariş' };

    const M = { MOVE_TYPES, PROCUREMENT, LOT_POLICIES, LOCATIONS: D.LOCATIONS };

    M.init = () => {
        staticProducts = D.buildProducts();
        baseItems = D.buildItemMaster();
        M.invalidate();
    };
    M.invalidate = () => { cache = {}; };

    // ======================================================================
    // Döviz
    // ======================================================================
    M.fxRate = (cur) => (!cur || cur === 'TRY' ? 1 : (S().fx.rates[cur] || D.DEFAULT_FX[cur] || 1));
    M.toTRY = (amount, cur) => amount * M.fxRate(cur);
    M.fmtMoney = (amount, cur) => (cur && cur !== 'TRY' ? `${U.num(amount, 2)} ${D.CURRENCIES[cur].symbol}` : U.cur(amount));

    // ======================================================================
    // Ürünler
    // ======================================================================
    M.products = () => {
        if (!cache.products) {
            const ov = S().productOverrides;
            cache.products = [
                ...staticProducts.map((p) => (ov[p.kod] ? { ...p, ...ov[p.kod] } : p)),
                ...S().customProducts.map((p) => ({ ...p, custom: true }))
            ];
            cache.productIndex = new Map(cache.products.map((p) => [p.kod, p]));
        }
        return cache.products;
    };
    M.product = (kod) => { M.products(); return cache.productIndex.get(kod) || null; };
    M.isProduct = (kod) => !!M.product(kod);

    // ======================================================================
    // Malzeme kartları
    // ======================================================================
    M.items = () => {
        if (!cache.items) {
            const all = { ...baseItems, ...S().customItems };
            cache.items = Object.values(all)
                .map((it) => ({ currency: 'TRY', ...it, ...(S().itemOverrides[it.kod] || {}) }))
                .sort((a, b) => a.kod.localeCompare(b.kod));
            cache.itemIndex = new Map(cache.items.map((i) => [i.kod, i]));
        }
        return cache.items;
    };
    M.rawItem = (kod) => { M.items(); return cache.itemIndex.get(kod) || null; };
    /** Malzeme veya mamul için birleşik kart (mamuller "üretim" tipinde sanal karttır) */
    M.item = (kod) => {
        const it = M.rawItem(kod);
        if (it) return it;
        const p = M.product(kod);
        if (!p) return null;
        return {
            kod, ad: p.ad, tur: 'Mamul', unit: 'ad', procurement: 'make', isProduct: true, currency: 'TRY',
            price: M.unitCost(kod), leadTime: (D.CATEGORY_STYLE[p.kategori] || {}).lead || 5,
            safetyStock: 0, lotPolicy: 'L4L', lotSize: 0, kategori: p.kategori
        };
    };
    /** Satın alınan kalemin TL birim fiyatı (güncel kurla) */
    M.priceTRY = (kod) => { const it = M.rawItem(kod); return it ? M.toTRY(it.price || 0, it.currency) : 0; };

    // ======================================================================
    // Ürün ağacı ve rotalar
    // ======================================================================
    /** Tek seviyeli reçete satırları [{kod, k}] */
    M.bom = (kod) => {
        const custom = S().customBoms[kod];
        if (custom) return custom;
        if (D.SUB_BOMS[kod]) return D.SUB_BOMS[kod].map(([c, k]) => ({ kod: c, k }));
        const p = M.product(kod);
        if (!p || p.custom) return [];
        const tpl = D.BOM_TEMPLATES[p.kategori] || [];
        return tpl.map(([c, , , k]) => ({ kod: c, k }));
    };
    M.hasBom = (kod) => M.bom(kod).length > 0;

    M.workCenters = () => S().workCenters;
    M.workCenter = (id) => S().workCenters.find((w) => w.id === id) || null;

    /** Operasyon listesi [{wc, setup, run}] — özel rota yoksa kategori varsayılanı */
    M.routing = (kod) => {
        if (S().routings[kod]) return S().routings[kod];
        const p = M.product(kod);
        let tpl = null;
        if (p) tpl = D.DEFAULT_ROUTINGS[p.kategori];
        else { const it = M.rawItem(kod); if (it && it.procurement === 'make') tpl = D.DEFAULT_ROUTINGS._YM; }
        return (tpl || []).map(([wc, setup, run]) => ({ wc, setup, run }));
    };
    /** Bir operasyonun toplam dakikası (verimlilik dahil) */
    M.opMinutes = (op, qty) => {
        const wc = M.workCenter(op.wc);
        const eff = wc ? (wc.efficiency || 100) / 100 : 1;
        return (op.setup + op.run * qty) / eff;
    };

    // ======================================================================
    // Maliyet (TL, güncel kurla) — malzeme + işçilik + genel gider
    // ======================================================================
    /** Kendi rotasının birim işçilik maliyeti (hazırlık standart partiye yayılır) */
    M.ownLabor = (kod) => {
        if (!S().costing.includeLabor) return 0;
        const lot = Math.max(1, S().costing.stdLot || 20);
        return U.sum(M.routing(kod), (op) => {
            const wc = M.workCenter(op.wc);
            return wc ? (M.opMinutes(op, lot) / lot) * (wc.rate || 0) / 60 : 0;
        });
    };

    /** { material, labor } — çok seviyeli toplanmış, genel gider hariç */
    M.costParts = (kod, depth = 0) => {
        cache.parts = cache.parts || {};
        if (cache.parts[kod]) return cache.parts[kod];
        let res;
        const lines = depth > 20 ? [] : M.bom(kod);
        if (lines.length) {
            res = { material: 0, labor: M.ownLabor(kod) };
            lines.forEach((l) => {
                const c = M.hasBom(l.kod) ? M.costParts(l.kod, depth + 1) : { material: M.priceTRY(l.kod), labor: 0 };
                res.material += l.k * c.material;
                res.labor += l.k * c.labor;
            });
        } else {
            const it = M.rawItem(kod);
            const p = it ? null : M.product(kod);
            res = { material: it ? M.priceTRY(kod) : (p ? p.toplam : 0), labor: 0 };
        }
        cache.parts[kod] = res;
        return res;
    };
    M.overheadPct = () => (S().costing.overheadPct || 0) / 100;
    /** Standart birim maliyet (TL): malzeme + işçilik + genel gider */
    M.unitCost = (kod) => {
        const c = M.costParts(kod);
        if (!M.hasBom(kod)) return c.material;
        return (c.material + c.labor) * (1 + M.overheadPct());
    };
    /** Yalnızca malzeme maliyeti (ERP'deki kayıtlı maliyetle karşılaştırma için) */
    M.materialCost = (kod) => M.costParts(kod).material;

    /** Maliyetin malzeme türüne göre dağılımı + işçilik + genel gider (TL) */
    M.costBreakdown = (kod) => {
        const acc = {};
        const walk = (k, mult, depth) => {
            if (depth > 20) return;
            M.bom(k).forEach((l) => {
                const child = M.item(l.kod);
                if (!child) return;
                if (M.hasBom(l.kod) && !child.isProduct) walk(l.kod, mult * l.k, depth + 1);
                else acc[child.tur] = (acc[child.tur] || 0) + mult * l.k * (child.isProduct ? M.unitCost(l.kod) : M.priceTRY(l.kod));
            });
        };
        walk(kod, 1, 0);
        const c = M.costParts(kod);
        if (c.labor) acc['İşçilik'] = c.labor;
        const oh = (c.material + c.labor) * M.overheadPct();
        if (oh) acc['Genel Gider'] = oh;
        return acc;
    };
    /** Döviz bazında malzeme maliyeti dağılımı (TL karşılığı) — kur riski analizi */
    M.currencyExposure = (kod) => {
        const acc = {};
        const walk = (k, mult, depth) => {
            if (depth > 20) return;
            M.bom(k).forEach((l) => {
                if (M.hasBom(l.kod)) return walk(l.kod, mult * l.k, depth + 1);
                const it = M.rawItem(l.kod);
                if (!it) return;
                acc[it.currency] = (acc[it.currency] || 0) + mult * l.k * M.priceTRY(l.kod);
            });
        };
        walk(kod, 1, 0);
        return acc;
    };

    /** Kalemin kullanıldığı ürünler (kategori bazında sayım) */
    M.whereUsed = (kod) => {
        const res = { products: 0, byCategory: {}, parents: [] };
        Object.entries(D.SUB_BOMS).forEach(([ym, lines]) => { if (lines.some(([c]) => c === kod)) res.parents.push(ym); });
        Object.entries(S().customBoms).forEach(([p, lines]) => { if (!M.isProduct(p) && lines.some((l) => l.kod === kod) && !res.parents.includes(p)) res.parents.push(p); });
        const direct = new Set([kod, ...res.parents]);
        M.products().forEach((p) => {
            if (M.bom(p.kod).some((l) => direct.has(l.kod))) {
                res.products++;
                res.byCategory[p.kategori] = (res.byCategory[p.kategori] || 0) + 1;
            }
        });
        return res;
    };

    // ======================================================================
    // Stok (lot kayıtlarından türetilir)
    // ======================================================================
    function stockIndex() {
        if (!cache.stock) {
            cache.stock = new Map();
            S().lots.forEach((l) => {
                let e = cache.stock.get(l.kod);
                if (!e) { e = { total: 0, byLoc: {} }; cache.stock.set(l.kod, e); }
                e.total += l.qty;
                e.byLoc[l.loc] = (e.byLoc[l.loc] || 0) + l.qty;
            });
        }
        return cache.stock;
    }
    /** Eldeki stok; locs verilirse yalnızca o lokasyon(lar) */
    M.onHand = (kod, locs) => {
        const e = stockIndex().get(kod);
        if (!e) return 0;
        if (!locs) return U.round(e.total, 3);
        return U.round(U.sum([].concat(locs), (l) => e.byLoc[l] || 0), 3);
    };
    /** Üretimde kullanılabilir stok (fasoncudaki hariç) */
    M.CONSUME_LOCS = Object.keys(D.LOCATIONS).filter((k) => D.LOCATIONS[k].consume);
    M.available = (kod) => M.onHand(kod, M.CONSUME_LOCS);

    /** FIFO sıralı lotlar */
    M.lots = (kod, loc) => S().lots.filter((l) => l.kod === kod && (!loc || l.loc === loc) && l.qty > EPS)
        .sort((a, b) => a.at.localeCompare(b.at));

    M.stockStatus = (kod) => {
        const it = M.item(kod);
        if (!it || it.procurement === 'service') return 'na';
        const q = M.onHand(kod);
        if (it.safetyStock <= 0) return q < 0 ? 'critical' : 'ok';
        if (q < it.safetyStock * 0.5) return 'critical';
        if (q < it.safetyStock) return 'warn';
        return 'ok';
    };

    /** Açık satın alma siparişlerinde bekleyen miktar */
    M.onOrder = (kod) => U.sum(
        S().pos.filter((p) => p.status === 'open' || p.status === 'partial'),
        (p) => U.sum(p.lines.filter((l) => l.kod === kod), (l) => Math.max(0, l.qty - (l.received || 0)))
    );

    /** FIFO ile lotlardan düşer; düşülen parçaları döndürür */
    function takeFIFO(kod, locs, qty) {
        const taken = [];
        let rem = qty;
        [].concat(locs).forEach((loc) => {
            if (rem <= EPS) return;
            M.lots(kod, loc).forEach((l) => {
                if (rem <= EPS) return;
                const q = Math.min(l.qty, rem);
                l.qty = U.round(l.qty - q, 4);
                rem = U.round(rem - q, 4);
                taken.push({ lot: l.lot, qty: q, at: l.at, supplier: l.supplier, ref: l.ref, loc: l.loc });
            });
        });
        return { taken, missing: rem > EPS ? rem : 0 };
    }

    /**
     * Stok hareketi kaydeder.
     *  - qty > 0 (GR, FG, ADJ+) → loc'a yeni lot açar (lot verilmezse otomatik numara)
     *  - qty < 0 (GI, ADJ−)     → loc listesinden FIFO düşer
     *  - TRF                    → loc(lar)dan toLoc'a FIFO taşır (lot numaraları korunur)
     * @returns {object} hareket kaydı
     */
    M.move = ({ kod, qty, type, loc = 'MERKEZ', toLoc = null, lot = '', ref = '', note = '', supplier = '' }) => {
        const st = S();
        const it = M.item(kod);
        const now = new Date().toISOString();
        let lots = [];
        if (type === 'TRF') {
            const r = takeFIFO(kod, loc, qty);
            r.taken.forEach((t) => st.lots.push({ id: U.uid('lot'), lot: t.lot, kod, loc: toLoc, qty: t.qty, at: t.at, ref: t.ref, supplier: t.supplier }));
            lots = r.taken.map((t) => ({ lot: t.lot, qty: t.qty }));
            qty = U.sum(r.taken, (t) => t.qty);
        } else if (qty > 0) {
            const lotNo = lot || MRP.store.nextNo('LOT');
            st.lots.push({ id: U.uid('lot'), lot: lotNo, kod, loc, qty: U.round(qty, 4), at: now, ref, supplier });
            lots = [{ lot: lotNo, qty }];
        } else if (qty < 0) {
            const r = takeFIFO(kod, loc, -qty);
            lots = r.taken.map((t) => ({ lot: t.lot, qty: -t.qty }));
            if (r.missing) lots.push({ lot: '(eksik)', qty: -r.missing });
            qty = -U.sum(r.taken, (t) => t.qty);
        }
        st.lots = st.lots.filter((l) => l.qty > EPS);
        cache.stock = null;
        const u = MRP.auth.current();
        const m = {
            id: MRP.store.nextNo('HRK'), at: now, kod, type, qty: U.round(qty, 4), balance: M.onHand(kod),
            loc: Array.isArray(loc) ? loc.join('+') : loc, toLoc, lots, ref, note,
            user: u ? u.name : 'sistem', value: Math.abs(qty) * (it ? (it.isProduct ? M.unitCost(kod) : M.priceTRY(kod)) : 0) * (qty < 0 ? -1 : 1)
        };
        st.movements.push(m);
        return m;
    };

    M.stockValue = () => {
        let v = 0;
        stockIndex().forEach((e, kod) => {
            if (e.total <= 0) return;
            const it = M.rawItem(kod);
            if (it && it.procurement === 'service') return; // hizmet bakiyesi stok değeri sayılmaz
            v += e.total * (M.isProduct(kod) ? M.unitCost(kod) : M.priceTRY(kod));
        });
        return v;
    };

    // ======================================================================
    // Tedarikçi fiyat listesi, performans, fiyat geçmişi
    // ======================================================================
    /** Kalem için tedarikçi teklifleri — TL fiyata göre artan */
    M.offers = (kod) => S().priceList.filter((o) => o.kod === kod)
        .map((o) => ({ ...o, priceTRY: M.toTRY(o.price, o.currency), supplier: S().suppliers.find((s) => s.id === o.supplierId) }))
        .filter((o) => o.supplier)
        .sort((a, b) => a.priceTRY - b.priceTRY);
    M.offer = (supplierId, kod) => S().priceList.find((o) => o.supplierId === supplierId && o.kod === kod) || null;

    /** Teslimat kayıtlarından otomatik performans: zamanında teslim ve kalite oranı */
    M.supplierPerformance = (id) => {
        const pos = S().pos.filter((p) => p.supplierId === id && (p.receipts || []).length);
        if (!pos.length) return null;
        let onTime = 0, receipts = 0, rejected = 0;
        pos.forEach((p) => {
            const first = p.receipts.find((r) => r.quality !== 'rejected');
            if (first && first.at.slice(0, 10) <= p.deliveryDate) onTime++;
            p.receipts.forEach((r) => { receipts++; if (r.quality === 'rejected') rejected++; });
        });
        const onTimePct = onTime / pos.length;
        const qualityPct = receipts ? 1 - rejected / receipts : 1;
        return { orders: pos.length, onTimePct, qualityPct, score: U.round(1 + 4 * (0.6 * onTimePct + 0.4 * qualityPct), 1) };
    };
    /** Etkin puan: teslimat verisi varsa otomatik, yoksa elle girilen puan */
    M.supplierScore = (s) => { const p = M.supplierPerformance(s.id); return p ? p.score : s.puan; };

    M.priceHistory = (kod) => {
        const out = [];
        S().pos.forEach((p) => p.lines.filter((l) => l.kod === kod).forEach((l) => out.push({
            at: p.createdAt, po: p.no, supplier: p.supplierName, qty: l.qty, price: l.price,
            origPrice: l.origPrice ?? l.price, currency: l.currency || 'TRY', status: p.status
        })));
        return out.sort((a, b) => a.at.localeCompare(b.at));
    };

    /** Talep/PO satırları için öncelikli tedarikçi önerisi */
    M.suggestSuppliers = (types) => S().suppliers
        .filter((s) => s.aktif)
        .map((s) => ({ s, match: types.filter((t) => s.kategoriler.includes(t)).length }))
        .sort((a, b) => b.match - a.match || M.supplierScore(b.s) - M.supplierScore(a.s));

    MRP.model = M;
})(window.MRP);
</script>
<script>
/* assets/js/mrp-engine.js */
/* ==========================================================================
   MRP Pro — MRP Motoru
   --------------------------------------------------------------------------
   Klasik MRP mantığı:
     1. Bağımsız talep (Ana Üretim Planı) + açık iş emirlerinin bileşen ihtiyaçları
        → brüt ihtiyaçlar
     2. Düşük seviye kodu (LLC) ile ürün ağacı seviye seviye işlenir
     3. Her kalem için:  eldeki stok − emniyet stoğu + planlı girişler (açık PO,
        açık talepler, açık iş emirleri) ile brüt ihtiyaçlar netleştirilir
     4. Net ihtiyaç parti büyüklüğü politikasına göre yuvarlanır
        (L4L / Sabit parti / Minimum sipariş)
     5. Tedarik süresi kadar geriye kaydırılarak sipariş salım tarihi bulunur
     6. Üretilen kalemlerin planlı siparişleri alt seviyeye patlatılır
   Tüm tarihler "YYYY-MM-DD" metni olarak tutulur (saat dilimi kayması olmaz).
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U;
    const M = MRP.model;
    const S = () => MRP.store.state;

    const OPEN_WO = ['planned', 'released'];
    const EPS = 1e-9;
    const addDaysIso = (iso, n) => U.iso(U.addDays(U.parseDate(iso), n));
    const maxIso = (a, b) => (a > b ? a : b);

    function applyLotSize(it, shortage) {
        let q = shortage;
        if (it.lotPolicy === 'FOQ' && it.lotSize > 0) q = Math.ceil(shortage / it.lotSize - EPS) * it.lotSize;
        else if (it.lotPolicy === 'MIN' && it.lotSize > 0) q = Math.max(shortage, it.lotSize);
        return it.unit === 'ad' ? Math.ceil(q - EPS) : Math.ceil(q * 1000 - 1e-6) / 1000;
    }

    /** Aynı güne düşen brüt ihtiyaçları tek satırda toplar (kaynaklar korunur) */
    function mergeByDate(list) {
        const byDate = new Map();
        list.forEach((g) => {
            const x = byDate.get(g.date);
            if (x) { x.qty += g.qty; if (!x.srcs.includes(g.src)) x.srcs.push(g.src); if (g.kind === 'MPS') x.kind = 'MPS'; }
            else byDate.set(g.date, { date: g.date, qty: g.qty, kind: g.kind, srcs: [g.src] });
        });
        return [...byDate.values()].sort((a, b) => a.date.localeCompare(b.date))
            .map((x) => ({ ...x, src: x.srcs.length > 2 ? `${x.srcs.slice(0, 2).join(', ')} +${x.srcs.length - 2}` : x.srcs.join(', ') }));
    }

    /**
     * @param {{extraDemands?: Array<{id,kod,qty,dueDate}>}} [opts]  Senaryo analizi için kalıcı olmayan ek talepler
     */
    function run(opts = {}) {
        const st = S();
        const today = U.iso(U.today());
        const gross = new Map();
        const receipts = new Map();
        const push = (map, kod, entry) => { if (entry.qty <= EPS) return; if (!map.has(kod)) map.set(kod, []); map.get(kod).push(entry); };

        // 1) Bağımsız talep
        [...st.mps, ...(opts.extraDemands || [])].forEach((d) => {
            if (M.product(d.kod)) push(gross, d.kod, { date: d.dueDate, qty: +d.qty, src: d.id, kind: 'MPS' });
        });

        // 2) Açık iş emirleri: mamul için planlı giriş, bileşenler için bağımlı talep
        const openWOs = st.workOrders.filter((w) => OPEN_WO.includes(w.status));
        openWOs.forEach((w) => {
            push(receipts, w.kod, { date: w.end, qty: w.qty, src: w.no, kind: 'WO' });
            M.bom(w.kod).forEach((l) => push(gross, l.kod, { date: maxIso(w.start, today), qty: l.k * w.qty, src: w.no, kind: 'WO' }));
        });

        // 3) Açık satın alma siparişleri ve henüz siparişe dönmemiş talepler → planlı giriş
        st.pos.filter((p) => p.status === 'open' || p.status === 'partial').forEach((p) => p.lines.forEach((l) => {
            push(receipts, l.kod, { date: p.deliveryDate, qty: l.qty - (l.received || 0), src: p.no, kind: 'PO' });
        }));
        st.requests.filter((r) => r.status === 'pending' || r.status === 'approved').forEach((r) => r.lines.forEach((l) => {
            push(receipts, l.kod, { date: l.needDate || r.deadline || today, qty: l.qty, src: r.no, kind: 'REQ' });
        }));

        // 4) Düşük seviye kodları
        const llc = new Map();
        const visit = (kod, lvl, path) => {
            if (path.has(kod)) return; // döngüsel reçete koruması
            if ((llc.get(kod) ?? -1) >= lvl) return;
            llc.set(kod, lvl);
            path.add(kod);
            M.bom(kod).forEach((l) => visit(l.kod, lvl + 1, path));
            path.delete(kod);
        };
        [...gross.keys(), ...receipts.keys()].forEach((k) => visit(k, 0, new Set()));
        // Talebi olmayan kalemler de (emniyet stoğu tamamlama için) ağaçlarıyla birlikte seviyelendirilir;
        // böylece bir yarı mamul her zaman kendi bileşenlerinden önce işlenir.
        M.items().forEach((it) => { if (!llc.has(it.kod)) visit(it.kod, 0, new Set()); });
        const order = [...llc.entries()].sort((a, b) => a[1] - b[1]).map(([k]) => k);

        // 5) Netleştirme
        const records = {};
        const planned = [];
        const exceptions = [];
        let seq = 0;

        order.forEach((kod) => {
            const it = M.item(kod);
            if (!it) return;
            const isService = it.procurement === 'service';
            const reqs = mergeByDate(gross.get(kod) || []);
            const recs = (receipts.get(kod) || []).sort((a, b) => a.date.localeCompare(b.date));
            // Fason/hizmet: teslim alınmış ama henüz üretimde kullanılmamış hizmet bakiyesi netleştirilir
            const onHand = M.onHand(kod);
            const ss = isService ? 0 : (it.safetyStock || 0);
            if (!reqs.length && !recs.length && onHand >= ss) return;

            const rec = { kod, level: llc.get(kod), onHand, ss, gross: reqs, receipts: recs, planned: [] };
            let proj = onHand - ss;
            let ri = 0;

            recs.forEach((r) => {
                if (r.kind === 'PO' && r.date < today) {
                    exceptions.push({ sev: 'warn', kod, msg: `${r.src} teslimatı ${U.diffDays(today, r.date)} gün gecikmiş (${U.qty(r.qty, it.unit)}).` });
                }
            });

            const plan = (needDate, shortage, reason) => {
                const qty = applyLotSize(it, shortage);
                const due = maxIso(needDate, today);
                const release = addDaysIso(due, -(it.leadTime || 0));
                const unitPrice = it.procurement === 'make' ? M.unitCost(kod) : M.priceTRY(kod);
                const po = {
                    id: `PL-${String(++seq).padStart(4, '0')}`, kod, ad: it.ad, unit: it.unit, tur: it.tur,
                    type: it.procurement === 'make' ? 'production' : 'purchase', service: isService,
                    qty, shortage: U.round(shortage, 3), needDate, due, release, leadTime: it.leadTime || 0,
                    price: unitPrice, currency: it.currency || 'TRY', origPrice: it.price || 0,
                    value: qty * unitPrice, reason, late: release < today
                };
                planned.push(po);
                rec.planned.push(po);
                if (po.late) {
                    exceptions.push({ sev: 'critical', kod, msg: `${po.id}: salım tarihi ${U.diffDays(today, release)} gün geçmiş — tedarik hızlandırılmalı veya talep ertelenmeli.` });
                } else if (U.diffDays(release, today) <= 3) {
                    exceptions.push({ sev: 'warn', kod, msg: `${po.id}: ${U.date(U.parseDate(release))} tarihine kadar salınmalı.` });
                }
                if (needDate < today) {
                    exceptions.push({ sev: 'critical', kod, msg: `İhtiyaç tarihi geçmiş (${U.date(U.parseDate(needDate))}) — karşılanamayan talep.` });
                }
                if (po.type === 'production') {
                    M.bom(kod).forEach((l) => push(gross, l.kod, { date: maxIso(release, today), qty: l.k * qty, src: po.id, kind: 'PLN' }));
                }
                if (!isService && po.type === 'purchase' && !po.price) {
                    exceptions.push({ sev: 'info', kod, msg: 'Birim fiyat tanımsız — malzeme kartını güncelleyin.' });
                }
                return qty;
            };

            reqs.forEach((r) => {
                while (ri < recs.length && recs[ri].date <= r.date) proj += recs[ri++].qty;
                if (proj < r.qty - EPS) {
                    const later = recs.slice(ri).filter((x) => x.kind === 'PO' || x.kind === 'REQ');
                    if (later.length) {
                        exceptions.push({ sev: 'warn', kod, msg: `${later[0].src} ihtiyaçtan sonra geliyor (${U.date(U.parseDate(later[0].date))}); öne çekilirse ek sipariş gerekmeyebilir.` });
                    }
                    proj += plan(r.date, r.qty - proj, r.kind === 'MPS' ? `Ana plan ${r.src}` : `Bağımlı talep ${r.src}`);
                }
                proj -= r.qty;
            });
            while (ri < recs.length) proj += recs[ri++].qty;
            if (proj < -EPS) proj += plan(addDaysIso(today, it.leadTime || 0), -proj, 'Emniyet stoğu tamamlama');

            rec.projectedEnd = U.round(proj + ss, 3);
            records[kod] = rec;
        });

        // Bağımlı talep sonradan eklenen kalemler için brüt listeleri güncel tut
        Object.values(records).forEach((r) => { r.gross = (gross.get(r.kod) || []).slice().sort((a, b) => a.date.localeCompare(b.date)); });

        const sevOrder = { critical: 0, warn: 1, info: 2 };
        exceptions.sort((a, b) => sevOrder[a.sev] - sevOrder[b.sev]);

        const purchase = planned.filter((p) => p.type === 'purchase');
        const production = planned.filter((p) => p.type === 'production');
        return {
            runAt: new Date().toISOString(),
            runBy: MRP.auth.current() ? MRP.auth.current().name : '',
            today,
            planned, records, exceptions,
            summary: {
                demands: st.mps.length + (opts.extraDemands || []).length,
                items: Object.keys(records).length,
                purchaseCount: purchase.length,
                purchaseValue: U.sum(purchase, (p) => p.value),
                productionCount: production.length,
                late: planned.filter((p) => p.late).length,
                critical: exceptions.filter((e) => e.sev === 'critical').length
            }
        };
    }

    /** Haftalık zaman fazlı tablo (12 hafta + geçmiş vade kovası) */
    function timePhased(rec, weeks = 12) {
        const start = U.weekStart(U.today());
        const cols = [{ label: 'Geçmiş', from: '0000-00-00', to: addDaysIso(U.iso(start), -1) }];
        for (let i = 0; i < weeks; i++) {
            const from = U.iso(U.addDays(start, i * 7));
            cols.push({ label: `H${U.isoWeek(from)}`, sub: U.date(U.parseDate(from)).slice(0, 5), from, to: addDaysIso(from, 6) });
        }
        cols.push({ label: 'Sonra', from: addDaysIso(U.iso(start), weeks * 7), to: '9999-12-31' });
        const bucket = (list, dateKey) => cols.map((c) => U.sum(list.filter((x) => x[dateKey] >= c.from && x[dateKey] <= c.to), (x) => x.qty));
        const g = bucket(rec.gross, 'date');
        const sr = bucket(rec.receipts, 'date');
        const pr = bucket(rec.planned, 'due');
        const rel = bucket(rec.planned, 'release');
        let proj = rec.onHand;
        const pa = cols.map((_, i) => (proj = proj + sr[i] + pr[i] - g[i]));
        return { cols, rows: [
            { label: 'Brüt ihtiyaç', values: g },
            { label: 'Planlı girişler (PO/Talep/İE)', values: sr },
            { label: 'Planlı sipariş girişi', values: pr },
            { label: 'Öngörülen eldeki stok', values: pa, projected: true },
            { label: 'Planlı sipariş salımı', values: rel, release: true }
        ] };
    }

    MRP.engine = { run, timePhased, applyLotSize };
})(window.MRP);
</script>
<script>
/* assets/js/app.js */
/* ==========================================================================
   MRP Pro — Uygulama kabuğu: giriş, yönlendirme (hash router), menü,
   bildirimler, tema ve olay delegasyonu
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, A = MRP.auth;

    MRP.views = MRP.views || {};
    MRP.actions = MRP.actions || {};
    MRP.charts = {};

    const NAV = [
        { group: 'Genel', items: [{ id: 'dashboard', label: 'Gösterge Paneli', icon: 'dashboard' }] },
        { group: 'Mühendislik', items: [
            { id: 'bom', label: 'Ürün Ağacı', icon: 'tree' },
            { id: 'items', label: 'Malzeme Kartları', icon: 'layers' },
            { id: 'costing', label: 'Maliyet & Kur', icon: 'coin' }
        ] },
        { group: 'Planlama', items: [
            { id: 'mrp', label: 'MRP Çalıştırma', icon: 'calc', count: () => (MRP.store.state.lastRun ? MRP.store.state.lastRun.summary.critical : 0), alert: true },
            { id: 'capacity', label: 'Kapasite Planlama', icon: 'gauge' },
            { id: 'workorders', label: 'İş Emirleri', icon: 'factory', count: () => MRP.store.state.workOrders.filter((w) => w.status === 'planned' || w.status === 'released').length }
        ] },
        { group: 'Satın Alma', items: [
            { id: 'requests', label: 'Satın Alma Talepleri', icon: 'cart', count: () => MRP.store.state.requests.filter((r) => r.status === 'pending').length },
            { id: 'po', label: 'Satın Alma Siparişleri', icon: 'truck', count: () => MRP.store.state.pos.filter((p) => p.status === 'open' || p.status === 'partial').length },
            { id: 'suppliers', label: 'Tedarikçiler', icon: 'users' }
        ] },
        { group: 'Depo', items: [
            { id: 'stock', label: 'Stok Durumu', icon: 'warehouse', count: () => MRP.model.items().filter((i) => MRP.model.stockStatus(i.kod) === 'critical').length, alert: true },
            { id: 'movements', label: 'Stok Hareketleri', icon: 'swap' }
        ] },
        { group: 'Analiz & Sistem', items: [
            { id: 'analysis', label: 'Analizler', icon: 'pie' },
            { id: 'import', label: 'Veri Aktarımı (Excel)', icon: 'upload' },
            { id: 'reports', label: 'Raporlar & Dışa Aktarım', icon: 'chart' },
            { id: 'audit', label: 'Denetim Kaydı', icon: 'shield' }
        ] }
    ];

    let currentView = null;

    // ---------------- Tema ----------------
    function applyTheme(t) {
        document.body.classList.toggle('light', t === 'light');
        U.$$('[data-theme-icon]').forEach((el) => { el.innerHTML = MRP.icon(t === 'light' ? 'moon' : 'sun'); });
    }
    function toggleTheme() {
        const next = document.body.classList.contains('light') ? 'dark' : 'light';
        try { localStorage.setItem('mrppro.theme', next); } catch (e) { /* yoksay */ }
        applyTheme(next);
        if (currentView) render();
    }

    // ---------------- Giriş ----------------
    function showLogin() {
        U.$('#app').hidden = true;
        U.$('#login').hidden = false;
        U.$('#loginUser').focus();
    }
    function doLogin(e) {
        if (e) e.preventDefault();
        const u = U.$('#loginUser').value.trim();
        const p = U.$('#loginPass').value;
        if (A.login(u, p)) {
            U.$('#loginError').classList.remove('show');
            U.$('#loginPass').value = '';
            MRP.store.audit('Oturum açıldı', u);
            MRP.store.save();
            startApp();
        } else {
            const err = U.$('#loginError');
            err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
            U.$('#loginPass').value = '';
            U.$('#loginPass').focus();
        }
    }
    async function doLogout() {
        if (!(await UI.confirm('Oturumu kapatmak istediğinize emin misiniz?', { title: 'Çıkış', okLabel: 'Çıkış Yap' }))) return;
        MRP.store.audit('Oturum kapatıldı', A.current().username);
        MRP.store.save();
        A.logout();
        location.hash = '';
        showLogin();
    }

    function startApp() {
        const u = A.current();
        U.$('#login').hidden = true;
        U.$('#app').hidden = false;
        U.$('#userAvatar').textContent = u.avatar;
        U.$('#userAvatar').className = 'avatar ' + u.role;
        U.$('#userName').textContent = u.name;
        U.$('#userRole').textContent = u.roleName;
        route();
    }

    // ---------------- Menü ----------------
    function renderNav() {
        U.$('#sbNav').innerHTML = NAV.map((g) => {
            const items = g.items.filter((i) => A.canView(i.id));
            if (!items.length) return '';
            return `<div class="sb-group"><div class="sb-group-title">${U.esc(g.group)}</div>${items.map((i) => {
                const c = i.count ? i.count() : 0;
                return `<a class="sb-link ${currentView === i.id ? 'active' : ''}" href="#/${i.id}">${MRP.icon(i.icon)}<span>${U.esc(i.label)}</span>${c ? `<span class="count ${i.alert ? 'alert' : ''}">${c}</span>` : ''}</a>`;
            }).join('')}</div>`;
        }).join('');
    }

    // ---------------- Yönlendirme ----------------
    function route() {
        if (!A.current()) return showLogin();
        let id = (location.hash.replace(/^#\/?/, '').split('?')[0]) || 'dashboard';
        if (!MRP.views[id] || !A.canView(id)) id = A.current().views[0];
        currentView = id;
        render();
        closeSidebar();
        window.scrollTo(0, 0);
    }

    /** Aktif görünümü yeniden çizer (veri değişikliklerinden sonra çağrılır) */
    function render() {
        if (!currentView) return;
        Object.values(MRP.charts).forEach((c) => c && c.destroy && c.destroy());
        MRP.charts = {};
        const v = MRP.views[currentView];
        U.$('#pageTitle').textContent = v.title;
        U.$('#pageSub').textContent = v.subtitle || '';
        document.title = `${v.title} · MRP Pro`;
        const host = U.$('#view');
        host.innerHTML = v.render();
        if (v.after) v.after(host);
        renderNav();
        updateNotifBadge();
    }

    /** Veriyi kaydet + model önbelleğini temizle + ekranı yenile */
    function commit() {
        MRP.model.invalidate();
        MRP.store.save();
        render();
    }

    // ---------------- Bildirimler ----------------
    const myNotifs = () => {
        const u = A.current();
        return u ? MRP.store.state.notifications.filter((n) => n.roles.includes(u.role)) : [];
    };
    function updateNotifBadge() {
        const u = A.current();
        const unread = myNotifs().filter((n) => !n.readBy.includes(u.username)).length;
        const b = U.$('#notifCount');
        b.hidden = unread === 0;
        b.textContent = unread > 99 ? '99+' : unread;
    }
    function renderNotifPanel() {
        const u = A.current();
        const list = myNotifs();
        U.$('#notifBody').innerHTML = list.length ? list.slice(0, 50).map((n) => `
            <div class="notif-item ${n.readBy.includes(u.username) ? '' : 'unread'}" data-act="openNotif" data-id="${U.esc(n.id)}">
                <div class="t"><span>${U.esc(n.title)}</span><small>${U.esc(U.timeAgo(n.at))}</small></div>
                <div class="m">${U.esc(n.message)}</div>
            </div>`).join('') : '<div class="empty"><h3>Bildirim yok</h3><p>Yeni gelişmeler burada görünecek.</p></div>';
    }
    function togglePopover(id) {
        const el = U.$('#' + id);
        const open = el.hidden;
        U.$$('.popover').forEach((p) => { p.hidden = true; });
        if (open) { el.hidden = false; if (id === 'notifPop') renderNotifPanel(); }
    }

    // ---------------- Sidebar (mobil) ----------------
    function openSidebar() { U.$('#sidebar').classList.add('open'); U.$('#sbBackdrop').classList.add('open'); }
    function closeSidebar() { U.$('#sidebar').classList.remove('open'); U.$('#sbBackdrop').classList.remove('open'); }

    // ---------------- Genel eylemler ----------------
    Object.assign(MRP.actions, {
        toggleTheme, logout: doLogout,
        openSidebar, closeSidebar,
        toggleNotif: () => togglePopover('notifPop'),
        toggleUserMenu: () => togglePopover('userPop'),
        fillDemo: (_, el) => { U.$('#loginUser').value = el.dataset.u; U.$('#loginPass').value = el.dataset.p; U.$('#loginPass').focus(); },
        openNotif: (id) => {
            const n = MRP.store.state.notifications.find((x) => x.id === id);
            if (!n) return;
            const u = A.current().username;
            if (!n.readBy.includes(u)) n.readBy.push(u);
            MRP.store.save();
            U.$$('.popover').forEach((p) => { p.hidden = true; });
            if (n.link && A.canView(n.link)) location.hash = '#/' + n.link; else updateNotifBadge();
        },
        markAllRead: () => {
            const u = A.current().username;
            myNotifs().forEach((n) => { if (!n.readBy.includes(u)) n.readBy.push(u); });
            MRP.store.save();
            renderNotifPanel(); updateNotifBadge();
        },
        go: (id) => { location.hash = '#/' + id; }
    });

    // Tek olay dinleyici: data-act="eylem" data-id="..."
    document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el) {
            if (!e.target.closest('.popover')) U.$$('.popover').forEach((p) => { p.hidden = true; });
            return;
        }
        const fn = MRP.actions[el.dataset.act];
        if (!fn) return console.warn('Tanımsız eylem:', el.dataset.act);
        e.preventDefault();
        e.stopPropagation();
        if (!el.closest('.popover')) U.$$('.popover').forEach((p) => { p.hidden = true; });
        fn(el.dataset.id, el, e);
    });
    document.addEventListener('change', (e) => {
        const el = e.target.closest('[data-change]');
        if (el && MRP.actions[el.dataset.change]) MRP.actions[el.dataset.change](el.value, el, e);
    });
    document.addEventListener('input', (e) => {
        const el = e.target.closest('[data-input]');
        if (el && MRP.actions[el.dataset.input]) MRP.actions[el.dataset.input](el.value, el, e);
    });

    // ---------------- Başlangıç ----------------
    MRP.app = { render, commit, route, currentView: () => currentView };

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', () => {
        let theme = 'dark';
        try { theme = localStorage.getItem('mrppro.theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) { /* yoksay */ }
        applyTheme(theme);
        MRP.store.load();
        MRP.model.init();
        U.$('#loginForm').addEventListener('submit', doLogin);
        U.$('#demoAccounts').innerHTML = Object.values(A.USERS).map((u) => `
            <button type="button" class="demo-row" data-act="fillDemo" data-u="${U.esc(u.username)}" data-p="${U.esc(u.password)}">
                <span class="r">${U.esc(u.roleName)}</span><span class="c">${U.esc(u.username)} / ${U.esc(u.password)}</span></button>`).join('');
        if (A.restore()) startApp(); else showLogin();
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/common.js */
/* ==========================================================================
   MRP Pro — Görünümler için ortak HTML yardımcıları
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U;
    const esc = U.esc;

    const H = {};

    H.kpi = (label, value, sub = '', cls = '') =>
        `<div class="kpi ${cls}"><div class="l">${esc(label)}</div><div class="v">${esc(value)}</div><div class="s">${esc(sub)}</div></div>`;

    H.banner = (type, icon, title, text = '', actionHtml = '') =>
        `<div class="banner ${type}"><div class="ic">${MRP.icon(icon)}</div><div class="tx"><h4>${esc(title)}</h4>${text ? `<p>${esc(text)}</p>` : ''}</div>${actionHtml}</div>`;

    H.empty = (title, text = '') => `<div class="empty"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}</div>`;

    H.card = (title, sub, body, actions = '') =>
        `<section class="card"><div class="card-head"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${actions}</div>${body}</section>`;

    const STOCK = {
        critical: ['badge-red', 'Kritik'], warn: ['badge-amber', 'Düşük'], ok: ['badge-green', 'Normal'], na: ['badge-gray', 'Stoksuz']
    };
    H.stockBadge = (s) => `<span class="badge ${STOCK[s][0]}">${STOCK[s][1]}</span>`;

    H.REQ_STATUS = {
        pending: ['badge-violet', 'Onay Bekliyor'], approved: ['badge-green', 'Onaylandı'], rejected: ['badge-red', 'Reddedildi'],
        ordered: ['badge-amber', 'Siparişe Döndü'], closed: ['badge-cyan', 'Kapandı']
    };
    H.PO_STATUS = {
        open: ['badge-amber', 'Açık'], partial: ['badge-blue', 'Kısmi Teslim'], received: ['badge-green', 'Teslim Alındı'], cancelled: ['badge-gray', 'İptal']
    };
    H.WO_STATUS = {
        planned: ['badge-gray', 'Planlandı'], released: ['badge-blue', 'Serbest'], completed: ['badge-green', 'Tamamlandı'], cancelled: ['badge-red', 'İptal']
    };
    H.PRIORITY = { low: ['badge-gray', 'Düşük'], normal: ['badge-blue', 'Normal'], high: ['badge-amber', 'Yüksek'], urgent: ['badge-red', 'Acil'] };
    H.badge = (map, key) => { const b = map[key] || ['badge-gray', key]; return `<span class="badge ${b[0]}">${esc(b[1])}</span>`; };

    H.catTag = (cat) => {
        const c = (MRP.data.CATEGORY_STYLE[cat] || {}).color || '#64748b';
        return `<span class="badge plain" style="background:${c}22;color:${c};">${esc(cat)}</span>`;
    };

    H.itemLink = (kod) => `<button class="link mono" data-act="itemDetail" data-id="${esc(kod)}">${esc(kod)}</button>`;
    H.productLink = (kod) => `<button class="link mono" data-act="productDetail" data-id="${esc(kod)}">${esc(kod)}</button>`;
    H.anyLink = (kod) => (MRP.model.isProduct(kod) ? H.productLink(kod) : H.itemLink(kod));

    /** Sayfalama çubuğu */
    H.pager = (total, page, size, act) => {
        const pages = Math.max(1, Math.ceil(total / size));
        const from = total ? (page - 1) * size + 1 : 0;
        const to = Math.min(total, page * size);
        return `<div class="pager"><span>${from}–${to} / ${total.toLocaleString('tr-TR')} kayıt</span>
            <span style="display:flex;gap:6px;align-items:center;">
                <button class="btn btn-secondary btn-sm" data-act="${act}" data-id="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Önceki</button>
                <span>${page} / ${pages}</span>
                <button class="btn btn-secondary btn-sm" data-act="${act}" data-id="${page + 1}" ${page >= pages ? 'disabled' : ''}>Sonraki ›</button>
            </span></div>`;
    };

    H.tabs = (items, active, act) => `<div class="tabs">${items.map(([id, label, n]) =>
        `<button class="tab ${id === active ? 'active' : ''}" data-act="${act}" data-id="${esc(id)}">${esc(label)}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}</div>`;

    H.chartTheme = () => {
        const light = document.body.classList.contains('light');
        return {
            text: light ? '#3d4a63' : '#b4bcd0',
            grid: light ? 'rgba(15,23,42,.07)' : 'rgba(255,255,255,.07)',
            surface: light ? '#ffffff' : '#111729'
        };
    };
    H.chart = (id, config) => {
        if (typeof Chart === 'undefined') return;
        const el = document.getElementById(id);
        if (!el) return;
        const t = H.chartTheme();
        Chart.defaults.color = t.text;
        Chart.defaults.font.family = "'Inter', 'Segoe UI', sans-serif";
        MRP.charts[id] = new Chart(el, config);
    };

    /** Yetki kontrolü — yoksa uyarı verip false döner */
    H.guard = (action) => {
        if (MRP.auth.can(action)) return true;
        MRP.UI.toast('Yetkiniz yok', 'Bu işlem için rolünüzün yetkisi bulunmuyor.', 'error');
        return false;
    };

    MRP.H = H;
})(window.MRP);
</script>
<script>
/* assets/js/views/dashboard.js */
/* ==========================================================================
   MRP Pro — Gösterge Paneli
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;

    const openPOValue = () => U.sum(S().pos.filter((p) => p.status === 'open' || p.status === 'partial'),
        (p) => U.sum(p.lines, (l) => Math.max(0, l.qty - (l.received || 0)) * l.price * (1 - l.disc / 100) * (1 + l.vat / 100)));

    MRP.views.dashboard = {
        title: 'Gösterge Paneli',
        subtitle: 'Planlama, satın alma ve stok durumunun özeti',
        render() {
            const st = S();
            const items = M.items().filter((i) => i.procurement !== 'service');
            const crit = items.filter((i) => M.stockStatus(i.kod) === 'critical');
            const warn = items.filter((i) => M.stockStatus(i.kod) === 'warn');
            const run = st.lastRun;
            const activeWO = st.workOrders.filter((w) => w.status === 'planned' || w.status === 'released').length;
            const pendingReq = st.requests.filter((r) => r.status === 'pending');

            let html = '';
            if (!run) {
                html += H.banner('blue', 'info', 'MRP henüz çalıştırılmadı', 'Ana üretim planına göre malzeme ihtiyaçlarını hesaplamak için MRP\'yi çalıştırın.',
                    MRP.auth.canView('mrp') ? '<button class="btn btn-primary btn-sm" data-act="go" data-id="mrp">MRP\'ye git</button>' : '');
            } else if (run.summary.critical > 0) {
                html += H.banner('red', 'alert', `${run.summary.critical} kritik MRP istisnası`, `Son çalıştırma: ${U.dateTime(run.runAt)} — gecikmiş salım veya karşılanamayan talepler var.`,
                    MRP.auth.canView('mrp') ? '<button class="btn btn-danger btn-sm" data-act="go" data-id="mrp">İncele</button>' : '');
            }
            if (crit.length) {
                html += H.banner('amber', 'warehouse', `${crit.length} malzeme emniyet stoğunun yarısının altında`, crit.slice(0, 6).map((i) => i.kod).join(', ') + (crit.length > 6 ? '…' : ''),
                    MRP.auth.canView('stock') ? '<button class="btn btn-secondary btn-sm" data-act="go" data-id="stock">Stok durumu</button>' : '');
            }

            html += `<div class="kpis">
                ${H.kpi('Mamul', M.products().length.toLocaleString('tr-TR'), `${st.customProducts.length} özel ürün`, 'blue')}
                ${H.kpi('Malzeme Kartı', M.items().length, `${items.length} stoklu kalem`, 'cyan')}
                ${H.kpi('Stok Değeri', U.compactCur(M.stockValue()), 'Standart maliyetle', '')}
                ${H.kpi('Kritik / Düşük Stok', `${crit.length} / ${warn.length}`, 'Emniyet stoğuna göre', crit.length ? 'red' : 'green')}
                ${H.kpi('Onay Bekleyen Talep', pendingReq.length, U.cur(U.sum(pendingReq, (r) => r.total)), 'violet')}
                ${H.kpi('Açık Sipariş Bakiyesi', U.compactCur(openPOValue()), `${st.pos.filter((p) => p.status === 'open' || p.status === 'partial').length} PO (KDV dahil)`, 'blue')}
                ${H.kpi('Aktif İş Emri', activeWO, `${st.workOrders.filter((w) => w.status === 'completed').length} tamamlandı`, 'green')}
                ${H.kpi('MRP Önerisi', run ? run.planned.length : '–', run ? `${run.summary.late} geç salım` : 'Çalıştırılmadı', run && run.summary.late ? 'red' : '')}
                ${(() => { const c = MRP.capacity.summary(MRP.capacity.compute({ includePlanned: true })); return H.kpi('Kapasite Tepe Doluluk', `%${U.num(c.peak * 100, 0)}`, c.over ? `${c.over} aşırı yüklü hafta` : '8 hafta içinde aşım yok', c.over ? 'red' : 'green'); })()}
                ${H.kpi('USD / EUR', `${U.num(st.fx.rates.USD, 2)} / ${U.num(st.fx.rates.EUR, 2)}`, st.fx.updatedAt ? `${st.fx.source} · ${U.date(st.fx.updatedAt)}` : 'Varsayılan kur — güncelleyin', st.fx.updatedAt ? 'cyan' : 'violet')}
            </div>`;

            html += `<div class="grid grid-2">
                ${H.card('Planlı sipariş salımları', 'Son MRP çalıştırmasına göre önümüzdeki 8 hafta (₺)', '<div class="card-body"><div class="chart-box"><canvas id="chRelease"></canvas></div></div>')}
                ${H.card('Stok sağlığı', 'Stoklu malzemelerin emniyet stoğuna göre durumu', '<div class="card-body"><div class="chart-box"><canvas id="chHealth"></canvas></div></div>')}
                ${H.card('Kategori bazında ürün maliyeti', 'Kayıtlı birim maliyetlerin toplamı', '<div class="card-body"><div class="chart-box"><canvas id="chCat"></canvas></div></div>')}
                ${H.card('Tedarikçi bazında açık sipariş', 'Teslim bekleyen tutar (₺)', '<div class="card-body"><div class="chart-box"><canvas id="chSup"></canvas></div></div>')}
            </div>`;

            const exc = run ? run.exceptions.slice(0, 8) : [];
            const moves = st.movements.slice(-8).reverse();
            html += `<div class="grid grid-2" style="margin-top:16px;">
                ${H.card('MRP istisna mesajları', run ? `${run.exceptions.length} mesaj` : '', exc.length
                    ? exc.map((e) => `<div class="exc"><span class="sev ${e.sev}"></span><div>${H.anyLink(e.kod)} — ${esc(e.msg)}</div></div>`).join('')
                    : H.empty('İstisna yok', run ? 'Plan sorunsuz görünüyor.' : 'MRP çalıştırıldığında burada listelenir.'))}
                ${H.card('Son stok hareketleri', '', moves.length ? `<div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Kod</th><th>Tür</th><th class="num">Miktar</th></tr></thead><tbody>
                    ${moves.map((m) => `<tr><td class="nowrap">${esc(U.dateTime(m.at))}</td><td>${H.anyLink(m.kod)}</td><td><span class="badge ${M.MOVE_TYPES[m.type].badge}">${esc(M.MOVE_TYPES[m.type].label)}</span></td>
                        <td class="num ${m.qty < 0 ? 'tp-neg' : 'tp-pos'}">${m.qty > 0 ? '+' : ''}${esc(U.qty(m.qty))}</td></tr>`).join('')}</tbody></table></div>`
                    : H.empty('Henüz hareket yok', 'Mal kabul, üretim ve sayım işlemleri burada görünür.'))}
            </div>`;
            return html;
        },
        after() {
            const st = S();
            const t = H.chartTheme();
            const items = M.items().filter((i) => i.procurement !== 'service');
            const counts = { ok: 0, warn: 0, critical: 0 };
            items.forEach((i) => { counts[M.stockStatus(i.kod)]++; });
            H.chart('chHealth', {
                type: 'doughnut',
                data: { labels: ['Normal', 'Düşük', 'Kritik'], datasets: [{ data: [counts.ok, counts.warn, counts.critical], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderColor: t.surface, borderWidth: 2 }] },
                options: { maintainAspectRatio: false, cutout: '68%', plugins: { legend: { position: 'right' } } }
            });

            const byCat = MRP.data.CATEGORIES.map((c) => U.sum(M.products().filter((p) => p.kategori === c), (p) => p.toplam));
            H.chart('chCat', {
                type: 'bar',
                data: { labels: MRP.data.CATEGORIES, datasets: [{ data: byCat, backgroundColor: MRP.data.CATEGORIES.map((c) => MRP.data.CATEGORY_STYLE[c].color), borderRadius: 6 }] },
                options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => U.cur(c.raw) } } },
                    scales: { x: { grid: { color: t.grid }, ticks: { callback: (v) => U.compactCur(v) } }, y: { grid: { display: false } } } }
            });

            const start = U.weekStart(U.today());
            const weeks = [...Array(8)].map((_, i) => U.addDays(start, i * 7));
            const run = st.lastRun;
            const inWeek = (p, w) => { const d = U.parseDate(p.release); return d >= (w === 0 ? new Date(0) : weeks[w]) && d < U.addDays(weeks[w], 7); };
            const val = (type) => weeks.map((_, w) => run ? U.sum(run.planned.filter((p) => p.type === type && inWeek(p, w)), (p) => p.value) : 0);
            H.chart('chRelease', {
                type: 'bar',
                data: { labels: weeks.map((w, i) => (i === 0 ? 'Bu hafta*' : `H${U.isoWeek(w)}`)), datasets: [
                    { label: 'Satın alma', data: val('purchase'), backgroundColor: '#8b5cf6', borderRadius: 4 },
                    { label: 'Üretim', data: val('production'), backgroundColor: '#3b82f6', borderRadius: 4 }
                ] },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${U.cur(c.raw)}` } } },
                    scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { color: t.grid }, ticks: { callback: (v) => U.compactCur(v) } } } }
            });

            const sup = {};
            st.pos.filter((p) => p.status === 'open' || p.status === 'partial').forEach((p) => {
                sup[p.supplierName] = (sup[p.supplierName] || 0) + U.sum(p.lines, (l) => Math.max(0, l.qty - (l.received || 0)) * l.price * (1 - l.disc / 100));
            });
            const entries = Object.entries(sup).sort((a, b) => b[1] - a[1]);
            H.chart('chSup', {
                type: 'bar',
                data: { labels: entries.length ? entries.map((e) => e[0]) : ['Açık sipariş yok'], datasets: [{ data: entries.length ? entries.map((e) => e[1]) : [0], backgroundColor: '#10b981', borderRadius: 6 }] },
                options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => U.cur(c.raw) } } },
                    scales: { x: { beginAtZero: true, grid: { color: t.grid }, ticks: { callback: (v) => U.compactCur(v) } }, y: { grid: { display: false } } } }
            });
        }
    };
})(window.MRP);
</script>
<script>
/* assets/js/views/engineering.js */
/* ==========================================================================
   MRP Pro — Mühendislik: Ürün Ağacı (BOM) ve Malzeme Kartları
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, H = MRP.H, M = MRP.model, D = MRP.data;
    const esc = U.esc;
    const S = () => MRP.store.state;
    const app = () => MRP.app;

    // =====================================================================
    // ÜRÜN AĞACI
    // =====================================================================
    const bomState = { cat: 'Masalar', q: '', sort: 'kod', page: 1, size: 50, onlyReal: false };

    MRP.views.bom = {
        title: 'Ürün Ağacı',
        subtitle: 'Mamul reçeteleri, çok seviyeli ürün ağacı ve standart maliyet',
        render() {
            const all = M.products();
            const tabs = D.CATEGORIES.map((c) => [c, c, all.filter((p) => p.kategori === c).length]);
            let list = all.filter((p) => p.kategori === bomState.cat && (!bomState.onlyReal || !p.synthetic));
            const q = bomState.q.toLocaleLowerCase('tr');
            if (q) list = list.filter((p) => p.kod.toLocaleLowerCase('tr').includes(q) || p.ad.toLocaleLowerCase('tr').includes(q));
            const sorters = {
                kod: (a, b) => a.kod.localeCompare(b.kod, 'tr'),
                'cost-desc': (a, b) => b.toplam - a.toplam,
                'cost-asc': (a, b) => a.toplam - b.toplam,
                'var-desc': (a, b) => Math.abs(variance(b)) - Math.abs(variance(a))
            };
            list.sort(sorters[bomState.sort]);
            const pages = Math.max(1, Math.ceil(list.length / bomState.size));
            bomState.page = Math.min(bomState.page, pages);
            const pageItems = list.slice((bomState.page - 1) * bomState.size, bomState.page * bomState.size);

            const rows = pageItems.map((p) => {
                const bomCost = M.materialCost(p.kod);
                const v = variance(p);
                return `<tr class="${p.custom ? 'r-new' : ''}">
                    <td>${H.productLink(p.kod)} ${p.custom ? '<span class="badge badge-green plain">ÖZEL</span>' : ''}</td>
                    <td class="strong">${esc(p.ad)}</td>
                    <td class="num">${M.bom(p.kod).length}</td>
                    <td class="num">${U.num(p.toplam)}</td>
                    <td class="num">${U.num(bomCost)}</td>
                    <td class="num ${Math.abs(v) > 25 ? 'tp-neg' : ''}">${p.toplam ? (v > 0 ? '+' : '') + U.num(v, 1) + '%' : '–'}</td>
                    <td class="num strong">${U.num(M.unitCost(p.kod))}</td>
                    <td class="num">${U.qty(M.onHand(p.kod))}</td>
                    <td><div class="row-actions">
                        <button class="btn btn-secondary btn-sm" data-act="productDetail" data-id="${esc(p.kod)}">${MRP.icon('tree', 'sm')} Ağaç</button>
                        ${p.custom && MRP.auth.can('editProduct') ? `<button class="btn btn-ghost btn-sm" data-act="deleteProduct" data-id="${esc(p.kod)}" title="Sil">${MRP.icon('trash', 'sm')}</button>` : ''}
                    </div></td></tr>`;
            }).join('');

            return `
                ${H.tabs(tabs, bomState.cat, 'bomCat')}
                <div class="toolbar">
                    <input class="input" placeholder="Kod veya ad ile ara…" value="${esc(bomState.q)}" data-input="bomSearch" id="bomSearch">
                    <select class="input" data-change="bomSort">
                        ${[['kod', 'Koda göre'], ['cost-desc', 'Maliyet (yüksek → düşük)'], ['cost-asc', 'Maliyet (düşük → yüksek)'], ['var-desc', 'Maliyet farkı (büyük → küçük)']]
                            .map(([v, l]) => `<option value="${v}" ${bomState.sort === v ? 'selected' : ''}>${l}</option>`).join('')}
                    </select>
                    <label class="check-chip"><input type="checkbox" data-change="bomReal" ${bomState.onlyReal ? 'checked' : ''}> Yalnızca ana ürünler</label>
                    <span class="spacer"></span>
                    ${MRP.auth.can('editProduct') ? `<button class="btn btn-primary" data-act="addProduct">${MRP.icon('plus')} Yeni Ürün</button>` : ''}
                </div>
                <section class="card">
                    <div class="table-wrap"><table>
                        <thead><tr><th>Mamul Kodu</th><th>Mamul Adı</th><th class="num">Bileşen</th><th class="num">Kayıtlı Maliyet ₺</th>
                            <th class="num">BOM Malzeme ₺</th><th class="num">Fark</th><th class="num">Standart Maliyet ₺</th><th class="num">Stok</th><th></th></tr></thead>
                        <tbody>${rows || `<tr><td colspan="9">${H.empty('Ürün bulunamadı', 'Arama ölçütlerini değiştirin.')}</td></tr>`}</tbody>
                    </table></div>
                    ${H.pager(list.length, bomState.page, bomState.size, 'bomPage')}
                </section>
                <p class="muted" style="font-size:.78em;margin-top:10px;">BOM malzeme maliyeti, malzeme kartlarındaki fiyatlarla (dövizliler güncel kurla) çok seviyeli hesaplanır ve ERP'deki kayıtlı maliyetle karşılaştırılır. Standart maliyet = (malzeme + işçilik) × (1 + genel gider %${S().costing.overheadPct}).</p>`;
        },
        after() {
            const el = document.getElementById('bomSearch');
            if (el && bomState.q) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
    };

    function variance(p) {
        if (!p.toplam) return 0;
        return (M.materialCost(p.kod) - p.toplam) / p.toplam * 100;
    }

    const rerenderSearch = U.debounce(() => app().render(), 250);
    Object.assign(MRP.actions, {
        bomCat: (c) => { bomState.cat = c; bomState.page = 1; bomState.q = ''; app().render(); },
        bomSearch: (v) => { bomState.q = v; bomState.page = 1; rerenderSearch(); },
        bomSort: (v) => { bomState.sort = v; app().render(); },
        bomReal: (_, el) => { bomState.onlyReal = el.checked; bomState.page = 1; app().render(); },
        bomPage: (p) => { bomState.page = +p; app().render(); },
        productDetail: (kod) => openProduct(kod),
        itemDetail: (kod) => openItem(kod),
        addProduct: () => openAddProduct(),
        deleteProduct: (kod) => deleteProduct(kod),
        editItem: (kod) => openEditItem(kod),
        treeToggle: (path, el) => {
            const modal = el.closest('.modal');
            const collapsed = el.dataset.collapsed === '1';
            el.dataset.collapsed = collapsed ? '0' : '1';
            el.innerHTML = MRP.icon(collapsed ? 'chevronDown' : 'chevronRight', 'sm');
            modal.querySelectorAll('tr[data-path]').forEach((tr) => {
                if (tr.dataset.path.startsWith(path + '/')) tr.hidden = !collapsed;
            });
        }
    });

    /** Satır maliyeti için kalemin TL birim değeri: üretilenlerde malzeme+işçilik (genel gider en üstte bir kez eklenir) */
    const lineUnit = (kod) => { if (!M.hasBom(kod)) return M.priceTRY(kod); const c = M.costParts(kod); return c.material + c.labor; };

    /** Çok seviyeli ağacı düz satır listesine çevirir */
    function explode(kod, mult = 1, level = 1, path = '0', out = [], guard = new Set()) {
        if (guard.has(kod) || level > 10) return out;
        guard.add(kod);
        M.bom(kod).forEach((l, i) => {
            const it = M.item(l.kod) || { kod: l.kod, ad: '(tanımsız kalem)', tur: '-', unit: '', price: 0, currency: 'TRY', procurement: 'buy' };
            const p = `${path}/${i}`;
            const hasKids = M.hasBom(l.kod);
            const unitCost = lineUnit(l.kod);
            out.push({ it, k: l.k, total: l.k * mult, level, path: p, hasKids, unitCost, cost: l.k * mult * unitCost });
            if (hasKids) explode(l.kod, mult * l.k, level + 1, p, out, guard);
        });
        guard.delete(kod);
        return out;
    }

    function routingTable(kod, qty = 1) {
        const ops = M.routing(kod);
        if (!ops.length) return '<p class="muted" style="font-size:.85em;">Rota tanımlı değil.</p>';
        return `<div class="table-wrap"><table><thead><tr><th>#</th><th>İş merkezi</th><th class="num">Hazırlık (dk)</th><th class="num">Birim süre (dk)</th><th class="num">Saat ücreti</th><th class="num">Birim işçilik ₺</th></tr></thead><tbody>
            ${ops.map((op, i) => { const wc = M.workCenter(op.wc) || { ad: '?', rate: 0, efficiency: 100 }; const lot = Math.max(1, S().costing.stdLot);
                return `<tr><td class="num">${(i + 1) * 10}</td><td class="strong">${esc(wc.ad)} <span class="muted mono">${esc(op.wc)}</span></td><td class="num">${U.num(op.setup, 0)}</td><td class="num">${U.num(op.run, 1)}</td>
                    <td class="num">${U.cur(wc.rate)}</td><td class="num">${U.num(M.opMinutes(op, lot) / lot * wc.rate / 60)}</td></tr>`; }).join('')}
            <tr class="total"><td colspan="5" class="text-right">Bu seviyenin birim işçiliği (std. parti ${S().costing.stdLot})</td><td class="num">${U.num(M.ownLabor(kod))}</td></tr>
            </tbody></table></div>`;
    }

    function openProduct(kod) {
        const p = M.product(kod);
        if (!p) return;
        const rows = explode(kod);
        const unitCost = M.unitCost(kod);
        const parts = M.costParts(kod);
        const mat = parts.material;
        const v = p.toplam ? (mat - p.toplam) / p.toplam * 100 : 0;
        const breakdown = Object.entries(M.costBreakdown(kod)).sort((a, b) => b[1] - a[1]);
        const exposure = Object.entries(M.currencyExposure(kod)).filter(([c]) => c !== 'TRY');
        const lvl1 = U.sum(rows.filter((r) => r.level === 1), (r) => r.cost);
        const body = `
            <div class="grid grid-3" style="margin-bottom:16px;">
                <dl class="dl card card-body">
                    <dt>Mamul kodu</dt><dd class="mono">${esc(p.kod)}</dd>
                    <dt>Kategori</dt><dd>${H.catTag(p.kategori)}</dd>
                    <dt>Bileşen (1. seviye)</dt><dd>${M.bom(kod).length}</dd>
                    <dt>Toplam satır</dt><dd>${rows.length}</dd>
                    <dt>Mamul stoğu</dt><dd>${U.qty(M.onHand(kod), 'ad')}</dd>
                    <dt>Üretim süresi</dt><dd>${M.item(kod).leadTime} gün</dd>
                </dl>
                <dl class="dl card card-body">
                    <dt>Malzeme</dt><dd>${U.cur(mat)}</dd>
                    <dt>İşçilik</dt><dd>${U.cur(parts.labor)}</dd>
                    <dt>Genel gider (%${S().costing.overheadPct})</dt><dd>${U.cur((mat + parts.labor) * M.overheadPct())}</dd>
                    <dt class="grand">Standart maliyet</dt><dd style="color:var(--accent);font-size:1.1em;">${U.cur(unitCost)}</dd>
                    <dt>Kayıtlı (ERP) maliyet</dt><dd>${U.cur(p.toplam)}</dd>
                    <dt>Malzeme sapması</dt><dd class="${Math.abs(v) > 15 ? 'tp-neg' : ''}">${p.toplam ? (v > 0 ? '+' : '') + U.num(v, 1) + '%' : '–'}</dd>
                </dl>
                <dl class="dl card card-body">
                    ${breakdown.map(([t, val]) => `<dt>${esc(t)}</dt><dd>${U.num(val)} <span class="muted">(${unitCost ? U.num(val / unitCost * 100, 1) : 0}%)</span></dd>`).join('')}
                    ${exposure.length ? `<dt style="margin-top:6px;">Dövize bağlı pay</dt><dd style="margin-top:6px;">${exposure.map(([c, val]) => `${c} ${U.num(val / unitCost * 100, 0)}%`).join(' · ')}</dd>` : ''}
                </dl>
            </div>
            ${rows.length ? `<div class="table-wrap" style="max-height:400px;"><table>
                <thead><tr><th>Seviye / Kod</th><th>Bileşen</th><th>Tür</th><th class="num">Katsayı</th><th class="num">1 Mamul İçin</th>
                    <th class="num">Birim Fiyat</th><th class="num">Birim ₺</th><th class="num">Tutar ₺</th><th>Stok</th></tr></thead>
                <tbody>${rows.map((r) => `<tr data-path="${r.path}" ${r.hasKids ? 'class="r-warn"' : ''}>
                    <td class="nowrap" style="padding-left:${12 + (r.level - 1) * 22}px;">
                        ${r.hasKids ? `<button class="tree-toggle" data-act="treeToggle" data-id="${r.path}" data-collapsed="0">${MRP.icon('chevronDown', 'sm')}</button>` : '<span style="display:inline-block;width:20px;"></span>'}
                        <span class="lvl">.${r.level}</span>${H.itemLink(r.it.kod)}</td>
                    <td class="strong">${esc(r.it.ad)}</td>
                    <td><span class="badge badge-gray plain">${esc(r.it.tur)}</span></td>
                    <td class="num">${U.num(r.k, 4)}</td>
                    <td class="num">${esc(U.qty(r.total, r.it.unit))}</td>
                    <td class="num">${r.hasKids ? '<span class="muted">alt reçete</span>' : esc(M.fmtMoney(r.it.price || 0, r.it.currency))}</td>
                    <td class="num">${U.num(r.unitCost)}</td>
                    <td class="num strong">${U.num(r.cost)}</td>
                    <td>${H.stockBadge(M.stockStatus(r.it.kod))}</td></tr>`).join('')}
                    <tr class="total"><td colspan="7" class="text-right">Bileşenler toplamı (alt seviye işçiliği dahil)</td><td class="num">${U.num(lvl1)}</td><td></td></tr>
                    <tr class="total"><td colspan="7" class="text-right">+ Montaj seviyesi işçiliği</td><td class="num">${U.num(M.ownLabor(kod))}</td><td></td></tr>
                    <tr class="total"><td colspan="7" class="text-right">+ Genel gider %${S().costing.overheadPct}</td><td class="num">${U.num(unitCost - lvl1 - M.ownLabor(kod))}</td><td></td></tr>
                    <tr class="total"><td colspan="7" class="text-right">Standart birim maliyet</td><td class="num" style="color:var(--accent);">${U.num(unitCost)}</td><td></td></tr>
                </tbody></table></div>` : H.empty('Reçete tanımlı değil', 'Bu ürün için bileşen girilmemiş.')}
            <h3 style="font-size:.9em;margin:16px 0 8px;">Üretim rotası</h3>${routingTable(kod)}
            <p class="muted" style="font-size:.76em;margin-top:8px;">Fiyatlar güncel kurla TL'ye çevrilir (${Object.entries(S().fx.rates).map(([c, r]) => `${c} ${U.num(r, 4)}`).join(' · ')}).</p>`;
        const buttons = [{ label: 'Kapat' }];
        if (MRP.auth.can('editCost')) buttons.push({ label: 'Kayıtlı Maliyet', icon: 'edit', onClick: () => { setTimeout(() => editRecordedCost(kod)); } });
        if (MRP.auth.can('manageCapacity')) buttons.push({ label: 'Rotayı Düzenle', icon: 'gauge', onClick: () => { setTimeout(() => editRouting(kod)); } });
        if (MRP.auth.can('runMRP')) buttons.push({ label: 'Ana Plana Ekle', cls: 'btn-primary', icon: 'plus', onClick: () => { MRP.actions.addDemand(kod); } });
        UI.modal({ title: `${p.kod} — ${p.ad}`, size: 'xl', body, buttons });
    }

    function editRecordedCost(kod) {
        if (!H.guard('editCost')) return;
        const p = M.product(kod);
        UI.modal({
            title: `Kayıtlı Maliyet — ${kod}`, size: 'sm',
            body: `<p class="muted" style="font-size:.85em;margin-bottom:12px;">ERP'deki referans maliyet. BOM malzeme maliyeti şu an <b>${U.cur(M.materialCost(kod))}</b>.</p>
                <div class="form-grid"><div class="field full"><label>Kayıtlı maliyet (₺)</label><input id="rcCost" type="number" min="0" step="0.01" value="${p.toplam}"></div></div>`,
            buttons: [{ label: 'Vazgeç' }, { label: 'BOM malzemesini kullan', onClick: (ctx) => { ctx.$('#rcCost').value = U.round(M.materialCost(kod), 2); return false; } }, {
                label: 'Kaydet', cls: 'btn-primary', onClick: (ctx) => {
                    const v = U.toNum(ctx.$('#rcCost').value, NaN);
                    if (!(v >= 0)) { UI.toast('Geçersiz maliyet', '', 'warn'); return false; }
                    if (p.custom) S().customProducts.find((x) => x.kod === kod).toplam = v;
                    else S().productOverrides[kod] = { ...(S().productOverrides[kod] || {}), toplam: v };
                    MRP.store.audit('Kayıtlı maliyet güncellendi', `${kod}: ${U.num(p.toplam)} → ${U.num(v)}`);
                    app().commit();
                    UI.toast('Kayıtlı maliyet güncellendi', kod, 'success');
                }
            }]
        });
    }

    function editRouting(kod) {
        if (!H.guard('manageCapacity')) return;
        const ops = M.routing(kod).map((o) => ({ ...o }));
        const wcOpts = (sel) => M.workCenters().map((w) => `<option value="${esc(w.id)}" ${w.id === sel ? 'selected' : ''}>${esc(w.ad)}</option>`).join('');
        const row = (o) => `<tr><td><select class="input input-sm rt-wc">${wcOpts(o.wc)}</select></td>
            <td><input class="input input-sm rt-setup" type="number" min="0" step="1" value="${o.setup}" style="text-align:right;"></td>
            <td><input class="input input-sm rt-run" type="number" min="0" step="0.1" value="${o.run}" style="text-align:right;"></td>
            <td><button class="btn btn-ghost btn-sm rt-del" type="button">${MRP.icon('x', 'sm')}</button></td></tr>`;
        const ctx = UI.modal({
            title: `Rota — ${kod}`, size: 'md',
            body: `<p class="muted" style="font-size:.85em;margin-bottom:10px;">Operasyonlar sırayla yapılır. Süreler dakika cinsindendir; kapasite yükü ve işçilik maliyeti bu rotadan hesaplanır.</p>

        const isCustom = !!S().customItems[kod];

        UI.modal({
            title: `Malzeme Kartı — ${it.kod}`, size: 'md',
            body: `<div class="form-grid">
                <div class="field full"><label>Malzeme adı</label><input id="eiAd" value="${esc(it.ad)}" ${ro(isCustom && canParams)}></div>

            },
            buttons: [{ label: 'Vazgeç' }, {
                label: 'Kaydet', cls: 'btn-primary', onClick: (ctx) => {

                        currency: ctx.$('#eiCur').value,

                        safetyStock: Math.max(0, U.toNum(ctx.$('#eiSS').value)),

                <tbody id="npRows"></tbody></table></div>
                <button class="btn btn-secondary btn-sm" type="button" id="npAddRow" style="margin-top:8px;">${MRP.icon('plus', 'sm')} Satır ekle</button>
            </div>
            <div class="totals"><dl class="dl"><dt>Bileşen sayısı</dt><dd id="npCount">0</dd><dt class="grand">Tahmini birim maliyet</dt><dd class="grand" id="npCost">0,00 ₺</dd></dl></div>`,
            buttons: [{ label: 'Vazgeç' }, { label: 'Ürünü Kaydet', cls: 'btn-success', icon: 'check', onClick: (c) => saveProduct(c) }]
        });
        const tbody = ctx.$('#npRows');
        const typeOpts = D.ITEM_TYPES.filter((t) => t !== 'Yarı Mamül İskelet').map((t) => `<option>${esc(t)}</option>`).join('');
        const addRow = (kod = '', k = 1) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><input class="input input-sm np-kod" list="npItems" value="${esc(kod)}" placeholder="HM.XXX"></td>
                <td><input class="input input-sm np-ad"></td>
                <td><select class="input input-sm np-tur">${typeOpts}</select></td>
                <td><input class="input input-sm np-k" type="number" min="0" step="any" value="${k}" style="text-align:right;"></td>
                <td><input class="input input-sm np-price" type="number" min="0" step="any" value="0" style="text-align:right;"></td>
                <td><button class="btn btn-ghost btn-sm np-del" type="button" title="Sil">${MRP.icon('x', 'sm')}</button></td>`;
            tbody.appendChild(tr);
            sync(tr);
        };
        const sync = (tr) => {
            const kod = tr.querySelector('.np-kod').value.trim();
            const it = kod ? M.item(kod) : null;
            const known = !!it && !it.isProduct;
            ['.np-ad', '.np-tur', '.np-price'].forEach((s) => { tr.querySelector(s).disabled = known; });
            if (known) {
                tr.querySelector('.np-ad').value = it.ad;
                if ([...tr.querySelector('.np-tur').options].some((o) => o.value === it.tur)) tr.querySelector('.np-tur').value = it.tur;
                tr.querySelector('.np-price').value = U.round(lineUnit(kod), 4);
            }
            recalc();
        };
        const recalc = () => {
            let n = 0, cost = 0;
            U.$$('tr', tbody).forEach((tr) => {
                const kod = tr.querySelector('.np-kod').value.trim();
                if (!kod) return;
                n++;
                cost += U.toNum(tr.querySelector('.np-k').value) * U.toNum(tr.querySelector('.np-price').value);
            });
            ctx.$('#npCount').textContent = n;
            ctx.$('#npCost').textContent = U.cur(cost);
        };
        tbody.addEventListener('input', (e) => { const tr = e.target.closest('tr'); if (e.target.classList.contains('np-kod')) sync(tr); else recalc(); });
        tbody.addEventListener('click', (e) => { if (e.target.closest('.np-del')) { e.target.closest('tr').remove(); recalc(); } });
        ctx.$('#npAddRow').addEventListener('click', () => addRow());
        ctx.$('#npTpl').addEventListener('click', () => {
            tbody.innerHTML = '';
            (D.BOM_TEMPLATES[ctx.$('#npCat').value] || []).forEach(([kod, , , k]) => addRow(kod, k));
        });
        addRow();
    }

    function saveProduct(ctx) {
        const kod = ctx.$('#npKod').value.trim().toUpperCase();
        const ad = ctx.$('#npAd').value.trim();
        const kategori = ctx.$('#npCat').value;
        if (!kod || !ad) { UI.toast('Eksik bilgi', 'Mamul kodu ve adı zorunludur.', 'warn'); return false; }
        if (!/^[A-ZÇĞİÖŞÜ0-9._-]+$/.test(kod)) { UI.toast('Geçersiz kod', 'Kod yalnızca harf, rakam, nokta, tire ve alt çizgi içerebilir.', 'warn'); return false; }
        if (M.product(kod) || M.items().some((i) => i.kod === kod)) { UI.toast('Kod kullanımda', `${kod} zaten tanımlı.`, 'error'); return false; }

        const lines = [];
        const newItems = {};
        for (const tr of ctx.$$('#npRows tr')) {
            const c = tr.querySelector('.np-kod').value.trim().toUpperCase();
            if (!c) continue;
            const k = U.toNum(tr.querySelector('.np-k').value);
            if (k <= 0) { UI.toast('Geçersiz katsayı', `${c} için katsayı sıfırdan büyük olmalı.`, 'warn'); return false; }
            if (c === kod) { UI.toast('Döngüsel reçete', 'Ürün kendi bileşeni olamaz.', 'warn'); return false; }
            if (lines.some((l) => l.kod === c)) { UI.toast('Tekrarlanan bileşen', c, 'warn'); return false; }
            if (!M.item(c)) {
                const adC = tr.querySelector('.np-ad').value.trim();
                if (!adC) { UI.toast('Bileşen adı gerekli', `${c} yeni bir kalem; adını girin.`, 'warn'); return false; }
                const tur = tr.querySelector('.np-tur').value;
                newItems[c] = {
                    kod: c, ad: adC, tur, unit: D.UNIT_BY_TYPE[tur] || 'ad', price: U.toNum(tr.querySelector('.np-price').value), currency: 'TRY',
                    procurement: tur === 'Fason İşçilik' ? 'service' : 'buy', leadTime: 7, safetyStock: 0, lotPolicy: 'L4L', lotSize: 0
                };
            }
            lines.push({ kod: c, k });
        }
        if (!lines.length) { UI.toast('Reçete boş', 'En az bir bileşen ekleyin.', 'warn'); return false; }

        Object.assign(S().customItems, newItems);
        S().customBoms[kod] = lines;
        S().customProducts.push({ kod, ad, kategori, bilesen: lines.length, fason: 0, hammadde: 0, iroko: 0, toplam: 0, createdAt: new Date().toISOString() });
        M.invalidate();
        const br = M.costBreakdown(kod);
        const p = S().customProducts[S().customProducts.length - 1];
        p.toplam = U.round(M.materialCost(kod), 2);
        p.fason = U.round(br['Fason İşçilik'] || 0, 2);
        p.iroko = U.round(br['İroko Kereste'] || 0, 2);
        p.hammadde = U.round(p.toplam - p.fason, 2);
        MRP.store.audit('Ürün eklendi', `${kod} — ${ad} (${lines.length} bileşen, ${Object.keys(newItems).length} yeni kalem)`);
        MRP.store.notify('product', 'Yeni ürün tanımlandı', `${kod} — ${ad}`, ['admin', 'planlama'], 'bom');
        bomState.cat = kategori; bomState.q = kod; bomState.page = 1;
        app().commit();
        UI.toast('Ürün kaydedildi', `${kod} · ${U.cur(p.toplam)}`, 'success');
    }

    async function deleteProduct(kod) {
        if (!H.guard('editProduct')) return;
        const st = S();
        if (st.mps.some((d) => d.kod === kod) || st.workOrders.some((w) => w.kod === kod && (w.status === 'planned' || w.status === 'released'))) {
            return UI.toast('Silinemez', 'Ürün ana planda veya açık bir iş emrinde kullanılıyor.', 'error');
        }
        if (!(await UI.confirm(`${kod} ürünü ve reçetesi silinecek. Emin misiniz?`, { title: 'Ürünü sil', okLabel: 'Sil', danger: true }))) return;
        st.customProducts = st.customProducts.filter((p) => p.kod !== kod);
        delete st.customBoms[kod];
        MRP.store.audit('Ürün silindi', kod);
        app().commit();
        UI.toast('Ürün silindi', kod, 'info');
    }
