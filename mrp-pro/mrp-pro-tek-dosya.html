<style>
/* assets/css/app.css */
/* ==========================================================================
   MRP Pro — Uygulama stilleri
   ========================================================================== */

:root {
    --bg: #0b1020;
    --bg-elev: #111729;
    --bg-elev-2: #161e33;
    --bg-input: #0e1426;
    --bg-hover: #1b2440;
    --border: #232c45;
    --border-strong: #2f3a5a;
    --text: #e6e9f2;
    --text-2: #b4bcd0;
    --text-3: #7f89a3;
    --accent: #f59e0b;
    --accent-2: #d97706;
    --accent-soft: rgba(245, 158, 11, .14);
    --on-accent: #1a1204;
    --blue: #3b82f6;  --blue-soft: rgba(59,130,246,.15);
    --green: #10b981; --green-soft: rgba(16,185,129,.15);
    --red: #ef4444;   --red-soft: rgba(239,68,68,.14);
    --amber: #f59e0b; --amber-soft: rgba(245,158,11,.15);
    --violet: #8b5cf6; --violet-soft: rgba(139,92,246,.15);
    --cyan: #06b6d4;  --cyan-soft: rgba(6,182,212,.15);
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --radius: 12px;
    --radius-sm: 8px;
    --sidebar-w: 248px;
    --mono: 'JetBrains Mono', Consolas, monospace;
    color-scheme: dark;
}
body.light {
    --bg: #f4f6fa;
    --bg-elev: #ffffff;
    --bg-elev-2: #f8fafc;
    --bg-input: #ffffff;
    --bg-hover: #eef2f8;
    --border: #e3e8f0;
    --border-strong: #cfd7e3;
    --text: #172033;
    --text-2: #3d4a63;
    --text-3: #6b7790;
    --accent: #d97706;
    --accent-2: #b45309;
    --accent-soft: rgba(217,119,6,.12);
    --on-accent: #ffffff;
    --shadow: 0 10px 30px rgba(15,23,42,.08);
    color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--text-3); }
.text-right { text-align: right; }
.nowrap { white-space: nowrap; }
.icon { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 15px; height: 15px; }

/* ---------- Buttons ---------- */
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid transparent;
    font-weight: 600; font-size: .86em; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-2); }
.btn-secondary { background: var(--bg-elev-2); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: var(--bg-hover); }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover:not(:disabled) { filter: brightness(.92); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(.92); }
.btn-violet { background: var(--violet); color: #fff; }
.btn-violet:hover:not(:disabled) { filter: brightness(.92); }
.btn-sm { padding: 5px 10px; font-size: .8em; }
.btn-icon { padding: 7px; }

/* ---------- Badges ---------- */
.badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px; border-radius: 999px; font-size: .74em; font-weight: 700;
    letter-spacing: .2px; white-space: nowrap; border: 1px solid transparent;
}
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.plain::before { display: none; }
.badge-gray   { background: var(--bg-hover); color: var(--text-2); }
.badge-red    { background: var(--red-soft); color: var(--red); }
.badge-amber  { background: var(--amber-soft); color: var(--amber); }
.badge-green  { background: var(--green-soft); color: var(--green); }
.badge-blue   { background: var(--blue-soft); color: var(--blue); }
.badge-violet { background: var(--violet-soft); color: var(--violet); }
.badge-cyan   { background: var(--cyan-soft); color: var(--cyan); }

/* ---------- Login ---------- */
.login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto; z-index: 50;
    background:
        radial-gradient(circle at 15% 20%, rgba(245,158,11,.14), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(59,130,246,.12), transparent 40%),
        var(--bg);
}
.login-card {
    width: 100%; max-width: 440px; background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 18px; padding: 34px 32px; box-shadow: var(--shadow);
}
.login-logos { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding-bottom: 20px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
.brand-logo { height: 40px; width: auto; background: #fff; border-radius: 8px; padding: 5px 10px; }
.login-title { text-align: center; margin-bottom: 22px; }
.login-title h1 { font-size: 1.45em; font-weight: 800; letter-spacing: -.3px; }
.login-title p { color: var(--text-3); font-size: .88em; margin-top: 4px; }
.login-error { display: none; background: var(--red-soft); color: var(--red); border: 1px solid var(--red); padding: 9px 12px; border-radius: var(--radius-sm); font-size: .85em; margin-bottom: 14px; }
.login-error.show { display: block; animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.login-demo { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.login-demo h4 { font-size: .74em; text-transform: uppercase; letter-spacing: .8px; color: var(--text-3); margin-bottom: 8px; text-align: center; }
.demo-row { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: .84em; border: 0; background: none; width: 100%; text-align: left; }
.demo-row:hover { background: var(--bg-hover); }
.demo-row .r { font-weight: 600; }
.demo-row .c { font-family: var(--mono); color: var(--text-3); font-size: .9em; }
.login-note { margin-top: 12px; font-size: .74em; color: var(--text-3); text-align: center; }
.theme-fab { position: fixed; top: 16px; right: 16px; z-index: 60; }

/* ---------- Form ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: .74em; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); }
.field .req { color: var(--red); }
.field .hint { font-size: .75em; color: var(--text-3); }
.input, .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px; background: var(--bg-input); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input[readonly] { background: var(--bg-elev-2); color: var(--text-2); }
textarea { resize: vertical; min-height: 70px; }
.input-sm { padding: 5px 8px; font-size: .86em; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-section + .form-section { margin-top: 22px; }
.form-section h3 { font-size: .8em; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); margin-bottom: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
.check-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; font-size: .84em; background: var(--bg-elev-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- App shell ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-elev); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 40;
}
.sb-brand { display: flex; align-items: center; gap: 11px; padding: 18px 18px 16px; border-bottom: 1px solid var(--border); }
.sb-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #f59e0b, #dc2626); display: grid; place-items: center; font-weight: 900; color: #1a1204; }
.sb-brand b { display: block; font-size: 1.02em; letter-spacing: -.2px; }
.sb-brand small { color: var(--text-3); font-size: .74em; }
.sb-nav { flex: 1; overflow-y: auto; padding: 10px 10px 20px; }
.sb-group { margin-top: 14px; }
.sb-group-title { font-size: .68em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); padding: 0 10px 6px; }
.sb-link {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
    color: var(--text-2); text-decoration: none; font-weight: 500; font-size: .9em; cursor: pointer;
}
.sb-link:hover { background: var(--bg-hover); color: var(--text); }
.sb-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sb-link .count { margin-left: auto; font-size: .74em; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--bg-hover); color: var(--text-2); }
.sb-link .count.alert { background: var(--red); color: #fff; }
.sb-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; justify-content: center; }
.sb-foot .brand-logo { height: 26px; padding: 3px 7px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
    padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
}
.topbar .menu-btn { display: none; }
.page-title { flex: 1; min-width: 0; }
.page-title h1 { font-size: 1.15em; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-title p { font-size: .78em; color: var(--text-3); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 12px 4px 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-elev); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .78em; color: #fff; }
.avatar.admin { background: linear-gradient(135deg,#f59e0b,#d97706); color: #1a1204; }
.avatar.planlama { background: linear-gradient(135deg,#3b82f6,#1d4ed8); }
.avatar.satinalma { background: linear-gradient(135deg,#8b5cf6,#6d28d9); }
.avatar.satinalma_muduru { background: linear-gradient(135deg,#10b981,#059669); }
.user-chip .n { font-size: .82em; font-weight: 600; line-height: 1.2; }
.user-chip .r { font-size: .7em; color: var(--text-3); }
.content { padding: 22px 24px 40px; max-width: 1640px; width: 100%; margin: 0 auto; }

.notif-wrap { position: relative; }
.notif-dot { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: .68em; font-weight: 800; display: grid; place-items: center; }
.popover {
    position: absolute; top: calc(100% + 8px); right: 0; width: 380px; max-width: calc(100vw - 24px);
    background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow);
    z-index: 100; overflow: hidden; animation: pop .15s ease;
}
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
.popover-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.popover-head h4 { font-size: .9em; }
.popover-body { max-height: 420px; overflow-y: auto; }
.menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 14px; background: none; border: 0; cursor: pointer; text-align: left; font-size: .87em; }
.menu-item:hover { background: var(--bg-hover); }
.notif-item { padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.notif-item:hover { background: var(--bg-hover); }
.notif-item.unread { box-shadow: inset 3px 0 0 var(--accent); }
.notif-item .t { font-weight: 600; font-size: .86em; display: flex; justify-content: space-between; gap: 8px; }
.notif-item .t small { color: var(--text-3); font-weight: 400; white-space: nowrap; }
.notif-item .m { font-size: .8em; color: var(--text-2); margin-top: 3px; }

/* ---------- Cards & layout ---------- */
.card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-head h2 { font-size: .98em; font-weight: 700; }
.card-head p { font-size: .78em; color: var(--text-3); }
.card-body { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.stack > * + * { margin-top: 16px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .spacer { flex: 1; }
.toolbar .input { width: auto; min-width: 220px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 17px; position: relative; overflow: hidden; }
.kpi::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--kpi-c, var(--accent)); }
.kpi .l { font-size: .72em; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--text-3); }
.kpi .v { font-size: 1.45em; font-weight: 800; margin: 5px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.kpi .s { font-size: .76em; color: var(--text-3); }
.kpi.blue { --kpi-c: var(--blue); } .kpi.green { --kpi-c: var(--green); } .kpi.red { --kpi-c: var(--red); }
.kpi.violet { --kpi-c: var(--violet); } .kpi.cyan { --kpi-c: var(--cyan); }

.chart-box { position: relative; height: 270px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
.tab { padding: 7px 12px; border: 0; background: none; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-2); font-weight: 600; font-size: .84em; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover { background: var(--bg-hover); color: var(--text); }
.tab.active { background: var(--accent); color: var(--on-accent); }
.tab .n { font-size: .82em; padding: 0 6px; border-radius: 999px; background: rgba(127,137,163,.2); }
.tab.active .n { background: rgba(0,0,0,.15); }

/* ---------- Banners ---------- */
.banner { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: var(--radius); border: 1px solid; margin-bottom: 16px; }
.banner .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
.banner .tx { flex: 1; min-width: 0; }
.banner h4 { font-size: .92em; }
.banner p { font-size: .82em; color: var(--text-2); }
.banner.red { background: var(--red-soft); border-color: rgba(239,68,68,.45); }
.banner.red .ic { background: var(--red); color: #fff; }
.banner.amber { background: var(--amber-soft); border-color: rgba(245,158,11,.45); }
.banner.amber .ic { background: var(--amber); color: #1a1204; }
.banner.green { background: var(--green-soft); border-color: rgba(16,185,129,.45); }
.banner.green .ic { background: var(--green); color: #fff; }
.banner.blue { background: var(--blue-soft); border-color: rgba(59,130,246,.45); }
.banner.blue .ic { background: var(--blue); color: #fff; }

/* ---------- Tables ---------- */
.table-wrap { overflow: auto; max-height: 620px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-elev); }
.card .table-wrap { border: 0; border-radius: 0 0 var(--radius) var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: .84em; }
thead th {
    position: sticky; top: 0; z-index: 2; background: var(--bg-elev-2); text-align: left; padding: 10px 12px;
    font-size: .76em; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3);
    border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: middle; }
tbody tr:hover td { background: var(--bg-hover); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.strong { color: var(--text); font-weight: 600; }
tr.r-crit td { background: rgba(239,68,68,.06); }
tr.r-warn td { background: rgba(245,158,11,.05); }
tr.r-new td { background: rgba(16,185,129,.06); }
tr.total td { background: var(--bg-elev-2); font-weight: 700; color: var(--text); border-top: 2px solid var(--border-strong); }
td.mono { white-space: nowrap; }
td.code { font-family: var(--mono); font-size: .92em; color: var(--blue); font-weight: 600; white-space: nowrap; }
body.light td.mono { white-space: nowrap; }
td.code { color: #1d4ed8; }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; }
.link { background: none; border: 0; color: var(--blue); cursor: pointer; font-weight: 600; padding: 0; text-align: left; }
.link:hover { text-decoration: underline; }
.empty { text-align: center; padding: 46px 20px; color: var(--text-3); }
.empty h3 { color: var(--text-2); font-size: 1em; margin-bottom: 4px; }

.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; font-size: .82em; color: var(--text-3); border-top: 1px solid var(--border); }

.bar { display: inline-block; width: 90px; height: 6px; border-radius: 3px; background: var(--bg-hover); overflow: hidden; vertical-align: middle; }
.bar > span { display: block; height: 100%; border-radius: 3px; }

/* BOM tree */
.tree-toggle { width: 20px; height: 20px; border: 0; background: none; cursor: pointer; color: var(--text-3); display: inline-grid; place-items: center; border-radius: 4px; }
.tree-toggle:hover { background: var(--bg-hover); color: var(--text); }
.lvl { display: inline-block; min-width: 22px; font-size: .74em; font-weight: 700; color: var(--text-3); }

/* Time-phased grid */
.tp-table td, .tp-table th { text-align: right; }
.tp-table td:first-child, .tp-table th:first-child { text-align: left; position: sticky; left: 0; background: var(--bg-elev-2); z-index: 1; }
.tp-neg { color: var(--red) !important; font-weight: 700; }
.tp-pos { color: var(--green) !important; font-weight: 600; }

/* Summary list */
.dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: .86em; }
.dl dt { color: var(--text-3); }
.dl dd { font-weight: 600; text-align: right; }

/* Request / PO cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
.doc-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 17px; display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--doc-c, var(--border-strong)); }
.doc-card .h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.doc-card .h b { font-family: var(--mono); font-size: .95em; }
.doc-card .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: .8em; color: var(--text-2); }
.doc-card .meta span { color: var(--text-3); display: block; font-size: .9em; }
.doc-card .acts { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--border); margin-top: auto; }
.doc-card .amount { font-size: 1.1em; font-weight: 800; color: var(--accent); white-space: nowrap; }

.timeline { display: flex; flex-direction: column; gap: 8px; }
.timeline .ev { display: flex; gap: 10px; padding: 9px 12px; background: var(--bg-elev-2); border-radius: var(--radius-sm); font-size: .84em; }
.timeline .ev .d { color: var(--text-3); font-size: .9em; }
.comment { display: flex; gap: 10px; padding: 10px 12px; background: var(--bg-elev-2); border-radius: var(--radius-sm); }
.comment + .comment { margin-top: 8px; }
.comment .avatar { width: 28px; height: 28px; font-size: .7em; }
.comment .who { font-size: .8em; font-weight: 600; }
.comment .who small { color: var(--text-3); font-weight: 400; }
.comment .tx { font-size: .86em; color: var(--text-2); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }

/* Gantt */
.gantt { min-width: 760px; }
.gantt-head, .gantt-row { display: grid; grid-template-columns: 250px 1fr 150px; gap: 12px; align-items: center; }
.gantt-head { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .72em; text-transform: uppercase; font-weight: 700; color: var(--text-3); }
.gantt-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
.gantt-track { position: relative; height: 26px; background: var(--bg-elev-2); border-radius: 6px; }
.gantt-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; font-size: .72em; font-weight: 700; color: #fff; display: flex; align-items: center; padding: 0 8px; overflow: hidden; white-space: nowrap; min-width: 6px; }
.gantt-today { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--red); z-index: 2; }
.gantt-label { font-size: .84em; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gantt-label small { display: block; font-family: var(--mono); color: var(--text-3); font-weight: 500; font-size: .86em; }

/* Supplier cards */
.sup-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 17px; cursor: pointer; transition: border-color .15s, transform .15s; }
.sup-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.sup-card.passive { opacity: .55; }
.sup-card h3 { font-size: .95em; display: flex; justify-content: space-between; gap: 8px; }
.stars { color: var(--amber); letter-spacing: 1px; font-size: .9em; white-space: nowrap; }
.sup-card .info { font-size: .8em; color: var(--text-2); margin-top: 8px; display: grid; gap: 3px; }

/* Exceptions list */
.exc { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: .84em; align-items: flex-start; }
.exc:last-child { border-bottom: 0; }
.exc .sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.exc .sev.critical { background: var(--red); } .exc .sev.warn { background: var(--amber); } .exc .sev.info { background: var(--blue); }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(5,8,18,.65); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: 100%; max-width: 720px; background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: 16px; box-shadow: var(--shadow); animation: rise .2s ease; }
.modal.lg { max-width: 960px; } .modal.xl { max-width: 1180px; } .modal.sm { max-width: 460px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 1.02em; font-weight: 700; }
.modal-body { padding: 20px; max-height: calc(100vh - 220px); overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--bg-elev-2); border-radius: 0 0 16px 16px; flex-wrap: wrap; }
.totals { margin-top: 14px; margin-left: auto; max-width: 340px; }
.totals .dl dd { font-family: var(--mono); }
.totals .grand { border-top: 2px solid var(--accent); padding-top: 7px; font-size: 1.05em; }

/* ---------- Toast ---------- */
.toast-stack { position: fixed; bottom: 16px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; min-width: 280px; max-width: 400px; display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px; background: var(--bg-elev); border: 1px solid var(--border-strong); border-left: 4px solid var(--blue); border-radius: 10px; box-shadow: var(--shadow); animation: tin .25s ease; }
.toast.success { border-left-color: var(--green); } .toast.error { border-left-color: var(--red); } .toast.warn { border-left-color: var(--amber); }
.toast b { font-size: .88em; display: block; }
.toast span { font-size: .8em; color: var(--text-2); }
.toast .x { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--text-3); }
.toast.out { animation: tout .25s ease forwards; }
@keyframes tin { from { opacity: 0; transform: translateY(16px); } }
@keyframes tout { to { opacity: 0; transform: translateY(16px); } }

/* ---------- Responsive ---------- */
.sb-backdrop { display: none; }
@media (max-width: 1024px) {
    .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
    .sidebar.open { transform: none; }
    .sb-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 35; }
    .topbar .menu-btn { display: inline-flex; }
    .user-chip .meta { display: none; }

}
@media (max-width: 720px) {
    .content { padding: 16px; }
    .topbar { padding: 10px 16px; }
    .grid-2, .grid-3, .cards { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .page-title p { display: none; }
    .toolbar .input { min-width: 0; flex: 1; }
    .hide-sm { display: none; }
}

@media print {
    .sidebar, .topbar, .toolbar, .btn, .tabs { display: none !important; }
    body { background: #fff; color: #000; }

    .table-wrap { max-height: none; overflow: visible; }
}

    };

    U.diffDays = (a, b) => Math.round((U.parseDate(a) - U.parseDate(b)) / 86400000);

        const s = (Date.now() - new Date(d).getTime()) / 1000;
        if (s < 60) return 'az önce';

        const x = U.parseDate(d);

        return 1 + Math.round(((x - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);

    U.debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

    // UI: Toast, Modal, Onay, Metin girişi
    // ======================================================================
    const UI = {};

    UI.toast = (title, message = '', type = 'info', duration = 3800) => {
        const host = document.getElementById('toasts');
        if (!host) return;
        const ic = { success: 'check', error: 'x', warn: 'alert', info: 'info' }[type] || 'info';
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.setAttribute('role', 'status');
        el.innerHTML = `${MRP.icon(ic)}<div><b>${U.esc(title)}</b>${message ? `<span>${U.esc(message)}</span>` : ''}</div>
            <button class="x" aria-label="Kapat">${MRP.icon('x', 'sm')}</button>`;
        const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 250); };
        el.querySelector('.x').addEventListener('click', close);
        host.appendChild(el);
        setTimeout(close, duration);
    };

    /**
     * Genel modal.
     * @param {object} o  { title, body, size, buttons:[{label, cls, onClick(ctx) → false ise kapanmaz}], onOpen(ctx), onClose }
     */
    UI.modal = (o) => {
        const root = document.getElementById('modalRoot');
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal ${o.size || ''}" role="dialog" aria-modal="true">
                <div class="modal-head"><h2>${U.esc(o.title)}</h2>
                    <button class="btn btn-ghost btn-icon" data-close aria-label="Kapat">${MRP.icon('x')}</button></div>
                <div class="modal-body">${o.body || ''}</div>
                ${o.buttons && o.buttons.length ? '<div class="modal-foot"></div>' : ''}
            </div>`;
        const ctx = {
            el: overlay,
            body: overlay.querySelector('.modal-body'),
            $: (s) => overlay.querySelector(s),
            $$: (s) => [...overlay.querySelectorAll(s)],
            close: () => {
                overlay.remove();
                document.removeEventListener('keydown', onKey);
                if (o.onClose) o.onClose();
            }
        };
        const onKey = (e) => { if (e.key === 'Escape' && root.lastElementChild === overlay) ctx.close(); };
        document.addEventListener('keydown', onKey);
        overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) ctx.close(); });
        overlay.querySelector('[data-close]').addEventListener('click', ctx.close);
        const foot = overlay.querySelector('.modal-foot');
        (o.buttons || []).forEach((b) => {
            const btn = document.createElement('button');
            btn.className = `btn ${b.cls || 'btn-secondary'}`;
            btn.innerHTML = (b.icon ? MRP.icon(b.icon) : '') + U.esc(b.label);
            btn.addEventListener('click', async () => {
                if (!b.onClick) return ctx.close();
                btn.disabled = true;
                try {
                    const r = await b.onClick(ctx);
                    if (r !== false) ctx.close();
                } finally { btn.disabled = false; }
            });
            foot.appendChild(btn);
        });
        root.appendChild(overlay);
        if (o.onOpen) o.onOpen(ctx);
        const first = overlay.querySelector('input:not([readonly]), select, textarea');
        if (first) setTimeout(() => first.focus(), 30);
        return ctx;
    };

    UI.confirm = (message, { title = 'Onay', okLabel = 'Onayla', danger = false } = {}) => new Promise((resolve) => {
        let result = false;
        UI.modal({
            title, size: 'sm',
            body: `<p>${U.esc(message)}</p>`,
            onClose: () => resolve(result),
            buttons: [
                { label: 'Vazgeç' },
                { label: okLabel, cls: danger ? 'btn-danger' : 'btn-primary', onClick: () => { result = true; } }
            ]
        });
    });

    UI.promptText = ({ title, label, placeholder = '', required = false, multiline = true, okLabel = 'Kaydet' }) => new Promise((resolve) => {
        let result = null;
        UI.modal({
            title, size: 'sm',
            body: `<div class="field"><label>${U.esc(label)}${required ? ' <span class="req">*</span>' : ''}</label>
                ${multiline ? `<textarea id="pt" placeholder="${U.esc(placeholder)}"></textarea>` : `<input id="pt" placeholder="${U.esc(placeholder)}">`}</div>`,
            onClose: () => resolve(result),
            buttons: [
                { label: 'Vazgeç' },
                {
                    label: okLabel, cls: 'btn-primary', onClick: (ctx) => {
                        const v = ctx.$('#pt').value.trim();
                        if (required && !v) { UI.toast('Bu alan zorunludur', '', 'warn'); return false; }
                        result = v;
                    }
                }
            ]
        });
    });

    MRP.UI = UI;
})(window.MRP);
</script>

    /** Malzeme kartlarının varsayılan değerleri (tedarik tipi, süre, emniyet stoğu, parti politikası) */
    function buildItemMaster() {
        const items = {};
        const add = (kod, ad, tur, price, unitOverride) => {
            if (items[kod]) return;
            const unit = unitOverride || UNIT_BY_TYPE[tur] || 'ad';
            const h = MRP.U.hash(kod);
            const procurement = tur === 'Yarı Mamül İskelet' ? 'make' : tur === 'Fason İşçilik' ? 'service' : 'buy';
            let lotPolicy = 'L4L', lotSize = 0;
            if (tur === 'Bağlantı') { lotPolicy = 'FOQ'; lotSize = 500; }
            else if (tur === 'Ambalaj') { lotPolicy = 'FOQ'; lotSize = 50; }
            else if (tur === 'Profil') { lotPolicy = 'MIN'; lotSize = 60; }
            else if (tur === 'İroko Kereste') { lotPolicy = 'MIN'; lotSize = 0.5; }
            let safety;
            if (unit === 'm³') safety = 0.8;
            else if (unit === 'kg') safety = 10 + (h % 20);
            else if (unit === 'm') safety = 40 + (h % 60);
            else safety = procurement === 'make' ? 20 : 40 + (h % 120);
            if (procurement === 'service') safety = 0;
            items[kod] = {
                kod, ad, tur, unit, price: MRP.U.round(price, 4), procurement,
                leadTime: LEAD_BY_TYPE[tur] ?? 7, safetyStock: safety, lotPolicy, lotSize
            };
        };
        Object.values(BOM_TEMPLATES).forEach((lines) => lines.forEach(([kod, ad, tur, k, b]) => add(kod, ad, tur, k > 0 ? b / k : 0)));
        Object.entries(RAW_EXTRA).forEach(([kod, [ad, tur, unit, price]]) => add(kod, ad, tur, price, unit));
        return items;
    }

    /** Başlangıç stok seviyeleri (deterministik) — bazı kalemler bilerek kritik bırakılır */
    function buildInitialStock(items) {
        const stock = {};
        let forcedCrit = 0;
        Object.values(items).forEach((it) => {
            if (it.procurement === 'service') return;
            const h = MRP.U.hash(it.kod + '#s');
            let qty;
            if (it.unit === 'm³') qty = 0.4 + (h % 40) / 10;
            else if (it.unit === 'kg') qty = 5 + (h % 140);
            else if (it.unit === 'm') qty = 30 + (h % 600);
            else qty = it.procurement === 'make' ? h % 60 : 60 + (h % 1600);
            if (it.procurement === 'buy' && h % 5 === 0 && forcedCrit < 6) { qty = it.safetyStock * 0.3; forcedCrit++; }
            stock[it.kod] = MRP.U.round(it.unit === 'ad' ? Math.floor(qty) : qty, 3);
        });
        return stock;
    }

<script>

/* ==========================================================================
   MRP Pro — Kalıcı durum (localStorage), numaralandırma, bildirim ve denetim kaydı
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U;
    const KEY = 'mrppro.v2.state';
    const MAX_MOVEMENTS = 3000;
    const MAX_AUDIT = 1000;
    const MAX_NOTIFS = 150;

    function defaultState() {
        const items = MRP.data.buildItemMaster();
        const today = U.today();
        return {
            version: 2,
            createdAt: new Date().toISOString(),
            itemOverrides: {},          // malzeme kartı parametre değişiklikleri
            customItems: {},            // kullanıcı tarafından eklenen malzemeler
            customProducts: [],
            customBoms: {},             // { mamulKod: [{kod, k}] }
            stock: MRP.data.buildInitialStock(items),
            movements: [],
            mps: [                      // Ana Üretim Planı (bağımsız talep)
                { id: 'MPS-1', kod: 'BG.212.A', qty: 40, dueDate: U.iso(U.addDays(today, 18)), note: 'Otel projesi' },
                { id: 'MPS-2', kod: 'BG.06.A', qty: 120, dueDate: U.iso(U.addDays(today, 14)), note: 'Bayi siparişi' },
                { id: 'MPS-3', kod: 'BG.100.A', qty: 60, dueDate: U.iso(U.addDays(today, 28)), note: 'Sezon stoğu' }
            ],
            lastRun: null,
            requests: [],
            pos: [],
            workOrders: [],
            suppliers: JSON.parse(JSON.stringify(MRP.data.SUPPLIERS)),
            notifications: [],
            audit: [],
            seq: {}
        };
    }

    let state = null;

    function load() {
        try {
            const raw = localStorage.getItem(KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && parsed.version === 2) { state = Object.assign(defaultState(), parsed); return state; }
            }
        } catch (e) { console.warn('Durum okunamadı, varsayılan veriler kullanılıyor.', e); }
        state = defaultState();
        save();
        return state;
    }

    function save() {
        try {
            if (state.movements.length > MAX_MOVEMENTS) state.movements = state.movements.slice(-MAX_MOVEMENTS);
            if (state.audit.length > MAX_AUDIT) state.audit = state.audit.slice(-MAX_AUDIT);
            if (state.notifications.length > MAX_NOTIFS) state.notifications = state.notifications.slice(0, MAX_NOTIFS);
            localStorage.setItem(KEY, JSON.stringify(state));
        } catch (e) {
            console.error(e);
            MRP.UI.toast('Veri kaydedilemedi', 'Tarayıcı depolama alanı dolu veya engelli olabilir.', 'error', 6000);
        }
    }

    /** Belge numarası: PREFIX-YIL-0001 (silmeye/yeniden saymaya dayanıklı sıra) */
    function nextNo(prefix) {
        const year = new Date().getFullYear();
        const key = `${prefix}-${year}`;
        state.seq[key] = (state.seq[key] || 0) + 1;
        return `${key}-${String(state.seq[key]).padStart(4, '0')}`;
    }

    function audit(action, detail) {
        const u = MRP.auth.current();
        state.audit.push({ at: new Date().toISOString(), user: u ? u.name : 'sistem', role: u ? u.roleName : '', action, detail });
    }

    function notify(type, title, message, roles, link) {
        state.notifications.unshift({
            id: U.uid('n'), type, title, message, roles: roles || ['admin'], link: link || null,
            readBy: [], at: new Date().toISOString()
        });
    }

    function reset() {
        localStorage.removeItem(KEY);
        state = defaultState();
        save();
    }

    MRP.store = {
        load, save, nextNo, audit, notify, reset,
        get state() { return state; }
    };
})(window.MRP);
</script>

<script>
/* assets/js/model.js */
/* ==========================================================================
   MRP Pro — İş modeli: ürünler, malzeme kartları, ürün ağacı, maliyet, stok
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U;
    const D = MRP.data;
    const S = () => MRP.store.state;

    let staticProducts = [];
    let baseItems = {};
    let cache = {};

    const MOVE_TYPES = {
        GR: { label: 'Mal Kabul', badge: 'badge-green' },
        GI: { label: 'Üretime Sarf', badge: 'badge-amber' },
        FG: { label: 'Üretimden Giriş', badge: 'badge-blue' },
        ADJ: { label: 'Sayım Düzeltme', badge: 'badge-violet' }
    };
    const PROCUREMENT = { buy: 'Satın Alma', make: 'Üretim', service: 'Fason / Hizmet' };
    const LOT_POLICIES = { L4L: 'Lot-for-Lot (ihtiyaç kadar)', FOQ: 'Sabit Parti (katları)', MIN: 'Minimum Sipariş' };

    const M = { MOVE_TYPES, PROCUREMENT, LOT_POLICIES };

    M.init = () => {
        staticProducts = D.buildProducts();
        baseItems = D.buildItemMaster();
        M.invalidate();
    };
    M.invalidate = () => { cache = {}; };

    // ---------------- Ürünler ----------------
    M.products = () => {
        if (!cache.products) {
            cache.products = [...staticProducts, ...S().customProducts.map((p) => ({ ...p, custom: true }))];
            cache.productIndex = new Map(cache.products.map((p) => [p.kod, p]));
        }
        return cache.products;
    };
    M.product = (kod) => { M.products(); return cache.productIndex.get(kod) || null; };
    M.isProduct = (kod) => !!M.product(kod);

    // ---------------- Malzeme kartları ----------------
    M.items = () => {
        if (!cache.items) {
            const all = { ...baseItems, ...S().customItems };
            cache.items = Object.values(all).map((it) => ({ ...it, ...(S().itemOverrides[it.kod] || {}) }))
                .sort((a, b) => a.kod.localeCompare(b.kod));
            cache.itemIndex = new Map(cache.items.map((i) => [i.kod, i]));
        }
        return cache.items;
    };
    /** Malzeme veya mamul için birleşik kart (mamuller "üretim" tipinde sanal karttır) */
    M.item = (kod) => {
        M.items();
        const it = cache.itemIndex.get(kod);
        if (it) return it;
        const p = M.product(kod);
        if (!p) return null;
        return {
            kod, ad: p.ad, tur: 'Mamul', unit: 'ad', procurement: 'make', isProduct: true,
            price: M.unitCost(kod), leadTime: (D.CATEGORY_STYLE[p.kategori] || {}).lead || 5,
            safetyStock: 0, lotPolicy: 'L4L', lotSize: 0, kategori: p.kategori
        };
    };

    // ---------------- Ürün ağacı ----------------
    /** Tek seviyeli reçete satırları [{kod, k}] */
    M.bom = (kod) => {
        const custom = S().customBoms[kod];
        if (custom) return custom;
        if (D.SUB_BOMS[kod]) return D.SUB_BOMS[kod].map(([c, k]) => ({ kod: c, k }));
        const p = M.product(kod);
        if (!p || p.custom) return [];
        const tpl = D.BOM_TEMPLATES[p.kategori] || [];
        return tpl.map(([c, , , k]) => ({ kod: c, k }));
    };
    M.hasBom = (kod) => M.bom(kod).length > 0;

    /** Standart maliyet (alt seviyelerden yukarı doğru toplanır) */
    M.unitCost = (kod, depth = 0) => {
        cache.cost = cache.cost || {};
        if (cache.cost[kod] != null) return cache.cost[kod];
        if (depth > 20) return 0; // döngü koruması
        const lines = M.bom(kod);
        let cost;
        if (lines.length) cost = U.sum(lines, (l) => l.k * M.unitCost(l.kod, depth + 1));
        else {
            M.items();
            const it = cache.itemIndex.get(kod);
            const p = it ? null : M.product(kod);
            cost = it ? it.price : (p ? p.toplam : 0);
        }
        cache.cost[kod] = cost;
        return cost;
    };

    /** Maliyetin malzeme türüne göre dağılımı (çok seviyeli) */
    M.costBreakdown = (kod, mult = 1, acc = {}, depth = 0) => {
        if (depth > 20) return acc;
        M.bom(kod).forEach((l) => {
            const child = M.item(l.kod);
            if (!child) return;
            if (M.hasBom(l.kod) && !child.isProduct) M.costBreakdown(l.kod, mult * l.k, acc, depth + 1);
            else acc[child.tur] = (acc[child.tur] || 0) + mult * l.k * (child.price || 0);
        });
        return acc;
    };

    /** Kalemin kullanıldığı ürünler (kategori bazında sayım) */
    M.whereUsed = (kod) => {
        const res = { products: 0, byCategory: {}, parents: [] };
        Object.entries(D.SUB_BOMS).forEach(([ym, lines]) => { if (lines.some(([c]) => c === kod)) res.parents.push(ym); });
        Object.entries(S().customBoms).forEach(([p, lines]) => { if (lines.some((l) => l.kod === kod) && !res.parents.includes(p)) res.parents.push(p); });
        const direct = new Set([kod, ...res.parents]);
        M.products().forEach((p) => {
            if (M.bom(p.kod).some((l) => direct.has(l.kod))) {
                res.products++;
                res.byCategory[p.kategori] = (res.byCategory[p.kategori] || 0) + 1;
            }
        });
        return res;
    };

    // ---------------- Stok ----------------
    M.onHand = (kod) => S().stock[kod] || 0;

    M.stockStatus = (kod) => {
        const it = M.item(kod);
        if (!it || it.procurement === 'service') return 'na';
        const q = M.onHand(kod);
        if (it.safetyStock <= 0) return q < 0 ? 'critical' : 'ok';
        if (q < it.safetyStock * 0.5) return 'critical';
        if (q < it.safetyStock) return 'warn';
        return 'ok';
    };

    /** Açık satın alma siparişlerinde bekleyen miktar */
    M.onOrder = (kod) => U.sum(
        S().pos.filter((p) => p.status === 'open' || p.status === 'partial'),
        (p) => U.sum(p.lines.filter((l) => l.kod === kod), (l) => Math.max(0, l.qty - (l.received || 0)))
    );

    /**
     * Stok hareketi kaydeder ve bakiyeyi günceller.
     * @param {{kod:string, qty:number, type:'GR'|'GI'|'FG'|'ADJ', ref?:string, note?:string}} m  qty işaretlidir (+giriş / −çıkış)
     */
    M.move = ({ kod, qty, type, ref = '', note = '' }) => {
        const st = S().stock;
        const it = M.item(kod);
        const precise = it && it.unit !== 'ad' ? 3 : 0;
        st[kod] = U.round((st[kod] || 0) + qty, precise || 3);
        const u = MRP.auth.current();
        S().movements.push({
            id: MRP.store.nextNo('HRK'), at: new Date().toISOString(), kod, type, qty, balance: st[kod],
            ref, note, user: u ? u.name : 'sistem', value: qty * (it ? it.price || 0 : 0)
        });
    };

    M.stockValue = () => U.sum(Object.entries(S().stock), ([kod, q]) => {
        const it = M.item(kod);
        return it ? Math.max(0, q) * (it.price || 0) : 0;
    });

    /** Talep/PO satırları için öncelikli tedarikçi önerisi */
    M.suggestSuppliers = (types) => S().suppliers
        .filter((s) => s.aktif)
        .map((s) => ({ s, match: types.filter((t) => s.kategoriler.includes(t)).length }))
        .sort((a, b) => b.match - a.match || b.s.puan - a.s.puan);

    MRP.model = M;
})(window.MRP);
</script>
<script>
/* assets/js/mrp-engine.js */
/* ==========================================================================
   MRP Pro — MRP Motoru
   --------------------------------------------------------------------------
   Klasik MRP mantığı:
     1. Bağımsız talep (Ana Üretim Planı) + açık iş emirlerinin bileşen ihtiyaçları
        → brüt ihtiyaçlar
     2. Düşük seviye kodu (LLC) ile ürün ağacı seviye seviye işlenir
     3. Her kalem için:  eldeki stok − emniyet stoğu + planlı girişler (açık PO,
        açık talepler, açık iş emirleri) ile brüt ihtiyaçlar netleştirilir
     4. Net ihtiyaç parti büyüklüğü politikasına göre yuvarlanır
        (L4L / Sabit parti / Minimum sipariş)
     5. Tedarik süresi kadar geriye kaydırılarak sipariş salım tarihi bulunur
     6. Üretilen kalemlerin planlı siparişleri alt seviyeye patlatılır
   Tüm tarihler "YYYY-MM-DD" metni olarak tutulur (saat dilimi kayması olmaz).
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U;
    const M = MRP.model;
    const S = () => MRP.store.state;

    const OPEN_WO = ['planned', 'released'];
    const EPS = 1e-9;
    const addDaysIso = (iso, n) => U.iso(U.addDays(U.parseDate(iso), n));
    const maxIso = (a, b) => (a > b ? a : b);

    function applyLotSize(it, shortage) {
        let q = shortage;
        if (it.lotPolicy === 'FOQ' && it.lotSize > 0) q = Math.ceil(shortage / it.lotSize - EPS) * it.lotSize;
        else if (it.lotPolicy === 'MIN' && it.lotSize > 0) q = Math.max(shortage, it.lotSize);
        return it.unit === 'ad' ? Math.ceil(q - EPS) : Math.ceil(q * 1000 - 1e-6) / 1000;
    }

    /** Aynı güne düşen brüt ihtiyaçları tek satırda toplar (kaynaklar korunur) */
    function mergeByDate(list) {
        const byDate = new Map();
        list.forEach((g) => {
            const x = byDate.get(g.date);
            if (x) { x.qty += g.qty; if (!x.srcs.includes(g.src)) x.srcs.push(g.src); if (g.kind === 'MPS') x.kind = 'MPS'; }
            else byDate.set(g.date, { date: g.date, qty: g.qty, kind: g.kind, srcs: [g.src] });
        });
        return [...byDate.values()].sort((a, b) => a.date.localeCompare(b.date))
            .map((x) => ({ ...x, src: x.srcs.length > 2 ? `${x.srcs.slice(0, 2).join(', ')} +${x.srcs.length - 2}` : x.srcs.join(', ') }));
    }

    function run() {
        const st = S();
        const today = U.iso(U.today());
        const gross = new Map();
        const receipts = new Map();
        const push = (map, kod, entry) => { if (entry.qty <= EPS) return; if (!map.has(kod)) map.set(kod, []); map.get(kod).push(entry); };

        // 1) Bağımsız talep
        st.mps.forEach((d) => {
            if (M.product(d.kod)) push(gross, d.kod, { date: d.dueDate, qty: +d.qty, src: d.id, kind: 'MPS' });
        });

        // 2) Açık iş emirleri: mamul için planlı giriş, bileşenler için bağımlı talep
        const openWOs = st.workOrders.filter((w) => OPEN_WO.includes(w.status));
        openWOs.forEach((w) => {
            push(receipts, w.kod, { date: w.end, qty: w.qty, src: w.no, kind: 'WO' });
            M.bom(w.kod).forEach((l) => push(gross, l.kod, { date: maxIso(w.start, today), qty: l.k * w.qty, src: w.no, kind: 'WO' }));
        });

        // 3) Açık satın alma siparişleri ve henüz siparişe dönmemiş talepler → planlı giriş
        st.pos.filter((p) => p.status === 'open' || p.status === 'partial').forEach((p) => p.lines.forEach((l) => {
            push(receipts, l.kod, { date: p.deliveryDate, qty: l.qty - (l.received || 0), src: p.no, kind: 'PO' });
        }));
        st.requests.filter((r) => r.status === 'pending' || r.status === 'approved').forEach((r) => r.lines.forEach((l) => {
            push(receipts, l.kod, { date: l.needDate || r.deadline || today, qty: l.qty, src: r.no, kind: 'REQ' });
        }));

        // 4) Düşük seviye kodları
        const llc = new Map();
        const visit = (kod, lvl, path) => {
            if (path.has(kod)) return; // döngüsel reçete koruması
            if ((llc.get(kod) ?? -1) >= lvl) return;
            llc.set(kod, lvl);
            path.add(kod);
            M.bom(kod).forEach((l) => visit(l.kod, lvl + 1, path));
            path.delete(kod);
        };
        [...gross.keys(), ...receipts.keys()].forEach((k) => visit(k, 0, new Set()));
        // Talebi olmayan kalemler de (emniyet stoğu tamamlama için) ağaçlarıyla birlikte seviyelendirilir;
        // böylece bir yarı mamul her zaman kendi bileşenlerinden önce işlenir.
        M.items().forEach((it) => { if (!llc.has(it.kod)) visit(it.kod, 0, new Set()); });
        const order = [...llc.entries()].sort((a, b) => a[1] - b[1]).map(([k]) => k);

        // 5) Netleştirme
        const records = {};
        const planned = [];
        const exceptions = [];
        let seq = 0;

        order.forEach((kod) => {
            const it = M.item(kod);
            if (!it) return;
            const isService = it.procurement === 'service';
            const reqs = mergeByDate(gross.get(kod) || []);
            const recs = (receipts.get(kod) || []).sort((a, b) => a.date.localeCompare(b.date));
            const onHand = isService ? 0 : M.onHand(kod);
            const ss = isService ? 0 : (it.safetyStock || 0);
            if (!reqs.length && !recs.length && onHand >= ss) return;

            const rec = { kod, level: llc.get(kod), onHand, ss, gross: reqs, receipts: recs, planned: [] };
            let proj = onHand - ss;
            let ri = 0;

            recs.forEach((r) => {
                if (r.kind === 'PO' && r.date < today) {
                    exceptions.push({ sev: 'warn', kod, msg: `${r.src} teslimatı ${U.diffDays(today, r.date)} gün gecikmiş (${U.qty(r.qty, it.unit)}).` });
                }
            });

            const plan = (needDate, shortage, reason) => {
                const qty = applyLotSize(it, shortage);
                const due = maxIso(needDate, today);
                const release = addDaysIso(due, -(it.leadTime || 0));
                const po = {
                    id: `PL-${String(++seq).padStart(4, '0')}`, kod, ad: it.ad, unit: it.unit, tur: it.tur,
                    type: it.procurement === 'make' ? 'production' : 'purchase', service: isService,
                    qty, shortage: U.round(shortage, 3), needDate, due, release, leadTime: it.leadTime || 0,
                    price: it.price || 0, value: qty * (it.price || 0), reason, late: release < today
                };
                planned.push(po);
                rec.planned.push(po);
                if (po.late) {
                    exceptions.push({ sev: 'critical', kod, msg: `${po.id}: salım tarihi ${U.diffDays(today, release)} gün geçmiş — tedarik hızlandırılmalı veya talep ertelenmeli.` });
                } else if (U.diffDays(release, today) <= 3) {
                    exceptions.push({ sev: 'warn', kod, msg: `${po.id}: ${U.date(U.parseDate(release))} tarihine kadar salınmalı.` });
                }
                if (needDate < today) {
                    exceptions.push({ sev: 'critical', kod, msg: `İhtiyaç tarihi geçmiş (${U.date(U.parseDate(needDate))}) — karşılanamayan talep.` });
                }
                if (po.type === 'production') {
                    M.bom(kod).forEach((l) => push(gross, l.kod, { date: maxIso(release, today), qty: l.k * qty, src: po.id, kind: 'PLN' }));
                }
                if (!isService && po.type === 'purchase' && !po.price) {
                    exceptions.push({ sev: 'info', kod, msg: 'Birim fiyat tanımsız — malzeme kartını güncelleyin.' });
                }
                return qty;
            };

            reqs.forEach((r) => {
                while (ri < recs.length && recs[ri].date <= r.date) proj += recs[ri++].qty;
                if (proj < r.qty - EPS) {
                    const later = recs.slice(ri).filter((x) => x.kind === 'PO' || x.kind === 'REQ');
                    if (later.length) {
                        exceptions.push({ sev: 'warn', kod, msg: `${later[0].src} ihtiyaçtan sonra geliyor (${U.date(U.parseDate(later[0].date))}); öne çekilirse ek sipariş gerekmeyebilir.` });
                    }
                    proj += plan(r.date, r.qty - proj, r.kind === 'MPS' ? `Ana plan ${r.src}` : `Bağımlı talep ${r.src}`);
                }
                proj -= r.qty;
            });
            while (ri < recs.length) proj += recs[ri++].qty;
            if (proj < -EPS) proj += plan(addDaysIso(today, it.leadTime || 0), -proj, 'Emniyet stoğu tamamlama');

            rec.projectedEnd = U.round(proj + ss, 3);
            records[kod] = rec;
        });

        // Bağımlı talep sonradan eklenen kalemler için brüt listeleri güncel tut
        Object.values(records).forEach((r) => { r.gross = (gross.get(r.kod) || []).slice().sort((a, b) => a.date.localeCompare(b.date)); });

        const sevOrder = { critical: 0, warn: 1, info: 2 };
        exceptions.sort((a, b) => sevOrder[a.sev] - sevOrder[b.sev]);

        const purchase = planned.filter((p) => p.type === 'purchase');
        const production = planned.filter((p) => p.type === 'production');
        return {
            runAt: new Date().toISOString(),
            runBy: MRP.auth.current() ? MRP.auth.current().name : '',
            today,
            planned, records, exceptions,
            summary: {
                demands: st.mps.length,
                items: Object.keys(records).length,
                purchaseCount: purchase.length,
                purchaseValue: U.sum(purchase, (p) => p.value),
                productionCount: production.length,
                late: planned.filter((p) => p.late).length,
                critical: exceptions.filter((e) => e.sev === 'critical').length
            }
        };
    }

    /** Haftalık zaman fazlı tablo (12 hafta + geçmiş vade kovası) */
    function timePhased(rec, weeks = 12) {
        const start = U.weekStart(U.today());
        const cols = [{ label: 'Geçmiş', from: '0000-00-00', to: addDaysIso(U.iso(start), -1) }];
        for (let i = 0; i < weeks; i++) {
            const from = U.iso(U.addDays(start, i * 7));
            cols.push({ label: `H${U.isoWeek(from)}`, sub: U.date(U.parseDate(from)).slice(0, 5), from, to: addDaysIso(from, 6) });
        }
        cols.push({ label: 'Sonra', from: addDaysIso(U.iso(start), weeks * 7), to: '9999-12-31' });
        const bucket = (list, dateKey) => cols.map((c) => U.sum(list.filter((x) => x[dateKey] >= c.from && x[dateKey] <= c.to), (x) => x.qty));
        const g = bucket(rec.gross, 'date');
        const sr = bucket(rec.receipts, 'date');
        const pr = bucket(rec.planned, 'due');
        const rel = bucket(rec.planned, 'release');
        let proj = rec.onHand;
        const pa = cols.map((_, i) => (proj = proj + sr[i] + pr[i] - g[i]));
        return { cols, rows: [
            { label: 'Brüt ihtiyaç', values: g },
            { label: 'Planlı girişler (PO/Talep/İE)', values: sr },
            { label: 'Planlı sipariş girişi', values: pr },
            { label: 'Öngörülen eldeki stok', values: pa, projected: true },
            { label: 'Planlı sipariş salımı', values: rel, release: true }
        ] };
    }

    MRP.engine = { run, timePhased, applyLotSize };
})(window.MRP);
</script>
<script>
/* assets/js/app.js */
/* ==========================================================================
   MRP Pro — Uygulama kabuğu: giriş, yönlendirme (hash router), menü,
   bildirimler, tema ve olay delegasyonu
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, UI = MRP.UI, A = MRP.auth;

    MRP.views = MRP.views || {};
    MRP.actions = MRP.actions || {};
    MRP.charts = {};

    const NAV = [
        { group: 'Genel', items: [{ id: 'dashboard', label: 'Gösterge Paneli', icon: 'dashboard' }] },
        { group: 'Mühendislik', items: [
            { id: 'bom', label: 'Ürün Ağacı', icon: 'tree' },
            { id: 'items', label: 'Malzeme Kartları', icon: 'layers' }
        ] },
        { group: 'Planlama', items: [
            { id: 'mrp', label: 'MRP Çalıştırma', icon: 'calc', count: () => (MRP.store.state.lastRun ? MRP.store.state.lastRun.summary.critical : 0), alert: true },
            { id: 'workorders', label: 'İş Emirleri', icon: 'factory', count: () => MRP.store.state.workOrders.filter((w) => w.status === 'planned' || w.status === 'released').length }
        ] },
        { group: 'Satın Alma', items: [
            { id: 'requests', label: 'Satın Alma Talepleri', icon: 'cart', count: () => MRP.store.state.requests.filter((r) => r.status === 'pending').length },
            { id: 'po', label: 'Satın Alma Siparişleri', icon: 'truck', count: () => MRP.store.state.pos.filter((p) => p.status === 'open' || p.status === 'partial').length },
            { id: 'suppliers', label: 'Tedarikçiler', icon: 'users' }
        ] },
        { group: 'Depo', items: [
            { id: 'stock', label: 'Stok Durumu', icon: 'warehouse', count: () => MRP.model.items().filter((i) => MRP.model.stockStatus(i.kod) === 'critical').length, alert: true },
            { id: 'movements', label: 'Stok Hareketleri', icon: 'swap' }
        ] },
        { group: 'Sistem', items: [
            { id: 'reports', label: 'Raporlar & Dışa Aktarım', icon: 'chart' },
            { id: 'audit', label: 'Denetim Kaydı', icon: 'shield' }
        ] }
    ];

    let currentView = null;

    // ---------------- Tema ----------------
    function applyTheme(t) {
        document.body.classList.toggle('light', t === 'light');
        U.$$('[data-theme-icon]').forEach((el) => { el.innerHTML = MRP.icon(t === 'light' ? 'moon' : 'sun'); });
    }
    function toggleTheme() {
        const next = document.body.classList.contains('light') ? 'dark' : 'light';
        try { localStorage.setItem('mrppro.theme', next); } catch (e) { /* yoksay */ }
        applyTheme(next);
        if (currentView) render();
    }

    // ---------------- Giriş ----------------
    function showLogin() {
        U.$('#app').hidden = true;
        U.$('#login').hidden = false;
        U.$('#loginUser').focus();
    }
    function doLogin(e) {
        if (e) e.preventDefault();
        const u = U.$('#loginUser').value.trim();
        const p = U.$('#loginPass').value;
        if (A.login(u, p)) {
            U.$('#loginError').classList.remove('show');
            U.$('#loginPass').value = '';
            MRP.store.audit('Oturum açıldı', u);
            MRP.store.save();
            startApp();
        } else {
            const err = U.$('#loginError');
            err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
            U.$('#loginPass').value = '';
            U.$('#loginPass').focus();
        }
    }
    async function doLogout() {
        if (!(await UI.confirm('Oturumu kapatmak istediğinize emin misiniz?', { title: 'Çıkış', okLabel: 'Çıkış Yap' }))) return;
        MRP.store.audit('Oturum kapatıldı', A.current().username);
        MRP.store.save();
        A.logout();
        location.hash = '';
        showLogin();
    }

    function startApp() {
        const u = A.current();
        U.$('#login').hidden = true;
        U.$('#app').hidden = false;
        U.$('#userAvatar').textContent = u.avatar;
        U.$('#userAvatar').className = 'avatar ' + u.role;
        U.$('#userName').textContent = u.name;
        U.$('#userRole').textContent = u.roleName;
        route();
    }

    // ---------------- Menü ----------------
    function renderNav() {
        U.$('#sbNav').innerHTML = NAV.map((g) => {
            const items = g.items.filter((i) => A.canView(i.id));
            if (!items.length) return '';
            return `<div class="sb-group"><div class="sb-group-title">${U.esc(g.group)}</div>${items.map((i) => {
                const c = i.count ? i.count() : 0;
                return `<a class="sb-link ${currentView === i.id ? 'active' : ''}" href="#/${i.id}">${MRP.icon(i.icon)}<span>${U.esc(i.label)}</span>${c ? `<span class="count ${i.alert ? 'alert' : ''}">${c}</span>` : ''}</a>`;
            }).join('')}</div>`;
        }).join('');
    }

    // ---------------- Yönlendirme ----------------
    function route() {
        if (!A.current()) return showLogin();
        let id = (location.hash.replace(/^#\/?/, '').split('?')[0]) || 'dashboard';
        if (!MRP.views[id] || !A.canView(id)) id = A.current().views[0];
        currentView = id;
        render();
        closeSidebar();
        window.scrollTo(0, 0);
    }

    /** Aktif görünümü yeniden çizer (veri değişikliklerinden sonra çağrılır) */
    function render() {
        if (!currentView) return;
        Object.values(MRP.charts).forEach((c) => c && c.destroy && c.destroy());
        MRP.charts = {};
        const v = MRP.views[currentView];
        U.$('#pageTitle').textContent = v.title;
        U.$('#pageSub').textContent = v.subtitle || '';
        document.title = `${v.title} · MRP Pro`;
        const host = U.$('#view');
        host.innerHTML = v.render();
        if (v.after) v.after(host);
        renderNav();
        updateNotifBadge();
    }

    /** Veriyi kaydet + model önbelleğini temizle + ekranı yenile */
    function commit() {
        MRP.model.invalidate();
        MRP.store.save();
        render();
    }

    // ---------------- Bildirimler ----------------
    const myNotifs = () => {
        const u = A.current();
        return u ? MRP.store.state.notifications.filter((n) => n.roles.includes(u.role)) : [];
    };
    function updateNotifBadge() {
        const u = A.current();
        const unread = myNotifs().filter((n) => !n.readBy.includes(u.username)).length;
        const b = U.$('#notifCount');
        b.hidden = unread === 0;
        b.textContent = unread > 99 ? '99+' : unread;
    }
    function renderNotifPanel() {
        const u = A.current();
        const list = myNotifs();
        U.$('#notifBody').innerHTML = list.length ? list.slice(0, 50).map((n) => `
            <div class="notif-item ${n.readBy.includes(u.username) ? '' : 'unread'}" data-act="openNotif" data-id="${U.esc(n.id)}">
                <div class="t"><span>${U.esc(n.title)}</span><small>${U.esc(U.timeAgo(n.at))}</small></div>
                <div class="m">${U.esc(n.message)}</div>
            </div>`).join('') : '<div class="empty"><h3>Bildirim yok</h3><p>Yeni gelişmeler burada görünecek.</p></div>';
    }
    function togglePopover(id) {
        const el = U.$('#' + id);
        const open = el.hidden;
        U.$$('.popover').forEach((p) => { p.hidden = true; });
        if (open) { el.hidden = false; if (id === 'notifPop') renderNotifPanel(); }
    }

    // ---------------- Sidebar (mobil) ----------------
    function openSidebar() { U.$('#sidebar').classList.add('open'); U.$('#sbBackdrop').classList.add('open'); }
    function closeSidebar() { U.$('#sidebar').classList.remove('open'); U.$('#sbBackdrop').classList.remove('open'); }

    // ---------------- Genel eylemler ----------------
    Object.assign(MRP.actions, {
        toggleTheme, logout: doLogout,
        openSidebar, closeSidebar,
        toggleNotif: () => togglePopover('notifPop'),
        toggleUserMenu: () => togglePopover('userPop'),
        fillDemo: (_, el) => { U.$('#loginUser').value = el.dataset.u; U.$('#loginPass').value = el.dataset.p; U.$('#loginPass').focus(); },
        openNotif: (id) => {
            const n = MRP.store.state.notifications.find((x) => x.id === id);
            if (!n) return;
            const u = A.current().username;
            if (!n.readBy.includes(u)) n.readBy.push(u);
            MRP.store.save();
            U.$$('.popover').forEach((p) => { p.hidden = true; });
            if (n.link && A.canView(n.link)) location.hash = '#/' + n.link; else updateNotifBadge();
        },
        markAllRead: () => {
            const u = A.current().username;
            myNotifs().forEach((n) => { if (!n.readBy.includes(u)) n.readBy.push(u); });
            MRP.store.save();
            renderNotifPanel(); updateNotifBadge();
        },
        go: (id) => { location.hash = '#/' + id; }
    });

    // Tek olay dinleyici: data-act="eylem" data-id="..."
    document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el) {
            if (!e.target.closest('.popover')) U.$$('.popover').forEach((p) => { p.hidden = true; });
            return;
        }
        const fn = MRP.actions[el.dataset.act];
        if (!fn) return console.warn('Tanımsız eylem:', el.dataset.act);
        e.preventDefault();
        e.stopPropagation();
        if (!el.closest('.popover')) U.$$('.popover').forEach((p) => { p.hidden = true; });
        fn(el.dataset.id, el, e);
    });
    document.addEventListener('change', (e) => {
        const el = e.target.closest('[data-change]');
        if (el && MRP.actions[el.dataset.change]) MRP.actions[el.dataset.change](el.value, el, e);
    });
    document.addEventListener('input', (e) => {
        const el = e.target.closest('[data-input]');
        if (el && MRP.actions[el.dataset.input]) MRP.actions[el.dataset.input](el.value, el, e);
    });

    // ---------------- Başlangıç ----------------
    MRP.app = { render, commit, route, currentView: () => currentView };

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', () => {
        let theme = 'dark';
        try { theme = localStorage.getItem('mrppro.theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) { /* yoksay */ }
        applyTheme(theme);
        MRP.store.load();
        MRP.model.init();
        U.$('#loginForm').addEventListener('submit', doLogin);
        U.$('#demoAccounts').innerHTML = Object.values(A.USERS).map((u) => `
            <button type="button" class="demo-row" data-act="fillDemo" data-u="${U.esc(u.username)}" data-p="${U.esc(u.password)}">
                <span class="r">${U.esc(u.roleName)}</span><span class="c">${U.esc(u.username)} / ${U.esc(u.password)}</span></button>`).join('');
        if (A.restore()) startApp(); else showLogin();
    });
})(window.MRP);
</script>
<script>
/* assets/js/views/common.js */
/* ==========================================================================
   MRP Pro — Görünümler için ortak HTML yardımcıları
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U;
    const esc = U.esc;

    const H = {};

    H.kpi = (label, value, sub = '', cls = '') =>
        `<div class="kpi ${cls}"><div class="l">${esc(label)}</div><div class="v">${esc(value)}</div><div class="s">${esc(sub)}</div></div>`;

    H.banner = (type, icon, title, text = '', actionHtml = '') =>
        `<div class="banner ${type}"><div class="ic">${MRP.icon(icon)}</div><div class="tx"><h4>${esc(title)}</h4>${text ? `<p>${esc(text)}</p>` : ''}</div>${actionHtml}</div>`;

    H.empty = (title, text = '') => `<div class="empty"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}</div>`;

    H.card = (title, sub, body, actions = '') =>
        `<section class="card"><div class="card-head"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${actions}</div>${body}</section>`;

    const STOCK = {
        critical: ['badge-red', 'Kritik'], warn: ['badge-amber', 'Düşük'], ok: ['badge-green', 'Normal'], na: ['badge-gray', 'Stoksuz']
    };
    H.stockBadge = (s) => `<span class="badge ${STOCK[s][0]}">${STOCK[s][1]}</span>`;

    H.REQ_STATUS = {
        pending: ['badge-violet', 'Onay Bekliyor'], approved: ['badge-green', 'Onaylandı'], rejected: ['badge-red', 'Reddedildi'],
        ordered: ['badge-amber', 'Siparişe Döndü'], closed: ['badge-cyan', 'Kapandı']
    };
    H.PO_STATUS = {
        open: ['badge-amber', 'Açık'], partial: ['badge-blue', 'Kısmi Teslim'], received: ['badge-green', 'Teslim Alındı'], cancelled: ['badge-gray', 'İptal']
    };
    H.WO_STATUS = {
        planned: ['badge-gray', 'Planlandı'], released: ['badge-blue', 'Serbest'], completed: ['badge-green', 'Tamamlandı'], cancelled: ['badge-red', 'İptal']
    };
    H.PRIORITY = { low: ['badge-gray', 'Düşük'], normal: ['badge-blue', 'Normal'], high: ['badge-amber', 'Yüksek'], urgent: ['badge-red', 'Acil'] };
    H.badge = (map, key) => { const b = map[key] || ['badge-gray', key]; return `<span class="badge ${b[0]}">${esc(b[1])}</span>`; };

    H.catTag = (cat) => {
        const c = (MRP.data.CATEGORY_STYLE[cat] || {}).color || '#64748b';
        return `<span class="badge plain" style="background:${c}22;color:${c};">${esc(cat)}</span>`;
    };

    H.itemLink = (kod) => `<button class="link mono" data-act="itemDetail" data-id="${esc(kod)}">${esc(kod)}</button>`;
    H.productLink = (kod) => `<button class="link mono" data-act="productDetail" data-id="${esc(kod)}">${esc(kod)}</button>`;
    H.anyLink = (kod) => (MRP.model.isProduct(kod) ? H.productLink(kod) : H.itemLink(kod));

    /** Sayfalama çubuğu */
    H.pager = (total, page, size, act) => {
        const pages = Math.max(1, Math.ceil(total / size));
        const from = total ? (page - 1) * size + 1 : 0;
        const to = Math.min(total, page * size);
        return `<div class="pager"><span>${from}–${to} / ${total.toLocaleString('tr-TR')} kayıt</span>
            <span style="display:flex;gap:6px;align-items:center;">
                <button class="btn btn-secondary btn-sm" data-act="${act}" data-id="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Önceki</button>
                <span>${page} / ${pages}</span>
                <button class="btn btn-secondary btn-sm" data-act="${act}" data-id="${page + 1}" ${page >= pages ? 'disabled' : ''}>Sonraki ›</button>
            </span></div>`;
    };

    H.tabs = (items, active, act) => `<div class="tabs">${items.map(([id, label, n]) =>
        `<button class="tab ${id === active ? 'active' : ''}" data-act="${act}" data-id="${esc(id)}">${esc(label)}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}</div>`;

    H.chartTheme = () => {
        const light = document.body.classList.contains('light');
        return {
            text: light ? '#3d4a63' : '#b4bcd0',
            grid: light ? 'rgba(15,23,42,.07)' : 'rgba(255,255,255,.07)',
            surface: light ? '#ffffff' : '#111729'
        };
    };
    H.chart = (id, config) => {
        if (typeof Chart === 'undefined') return;
        const el = document.getElementById(id);
        if (!el) return;
        const t = H.chartTheme();
        Chart.defaults.color = t.text;
        Chart.defaults.font.family = "'Inter', 'Segoe UI', sans-serif";
        MRP.charts[id] = new Chart(el, config);
    };

    /** Yetki kontrolü — yoksa uyarı verip false döner */
    H.guard = (action) => {
        if (MRP.auth.can(action)) return true;
        MRP.UI.toast('Yetkiniz yok', 'Bu işlem için rolünüzün yetkisi bulunmuyor.', 'error');
        return false;
    };

    MRP.H = H;
})(window.MRP);
</script>
<script>
/* assets/js/views/dashboard.js */
/* ==========================================================================
   MRP Pro — Gösterge Paneli
   ========================================================================== */
(function (MRP) {
    'use strict';
    const U = MRP.U, H = MRP.H, M = MRP.model;
    const esc = U.esc;
    const S = () => MRP.store.state;

    const openPOValue = () => U.sum(S().pos.filter((p) => p.status === 'open' || p.status === 'partial'),
        (p) => U.sum(p.lines, (l) => Math.max(0, l.qty - (l.received || 0)) * l.price * (1 - l.disc / 100) * (1 + l.vat / 100)));

    MRP.views.dashboard = {
        title: 'Gösterge Paneli',
        subtitle: 'Planlama, satın alma ve stok durumunun özeti',
        render() {
            const st = S();
            const items = M.items().filter((i) => i.procurement !== 'service');
            const crit = items.filter((i) => M.stockStatus(i.kod) === 'critical');
            const warn = items.filter((i) => M.stockStatus(i.kod) === 'warn');
            const run = st.lastRun;
            const activeWO = st.workOrders.filter((w) => w.status === 'planned' || w.status === 'released').length;
            const pendingReq = st.requests.filter((r) => r.status === 'pending');

            let html = '';
            if (!run) {
                html += H.banner('blue', 'info', 'MRP henüz çalıştırılmadı', 'Ana üretim planına göre malzeme ihtiyaçlarını hesaplamak için MRP\'yi çalıştırın.',
                    MRP.auth.canView('mrp') ? '<button class="btn btn-primary btn-sm" data-act="go" data-id="mrp">MRP\'ye git</button>' : '');
            } else if (run.summary.critical > 0) {
                html += H.banner('red', 'alert', `${run.summary.critical} kritik MRP istisnası`, `Son çalıştırma: ${U.dateTime(run.runAt)} — gecikmiş salım veya karşılanamayan talepler var.`,
                    MRP.auth.canView('mrp') ? '<button class="btn btn-danger btn-sm" data-act="go" data-id="mrp">İncele</button>' : '');
            }
            if (crit.length) {
                html += H.banner('amber', 'warehouse', `${crit.length} malzeme emniyet stoğunun yarısının altında`, crit.slice(0, 6).map((i) => i.kod).join(', ') + (crit.length > 6 ? '…' : ''),
                    MRP.auth.canView('stock') ? '<button class="btn btn-secondary btn-sm" data-act="go" data-id="stock">Stok durumu</button>' : '');
            }

            html += `<div class="kpis">
                ${H.kpi('Mamul', M.products().length.toLocaleString('tr-TR'), `${st.customProducts.length} özel ürün`, 'blue')}
                ${H.kpi('Malzeme Kartı', M.items().length, `${items.length} stoklu kalem`, 'cyan')}
                ${H.kpi('Stok Değeri', U.compactCur(M.stockValue()), 'Standart maliyetle', '')}
                ${H.kpi('Kritik / Düşük Stok', `${crit.length} / ${warn.length}`, 'Emniyet stoğuna göre', crit.length ? 'red' : 'green')}
                ${H.kpi('Onay Bekleyen Talep', pendingReq.length, U.cur(U.sum(pendingReq, (r) => r.total)), 'violet')}
                ${H.kpi('Açık Sipariş Bakiyesi', U.compactCur(openPOValue()), `${st.pos.filter((p) => p.status === 'open' || p.status === 'partial').length} PO (KDV dahil)`, 'blue')}
                ${H.kpi('Aktif İş Emri', activeWO, `${st.workOrders.filter((w) => w.status === 'completed').length} tamamlandı`, 'green')}
                ${H.kpi('MRP Önerisi', run ? run.planned.length : '–', run ? `${run.summary.late} geç salım` : 'Çalıştırılmadı', run && run.summary.late ? 'red' : '')}
            </div>`;

            html += `<div class="grid grid-2">
                ${H.card('Planlı sipariş salımları', 'Son MRP çalıştırmasına göre önümüzdeki 8 hafta (₺)', '<div class="card-body"><div class="chart-box"><canvas id="chRelease"></canvas></div></div>')}
                ${H.card('Stok sağlığı', 'Stoklu malzemelerin emniyet stoğuna göre durumu', '<div class="card-body"><div class="chart-box"><canvas id="chHealth"></canvas></div></div>')}
                ${H.card('Kategori bazında ürün maliyeti', 'Kayıtlı birim maliyetlerin toplamı', '<div class="card-body"><div class="chart-box"><canvas id="chCat"></canvas></div></div>')}
                ${H.card('Tedarikçi bazında açık sipariş', 'Teslim bekleyen tutar (₺)', '<div class="card-body"><div class="chart-box"><canvas id="chSup"></canvas></div></div>')}
            </div>`;

            const exc = run ? run.exceptions.slice(0, 8) : [];
            const moves = st.movements.slice(-8).reverse();
            html += `<div class="grid grid-2" style="margin-top:16px;">
                ${H.card('MRP istisna mesajları', run ? `${run.exceptions.length} mesaj` : '', exc.length
                    ? exc.map((e) => `<div class="exc"><span class="sev ${e.sev}"></span><div>${H.anyLink(e.kod)} — ${esc(e.msg)}</div></div>`).join('')
                    : H.empty('İstisna yok', run ? 'Plan sorunsuz görünüyor.' : 'MRP çalıştırıldığında burada listelenir.'))}
                ${H.card('Son stok hareketleri', '', moves.length ? `<div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Kod</th><th>Tür</th><th class="num">Miktar</th></tr></thead><tbody>
                    ${moves.map((m) => `<tr><td class="nowrap">${esc(U.dateTime(m.at))}</td><td>${H.anyLink(m.kod)}</td><td><span class="badge ${M.MOVE_TYPES[m.type].badge}">${esc(M.MOVE_TYPES[m.type].label)}</span></td>
                        <td class="num ${m.qty < 0 ? 'tp-neg' : 'tp-pos'}">${m.qty > 0 ? '+' : ''}${esc(U.qty(m.qty))}</td></tr>`).join('')}</tbody></table></div>`
                    : H.empty('Henüz hareket yok', 'Mal kabul, üretim ve sayım işlemleri burada görünür.'))}
            </div>`;
            return html;
        },
        after() {
            const st = S();
            const t = H.chartTheme();
            const items = M.items().filter((i) => i.procurement !== 'service');
            const counts = { ok: 0, warn: 0, critical: 0 };
            items.forEach((i) => { counts[M.stockStatus(i.kod)]++; });
            H.chart('chHealth', {
                type: 'doughnut',
                data: { labels: ['Normal', 'Düşük', 'Kritik'], datasets: [{ data: [counts.ok, counts.warn, counts.critical], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderColor: t.surface, borderWidth: 2 }] },
                options: { maintainAspectRatio: false, cutout: '68%', plugins: { legend: { position: 'right' } } }
            });

            const byCat = MRP.data.CATEGORIES.map((c) => U.sum(M.products().filter((p) => p.kategori === c), (p) => p.toplam));
            H.chart('chCat', {
                type: 'bar',
                data: { labels: MRP.data.CATEGORIES, datasets: [{ data: byCat, backgroundColor: MRP.data.CATEGORIES.map((c) => MRP.data.CATEGORY_STYLE[c].color), borderRadius: 6 }] },
