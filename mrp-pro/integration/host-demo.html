<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Örnek ERP Portalı · MRP Pro gömülü</title>
<style>
    :root { --bg: #eef2f7; --panel: #fff; --text: #172033; --muted: #6b7790; --line: #dde3ec; --accent: #2563eb; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: #0f2a5a; color: #fff; }
    header b { font-size: 1.05em; letter-spacing: .3px; }
    header nav { display: flex; gap: 4px; flex-wrap: wrap; }
    header nav button { background: transparent; border: 0; color: #c9d6f0; padding: 7px 11px; border-radius: 6px; cursor: pointer; font: inherit; }
    header nav button:hover, header nav button.on { background: rgba(255,255,255,.14); color: #fff; }
    header .sp { flex: 1; }
    header .who { font-size: .85em; color: #c9d6f0; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
    #mrp { min-height: 0; }
    aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    aside section { padding: 14px; border-bottom: 1px solid var(--line); }
    aside h3 { font-size: .8em; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
    aside input, aside select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; margin-bottom: 6px; }
    aside button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #log { flex: 1; overflow: auto; padding: 10px 14px; font-family: Consolas, monospace; font-size: .76em; }
    #log div { padding: 4px 0; border-bottom: 1px dashed var(--line); word-break: break-word; }
    #log .t { color: var(--muted); }
    .login { margin: auto; background: var(--panel); padding: 28px; border-radius: 12px; width: 340px; box-shadow: 0 10px 30px rgba(15,23,42,.1); }
    .login h2 { margin-bottom: 4px; } .login p { color: var(--muted); font-size: .85em; margin-bottom: 16px; }
    .login input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; margin-bottom: 10px; font: inherit; }
    .login button { width: 100%; padding: 10px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
    .err { color: #dc2626; font-size: .85em; min-height: 1.2em; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<!--
  Bu sayfa, kendi ERP portalınızın MRP Pro'yu nasıl gömeceğini gösteren örnektir.
  ERP oturumu bir kez açılır; MRP Pro aynı token ile (tek oturum) çalışır.
-->
<div class="login" id="loginBox">
    <h2>Firma ERP</h2>
    <p>Örnek portal — ERP kullanıcısıyla giriş (admin / 1234, planlama / plan123 …)</p>
    <input id="u" value="planlama" autocomplete="username">
    <input id="p" type="password" value="plan123" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button id="go">Giriş</button>
</div>

<header id="bar" hidden>
    <b>Firma ERP</b>
    <nav id="nav">
        <button data-v="dashboard" class="on">Üretim Özeti</button>
        <button data-v="sales">Satış Siparişleri</button>
        <button data-v="mrp">MRP</button>
        <button data-v="workorders">İş Emirleri</button>
        <button data-v="requests">Satın Alma</button>
        <button data-v="stock">Depo</button>
        <button data-v="costing">Maliyet</button>
    </nav>
    <span class="sp"></span>
    <label class="who"><input type="checkbox" id="hideNav" checked> MRP menüsünü gizle</label>
    <span class="who" id="who"></span>
</header>
<main id="main" hidden>
    <div id="mrp"></div>
    <aside>
        <section>
            <h3>ERP'de satış siparişi aç</h3>
            <input id="soCust" value="Ege Mobilya Ltd." placeholder="Müşteri">
            <input id="soKod" value="BG.205.A" placeholder="Mamul kodu">
            <input id="soQty" type="number" value="50" placeholder="Miktar">
            <input id="soDate" type="date">
            <button id="soBtn">Siparişi kaydet → MRP'ye aktar</button>
        </section>
        <section>
            <h3>ERP'de sevkiyat / iptal</h3>
            <input id="shNo" placeholder="Sipariş no (ör. SS-2026-0003)">
            <input id="shQty" type="number" value="10" placeholder="Toplam sevk edilen (1. satır)">
            <button id="shBtn">Sevk et</button>
            <button id="cnBtn">Siparişi iptal et</button>
        </section>
        <section>
            <h3>ERP'de fiyat güncelle</h3>
            <input id="prKod" value="HM.044" placeholder="Malzeme kodu">
            <input id="prPrice" type="number" step="0.01" value="1950" placeholder="Fiyat">
            <select id="prCur"><option>USD</option><option>EUR</option><option>TRY</option></select>
            <button id="prBtn">Fiyatı kaydet</button>
        </section>
        <h3 style="padding:12px 14px 0;">MRP Pro olayları</h3>
        <div id="log"></div>
    </aside>
</main>

<script src="embed-sdk.js"></script>
<script>
(function () {
    'use strict';
    const API = '/api';
    let session = null, mrp = null;
    const $ = (s) => document.querySelector(s);
    const log = (type, obj) => {
        const d = document.createElement('div');
        d.innerHTML = `<span class="t">${new Date().toLocaleTimeString('tr-TR')}</span> <b></b> <span></span>`;
        d.querySelector('b').textContent = type;
        d.querySelector('span:last-child').textContent = obj ? JSON.stringify(obj).slice(0, 300) : '';
        $('#log').prepend(d);
    };
    async function api(method, path, body) {
        const r = await fetch(API + path, { method, headers: { 'Content-Type': 'application/json', ...(session ? { Authorization: 'Bearer ' + session.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.message || r.statusText);
        return j;
    }

    $('#go').onclick = async () => {
        try {
            session = await api('POST', '/auth/login', { username: $('#u').value, password: $('#p').value });
        } catch (e) { $('#err').textContent = e.message; return; }
        $('#loginBox').hidden = true; $('#bar').hidden = false; $('#main').hidden = false;
        $('#who').textContent = `${session.user.name} · ${session.user.roleName}`;
        const d = new Date(); d.setDate(d.getDate() + 30); $('#soDate').value = d.toISOString().slice(0, 10);
        mount();
    };

    function mount() {
        if (mrp) mrp.destroy();
        mrp = MRPPro.embed('#mrp', {
            src: '/mrp-pro/index.html', mode: 'erp', view: 'dashboard', theme: 'light',
            hideNav: $('#hideNav').checked, pollInterval: 3000,
            getToken: async () => session.token          // tek oturum: ERP token'ı MRP'ye verilir
        });
        mrp.on('*', (m) => log(m.type, m.type === 'sync' ? { yön: m.direction, değişiklik: m.changes.length, ilk: m.changes.slice(0, 3), reddedilen: m.rejected } : m.user || m.view || m.message || null));
        mrp.on('route', (m) => document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === m.view)));
    }

    $('#nav').onclick = (e) => { const v = e.target.dataset.v; if (v && mrp) mrp.navigate(v); };
    $('#hideNav').onchange = () => mount();
    $('#soBtn').onclick = async () => {
        try {
            const so = await api('POST', '/erp/sales-orders', { customer: $('#soCust').value.trim(), lines: [{ kod: $('#soKod').value.trim(), qty: +$('#soQty').value, dueDate: $('#soDate').value }] });
            log('ERP → satış siparişi', { no: so.no, müşteri: so.customer, satır: so.lines });
            $('#shNo').value = so.no;
            mrp.refresh();
        } catch (e) { log('HATA', e.message); }
    };
    const patchSO = async (body) => {
        try { const so = await api('PATCH', '/erp/sales-orders/' + encodeURIComponent($('#shNo').value.trim()), body); log('ERP → sipariş güncellendi', { no: so.no, durum: so.status, satır: so.lines }); mrp.refresh(); }
        catch (e) { log('HATA', e.message); }
    };
    $('#shBtn').onclick = () => patchSO({ lines: [{ line: 1, shipped: +$('#shQty').value }] });
    $('#cnBtn').onclick = () => patchSO({ status: 'cancelled' });
    $('#prBtn').onclick = async () => {
        try { const it = await api('PATCH', '/erp/items/' + encodeURIComponent($('#prKod').value.trim()), { price: +$('#prPrice').value, currency: $('#prCur').value }); log('ERP → fiyat', { kod: it.kod, price: it.price, currency: it.currency }); mrp.refresh(); }
        catch (e) { log('HATA', e.message); }
    };
})();
</script>
</body>
</html>
