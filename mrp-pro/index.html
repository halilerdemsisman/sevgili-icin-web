<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MRP Pro — Ürün ağacı, malzeme ihtiyaç planlama, satın alma ve stok yönetimi">
<title>MRP Pro · Malzeme İhtiyaç Planlama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">

<!-- Üçüncü parti kütüphaneler (sabit sürüm) -->
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>

<!-- Uygulama -->
<script defer src="assets/js/utils.js"></script>
<script defer src="assets/js/data.js"></script>
<script defer src="assets/js/store.js"></script>
<script defer src="assets/js/auth.js"></script>
<script defer src="assets/js/model.js"></script>
<script defer src="assets/js/mrp-engine.js"></script>
<script defer src="assets/js/app.js"></script>
<script defer src="assets/js/views/common.js"></script>
<script defer src="assets/js/views/dashboard.js"></script>
<script defer src="assets/js/views/engineering.js"></script>
<script defer src="assets/js/views/planning.js"></script>
<script defer src="assets/js/views/purchasing.js"></script>
<script defer src="assets/js/views/inventory.js"></script>
<script defer src="assets/js/views/system.js"></script>
</head>
<body>

<div id="toasts" class="toast-stack" aria-live="polite"></div>
<div id="modalRoot"></div>

<!-- Marka logoları (tekrar kullanım için) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="logo-exit" viewBox="0 0 330 110">
            <polygon points="2,8 2,102 78,55" fill="#e63946"/>
            <line x1="6" y1="96" x2="82" y2="60" stroke="#3a3a3a" stroke-width="3"/>
            <text x="92" y="76" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="62" fill="#3a3a3a" letter-spacing="3">EXIT</text>
            <text x="95" y="99" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-weight="500" font-size="16" fill="#3a3a3a">Innovative Solutions</text>
        </symbol>
        <symbol id="logo-bg" viewBox="0 0 340 110">
            <rect x="8" y="8" width="18" height="94" rx="2" fill="#f4c20d"/>
            <circle cx="58" cy="52" r="30" fill="none" stroke="#f4c20d" stroke-width="20"/>
            <rect x="8" y="88" width="82" height="14" rx="2" fill="#f4c20d"/>
            <text x="112" y="72" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="62" fill="#3a3a3a" letter-spacing="-2">bg</text>
            <text x="205" y="72" font-family="Helvetica, Arial, sans-serif" font-weight="300" font-size="52" fill="#3a3a3a">group</text>
        </symbol>
    </defs>
</svg>

<!-- ======================= GİRİŞ ======================= -->
<section id="login" class="login" hidden>
    <button class="btn btn-secondary btn-icon theme-fab" data-act="toggleTheme" title="Tema değiştir" aria-label="Tema değiştir"><span data-theme-icon></span></button>
    <div class="login-card">
        <div class="login-logos">
            <svg class="brand-logo" viewBox="0 0 330 110" role="img" aria-label="EXIT"><use href="#logo-exit"/></svg>
            <svg class="brand-logo" viewBox="0 0 340 110" role="img" aria-label="bg group"><use href="#logo-bg"/></svg>
        </div>
        <div class="login-title">
            <h1>MRP Pro</h1>
            <p>Ürün Ağacı · Malzeme İhtiyaç Planlama · Satın Alma · Stok</p>
        </div>
        <div class="login-error" id="loginError" role="alert">Kullanıcı adı veya şifre hatalı.</div>
        <form id="loginForm" class="stack" autocomplete="on">
            <div class="field">
                <label for="loginUser">Kullanıcı adı</label>
                <input id="loginUser" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="loginPass">Şifre</label>
                <input id="loginPass" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary" type="submit" style="width:100%;padding:11px;">Giriş Yap</button>
        </form>
        <div class="login-demo">
            <h4>Demo hesaplar — tıklayarak doldurun</h4>
            <div id="demoAccounts"></div>
            <p class="login-note">Demo sürümüdür; veriler yalnızca bu tarayıcıda saklanır.</p>
        </div>
    </div>
</section>

<!-- ======================= UYGULAMA ======================= -->
<div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
        <div class="sb-brand">
            <div class="sb-mark">M</div>
            <div><b>MRP Pro</b><small>Üretim Planlama Sistemi</small></div>
        </div>
        <nav class="sb-nav" id="sbNav" aria-label="Ana menü"></nav>
        <div class="sb-foot">
            <svg class="brand-logo" viewBox="0 0 330 110" role="img" aria-label="EXIT"><use href="#logo-exit"/></svg>
            <svg class="brand-logo" viewBox="0 0 340 110" role="img" aria-label="bg group"><use href="#logo-bg"/></svg>
        </div>
    </aside>
    <div class="sb-backdrop" id="sbBackdrop" data-act="closeSidebar"></div>

    <div class="main">
        <header class="topbar">
            <button class="btn btn-ghost btn-icon menu-btn" data-act="openSidebar" aria-label="Menü"><svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
            <div class="page-title">
                <h1 id="pageTitle">Gösterge Paneli</h1>
                <p id="pageSub"></p>
            </div>
            <div class="top-actions">
                <div class="notif-wrap">
                    <button class="btn btn-secondary btn-icon" data-act="toggleNotif" title="Bildirimler" aria-label="Bildirimler">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
                    </button>
                    <span class="notif-dot" id="notifCount" hidden>0</span>
                    <div class="popover" id="notifPop" hidden>
                        <div class="popover-head"><h4>Bildirimler</h4><button class="btn btn-ghost btn-sm" data-act="markAllRead">Tümünü okundu say</button></div>
                        <div class="popover-body" id="notifBody"></div>
                    </div>
                </div>
                <button class="btn btn-secondary btn-icon" data-act="toggleTheme" title="Tema değiştir" aria-label="Tema değiştir"><span data-theme-icon></span></button>
                <div class="notif-wrap">
                    <button class="user-chip" data-act="toggleUserMenu" style="cursor:pointer;">
                        <span class="avatar" id="userAvatar">A</span>
                        <span class="meta" style="text-align:left;"><span class="n" id="userName" style="display:block;"></span><span class="r" id="userRole" style="display:block;"></span></span>
                    </button>
                    <div class="popover" id="userPop" hidden style="width:220px;">
                        <button class="menu-item" data-act="toggleTheme"><span data-theme-icon></span> Tema değiştir</button>
                        <button class="menu-item" data-act="logout" style="color:var(--red);"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg> Çıkış yap</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="content" id="view"></main>
    </div>
</div>

</body>
</html>
